<body data-root="../">

<section class="hero" id="hero"></section>

<section id="toolApp">
<div class="wrap">
<div class="tool-grid">

  <form class="card card-pad" id="cfg" autocomplete="off">
    <div class="panel-title"><span class="ico" id="icoGear"></span>Schedule Setup</div>

    <div class="field">
      <label for="preset">Start from a template</label>
      <select id="preset">
        <option value="home" selected>Home</option>
        <option value="flat">Flat / shared house</option>
        <option value="office">Office</option>
        <option value="custom">My own list</option>
      </select>
    </div>

    <div class="field">
      <label for="tasks">Tasks — one per line</label>
      <textarea id="tasks" style="min-height:220px"></textarea>
      <div class="hint">Format <code>Task | frequency | room</code>. Frequency: daily, weekly, monthly or quarterly.</div>
      <div id="taskStats"></div>
    </div>

    <div class="field">
      <label for="people">Share between — one per line <span style="font-weight:400;color:var(--muted)">(optional)</span></label>
      <textarea id="people" style="min-height:80px">Alex
Sam
Jo</textarea>
      <div class="hint">Leave blank for an unassigned checklist.</div>
    </div>

    <div class="divider"></div>

    <div class="row">
      <div class="field"><label for="weeks">Weeks to plan</label><input type="number" id="weeks" value="4" min="1" max="26"></div>
      <div class="field"><label for="start">Starting</label><input type="date" id="start"></div>
    </div>

    <fieldset class="field">
      <legend class="label">Options</legend>
      <div class="check-list">
        <label class="check on"><input type="checkbox" id="optRotate" checked>
          <span><span class="t">Rotate who does what each week</span><span class="d">Otherwise the same person always gets the same job.</span></span></label>
        <label class="check on"><input type="checkbox" id="optGroupRoom" checked>
          <span><span class="t">Group by room</span><span class="d">Off groups by frequency instead.</span></span></label>
        <label class="check on"><input type="checkbox" id="optTick" checked>
          <span><span class="t">Tick boxes</span></span></label>
      </div>
    </fieldset>

    <div class="field">
      <label for="title">Schedule title</label>
      <input type="text" id="title" value="Cleaning Schedule">
    </div>

    <div class="field">
      <label for="seed">Seed</label>
      <div class="row" style="grid-template-columns:minmax(0,1fr) auto;gap:8px">
        <input type="text" id="seed" value="clean-1">
        <button type="button" class="btn btn-soft" id="newSeed"><span id="icoReset"></span></button>
      </div>
    </div>

    <div class="out-actions">
      <button type="submit" class="btn btn-primary btn-block"><span id="icoBolt"></span> Generate Schedule</button>
    </div>
  </form>

  <div class="card card-pad">
    <div class="panel-title"><span class="ico" id="icoSpark"></span>Schedule<span class="spacer"></span>
      <span class="result-pill" id="pill"></span></div>

    <div class="tabs" id="tabs">
      <button type="button" class="on" data-tab="plan">Plan</button>
      <button type="button" data-tab="weekly">Week by week</button>
      <button type="button" data-tab="load">Workload</button>
      <button type="button" data-tab="guide">Notes</button>
    </div>

    <div data-panel="plan">
      <div id="plan"></div>
      <div class="out-actions" style="margin-top:16px">
        <button type="button" class="btn btn-primary" id="printBtn"><span id="icoFile"></span> Print checklist</button>
        <button type="button" class="btn btn-ghost" id="csvBtn"><span id="icoDl"></span> CSV</button>
        <button type="button" class="btn btn-soft" id="regen"><span id="icoReset2"></span> Reshuffle</button>
      </div>
      <div id="checks"></div>
    </div>

    <div data-panel="weekly" hidden><div id="weekly"></div></div>
    <div data-panel="load" hidden><div id="load"></div></div>
    <div data-panel="guide" hidden><div id="guide"></div></div>
  </div>

</div>
</div>
</section>

<div id="afterTool"></div>

<script src="../assets/js/site.js"></script>
<script src="../assets/js/schedule.js"></script>
<script src="../assets/js/roster.js"></script>
<script>
(function () {
  var I = GTI, $ = GT.$, $$ = GT.$$, S = GTSched;
  ['icoGear:gear','icoSpark:spark','icoBolt:bolt','icoDl:download','icoReset:reset','icoReset2:reset','icoFile:file']
    .forEach(function (p) { var a = p.split(':'); document.getElementById(a[0]).innerHTML = I[a[1]]; });

  $('#start').value = GT.today();

  var TEMPLATES = {
    home: 'Wash up / load dishwasher | daily | Kitchen\nWipe kitchen surfaces | daily | Kitchen\nTidy living areas | daily | Living room\nMake beds | daily | Bedrooms\nHoover downstairs | weekly | Living room\nHoover upstairs | weekly | Bedrooms\nMop hard floors | weekly | Kitchen\nClean toilet | weekly | Bathroom\nClean shower and bath | weekly | Bathroom\nClean sinks and mirrors | weekly | Bathroom\nChange bed linen | weekly | Bedrooms\nBins and recycling out | weekly | Whole house\nDust surfaces and shelves | weekly | Living room\nClean inside microwave | monthly | Kitchen\nClean oven | monthly | Kitchen\nWipe skirting boards | monthly | Whole house\nClean windows inside | monthly | Whole house\nDescale kettle and taps | monthly | Kitchen\nWash curtains | quarterly | Whole house\nClean behind appliances | quarterly | Kitchen\nDeep clean fridge | quarterly | Kitchen',
    flat: 'Wash up | daily | Kitchen\nWipe worktops | daily | Kitchen\nTidy shared areas | daily | Living room\nTake out bins | weekly | Whole flat\nHoover shared areas | weekly | Living room\nMop kitchen floor | weekly | Kitchen\nClean toilet | weekly | Bathroom\nClean shower | weekly | Bathroom\nClean bathroom sink and mirror | weekly | Bathroom\nWipe fridge shelves | monthly | Kitchen\nClean oven and hob | monthly | Kitchen\nDust and wipe surfaces | monthly | Living room\nWash bath mats and towels | monthly | Bathroom\nDeep clean fridge | quarterly | Kitchen',
    office: 'Empty desk bins | daily | Whole office\nWipe kitchen counters | daily | Kitchen\nLoad and run dishwasher | daily | Kitchen\nTidy meeting rooms | daily | Meeting rooms\nRestock supplies | weekly | Kitchen\nHoover floors | weekly | Whole office\nClean toilets | weekly | Bathrooms\nWipe door handles and switches | weekly | Whole office\nClean fridge | monthly | Kitchen\nDust monitors and desks | monthly | Whole office\nClean windows | quarterly | Whole office\nDeep clean carpets | quarterly | Whole office'
  };

  var FREQ_ORDER = { daily: 0, weekly: 1, monthly: 2, quarterly: 3 };
  var FREQ_WEEKS = { daily: 1, weekly: 1, monthly: 4, quarterly: 13 };

  var tasks = [], people = [], plan = [];

  function parseTasks() {
    var out = [];
    GT.lines($('#tasks').value).forEach(function (l) {
      var parts = l.split('|').map(function (x) { return x.trim(); });
      var name = parts[0];
      if (!name) return;
      var freq = (parts[1] || 'weekly').toLowerCase();
      if (!(freq in FREQ_WEEKS)) freq = 'weekly';
      out.push({ name: name, freq: freq, room: parts[2] || 'General' });
    });
    return out;
  }

  function build() {
    if ($('#preset').value !== 'custom' && !$('#tasks').value.trim()) {
      $('#tasks').value = TEMPLATES[$('#preset').value] || TEMPLATES.home;
    }
    tasks = parseTasks();
    var pp = GTRoster.parseNames($('#people').value);
    people = pp.names;

    var byFreq = {};
    tasks.forEach(function (t) { byFreq[t.freq] = (byFreq[t.freq] || 0) + 1; });
    $('#taskStats').innerHTML = '<div class="note ' + (tasks.length ? 'note-ok' : 'note-warn') + '" style="margin-top:10px">' +
      (tasks.length ? I.check : I.warn) + '<span>' + tasks.length + ' task' + (tasks.length === 1 ? '' : 's') + ' · ' +
      Object.keys(byFreq).sort(function (a, b) { return FREQ_ORDER[a] - FREQ_ORDER[b]; })
        .map(function (f) { return byFreq[f] + ' ' + f; }).join(' · ') + '</span></div>';

    if (!tasks.length) {
      $('#plan').innerHTML = '<div class="empty">Add some tasks.</div>';
      $('#pill').textContent = '—'; $('#weekly').innerHTML = ''; $('#load').innerHTML = '';
      return;
    }

    var weeks = Math.max(1, Math.min(26, parseInt($('#weeks').value, 10) || 1));
    var rand = S.rng($('#seed').value);
    var order = people.length ? rand.shuffle(people) : [];

    /* Assign each task instance to a person, rotating week by week. */
    plan = [];
    for (var w = 0; w < weeks; w++) {
      var due = tasks.filter(function (t) { return w % FREQ_WEEKS[t.freq] === 0; });
      var row = due.map(function (t, i) {
        var person = null;
        if (order.length) {
          var idx = $('#optRotate').checked ? (i + w) % order.length : i % order.length;
          person = order[idx];
        }
        return { task: t, person: person };
      });
      plan.push(row);
    }
    window.__order = order;

    renderPlan();
    renderWeekly();
    renderLoad(order);
    renderChecks(weeks);

    $('#pill').textContent = tasks.length + ' tasks · ' + weeks + ' weeks';
    $('#pill').style.background = 'var(--green-bg)'; $('#pill').style.color = 'var(--green)';
  }

  function freqChip(f) {
    var colours = { daily: 'background:#dbeafe;color:#1e40af', weekly: 'background:#dcfce7;color:#166534',
      monthly: 'background:#fef3c7;color:#92400e', quarterly: 'background:#ede9fe;color:#5b21b6' };
    return '<span style="' + colours[f] + ';border-radius:5px;padding:2px 7px;font-size:11px;font-weight:600">' + f + '</span>';
  }

  function renderPlan() {
    var groupKey = $('#optGroupRoom').checked ? 'room' : 'freq';
    var groups = {};
    tasks.forEach(function (t) { (groups[t[groupKey]] = groups[t[groupKey]] || []).push(t); });
    var keys = Object.keys(groups);
    if (groupKey === 'freq') keys.sort(function (a, b) { return FREQ_ORDER[a] - FREQ_ORDER[b]; });

    $('#plan').innerHTML = keys.map(function (k) {
      return '<div style="margin-bottom:18px"><p class="more-label">' + GT.esc(k) + '</p><div class="more-list">' +
        groups[k].sort(function (a, b) { return FREQ_ORDER[a.freq] - FREQ_ORDER[b.freq]; })
          .map(function (t) {
            return '<div class="more-row">' +
              ($('#optTick').checked ? '<span style="width:18px;flex:none;color:var(--muted-2)">☐</span>' : '') +
              '<span class="mval" style="font-family:var(--sans);font-size:14.5px">' + GT.esc(t.name) + '</span>' +
              freqChip(t.freq) +
              (groupKey === 'freq' ? '<span class="chip" style="font-family:var(--sans)">' + GT.esc(t.room) + '</span>' : '') +
              '</div>';
          }).join('') + '</div></div>';
    }).join('');
  }

  function renderWeekly() {
    var d0 = new Date($('#start').value + 'T12:00:00');
    $('#weekly').innerHTML = plan.map(function (row, w) {
      var d = new Date(d0.getTime() + w * 7 * 86400000);
      return '<div style="margin-bottom:18px">' +
        '<p class="more-label">Week ' + (w + 1) + ' <span style="font-weight:500;color:var(--muted)">· w/c ' +
        d.toLocaleDateString(undefined, { day: 'numeric', month: 'short' }) + ' · ' + row.length + ' tasks</span></p>' +
        '<div class="more-list">' + row.map(function (item) {
          return '<div class="more-row">' +
            ($('#optTick').checked ? '<span style="width:18px;flex:none;color:var(--muted-2)">☐</span>' : '') +
            '<span class="mval" style="font-family:var(--sans);font-size:14px">' + GT.esc(item.task.name) + '</span>' +
            (item.person ? '<span class="chip" style="font-family:var(--sans);font-weight:600">' +
              GT.esc(item.person) + '</span>' : '') + '</div>';
        }).join('') + '</div></div>';
    }).join('');
  }

  function renderLoad(order) {
    if (!order.length) {
      $('#load').innerHTML = '<div class="empty">Add people to see how the work splits.</div>';
      return;
    }
    var counts = {};
    order.forEach(function (p) { counts[p] = 0; });
    plan.forEach(function (row) { row.forEach(function (i) { if (i.person) counts[i.person]++; }); });
    var vals = order.map(function (p) { return counts[p]; });
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);

    $('#load').innerHTML =
      '<p style="color:var(--muted);font-size:13.5px;margin-bottom:12px">Total task instances per person across the whole plan. Daily tasks count once per week here.</p>' +
      order.map(function (p) {
        var pct = max ? Math.round((counts[p] / max) * 100) : 0;
        return '<div style="margin-bottom:10px">' +
          '<div class="kv" style="border:0;padding:4px 0"><span class="k">' + GT.esc(p) + '</span>' +
          '<span class="v">' + counts[p] + ' tasks</span></div>' +
          '<div style="height:6px;background:var(--line);border-radius:999px;overflow:hidden">' +
          '<div style="height:100%;width:' + pct + '%;background:var(--blue)"></div></div></div>';
      }).join('') +
      '<div class="note ' + (max - min <= 1 ? 'note-ok' : 'note-warn') + '" style="margin-top:12px">' +
      (max - min <= 1 ? I.check : I.warn) + '<span>' + (max - min <= 1
        ? 'Workload is evenly split.'
        : 'Spread of ' + (max - min) + ' tasks between the busiest and quietest person. Increase the number of weeks so the rotation completes more full cycles.') +
      '</span></div>';
  }

  function renderChecks(weeks) {
    var c = [];
    var byFreq = {};
    tasks.forEach(function (t) { byFreq[t.freq] = (byFreq[t.freq] || 0) + 1; });

    if (!byFreq.daily) c.push(['warn', 'No daily tasks. Washing up and wiping surfaces daily is what stops the weekly clean becoming a big job.']);
    if (!byFreq.monthly && !byFreq.quarterly) {
      c.push(['warn', 'Everything is daily or weekly. Deep-clean jobs — oven, windows, behind appliances — get forgotten unless they are scheduled on a longer cycle.']);
    }
    if (byFreq.quarterly && weeks < 13) {
      c.push(['warn', 'Quarterly tasks appear every 13 weeks, so with only ' + weeks +
        ' weeks planned they show once at the start and not again. Extend the plan to see the full cycle.']);
    }
    if (!people.length) {
      c.push(['ok', 'No people listed — this is an unassigned checklist. Add names to split the work and rotate it.']);
    } else if ($('#optRotate').checked) {
      c.push(['ok', 'Tasks rotate each week, so nobody is permanently stuck with the bathroom.']);
    } else {
      c.push(['warn', 'Rotation is off, so the same person gets the same jobs every week. That is fine if people have chosen their tasks, and a common source of resentment if they have not.']);
    }
    var rooms = GT.uniq(tasks.map(function (t) { return t.room; }));
    c.push(['ok', tasks.length + ' tasks across ' + rooms.length + ' area' + (rooms.length === 1 ? '' : 's') + '.']);
    $('#checks').innerHTML = c.map(function (x) {
      return '<div class="note ' + (x[0] === 'ok' ? 'note-ok' : 'note-warn') + '">' +
        (x[0] === 'ok' ? I.check : I.warn) + '<span>' + x[1] + '</span></div>';
    }).join('');
  }

  $('#csvBtn').addEventListener('click', function () {
    var rows = ['week,task,frequency,room,person'];
    plan.forEach(function (row, w) {
      row.forEach(function (i) {
        rows.push([w + 1, '"' + i.task.name.replace(/"/g, '""') + '"', i.task.freq,
          '"' + i.task.room.replace(/"/g, '""') + '"', '"' + (i.person || '') + '"'].join(','));
      });
    });
    GT.download(rows.join('\n'), 'cleaning-schedule.csv', 'text/csv');
  });

  $('#printBtn').addEventListener('click', function () {
    var groupKey = $('#optGroupRoom').checked ? 'room' : 'freq';
    var groups = {};
    tasks.forEach(function (t) { (groups[t[groupKey]] = groups[t[groupKey]] || []).push(t); });
    var keys = Object.keys(groups);
    if (groupKey === 'freq') keys.sort(function (a, b) { return FREQ_ORDER[a] - FREQ_ORDER[b]; });

    GTRoster.printHtml($('#title').value,
      '<h1>' + GT.esc($('#title').value) + '</h1>' +
      '<p class="sub">' + tasks.length + ' tasks' + (people.length ? ' · ' + people.length + ' people' : '') + '</p>' +
      '<div class="grid g2">' + keys.map(function (k) {
        return '<div class="card"><h3>' + GT.esc(k) + '</h3><ul style="list-style:none;padding-left:0">' +
          groups[k].sort(function (a, b) { return FREQ_ORDER[a.freq] - FREQ_ORDER[b.freq]; })
            .map(function (t) {
              return '<li style="margin-bottom:5px">☐ ' + GT.esc(t.name) +
                ' <span style="color:#64748b;font-size:11px">(' + t.freq + ')</span></li>';
            }).join('') + '</ul></div>';
      }).join('') + '</div>');
  });

  $('#preset').addEventListener('change', function () {
    if (TEMPLATES[this.value]) $('#tasks').value = TEMPLATES[this.value];
    build();
  });
  $('#newSeed').addEventListener('click', function () { $('#seed').value = Math.random().toString(36).slice(2, 8); build(); });
  $('#regen').addEventListener('click', function () { $('#seed').value = Math.random().toString(36).slice(2, 8); build(); GT.toast('Reshuffled'); });

  $('#guide').innerHTML = [
    ['Frequency is what makes a schedule work', 'The reason cleaning feels endless is that everything gets treated as equally urgent. Splitting tasks into daily, weekly, monthly and quarterly turns an overwhelming list into a short daily routine plus a manageable weekly one — and it means the oven actually gets cleaned occasionally rather than never.'],
    ['Daily tasks keep the weekly clean small', 'Washing up and wiping surfaces every day is not really cleaning, it is maintenance. Skip it and the weekly clean becomes a three-hour job that people avoid, which is how schedules collapse.'],
    ['Rotate, or expect resentment', 'Whoever gets the bathroom every week will eventually stop doing it. Rotating means every job comes round to everyone, which removes the argument entirely. The workload tab shows the split so it is demonstrable rather than asserted.'],
    ['Group by room for actual cleaning', 'When you are in the bathroom you want everything bathroom-related in one list — it is far more efficient than moving between rooms. Group by frequency instead when you are planning rather than cleaning.'],
    ['Put quarterly tasks in the plan anyway', 'Washing curtains and cleaning behind appliances only need doing a few times a year, which is exactly why they get forgotten. Scheduling them is the only reliable way they happen.'],
    ['Print it and tick it', 'A printed checklist on the fridge or in the cupboard works far better than an app nobody opens. Ticking boxes is also a surprisingly effective motivator for children.']
  ].map(function (x) {
    return '<div style="margin-bottom:16px"><h4 style="font-size:14.5px;margin-bottom:6px">' + x[0] + '</h4>' +
      '<p style="color:var(--muted);font-size:13.8px">' + x[1] + '</p></div>';
  }).join('');

  $('#tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    $$('#tabs button').forEach(function (x) { x.classList.toggle('on', x === b); });
    $$('[data-panel]').forEach(function (p) { p.hidden = p.getAttribute('data-panel') !== b.getAttribute('data-tab'); });
  });
  $('#cfg').addEventListener('submit', function (e) { e.preventDefault(); build(); GT.toast('Schedule generated'); });
  $('#cfg').addEventListener('input', build);
  $('#cfg').addEventListener('change', build);

  $('#tasks').value = TEMPLATES.home;
  build();

  GT.page({
    slug: 'cleaning-schedule-generator',
    lede: 'A cleaning plan split by frequency and room — daily maintenance, weekly cleans and the quarterly jobs everyone forgets — shared fairly and printable as a checklist.',
    steps: [
      { icon: 'gear', title: 'Start from a template', text: 'Home, shared flat or office — then edit the task list.' },
      { icon: 'home', title: 'Share it out', text: 'Add names and tasks rotate weekly, with a workload bar to prove it is even.' },
      { icon: 'file', title: 'Print the checklist', text: 'Grouped by room, with tick boxes.' }
    ],
    guideTitle: 'Why frequency-based cleaning works',
    guide:
      '<p style="color:var(--muted)">Cleaning feels endless mostly because everything is treated as one undifferentiated pile of jobs. Sorting tasks by how often they genuinely need doing changes the shape of the problem: a short daily routine, a manageable weekly session, and a handful of deep-clean jobs on a longer cycle.</p>' +
      '<div class="grid g2" style="margin-top:18px">' +
      '<div><h4 style="font-size:14.5px;margin-bottom:8px">The four tiers</h4><ul style="color:var(--muted);font-size:13.8px;padding-left:18px;margin:0"><li><strong>Daily</strong> — washing up, surfaces, tidying. Maintenance, not cleaning. Ten minutes.</li><li><strong>Weekly</strong> — hoovering, bathroom, floors, bins. The real clean.</li><li><strong>Monthly</strong> — oven, windows, skirting boards, fridge shelves.</li><li><strong>Quarterly</strong> — curtains, behind appliances, carpets.</li></ul></div>' +
      '<div><h4 style="font-size:14.5px;margin-bottom:8px">Daily tasks are the load-bearing tier</h4><p style="color:var(--muted);font-size:13.8px">Skipping the daily ten minutes is what turns the weekly clean into a three-hour job. Once that happens people start avoiding it, and the schedule stops being followed at all.</p>' +
      '<p style="color:var(--muted);font-size:13.8px;margin-top:10px">The quarterly tier matters for the opposite reason: those jobs are easy to postpone indefinitely because nothing visibly breaks. Scheduling them is the only thing that makes them happen.</p></div></div>' +
      '<div class="note note-info" style="margin-top:18px">' + GTI.info + '<span><strong>Group by room when cleaning, by frequency when planning.</strong> Standing in the bathroom you want every bathroom job in one list — walking between rooms per task wastes a surprising amount of time. The toggle switches between the two views.</span></div>',
    related: ['chore-rotation-generator', 'work-shift-rotation-generator', 'secret-santa-generator'],
faqs: [
      { q: 'How do I create a cleaning schedule?', a: 'Enter each task with its frequency and room, choose the planning period, add people if the work is shared, then generate the schedule.' },
      { q: 'What cleaning frequencies can I use?', a: 'The tool supports daily, weekly, monthly and quarterly tasks.' },
      { q: 'Can I organize tasks by room?', a: 'Yes. Turn on room grouping to organize the plan by areas such as kitchen, bathroom and bedroom.' },
      { q: 'Can several people share the cleaning?', a: 'Yes. Enter their names and the schedule can distribute tasks among them.' },
      { q: 'Can responsibilities rotate?', a: 'Yes. Enable weekly rotation so the same person does not permanently receive the same recurring job.' },
