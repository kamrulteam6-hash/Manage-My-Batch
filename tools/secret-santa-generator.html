<body data-root="../">

<section class="hero" id="hero"></section>

<section id="toolApp">
<div class="wrap">
<div class="tool-grid">

  <form class="card card-pad" id="cfg" autocomplete="off">
    <div class="panel-title"><span class="ico" id="icoGear"></span>The Draw</div>

    <div class="field">
      <label for="names">Participants — one per line</label>
      <textarea id="names" style="min-height:180px">Ana
Ben
Cara
Dan
Eve
Finn
Gemma
Hari</textarea>
      <div id="stats"></div>
    </div>

    <div class="field">
      <label for="exclusions">Never match these pairs — one per line</label>
      <textarea id="exclusions" style="min-height:70px" placeholder="Ana &amp; Ben&#10;Cara &amp; Dan">Ana & Ben</textarea>
      <div class="hint">For couples and housemates who would rather draw someone else. Format <code>Name &amp; Name</code>.</div>
    </div>

    <div class="divider"></div>

    <fieldset class="field">
      <legend class="label">Draw rules</legend>
      <div class="check-list">
        <label class="check on"><input type="checkbox" id="optCycle" checked>
          <span><span class="t">No reciprocal pairs</span><span class="d">Stops A→B and B→A. Everyone forms one long chain instead.</span></span></label>
        <label class="check on"><input type="checkbox" id="optHide" checked>
          <span><span class="t">Hide the result from me</span><span class="d">Shows only the slips, so the organiser can take part fairly.</span></span></label>
      </div>
    </fieldset>

    <div class="row">
      <div class="field"><label for="budget">Budget</label><input type="text" id="budget" placeholder="e.g. £15"></div>
      <div class="field"><label for="date">Exchange date</label><input type="date" id="date"></div>
    </div>

    <div class="field">
      <label for="note">Note on every slip</label>
      <input type="text" id="note" placeholder="e.g. Bring your gift to the office party">
    </div>

    <div class="field">
      <label for="seed">Draw seed</label>
      <div class="row" style="grid-template-columns:minmax(0,1fr) auto;gap:8px">
        <input type="text" id="seed" value="santa-2026">
        <button type="button" class="btn btn-soft" id="newSeed"><span id="icoReset"></span></button>
      </div>
    </div>

    <div class="out-actions">
      <button type="submit" class="btn btn-primary btn-block"><span id="icoBolt"></span> Draw Names</button>
    </div>
  </form>

  <div class="card card-pad">
    <div class="panel-title"><span class="ico" id="icoSpark"></span>Result<span class="spacer"></span>
      <span class="result-pill" id="pill"></span></div>

      <button type="button" class="on" data-tab="slips">Slips</button>
      <button type="button" data-tab="reveal">Full list</button>
      <button type="button" data-tab="guide">How to run it</button>
    </div>

    <div data-panel="slips">
      <div id="slips"></div>
      <div class="out-actions" style="margin-top:16px">
        <button type="button" class="btn btn-primary" id="printBtn"><span id="icoFile"></span> Print slips</button>
        <button type="button" class="btn btn-soft" id="regen"><span id="icoReset2"></span> Redraw</button>
      </div>
      <div id="checks"></div>
    </div>

    <div data-panel="reveal" hidden>
      <div id="reveal"></div>

<div id="afterTool"></div>

<script src="../assets/js/site.js"></script>
<script src="../assets/js/schedule.js"></script>
<script src="../assets/js/roster.js"></script>
<script>
(function () {
  var I = GTI, $ = GT.$, $$ = GT.$$, S = GTSched;
  ['icoGear:gear','icoSpark:spark','icoBolt:bolt','icoReset:reset','icoReset2:reset','icoFile:file']
    .forEach(function (p) { var a = p.split(':'); document.getElementById(a[0]).innerHTML = I[a[1]]; });

  var names = [], result = null;

  function build() {
    var parsed = GTRoster.parseNames($('#names').value);
    names = parsed.names;
    GTRoster.rosterStats('#stats', parsed);

    if (names.length < 3) {
      $('#slips').innerHTML = '<div class="empty">Secret Santa needs at least three people.</div>';
      $('#pill').textContent = '—'; $('#reveal').innerHTML = ''; $('#checks').innerHTML = '';
      return;
    }

    var exclusions = GTRoster.parsePairs($('#exclusions').value)
      .filter(function (p) {
        return names.some(function (n) { return n.toLowerCase() === p[0].toLowerCase(); }) &&
               names.some(function (n) { return n.toLowerCase() === p[1].toLowerCase(); });
      })
      .map(function (p) {
        return [
          names.filter(function (n) { return n.toLowerCase() === p[0].toLowerCase(); })[0],
          names.filter(function (n) { return n.toLowerCase() === p[1].toLowerCase(); })[0]
        ];
      });

    result = S.drawNames(names, {
      seed: $('#seed').value,
      exclusions: exclusions,
      singleCycle: $('#optCycle').checked
    });

    renderSlips();
    renderReveal();
    renderChecks(exclusions);

    if (result.error) {
      $('#pill').textContent = 'no valid draw';
      $('#pill').style.background = 'var(--red-bg)'; $('#pill').style.color = 'var(--red)';
    } else {
      $('#pill').textContent = names.length + ' participants';
      $('#pill').style.background = 'var(--green-bg)'; $('#pill').style.color = 'var(--green)';
    }
  }

  function slipDetail() {
    var bits = [];
    if ($('#budget').value.trim()) bits.push('Budget: ' + $('#budget').value.trim());
    if ($('#date').value) bits.push(S.fmtDateFull(new Date($('#date').value + 'T12:00:00')));
    if ($('#note').value.trim()) bits.push($('#note').value.trim());
    return bits;
  }

  function renderSlips() {
    if (result.error) {
      $('#slips').innerHTML = '<div class="empty">No valid draw — see the note below.</div>';
      return;
    }
    var hide = $('#optHide').checked;
    $('#slips').innerHTML =
      '<div class="note ' + (hide ? 'note-ok' : 'note-warn') + '" style="margin-top:0">' +
      (hide ? I.check : I.warn) + '<span>' + (hide
        ? 'Recipients are hidden on screen so you can take part yourself. Print the slips without reading them, fold, and hand out.'
        : 'Recipients are visible below. If you are taking part, switch on “Hide the result from me” before drawing.') +
      '</span></div>' +
      '<div class="grid g2" style="margin-top:14px">' + names.map(function (n) {
        return '<div class="card" style="padding:14px;box-shadow:none">' +
          '<div style="font-size:12px;color:var(--muted);margin-bottom:4px">Slip for</div>' +
          '<div style="font-weight:700;font-size:15px;margin-bottom:8px">' + GT.esc(n) + '</div>' +
          '<div style="font-size:12px;color:var(--muted)">You are buying for</div>' +
          '<div style="font-weight:700;font-size:15px;color:' + (hide ? 'var(--muted-2)' : 'var(--blue)') + '">' +
          (hide ? '• • • • •' : GT.esc(result.map[n])) + '</div></div>';
      }).join('') + '</div>';
  }

  function renderReveal() {
    if (result.error) { $('#reveal').innerHTML = ''; return; }
    $('#reveal').innerHTML =
      '<div class="note note-warn">' + I.warn +
      '<span><strong>Spoiler.</strong> Only look at this if you are not taking part in the draw.</span></div>' +
      '<details class="faq" style="margin-top:12px"><summary>Show who has who</summary><div class="body">' +
      '<div class="more-list" style="margin-top:8px">' + names.map(function (n) {
        return '<div class="more-row"><span class="mval" style="font-family:var(--sans);font-size:14.5px">' +
          GT.esc(n) + ' <span style="color:var(--muted-2)">→</span> <strong>' + GT.esc(result.map[n]) + '</strong></span></div>';
      }).join('') + '</div></div></details>';
  }

  function renderChecks(exclusions) {
    var c = [];
    if (result.error) {
      var trouble = S.exclusionTrouble(names, exclusions);
      c.push(['err', 'No valid draw could be found. ' + (trouble.length
        ? trouble.map(GT.esc).join(', ') + ' ' + (trouble.length === 1 ? 'is' : 'are') +
          ' excluded from almost everyone, which makes the draw impossible.'
        : 'The exclusion rules are too restrictive for this group size — try removing one.')]);
      $('#checks').innerHTML = c.map(function (x) {
        return '<div class="note note-err">' + I.warn + '<span>' + x[1] + '</span></div>';
      }).join('');
      return;
    }

    c.push(['ok', 'Valid draw found. Nobody has themselves, and everyone gives and receives exactly one gift.']);
    if ($('#optCycle').checked) {
      c.push(['ok', 'One single chain — no two people are buying for each other, which keeps it a proper secret.']);
    } else {
      var recip = names.filter(function (n) { return result.map[result.map[n]] === n; });
      if (recip.length) {
        c.push(['warn', recip.length / 2 + ' reciprocal pair(s) — some people are buying for each other. Turn on “No reciprocal pairs” to avoid it.']);
      }
    }
    if (exclusions.length) {
      c.push(['ok', exclusions.length + ' exclusion rule' + (exclusions.length === 1 ? '' : 's') + ' honoured.']);
    }
    var raw = GTRoster.parsePairs($('#exclusions').value).length;
    if (raw > exclusions.length) {
      c.push(['warn', (raw - exclusions.length) + ' exclusion line' + (raw - exclusions.length === 1 ? '' : 's') +
        ' mention names that are not in the participant list. Check the spelling.']);
    }
    if (names.length < 5 && exclusions.length) {
      c.push(['warn', 'Small group with exclusions — the draw has few valid arrangements, so it may look predictable.']);
    }
    $('#checks').innerHTML = c.map(function (x) {
      return '<div class="note ' + (x[0] === 'ok' ? 'note-ok' : 'note-warn') + '">' +
        (x[0] === 'ok' ? I.check : I.warn) + '<span>' + x[1] + '</span></div>';
    }).join('');
  }

  $('#printBtn').addEventListener('click', function () {
    if (result.error) { GT.toast('Fix the draw first'); return; }
    var detail = slipDetail();
    var w = window.open('', '_blank');
    if (!w) { GT.toast('Allow pop-ups to print'); return; }
    w.document.write('<!DOCTYPE html><html><head><meta charset="utf-8"><title>Secret Santa slips</title><style>' +
      'body{font-family:Arial,Helvetica,sans-serif;color:#0f172a;margin:12mm}' +
      '.wrap{display:grid;grid-template-columns:1fr 1fr;gap:8mm}' +
      '.slip{border:1.5px dashed #94a3b8;border-radius:8px;padding:14px;break-inside:avoid;page-break-inside:avoid;min-height:38mm}' +
      '.for{font-size:11px;color:#64748b}.name{font-size:17px;font-weight:700;margin:2px 0 10px}' +
      '.lbl{font-size:11px;color:#64748b}.rec{font-size:19px;font-weight:700;margin-top:2px}' +
      '.meta{margin-top:10px;font-size:11px;color:#475569;line-height:1.5}' +
      '.fold{margin-top:10px;border-top:1px dotted #cbd5e1;padding-top:6px;font-size:10px;color:#94a3b8}' +
      '@media print{body{margin:8mm}}</style></head><body>' +
      '<div class="wrap">' + names.map(function (n) {
        return '<div class="slip"><div class="for">Secret Santa slip for</div>' +
          '<div class="name">' + GT.esc(n) + '</div>' +
          '<div class="lbl">You are buying a gift for</div>' +
          '<div class="rec">' + GT.esc(result.map[n]) + '</div>' +
          (detail.length ? '<div class="meta">' + detail.map(GT.esc).join('<br>') + '</div>' : '') +
          '<div class="fold">Fold along here — keep it secret</div></div>';
      }).join('') + '</div>' +
      '<script>window.onload=function(){window.print()}<' + '/script></body></html>');
    w.document.close();
  });

  $('#newSeed').addEventListener('click', function () { $('#seed').value = Math.random().toString(36).slice(2, 8); build(); });
  $('#regen').addEventListener('click', function () { $('#seed').value = Math.random().toString(36).slice(2, 8); build(); GT.toast('Redrawn'); });

  $('#guide').innerHTML = [
    ['The organiser problem', 'If you run the draw and take part in it, you know at least one answer — usually more. Hiding the result on screen and printing the slips without reading them is the only practical way to organise a draw you are also in. That is what the hide option is for.'],
    ['Why reciprocal pairs spoil it', 'If Ana draws Ben and Ben draws Ana, both know immediately who has them. In a group of eight that is a quarter of the secret gone. Arranging everyone in one chain — Ana buys for Ben, Ben for Cara, and so on back round to Ana — makes reciprocal pairs impossible.'],
    ['Exclusions are for couples and housemates', 'People who live together often already buy each other presents, so drawing their partner defeats the point. Add them as an exclusion pair and the draw routes around it.'],
    ['Too many exclusions makes it impossible', 'With six people and four exclusion rules there may be no valid arrangement at all. Rather than quietly breaking a rule, the tool tells you the draw failed and points at whoever is over-constrained.'],
    ['Print, fold, hand out', 'Printed slips are still the most reliable method for an in-person group. Each slip names the recipient and repeats the budget and date, so nobody has to ask twice.'],
    ['Keep the seed if you need to reprint', 'Same seed, same names, same draw. If a slip is lost you can reprint exactly the same allocation instead of redrawing the whole thing.']
  ].map(function (x) {
    return '<div style="margin-bottom:16px"><h4 style="font-size:14.5px;margin-bottom:6px">' + x[0] + '</h4>' +
      '<p style="color:var(--muted);font-size:13.8px">' + x[1] + '</p></div>';
  }).join('');

  $('#tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    $$('#tabs button').forEach(function (x) { x.classList.toggle('on', x === b); });
    $$('[data-panel]').forEach(function (p) { p.hidden = p.getAttribute('data-panel') !== b.getAttribute('data-tab'); });
  });
  $('#cfg').addEventListener('submit', function (e) { e.preventDefault(); build(); GT.toast('Names drawn'); });
  $('#cfg').addEventListener('input', build);
  $('#cfg').addEventListener('change', build);

  build();

  GT.page({
    slug: 'secret-santa-generator',
    lede: 'Draw Secret Santa names properly — no self-matches, no reciprocal pairs, couple exclusions honoured, and a hide mode so the organiser can take part.',
    steps: [
      { icon: 'gear', title: 'Add everyone and any exclusions', text: 'Couples and housemates who should not draw each other.' },
      { icon: 'gift', title: 'Draw', text: 'Keep the result hidden if you are taking part yourself.' },
      { icon: 'file', title: 'Print and fold the slips', text: 'Each slip carries the recipient, budget and date.' }
    ],
    guideTitle: 'The maths behind a proper draw',
    guide:
      '<p style="color:var(--muted)">Pulling names from a hat has two well-known failure modes: somebody draws themselves, and the last person is left with their own name and the whole thing restarts. A Secret Santa draw is what mathematicians call a <em>derangement</em> — a rearrangement where nothing stays in its original position.</p>' +
      '<p style="color:var(--muted);margin-top:12px">This tool goes further and builds a <strong>single cycle</strong>: shuffle everyone into a random order, then have each person buy for the next, with the last buying for the first. That construction guarantees three things at once — nobody has themselves, everyone gives and receives exactly one gift, and no two people are buying for each other.</p>' +
      '<div class="grid g2" style="margin-top:18px">' +
      '<div><h4 style="font-size:14.5px;margin-bottom:8px">Why reciprocal pairs matter</h4><p style="color:var(--muted);font-size:13.8px">A plain derangement still allows A→B and B→A. Both of them then know exactly who has them, and in a small group that unravels a large share of the secrecy. The single-cycle construction makes it structurally impossible rather than merely unlikely.</p></div>' +
      '<div><h4 style="font-size:14.5px;margin-bottom:8px">When exclusions break the draw</h4><p style="color:var(--muted);font-size:13.8px">Each exclusion removes valid arrangements. Enough of them — particularly in a small group — and none remain. The tool searches thoroughly, then reports failure and names whoever is excluded from nearly everybody, instead of quietly ignoring a rule.</p></div></div>' +
      '<div class="note note-info" style="margin-top:18px">' + GTI.info + '<span><strong>Organising a draw you are in?</strong> Leave "hide the result" on, print the slips without looking, and hand them out folded. Everything runs in your browser and nothing is uploaded, so the only person who could see the result is you — and only if you choose to.</span></div>',
    related: ['random-gift-exchange-generator', 'chore-rotation-generator', 'team-generator'],
faqs: [
      { q: 'Can Secret Santa prevent couples from drawing each other?', a: 'Yes. Add the couple to the never-match list.' },
      { q: 'Can somebody draw themselves?', a: 'No. A valid Secret Santa draw excludes self-matches.' },
      { q: 'What does no reciprocal pairs mean?', a: 'It prevents A drawing B while B simultaneously draws A.' },
      { q: 'Can the organizer participate without seeing every assignment?', a: 'Yes. Use the option that hides the full result and work from individual slips.' },
      { q: 'What happens if my exclusions make the draw impossible?', a: 'Review or reduce the restrictions. No generator can create a valid assignment when a participant has no eligible recipient.' },
      { q: 'Can I set a budget and date?', a: 'Yes. Add them before drawing so the information appears with the exchange details.' },
      { q: 'Can I recreate the same draw later?', a: 'Yes. Keep the same inputs, rules and draw seed.' }
    ],
    seo: {
      title: 'Secret Santa Generator – Draw Names Fairly With Exclusions',
      lead: 'Use the Secret Santa Generator above to create a private gift draw without putting names in a hat, drawing yourself or manually repairing awkward pairings.',
      blocks: [
        { html: '<p>Enter one participant per line, add any pairs who should never draw one another, choose whether reciprocal pairs are allowed and set the budget, exchange date and note that should appear on every slip.</p>' +
            '<p>You can also hide the full result from yourself. That is useful when the organizer wants to participate without seeing everybody’s assignments.</p>' +
            '<p>A draw seed lets the same participant list and rules reproduce the same assignment later.</p>' +
            '<p>The result can then be printed as individual slips so each person sees only the recipient they need to buy for.</p>' },
        { h: 'What Is a Secret Santa Generator?',
          html: '<p>A Secret Santa generator randomly assigns every participant one recipient.</p><p>The basic rules are simple:</p>',
          list: ['nobody draws themselves', 'each person buys for one recipient', 'each recipient is assigned to one giver', 'assignments remain secret until the exchange'],
          after: '<p>For example, a four-person draw might produce: Ana → Dan, Ben → Cara, Cara → Ana, Dan → Ben.</p>' +
            '<p>Everybody gives once and receives once.</p>' +
            '<p>The challenge begins when real groups add restrictions.</p>' +
            '<p>Couples may not want to draw each other. Housemates may already buy gifts together. Organizers may want to prevent two-person reciprocal exchanges.</p>' +
            '<p>The generator handles those rules while checking that the complete draw is still possible.</p>' },
        { h: 'How to Use This Secret Santa Generator',
          html: '<p>Paste one participant name per line.</p><p>Then add any excluded pairs using the tool’s <code>Name & Name</code> format.</p>' +
            '<p>For example, <code>Ana & Ben</code> can keep a couple or household pairing out of the draw.</p>' +
            '<p>Next decide whether to enable <strong>No reciprocal pairs</strong>.</p>' +
            '<p>This prevents Ana → Ben and Ben → Ana from forming a two-person exchange.</p>' +
            '<p>Add the budget, exchange date and any shared instruction.</p>' +
            '<p>Example: <code>Bring your wrapped gift to the office party.</code></p>' +
            '<p>Choose <strong>Hide the result from me</strong> when the organizer should not see everybody’s assignments.</p>' +
            '<p>Set a draw seed if reproducibility matters, then draw the names and print the slips.</p>' },
        { h: 'Why Nobody Should Draw Themselves',
          html: '<p>Mathematically, a Secret Santa assignment is a permutation of the participant list with no fixed points.</p>' +
            '<p>A fixed point would mean Ana → Ana, which breaks the game.</p>' +
            '<p>An assignment with no one mapped to themselves is called a derangement.</p>' +
            '<p>You do not need to know the mathematics to run the exchange, but it explains why simply shuffling a list once is not always enough.</p>' +
            '<p>A naive shuffle can leave one or more people assigned to themselves.</p>' +
            '<p>The generator checks the completed arrangement rather than treating any random ordering as automatically valid.</p>' +
            '<p>That is one reason a purpose-built Secret Santa draw is safer than a generic list randomizer.</p>' },
        { h: 'What Are Exclusion Pairs?',
          html: '<p>Exclusions block pairings that should not occur.</p><p>Common examples include:</p>',
          list: ['spouses', 'partners', 'housemates', 'parent and child', 'people who exchanged last year', 'colleagues in a direct manager/report relationship'],
          after: '<p>The reason does not need to be public.</p><p>Only the rule matters.</p>' +
            '<p>If <code>Ana & Ben</code> is excluded, the draw should find different recipients for both people.</p>' +
            '<p>Exclusions are useful, but every new rule removes possible assignments.</p>' +
            '<p>A small group with many exclusions can eventually become impossible to solve.</p>' +
            '<p>That is not a randomness problem. It is a constraint problem.</p>' },
        { h: 'Why a Secret Santa Draw Can Become Impossible',
          html: '<p>Imagine three participants: Ana, Ben, Cara.</p><p>Now exclude Ana & Ben and Ana & Cara.</p>' +
            '<p>Ana has nobody valid left to draw.</p><p>No algorithm can produce a valid result.</p>' +
            '<p>The same issue can occur in larger groups when restrictions overlap.</p>' +
            '<p>For example, several households may be so large relative to the whole exchange that one participant has too few eligible recipients.</p>' +
            '<p>A good generator should report the problem instead of quietly ignoring an exclusion.</p><p>When a draw is impossible:</p>',
          ol: ['review the exclusion list', 'remove nonessential restrictions', 'add more participants where appropriate', 'run the draw again'],
          after: '<p>Never solve the problem by secretly breaking a rule participants were told would apply.</p>' },
        { h: 'What Does "No Reciprocal Pairs" Mean?',
          html: '<p>A reciprocal pair is Ana → Ben and Ben → Ana. Both people buy directly for one another.</p>' +
            '<p>Some groups are perfectly happy with that.</p>' +
            '<p>Others prefer a broader exchange where gifts circulate around the group.</p>' +
            '<p>The no-reciprocal option prevents those two-person loops.</p>' +
            '<p>The ManageMyBatch tool describes this as forming one longer chain through the participants.</p>' +
            '<p>For example: Ana → Ben, Ben → Cara, Cara → Dan, Dan → Ana.</p>' +
