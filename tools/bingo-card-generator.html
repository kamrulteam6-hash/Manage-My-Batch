<body data-root="../">

<section class="hero" id="hero"></section>

<section id="toolApp">
<div class="wrap">
<div class="tool-grid">

  <form class="card card-pad" id="cfg" autocomplete="off">
    <div class="panel-title"><span class="ico" id="icoGear"></span>Card Settings</div>

    <div class="field">
      <label>Card content</label>
      <div class="seg" id="source">
        <button type="button" class="on" data-s="words">My own list</button>
        <button type="button" data-s="numbers">Numbers</button>
        <button type="button" data-s="classic">Classic BINGO 1–75</button>
      </div>
      <div class="hint" id="sourceHint"></div>
    </div>

    <div class="field" id="wordsField">
      <label for="words">Words or phrases — one per line</label>
      <textarea id="words" style="min-height:170px">addition
subtraction
fraction
decimal
multiply
divide
angle
perimeter
area
volume
average
estimate
rounding
symmetry
percentage
ratio
equation
factor
multiple
sequence
triangle
rectangle
diameter
radius
probability</textarea>
      <div id="stats"></div>
    </div>

    <div class="row" id="numberField" hidden>
      <div class="field"><label for="numMin">From</label><input type="number" id="numMin" value="1"></div>
      <div class="field"><label for="numMax">To</label><input type="number" id="numMax" value="75"></div>
    </div>

    <div class="divider"></div>

    <div class="row">
      <div class="field">
        <label for="gridSize">Grid size</label>
        <select id="gridSize">
          <option value="3">3 × 3</option>
          <option value="4">4 × 4</option>
          <option value="5" selected>5 × 5</option>
        </select>
      </div>
      <div class="field">
        <label for="cards">Number of cards</label>
        <input type="number" id="cards" value="12" min="1" max="200">
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label for="perPage">Cards per page</label>
        <select id="perPage">
          <option value="1">1 — large</option>
          <option value="2" selected>2</option>
          <option value="4">4 — compact</option>
        </select>
      </div>
      <div class="field">
        <label for="title">Card title</label>
        <input type="text" id="title" value="BINGO">
      </div>
    </div>

    <fieldset class="field">
      <legend class="label">Options</legend>
      <div class="check-list">
        <label class="check on"><input type="checkbox" id="optFree" checked>
          <span><span class="t">Free space in the centre</span><span class="d">Odd-sized grids only.</span></span></label>
        <label class="check on"><input type="checkbox" id="optHeader" checked>
          <span><span class="t">B-I-N-G-O header row</span></span></label>
        <label class="check on"><input type="checkbox" id="optNumberCards" checked>
          <span><span class="t">Number each card</span><span class="d">Makes it easy to verify a winning card.</span></span></label>
        <label class="check"><input type="checkbox" id="optColumnRanges">
          <span><span class="t">Classic column ranges</span><span class="d">B=1–15, I=16–30, N=31–45, G=46–60, O=61–75.</span></span></label>
      </div>
    </fieldset>

    <div class="field">
      <label for="seed">Seed</label>
      <div class="row" style="grid-template-columns:minmax(0,1fr) auto;gap:8px">
        <input type="text" id="seed" value="bingo-1">
        <button type="button" class="btn btn-soft" id="newSeed"><span id="icoReset"></span></button>
      </div>
    </div>

    <div class="out-actions">
      <button type="submit" class="btn btn-primary btn-block"><span id="icoBolt"></span> Generate Cards</button>
    </div>
  </form>

  <div class="card card-pad">
    <div class="panel-title"><span class="ico" id="icoSpark"></span>Bingo Cards<span class="spacer"></span>
      <span class="result-pill" id="pill"></span></div>

    <div class="tabs" id="tabs">
      <button type="button" class="on" data-tab="preview">Cards</button>
      <button type="button" data-tab="calls">Call list</button>
      <button type="button" data-tab="guide">How to run it</button>
    </div>

    <div data-panel="preview">
      <div id="preview"></div>
      <div class="out-actions" style="margin-top:16px">
        <button type="button" class="btn btn-primary" id="printBtn"><span id="icoFile"></span> Print all cards</button>
        <button type="button" class="btn btn-soft" id="regen"><span id="icoReset2"></span> New cards</button>
      </div>
      <div id="checks"></div>
    </div>

    <div data-panel="calls" hidden>
      <p style="color:var(--muted);font-size:13.8px;margin-bottom:12px">A shuffled call order, so you can tick items off as you read them out. Printing this alongside the cards keeps the game moving.</p>
      <div id="calls"></div>
      <div class="out-actions" style="margin-top:14px">
        <button class="btn btn-ghost" id="printCalls"><span id="icoFile2"></span> Print call list</button>
        <button class="btn btn-ghost" id="copyCalls"><span id="icoCopy"></span> Copy</button>
      </div>
    </div>

    <div data-panel="guide" hidden><div id="guide"></div></div>
  </div>

</div>
</div>
</section>

<div id="afterTool"></div>

<script src="../assets/js/site.js"></script>
<script src="../assets/js/worksheet.js"></script>
<script>
(function () {
  var I = GTI, $ = GT.$, $$ = GT.$$, W = GTWorksheet;
  ['icoGear:gear','icoSpark:spark','icoBolt:bolt','icoReset:reset','icoReset2:reset','icoFile:file','icoFile2:file','icoCopy:copy']
    .forEach(function (p) { var a = p.split(':'); document.getElementById(a[0]).innerHTML = I[a[1]]; });

  var HINTS = {
    words: 'Vocabulary, times tables, sight words — anything you can call out.',
    numbers: 'A simple numeric range.',
    classic: 'Standard 75-ball bingo with column ranges and a free space.'
  };

  var cards = [], pool = [], callList = [];

  function sourceMode() {
    return $$('#source button').filter(function (b) { return b.classList.contains('on'); })[0].getAttribute('data-s');
  }

  function buildPool() {
    var mode = sourceMode();
    if (mode === 'words') {
      var seen = {}, out = [];
      GT.lines($('#words').value).forEach(function (l) {
        var k = l.toLowerCase();
        if (seen[k]) return;
        seen[k] = 1; out.push(l);
      });
      return out;
    }
    var lo = mode === 'classic' ? 1 : (parseInt($('#numMin').value, 10) || 1);
    var hi = mode === 'classic' ? 75 : (parseInt($('#numMax').value, 10) || 75);
    if (lo > hi) { var t = lo; lo = hi; hi = t; }
    var arr = [];
    for (var i = lo; i <= hi && arr.length < 5000; i++) arr.push(String(i));
    return arr;
  }

  function makeCard(rand, size, useColumns) {
    var free = $('#optFree').checked && size % 2 === 1;
    var grid = [];
    for (var r = 0; r < size; r++) { grid.push([]); for (var c = 0; c < size; c++) grid[r].push(null); }

    if (useColumns) {
      /* Each column draws from its own slice of the range, as in 75-ball bingo. */
      var per = Math.floor(pool.length / size);
      for (var col = 0; col < size; col++) {
        var slice = pool.slice(col * per, col === size - 1 ? pool.length : (col + 1) * per);
        var chosen = rand.shuffle(slice).slice(0, size);
        for (var row = 0; row < size; row++) grid[row][col] = chosen[row] === undefined ? '' : chosen[row];
      }
    } else {
      var flat = rand.shuffle(pool).slice(0, size * size);
      var k = 0;
      for (var r2 = 0; r2 < size; r2++) for (var c2 = 0; c2 < size; c2++) grid[r2][c2] = flat[k++] === undefined ? '' : flat[k - 1];
    }

    if (free) {
      var mid = Math.floor(size / 2);
      grid[mid][mid] = '★ FREE';
    }
    return grid;
  }

  function cardKey(grid) {
    return grid.map(function (r) { return r.join('|'); }).join('//');
  }

  function build() {
    pool = buildPool();
    var mode = sourceMode();
    $('#sourceHint').textContent = HINTS[mode];
    $('#wordsField').hidden = mode !== 'words';
    $('#numberField').hidden = mode !== 'numbers';

    if (mode === 'words') {
      $('#stats').innerHTML = '<div class="note ' + (pool.length ? 'note-ok' : 'note-warn') + '" style="margin-top:10px">' +
        (pool.length ? I.check : I.warn) + '<span>' + pool.length + ' unique item' + (pool.length === 1 ? '' : 's') + '</span></div>';
    }

    var size = parseInt($('#gridSize').value, 10);
    var need = size * size - (($('#optFree').checked && size % 2 === 1) ? 1 : 0);
    var nCards = Math.max(1, Math.min(200, parseInt($('#cards').value, 10) || 1));
    var useColumns = $('#optColumnRanges').checked && mode !== 'words' && pool.length >= size * size;

    if (pool.length < need) {
      $('#preview').innerHTML = '<div class="empty">Not enough items — a ' + size + '×' + size +
        ' card needs at least ' + need + ', you have ' + pool.length + '.</div>';
      $('#pill').textContent = 'too few items';
      $('#pill').style.background = 'var(--red-bg)'; $('#pill').style.color = 'var(--red)';
      renderChecks(need, 0);
      return;
    }

    var rand = W.rng($('#seed').value);
    cards = [];
    var seen = {}, dupes = 0, guard = 0;
    while (cards.length < nCards && guard++ < nCards * 25) {
      var g = makeCard(rand, size, useColumns);
      var k = cardKey(g);
      if (seen[k]) { dupes++; continue; }
      seen[k] = 1;
      cards.push(g);
    }

    callList = rand.shuffle(pool);

    renderPreview(size);
    renderCalls();
    renderChecks(need, dupes);

    $('#pill').textContent = cards.length + ' card' + (cards.length === 1 ? '' : 's') + ' · ' + size + '×' + size;
    $('#pill').style.background = 'var(--green-bg)'; $('#pill').style.color = 'var(--green)';
  }

  function headerLetters(size) {
    var word = ($('#title').value || 'BINGO').replace(/\s/g, '').toUpperCase();
    var out = [];
    for (var i = 0; i < size; i++) out.push(word[i] || '');
    return out;
  }

  function cardHtml(grid, idx, size, compact) {
    var fs = compact ? 10.5 : (size >= 5 ? 12 : 14);
    var cellH = compact ? 30 : (size >= 5 ? 40 : 48);
    var html = '<div style="border:2px solid var(--ink);border-radius:8px;padding:10px;background:#fff">';
    if ($('#optNumberCards').checked) {
      html += '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px">' +
        '<strong style="font-size:' + (compact ? 12 : 14) + 'px;letter-spacing:.1em">' + GT.esc($('#title').value) + '</strong>' +
        '<span style="font-size:11px;color:var(--muted)">Card ' + (idx + 1) + '</span></div>';
    }
    html += '<table style="border-collapse:collapse;width:100%;table-layout:fixed">';
    if ($('#optHeader').checked) {
      html += '<tr>' + headerLetters(size).map(function (l) {
        return '<th style="border:1.5px solid var(--ink);padding:4px;font-size:' + (fs + 2) +
          'px;background:var(--bg-soft)">' + l + '</th>';
      }).join('') + '</tr>';
    }
    grid.forEach(function (row) {
      html += '<tr>' + row.map(function (cell) {
        var isFree = cell === '★ FREE';
        return '<td style="border:1.5px solid var(--ink);height:' + cellH + 'px;text-align:center;vertical-align:middle;' +
          'font-size:' + (isFree ? fs - 1 : fs) + 'px;font-weight:' + (isFree ? '700' : '500') + ';' +
          'padding:2px;word-break:break-word;line-height:1.2;' +
          (isFree ? 'background:var(--bg-soft);' : '') + '">' + GT.esc(cell) + '</td>';
      }).join('') + '</tr>';
    });
    html += '</table></div>';
    return html;
  }

  function renderPreview(size) {
    var show = Math.min(cards.length, 4);
    $('#preview').innerHTML =
      '<p class="more-label">Showing ' + show + ' of ' + cards.length + ' cards</p>' +
      '<div class="grid g2">' + cards.slice(0, show).map(function (g, i) {
        return cardHtml(g, i, size, true);
      }).join('') + '</div>';
  }

  function renderCalls() {
    $('#calls').innerHTML = '<div style="columns:4;column-gap:16px;font-size:13.5px;line-height:2">' +
      callList.map(function (c, i) {
        return '<div style="break-inside:avoid"><span style="color:var(--muted-2);font-size:11px">' +
          String(i + 1).padStart(2, '0') + '</span> ☐ ' + GT.esc(c) + '</div>';
      }).join('') + '</div>';
  }

  function renderChecks(need, dupes) {
    var c = [];
    var size = parseInt($('#gridSize').value, 10);
    var nCards = parseInt($('#cards').value, 10) || 1;

    if (pool.length < need) {
      c.push(['err', 'A ' + size + '×' + size + ' card needs ' + need + ' items but the list has ' + pool.length + '.']);
    } else {
      c.push(['ok', pool.length + ' items available for ' + need + ' squares per card.']);
    }

    if (dupes) {
      c.push(['warn', dupes + ' duplicate card' + (dupes === 1 ? ' was' : 's were') +
        ' discarded and regenerated. With a small item pool there are only so many distinct cards possible.']);
    }

    /* Rough guide to how many genuinely different cards the pool supports. */
    if (pool.length && pool.length < need * 1.6) {
      c.push(['warn', 'The pool is only slightly larger than a card. Cards will look very similar and several players will win simultaneously. Aim for at least twice as many items as squares.']);
    } else if (pool.length >= need * 2) {
      c.push(['ok', 'Pool is comfortably larger than a card, so cards vary well.']);
    }

    if ($('#optFree').checked && size % 2 === 0) {
      c.push(['warn', 'Even-sized grids have no centre square, so the free space is skipped.']);
    }
    if ($('#optColumnRanges').checked && sourceMode() === 'words') {
      c.push(['warn', 'Column ranges only apply to numeric cards — the option is ignored for word lists.']);
    }
    if (nCards > 60) {
      c.push(['warn', nCards + ' cards is a lot of paper. Consider 4-per-page for a class set.']);
    }
    $('#checks').innerHTML = c.map(function (x) {
      return '<div class="note ' + (x[0] === 'ok' ? 'note-ok' : x[0] === 'warn' ? 'note-warn' : 'note-err') + '">' +
        (x[0] === 'ok' ? I.check : I.warn) + '<span>' + x[1] + '</span></div>';
    }).join('');
  }

  function printWindow(title, body) {
    var w = window.open('', '_blank');
    if (!w) { GT.toast('Allow pop-ups to print'); return; }
    w.document.write('<!DOCTYPE html><html><head><meta charset="utf-8"><title>' + GT.esc(title) + '</title><style>' +
      'body{font-family:Arial,Helvetica,sans-serif;color:#0f172a;margin:10mm}' +
      '.wrap{display:grid;gap:10mm}' +
      '.p1{grid-template-columns:1fr}.p2{grid-template-columns:1fr 1fr}.p4{grid-template-columns:1fr 1fr}' +
      '.card{border:2px solid #0f172a;border-radius:8px;padding:10px;break-inside:avoid;page-break-inside:avoid}' +
      '.card table{border-collapse:collapse;width:100%;table-layout:fixed}' +
      '.card td,.card th{border:1.5px solid #0f172a;text-align:center;vertical-align:middle;padding:3px;' +
      'word-break:break-word;line-height:1.2}' +
      '.card th{background:#f1f5f9}' +
      '.hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}' +
      '.hd strong{letter-spacing:.12em}.hd span{font-size:11px;color:#64748b}' +
      '.free{background:#f1f5f9;font-weight:700}' +
      '@media print{body{margin:8mm}.noprint{display:none}}' +
      '</style></head><body>' + body +
      '<script>window.onload=function(){window.print()}<' + '/script></body></html>');
    w.document.close();
  }

  $('#printBtn').addEventListener('click', function () {
    var size = parseInt($('#gridSize').value, 10);
    var per = parseInt($('#perPage').value, 10);
    var cellH = per === 4 ? 30 : per === 2 ? 42 : 60;
    var fs = per === 4 ? 10 : per === 2 ? 12 : 16;

    var body = '<div class="wrap p' + per + '">' + cards.map(function (g, i) {
      var h = '<div class="card">';
      if ($('#optNumberCards').checked) {
        h += '<div class="hd"><strong style="font-size:' + (fs + 2) + 'px">' + GT.esc($('#title').value) +
          '</strong><span>Card ' + (i + 1) + '</span></div>';
      }
      h += '<table>';
      if ($('#optHeader').checked) {
        h += '<tr>' + headerLetters(size).map(function (l) {
          return '<th style="font-size:' + (fs + 3) + 'px">' + l + '</th>';
        }).join('') + '</tr>';
      }
      g.forEach(function (row) {
        h += '<tr>' + row.map(function (cell) {
          var free = cell === '★ FREE';
          return '<td class="' + (free ? 'free' : '') + '" style="height:' + cellH + 'px;font-size:' + fs + 'px">' +
            GT.esc(cell) + '</td>';
        }).join('') + '</tr>';
      });
      h += '</table></div>';
      return h;
    }).join('') + '</div>';

    printWindow($('#title').value + ' cards', body);
  });

  $('#printCalls').addEventListener('click', function () {
    printWindow('Bingo call list',
      '<h2 style="margin:0 0 4px">' + GT.esc($('#title').value) + ' — call list</h2>' +
      '<p style="color:#64748b;font-size:12px;margin:0 0 14px">' + callList.length +
      ' items in shuffled order · tick each one as you call it</p>' +
      '<div style="columns:4;column-gap:14px;font-size:13px;line-height:2.1">' +
      callList.map(function (c, i) {
        return '<div style="break-inside:avoid"><span style="color:#94a3b8;font-size:10px">' +
          String(i + 1).padStart(2, '0') + '</span> ☐ ' + GT.esc(c) + '</div>';
      }).join('') + '</div>');
  });
  $('#copyCalls').addEventListener('click', function () {
    GT.copy(callList.map(function (c, i) { return (i + 1) + '. ' + c; }).join('\n'), 'Call list');
  });

  $('#source').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    $$('#source button').forEach(function (x) { x.classList.toggle('on', x === b); });
    var s = b.getAttribute('data-s');
    if (s === 'classic') {
      $('#gridSize').value = '5';
      $('#optColumnRanges').checked = true;
      $('#optColumnRanges').closest('.check').classList.add('on');
      $('#optFree').checked = true;
      $('#title').value = 'BINGO';
    }
    build();
  });
  $('#newSeed').addEventListener('click', function () { $('#seed').value = Math.random().toString(36).slice(2, 8); build(); });
  $('#regen').addEventListener('click', function () { $('#seed').value = Math.random().toString(36).slice(2, 8); build(); GT.toast('New cards'); });

  $('#guide').innerHTML = [
    ['Pool size decides how good the game is', 'If your list barely covers one card, every card looks the same and half the room shouts bingo at once. Aim for at least twice as many items as squares — for a 5×5 card that means 50 or more items. The tool warns you when the pool is too thin.'],
    ['Print the call list', 'Reading items off the original list means you lose track of what has been called. The shuffled call list with tick boxes solves that, and shuffling it means the game does not follow the order you typed.'],
    ['Number the cards', 'When someone calls bingo, you need to check it. A card number lets you find the right grid instantly rather than squinting at a photo of a card.'],
    ['Free space changes the odds', 'A centre free square makes lines through the middle much easier and shortens the game noticeably. Useful with younger children, worth turning off if you want a longer game.'],
    ['Classic column ranges are what makes it 75-ball bingo', 'In traditional bingo, B holds 1–15, I holds 16–30 and so on. Without column ranges any number can appear in any column, which is fine for classroom vocabulary bingo but is not the traditional game.'],
    ['Smaller grids for younger players', '3×3 finishes quickly and keeps attention. 5×5 is the standard but takes considerably longer, especially without a free space.']
  ].map(function (x) {
    return '<div style="margin-bottom:16px"><h4 style="font-size:14.5px;margin-bottom:6px">' + x[0] + '</h4>' +
      '<p style="color:var(--muted);font-size:13.8px">' + x[1] + '</p></div>';
  }).join('');

  $('#tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    $$('#tabs button').forEach(function (x) { x.classList.toggle('on', x === b); });
    $$('[data-panel]').forEach(function (p) { p.hidden = p.getAttribute('data-panel') !== b.getAttribute('data-tab'); });
  });
  $('#cfg').addEventListener('submit', function (e) { e.preventDefault(); build(); GT.toast('Cards generated'); });
  $('#cfg').addEventListener('input', build);
  $('#cfg').addEventListener('change', build);

  build();

  GT.page({
    slug: 'bingo-card-generator',
    lede: 'Print unique bingo cards from your own word list or a number range — with duplicate detection, a shuffled call list, and a warning when your pool is too small.',
    steps: [
      { icon: 'gear', title: 'Add your items', text: 'Vocabulary, times tables, sight words or a number range.' },
      { icon: 'bingo', title: 'Set grid and card count', text: '3×3 for younger players, 5×5 for the classic game.' },
      { icon: 'file', title: 'Print cards and call list', text: 'One, two or four cards per page, plus a tickable call sheet.' }
    ],
    guideTitle: 'The mistake that ruins classroom bingo',
    guide:
      '<p style="color:var(--muted)">Someone types 25 vocabulary words, generates 30 cards for a 5×5 grid, and every single card contains all 25 words in a different arrangement. The first few calls produce a winner, several children win simultaneously, and the game is over in two minutes.</p>' +
