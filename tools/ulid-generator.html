<body data-root="../">

<section class="hero" id="hero"></section>

<section id="toolApp">
<div class="wrap">
<div class="tool-grid">

  <form class="card card-pad" id="cfg" autocomplete="off">
    <div class="panel-title"><span class="ico" id="icoGear"></span>Generator Settings</div>

    <div class="field">
      <label for="count">How many?</label>
      <div class="row" style="grid-template-columns:minmax(0,1fr) auto">
        <input type="number" id="count" value="10" min="1" max="10000">
        <button type="button" class="btn btn-ghost" id="regen"><span id="icoReset"></span> Regenerate</button>
      </div>
    </div>

    <div class="field">
      <label for="tsMode">Timestamp source</label>
      <select id="tsMode">
        <option value="now">Now</option>
        <option value="custom">Custom date/time</option>
        <option value="spread">Spread across a range</option>
      </select>
      <input type="datetime-local" id="customTs" style="margin-top:8px" hidden>
      <div class="row" id="rangeWrap" style="margin-top:8px" hidden>
        <input type="date" id="fromDate">
        <input type="date" id="toDate">
      </div>
      <div class="hint">ULIDs encode the millisecond they were created, so generating for a past date lets you build realistic historical fixtures.</div>
    </div>

    <div class="field">
      <label>Case</label>
      <div class="seg" id="caseSeg">
        <button type="button" class="on" data-c="upper">UPPERCASE</button>
        <button type="button" data-c="lower">lowercase</button>
      </div>
      <div class="hint">The spec is uppercase. Crockford Base32 decoding is case-insensitive, so lowercase still parses.</div>
    </div>

    <div class="field">
      <label for="output">Output as</label>
      <select id="output">
        <option value="lines">Plain list (one per line)</option>
        <option value="json">JSON array</option>
        <option value="jsonl">JSON objects with timestamps</option>
        <option value="csv">CSV</option>
        <option value="sql">SQL INSERT values</option>
        <option value="quoted">Quoted &amp; comma-separated</option>
      </select>
    </div>

    <fieldset class="field">
      <legend class="label">Options</legend>
      <div class="check-list">
        <label class="check"><input type="checkbox" id="optMono" checked><span><span class="t">Monotonic within a millisecond</span><span class="d">Increments the random half so same-tick ULIDs still sort correctly.</span></span></label>
        <label class="check"><input type="checkbox" id="optSorted"><span><span class="t">Sort output ascending</span><span class="d">Proves the lexicographic ordering property.</span></span></label>
      </div>
    </fieldset>

    <div class="divider"></div>

    <div class="field">
      <label for="decode">Decode a ULID</label>
      <input type="text" id="decode" placeholder="01ARZ3NDEKTSV4RRFFQ69G5FAV">
      <div id="decodeOut" style="margin-top:12px"></div>
    </div>
  </form>

  <div class="card card-pad">
    <div class="panel-title"><span class="ico" id="icoSpark"></span>Generated ULIDs<span class="spacer"></span>
      <span class="result-pill" id="pill"></span></div>

    <div class="tabs" id="tabs">
      <button type="button" class="on" data-tab="file">Output</button>
      <button type="button" data-tab="anatomy">Anatomy</button>
      <button type="button" data-tab="code">Code snippets</button>
    </div>

    <div data-panel="file">
      <div class="output-box">
        <div class="output-bar"><span class="fname" id="fname">ulids.txt</span><span class="chip" id="meta"></span></div>
        <pre class="code" id="out"></pre>
      </div>
      <div class="out-actions">
        <button class="btn btn-primary" id="copyBtn"><span id="icoCopy"></span> Copy all</button>
        <button class="btn btn-ghost" id="dlBtn"><span id="icoDl"></span> Download</button>
        <button class="btn btn-soft" id="copyOne">Copy first</button>
      </div>
    </div>

    <div data-panel="anatomy" hidden><div id="anatomy"></div></div>
    <div data-panel="code" hidden><div id="code"></div></div>
  </div>

</div>

<script src="../assets/js/site.js"></script>
<script>
(function () {
  var I = GTI, $ = GT.$, $$ = GT.$$;
  ['icoGear:gear','icoSpark:spark','icoCopy:copy','icoDl:download','icoReset:reset']
    .forEach(function (p) { var a = p.split(':'); document.getElementById(a[0]).innerHTML = I[a[1]]; });

  /* Crockford Base32 — excludes I, L, O and U to avoid transcription errors */
  var A = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';
  var caseMode = 'upper', ids = [];

  function encodeTime(ms, len) {
    var s = '';
    for (var i = len - 1; i >= 0; i--) { s = A[ms % 32] + s; ms = Math.floor(ms / 32); }
    return s;
  }
  function randomChars(len) {
    var b = new Uint8Array(len); crypto.getRandomValues(b);
    var s = '';
    for (var i = 0; i < len; i++) s += A[b[i] % 32];
    return s;
  }
  function incrementRandom(r) {
    var chars = r.split('');
    for (var i = chars.length - 1; i >= 0; i--) {
      var idx = A.indexOf(chars[i]);
      if (idx < 31) { chars[i] = A[idx + 1]; return chars.join(''); }
      chars[i] = A[0];
    }
    return randomChars(16);
  }

  var lastMs = -1, lastRand = '';
  function ulid(ms) {
    ms = ms == null ? Date.now() : ms;
    var rand;
    if ($('#optMono').checked && ms === lastMs) { rand = incrementRandom(lastRand); }
    else { rand = randomChars(16); }
    lastMs = ms; lastRand = rand;
    return encodeTime(ms, 10) + rand;
  }

  function decodeTime(s) {
    var t = 0, part = s.slice(0, 10).toUpperCase();
    for (var i = 0; i < part.length; i++) {
      var v = A.indexOf(part[i]);
      if (v < 0) return null;
      t = t * 32 + v;
    }
    return t;
  }

  var out = GT.mountOutput({ pre: '#out', fileLabel: '#fname', meta: '#meta',
    copyBtn: '#copyBtn', downloadBtn: '#dlBtn', filename: 'ulids.txt', mime: 'text/plain' });

  function timestamps(n) {
    var mode = $('#tsMode').value;
    if (mode === 'custom' && $('#customTs').value) {
      var t = new Date($('#customTs').value).getTime();
      return Array.from({ length: n }, function () { return t; });
    }
    if (mode === 'spread') {
      var a = $('#fromDate').value ? new Date($('#fromDate').value).getTime() : Date.now() - 30 * 86400000;
      var b = $('#toDate').value ? new Date($('#toDate').value).getTime() : Date.now();
      if (b < a) { var tmp = a; a = b; b = tmp; }
      var arr = Array.from({ length: n }, function () { return a + Math.floor(Math.random() * (b - a)); });
      arr.sort(function (x, y) { return x - y; });
      return arr;
    }
    return Array.from({ length: n }, function () { return Date.now(); });
  }

  function build() {
    var n = Math.max(1, Math.min(10000, parseInt($('#count').value, 10) || 1));
    var ts = timestamps(n);
    lastMs = -1; lastRand = '';
    ids = ts.map(function (t) { return ulid(t); });
    if ($('#optSorted').checked) ids = ids.slice().sort();
    var shown = ids.map(function (u) { return caseMode === 'lower' ? u.toLowerCase() : u; });

    var mode = $('#output').value, text, file = 'ulids.txt';
    if (mode === 'json') { text = JSON.stringify(shown, null, 2); file = 'ulids.json'; }
    else if (mode === 'jsonl') {
      text = JSON.stringify(ids.map(function (u, i) {
        return { index: i + 1, ulid: shown[i], createdAt: new Date(decodeTime(u)).toISOString() };
      }), null, 2); file = 'ulids.json';
    }
    else if (mode === 'csv') {
      text = 'index,ulid,created_at\n' + ids.map(function (u, i) {
        return (i + 1) + ',' + shown[i] + ',' + new Date(decodeTime(u)).toISOString();
      }).join('\n'); file = 'ulids.csv';
    }
    else if (mode === 'sql') {
      text = 'INSERT INTO records (id) VALUES\n' + shown.map(function (u) { return "  ('" + u + "')"; }).join(',\n') + ';';
      file = 'ulids.sql';
    }
    else if (mode === 'quoted') text = shown.map(function (u) { return '"' + u + '"'; }).join(', ');
    else text = shown.join('\n');

    out.set(text, file);
    $('#pill').textContent = n.toLocaleString() + ' generated';
    $('#pill').style.background = 'var(--green-bg)'; $('#pill').style.color = 'var(--green)';
    renderAnatomy();
  }

  function renderAnatomy() {
    var u = ids[0] || ulid();
    var t = decodeTime(u);
    $('#anatomy').innerHTML =
      '<div class="output-box" style="margin-bottom:16px"><pre class="code">' +
      u.slice(0, 10) + '  ' + u.slice(10) + '\n' +
      '└─ time ─┘  └───── randomness ─────┘</pre></div>' +
      [['Characters 1–10', u.slice(0, 10), '48-bit Unix timestamp in milliseconds, Crockford Base32'],
       ['Characters 11–26', u.slice(10), '80 bits of cryptographic randomness'],
       ['Total length', '26 characters', 'Always fixed — no padding, no dashes'],
       ['Encoded time', new Date(t).toISOString(), 'Readable by anyone holding the ULID'],
       ['Alphabet', A, 'Excludes I, L, O and U to prevent transcription mistakes'],
       ['Valid until', new Date(281474976710655).toISOString().slice(0, 10), 'The 48-bit timestamp overflows in the year 10889']
      ].map(function (r) {
        return '<div class="kv"><span class="k">' + r[0] + '<br><span style="font-size:12.5px">' + r[2] + '</span></span>' +
          '<span class="v" style="max-width:52%;word-break:break-all;text-align:right">' + GT.esc(r[1]) + '</span></div>';
      }).join('') +
      '<div class="note note-info" style="margin-top:14px">' + I.info +
      '<span>Because the timestamp is the high-order part and Base32 preserves order, sorting ULIDs as plain strings sorts them chronologically. No parsing required — <code>ORDER BY id</code> just works.</span></div>';
  }

  $('#code').innerHTML = [
    ['JavaScript', "// npm i ulid\nimport { ulid, monotonicFactory } from 'ulid';\n\nconst id = ulid();\n\n// guaranteed ordering within the same millisecond\nconst next = monotonicFactory();\nconst a = next(), b = next();"],
    ['Python', "# pip install python-ulid\nfrom ulid import ULID\n\nid = ULID()\nprint(str(id), id.datetime)"],
    ['Go', '// go get github.com/oklog/ulid/v2\nid := ulid.MustNew(ulid.Timestamp(time.Now()), rand.Reader)'],
    ['PHP', '// composer require robinvdvleuten/ulid\n$id = Ulid::generate();'],
    ['PostgreSQL storage', '-- 26 chars, but only 16 bytes of real data.\n-- Store as bytea/uuid if space matters, or:\nCREATE TABLE records (\n  id CHAR(26) PRIMARY KEY\n);'],
    ['Sorting proof', "['01J0…A', '01J0…B'].sort()\n// chronological, because the timestamp is the prefix"]
  ].map(function (b) {
    return '<div style="margin-bottom:18px"><h4 style="font-size:14.5px;margin-bottom:8px">' + b[0] + '</h4>' +
      '<pre class="code">' + GT.esc(b[1]) + '</pre></div>';
  }).join('');

  $('#decode').addEventListener('input', function () {
    var v = this.value.trim().toUpperCase(), el = $('#decodeOut');
    if (!v) { el.innerHTML = ''; return; }
    if (v.length !== 26) {
      el.innerHTML = '<div class="note note-err">' + I.warn + '<span>A ULID is exactly 26 characters — this one has ' + v.length + '.</span></div>';
      return;
    }
    var bad = v.split('').filter(function (c) { return A.indexOf(c) === -1; });
    if (bad.length) {
      el.innerHTML = '<div class="note note-err">' + I.warn + '<span>Invalid Crockford Base32 characters: ' + GT.uniq(bad).join(', ') +
        '. The letters I, L, O and U are deliberately excluded.</span></div>';
      return;
    }
    if (v[0] > '7') {
      el.innerHTML = '<div class="note note-err">' + I.warn + '<span>Timestamp overflow — the first character cannot exceed 7.</span></div>';
      return;
    }
    var t = decodeTime(v);
    el.innerHTML = [['Created at', new Date(t).toISOString()], ['Unix ms', String(t)],
      ['Age', Math.round((Date.now() - t) / 1000) + ' seconds ago'], ['Random part', v.slice(10)]]
      .map(function (r) { return '<div class="kv"><span class="k">' + r[0] + '</span><span class="v">' + r[1] + '</span></div>'; }).join('');
  });

  $('#tsMode').addEventListener('change', function () {
    $('#customTs').hidden = this.value !== 'custom';
    $('#rangeWrap').hidden = this.value !== 'spread';
    build();
  });
  $('#caseSeg').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    $$('#caseSeg button').forEach(function (x) { x.classList.toggle('on', x === b); });
    caseMode = b.getAttribute('data-c'); build();
  });
  $('#copyOne').addEventListener('click', function () {
    GT.copy(caseMode === 'lower' ? (ids[0] || '').toLowerCase() : ids[0] || '', 'ULID');
  });
  $('#regen').addEventListener('click', build);
  $('#tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    $$('#tabs button').forEach(function (x) { x.classList.toggle('on', x === b); });
    $$('[data-panel]').forEach(function (p) { p.hidden = p.getAttribute('data-panel') !== b.getAttribute('data-tab'); });
  });
  $('#cfg').addEventListener('submit', function (e) { e.preventDefault(); build(); });
  ['#count','#output','#optMono','#optSorted','#customTs','#fromDate','#toDate'].forEach(function (s) {
    $(s).addEventListener('change', build); $(s).addEventListener('input', build);
  });

  build();

  GT.page({
    slug: 'ulid-generator',
    lede: 'Generate ULIDs — 26 characters, sortable by creation time, safe in URLs, and readable without the dashes and ambiguity of a UUID.',
    steps: [
      { icon: 'gear', title: 'Set count and timestamp', text: 'Generate for now, a fixed moment, or spread across a date range for historical fixtures.' },
      { icon: 'clock', title: 'Keep monotonic on', text: 'IDs created in the same millisecond still sort in creation order.' },
      { icon: 'copy', title: 'Export or decode', text: 'Copy as a list, JSON, CSV or SQL — or paste an existing ULID to read its timestamp.' }
    ],
    guideTitle: 'ULID vs UUID v7 — how to choose',
    guide:
      '<p style="color:var(--muted)">Both solve the same problem: globally unique identifiers that sort by creation time. They differ mainly in encoding and ecosystem, and the right answer usually comes down to where the ID will be seen.</p>' +
      '<div class="grid g2" style="margin-top:18px">' +
      '<div><h4 style="font-size:14.5px;margin-bottom:8px">ULID wins on ergonomics</h4><ul style="color:var(--muted);font-size:13.8px;padding-left:18px;margin:0"><li>26 characters instead of 36 — noticeably shorter in URLs and logs.</li><li>No dashes, so double-click selects the whole ID.</li><li>Crockford Base32 excludes I, L, O and U, so nobody misreads a 1 for an l when copying from a screen or reading over the phone.</li><li>Case-insensitive when decoding.</li></ul></div>' +
      '<div><h4 style="font-size:14.5px;margin-bottom:8px">UUID v7 wins on ecosystem</h4><ul style="color:var(--muted);font-size:13.8px;padding-left:18px;margin:0"><li>It is a real IETF standard (RFC 9562); ULID is a community spec.</li><li>Native database column types exist — PostgreSQL <code>uuid</code>, 16 bytes on disk with real index support.</li><li>Every language and ORM already understands the format.</li><li>Stored as text, a ULID needs <code>CHAR(26)</code> unless you convert to binary yourself.</li></ul></div></div>' +
      '<p style="color:var(--muted);margin-top:16px"><strong>A reasonable default:</strong> UUID v7 for internal database keys where native types and tooling matter, ULID for identifiers that humans see, type or read aloud — order numbers, support tickets, short share links.</p>' +
      '<div class="note note-warn" style="margin-top:16px">' + GTI.warn + '<span>Like UUID v7, a ULID publishes its creation time. If the moment a record was created is sensitive — or if an attacker could infer volume from watching IDs — use a fully random identifier such as a NanoID instead.</span></div>',
    related: ['uuid-v7-generator', 'nanoid-generator', 'mongodb-objectid-generator'],
faqs: [
      { q: 'How long is a ULID?', a: 'A canonical ULID is 26 characters and represents a 128-bit value.' },
      { q: 'Is ULID a UUID?', a: 'No. It is a separate community specification, although both ULID and UUID are 128-bit identifier formats.' },
      { q: 'Does ULID contain a timestamp?', a: 'Yes. The first 48 bits encode a Unix timestamp in milliseconds.' },
      { q: 'Are ULIDs sortable?', a: 'Yes. Properly generated ULIDs are lexicographically sortable by their timestamp. Monotonic generation preserves ordering for multiple IDs in the same millisecond.' },
      { q: 'Is ULID URL-safe?', a: 'Yes. Its Crockford Base32 text form uses letters and digits without URL-reserved punctuation.' },
      { q: 'ULID or UUID v7: which should I choose?', a: 'Choose ULID for compact sortable text. Choose UUID v7 when native UUID types and RFC-standardized UUID interoperability are more important.' },
      { q: 'Is this ULID generator free?', a: 'Yes. Generate, format, decode and download ULIDs above without creating an account.' }
    ],
    seo: {
      title: 'ULID Generator – Create Sortable, URL-Safe Identifiers Online',
      lead: 'Use the ULID Generator above to create Universally Unique Lexicographically Sortable Identifiers in your browser. Generate one or thousands, choose the timestamp, switch between canonical uppercase and lowercase output, enable monotonic ordering and decode an existing ULID to see when it was created.',
      blocks: [
        { html: '<p>A ULID is a 128-bit identifier represented as 26 Crockford Base32 characters.</p>' +
            '<p>Its first 48 bits encode a millisecond timestamp. The remaining 80 bits provide randomness.</p>' +
            '<p>That layout makes ULIDs compact, URL-friendly and naturally sortable by time—a useful combination for database records, APIs, logs, events and distributed applications.</p>' },
        { h: 'What Is a ULID?',
          html: '<p>ULID stands for <strong>Universally Unique Lexicographically Sortable Identifier</strong>.</p><p>A typical ULID looks like:</p>' +
            '<pre class="code">01ARZ3NDEKTSV4RRFFQ69G5FAV</pre><p>The format contains two logical parts:</p>',
          table: { head: ['Part', 'Size', 'Purpose'], rows: [['Timestamp', '48 bits', 'Unix time in milliseconds'], ['Randomness', '80 bits', 'Uniqueness within the timestamp'], ['Total', '128 bits', 'Complete ULID']] },
          after: '<p>The 128-bit value is encoded using Crockford Base32, producing a fixed 26-character string.</p>' +
            '<p>Because the timestamp comes first, normal lexicographic string sorting also sorts correctly generated ULIDs by time.</p>' },
        { h: 'How to Use This ULID Generator',
          html: '<p>Choose how many identifiers you want.</p><p>For normal use, leave the timestamp set to the current time.</p>' +
            '<p>For test fixtures, you can choose a specific date and time. This is useful when you need realistic records that sort as if they were created in the past.</p>' +
            '<p>Next, choose uppercase or lowercase output.</p>' +
            '<p>The canonical ULID representation is uppercase. Crockford Base32 decoding is case-insensitive, so many implementations also accept lowercase.</p>' +
            '<p>Enable <strong>Monotonic within a millisecond</strong> when generating multiple values that may share exactly the same millisecond timestamp.</p>' +
            '<p>Then copy, download or export the generated values.</p>' +
            '<p>You can paste an existing ULID into the decoder to inspect its timestamp and validate the string.</p>' },
        { h: 'Why Are ULIDs Sortable?',
          html: '<p>The timestamp is encoded at the beginning of the identifier.</p>' +
            '<p>That means an older ULID normally starts with a lower encoded time value than a newer one.</p><p>Example conceptually:</p>' +
            '<p>Older record: <code>01H...</code></p><p>Newer record: <code>01J...</code></p>' +
            '<p>Because the time component comes first, text sorting can follow creation chronology.</p>' +
            '<p>This is different from UUID v4, where the value is random and sorting the ID does not meaningfully represent creation time.</p>' +
            '<p>Sortable IDs are convenient in databases, logs and event systems where recent records are often grouped together.</p>' },
        { h: 'What Is Crockford Base32?',
          html: '<p>Crockford Base32 is an encoding alphabet designed to be compact and easier for humans to read than many other binary-to-text formats.</p>' +
            '<p>ULID uses characters that avoid several ambiguous letters.</p>' +
            '<p>The canonical encoding does not use letters such as I, L, O and U.</p>' +
            '<p>That reduces visual confusion in copied identifiers.</p>' +
            '<p>Base32 also allows a 128-bit value to fit into 26 characters, compared with the 36-character standard textual form of a UUID.</p>' +
            '<p>ULIDs contain no punctuation, which makes them convenient in URLs, filenames and systems where hyphens are undesirable.</p>' },
        { h: 'ULID Timestamp Explained',
          html: '<p>The timestamp portion is 48 bits and represents Unix time in milliseconds.</p>' +
            '<p>That gives ULID millisecond-level time ordering, and a decoder can recover the approximate creation time.</p>' +
            '<p>Do not choose ULID if creation time itself must remain hidden.</p>' +
            '<p>Also avoid treating the embedded timestamp as your only business timestamp. Keep a normal <code>created_at</code> field when your application needs explicit date queries, auditing or time-zone-aware logic.</p>' },
        { h: 'What Does Monotonic ULID Mean?',
          html: '<p>Several ULIDs can be created during one millisecond.</p>' +
            '<p>If every value uses a new random 80-bit portion, those same-millisecond ULIDs are unique but may not appear in the exact order they were generated.</p>' +
            '<p>A monotonic ULID generator solves that by incrementing the random component when the timestamp has not advanced.</p>' +
            '<p>This preserves lexicographic order for identifiers created in the same millisecond.</p>' +
            '<p>Monotonic generation is especially useful in high-throughput applications where many records can be created during one clock tick.</p>' +
            '<p>Production code should use a library that correctly handles monotonic state and overflow.</p>' },
        { h: 'How Unique Is a ULID?',
          html: '<p>The random component contains 80 bits.</p><p>Within a given millisecond, that provides an enormous identifier space.</p>' +
            '<p>The ULID specification describes roughly 1.21 × 10²⁴ possible random values per millisecond.</p>' +
            '<p>Collisions are therefore extremely unlikely with a secure implementation.</p>' +
            '<p>Still, identifier uniqueness should not be treated as a replacement for database integrity.</p>' +
            '<p>If a column must be unique, enforce that with a UNIQUE constraint or primary key.</p>' +
            '<p>The generator makes structurally valid IDs; your application remains responsible for persistence rules.</p>' },
