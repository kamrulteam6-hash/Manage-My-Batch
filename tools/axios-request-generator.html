<script>
(function () {
  var I = GTI, $ = GT.$, $$ = GT.$$;
  ['icoGear:gear','icoSpark:spark','icoCopy:copy','icoDl:download']
    .forEach(function (p) { var a = p.split(':'); document.getElementById(a[0]).innerHTML = I[a[1]]; });

  var req = GTReq.mount($('#reqForm'), build);
  var lang = 'js';

  var out = GT.mountOutput({ pre: '#out', fileLabel: '#fname', meta: '#meta',
    copyBtn: '#copyBtn', downloadBtn: '#dlBtn', filename: 'request.js', mime: 'text/plain' });

  function ts() { return lang === 'ts'; }
  function ind(s, n) {
    var pad = new Array(n + 1).join(' ');
    return s.split('\n').map(function (l) { return l ? pad + l : l; }).join('\n');
  }
  function origin() {
    try { return new URL(req.fullUrl()).origin; } catch (e) { return 'https://api.example.com'; }
  }
  function pathOnly() {
    try { var u = new URL(req.fullUrl()); return u.pathname + u.search; } catch (e) { return '/'; }
  }

  function headersObj(skipContentType) {
    var m = req.model;
    var hs = req.allHeaders().filter(function (h) {
      if (skipContentType && /^content-type$/i.test(h.k)) return false;
      return true;
    });
    if (!hs.length) return null;
    return '{\n' + hs.map(function (h) {
      var v;
      if (/^authorization$/i.test(h.k) && /^Bearer /.test(h.v) && $('#optEnv').checked) v = '`Bearer ${process.env.API_TOKEN}`';
      else if (m.auth === 'apikey' && h.k === (m.apiKeyName || 'X-API-Key') && $('#optEnv').checked) v = 'process.env.API_KEY';
      else v = "'" + h.v.replace(/'/g, "\\'") + "'";
      return "  '" + h.k + "': " + v + ',';
    }).join('\n') + '\n}';
  }

  function dataLiteral() {
    var m = req.model;
    if (req.noBody()) return null;
    if (m.bodyType === 'json') {
      /* Axios serialises plain objects automatically — no JSON.stringify needed. */
      try { return JSON.stringify(JSON.parse(m.body), null, 2); } catch (e) { return m.body; }
    }
    if (m.bodyType === 'text') return "'" + m.body.replace(/'/g, "\\'").replace(/\n/g, '\\n') + "'";
    if (m.bodyType === 'form') {
      return 'new URLSearchParams({\n' + m.form.filter(function (f) { return f.k.trim(); }).map(function (f) {
        return "  '" + f.k.trim() + "': '" + String(f.v).replace(/'/g, "\\'") + "',";
      }).join('\n') + '\n})';
    }
    if (m.bodyType === 'multipart') return 'formData';
    return null;
  }

  function multipartPrelude() {
    var m = req.model;
    if (req.noBody() || m.bodyType !== 'multipart') return '';
    return 'const formData = new FormData();\n' +
      m.form.filter(function (f) { return f.k.trim(); }).map(function (f) {
        return "formData.append('" + f.k.trim() + "', '" + String(f.v).replace(/'/g, "\\'") + "');";
      }).join('\n') + '\n\n';
  }

  function configLines(includeUrl) {
    var m = req.model, lines = [];
    if (includeUrl) {
      lines.push("method: '" + m.method.toLowerCase() + "',");
      lines.push('url: ' + JSON.stringify(req.fullUrl()) + ',');
    }
    var h = headersObj(m.bodyType === 'multipart');
    if (h) lines.push('headers: ' + h + ',');
    var d = dataLiteral();
    if (d) lines.push('data: ' + d + ',');
    if ($('#optTimeout').checked) lines.push('timeout: ' + ($('#timeoutMs').value || 10000) + ',');
    if ($('#optCancel').checked) lines.push('signal: controller.signal,');
    if ($('#optValidate').checked) lines.push('validateStatus: (status) => status < 500,   // resolve on 4xx, reject only on server errors');
    if ($('#optProgress').checked) {
      lines.push('onUploadProgress: (e) => {');
      lines.push('  if (e.total) console.log(`upload ${Math.round((e.loaded / e.total) * 100)}%`);');
      lines.push('},');
      lines.push('onDownloadProgress: (e) => {');
      lines.push('  if (e.total) console.log(`download ${Math.round((e.loaded / e.total) * 100)}%`);');
      lines.push('},');
    }
    return lines;
  }

  function catchBlock(fn) {
    return 'catch (error) {\n' +
      '  if (axios.isAxiosError(error)) {\n' +
      '    if (error.response) {\n' +
      '      // The server replied with a status outside validateStatus.\n' +
      "      console.error('Server error', error.response.status, error.response.data);\n" +
      '    } else if (error.request) {\n' +
      '      // The request was sent but no response arrived — timeout, DNS, offline.\n' +
      "      console.error('No response received', error.code);\n" +
      '    } else {\n' +
      "      console.error('Request setup failed', error.message);\n" +
      '    }\n' +
      '  } else {\n' +
      '    throw error;\n' +
      '  }\n' +
      '  throw error;\n' +
      '}';
  }

  function build() {
    var m = req.model;
    var style = $('#style').value;
    var fn = $('#fnName').value || 'makeRequest';
    var imp = ts() ? "import axios, { AxiosError, AxiosInstance } from 'axios';\n\n" : "import axios from 'axios';\n\n";
    var retType = ts() ? ': Promise<ApiResponse>' : '';
    var iface = ts() ? 'interface ApiResponse {\n  [key: string]: unknown;\n}\n\n' : '';
    var text = '';
    var ctrl = $('#optCancel').checked ? 'const controller = new AbortController();\n\n' : '';

    if (style === 'shorthand') {
      var d = dataLiteral();
      var cfg = configLines(false);
      var args = [JSON.stringify(req.fullUrl())];
      if (d && ['post', 'put', 'patch'].indexOf(m.method.toLowerCase()) > -1) args.push(d);
      if (cfg.filter(function (l) { return l.indexOf('data:') !== 0; }).length) {
        args.push('{\n' + ind(cfg.filter(function (l) { return l.indexOf('data:') !== 0; }).join('\n'), 2) + '\n}');
      }
      text = imp + multipartPrelude() + ctrl +
        'const { data } = await axios.' + m.method.toLowerCase() + '(' + args.join(', ') + ');';
    } else if (style === 'config') {
      text = imp + multipartPrelude() + ctrl +
        'const response = await axios({\n' + ind(configLines(true).join('\n'), 2) + '\n});\n\n' +
        'console.log(response.status, response.data);';
    } else if (style === 'instance') {
      text = imp + iface +
        'const api' + (ts() ? ': AxiosInstance' : '') + ' = axios.create({\n' +
        '  baseURL: ' + JSON.stringify(origin()) + ',\n' +
        '  timeout: ' + ($('#timeoutMs').value || 10000) + ',\n' +
        '  headers: {\n' +
        "    'Content-Type': 'application/json',\n" +
        '    Authorization: `Bearer ${process.env.API_TOKEN}`,\n' +
        '  },\n' +
        '});\n\n' +
        'export async function ' + fn + '()' + retType + ' {\n' +
        '  const { data } = await api.' + m.method.toLowerCase() + '(' + JSON.stringify(pathOnly()) +
        (dataLiteral() && ['post', 'put', 'patch'].indexOf(m.method.toLowerCase()) > -1 ? ', ' + ind(dataLiteral(), 2).trim() : '') + ');\n' +
        '  return data;\n' +
        '}';
    } else if (style === 'interceptors') {
      text = imp +
        'const api = axios.create({\n' +
        '  baseURL: ' + JSON.stringify(origin()) + ',\n' +
        '  timeout: ' + ($('#timeoutMs').value || 10000) + ',\n' +
        '});\n\n' +
        '// Attach auth to every outgoing request in one place.\n' +
        'api.interceptors.request.use((config) => {\n' +
        '  const token = process.env.API_TOKEN;\n' +
        '  if (token) config.headers.Authorization = `Bearer ${token}`;\n' +
        '  return config;\n' +
        '});\n\n' +
        '// Normalise errors and handle auth expiry centrally.\n' +
        'api.interceptors.response.use(\n' +
        '  (response) => response,\n' +
        '  async (error) => {\n' +
        '    if (error.response?.status === 401) {\n' +
        '      // refresh the token, redirect to login, etc.\n' +
        '    }\n' +
        '    return Promise.reject(error);\n' +
        '  },\n' +
        ');\n\n' +
        'export async function ' + fn + '()' + retType + ' {\n' +
        '  const { data } = await api.' + m.method.toLowerCase() + '(' + JSON.stringify(pathOnly()) +
        (dataLiteral() && ['post', 'put', 'patch'].indexOf(m.method.toLowerCase()) > -1 ? ', ' + ind(dataLiteral(), 2).trim() : '') + ');\n' +
        '  return data;\n' +
        '}';
    } else if (style === 'retry') {
      text = imp +
        'const api = axios.create({\n' +
        '  baseURL: ' + JSON.stringify(origin()) + ',\n' +
        '  timeout: ' + ($('#timeoutMs').value || 10000) + ',\n' +
        '});\n\n' +
        '// Retry idempotent requests on network errors and 5xx, with backoff.\n' +
        'api.interceptors.response.use(undefined, async (error) => {\n' +
        '  const config = error.config;\n' +
        '  if (!config || config.__retryCount >= 3) return Promise.reject(error);\n\n' +
        '  const status = error.response?.status;\n' +
        '  const retryable = !error.response || (status >= 500 && status < 600) || status === 429;\n' +
        '  if (!retryable) return Promise.reject(error);\n\n' +
        '  config.__retryCount = (config.__retryCount ?? 0) + 1;\n' +
        '  const delay = 250 * 2 ** (config.__retryCount - 1);\n' +
        '  await new Promise((r) => setTimeout(r, delay));\n' +
        '  return api(config);\n' +
        '});\n\n' +
        'export async function ' + fn + '()' + retType + ' {\n' +
        '  const { data } = await api.' + m.method.toLowerCase() + '(' + JSON.stringify(pathOnly()) + ');\n' +
        '  return data;\n' +
        '}';
    } else if (style === 'react') {
      text = imp +
        'function useData() {\n' +
        '  const [data, setData] = useState' + (ts() ? '<unknown>' : '') + '(null);\n' +
        '  const [error, setError] = useState' + (ts() ? '<Error | null>' : '') + '(null);\n' +
        '  const [loading, setLoading] = useState(true);\n\n' +
        '  useEffect(() => {\n' +
        '    const controller = new AbortController();\n\n' +
        '    axios({\n' +
        ind(configLines(true).filter(function (l) { return l.indexOf('signal:') !== 0; }).join('\n'), 6) + '\n' +
        '      signal: controller.signal,\n' +
        '    })\n' +
        '      .then((res) => setData(res.data))\n' +
        '      .catch((e) => {\n' +
        '        if (!axios.isCancel(e)) setError(e);\n' +
        '      })\n' +
        '      .finally(() => setLoading(false));\n\n' +
        '    return () => controller.abort();\n' +
        '  }, []);\n\n' +
        '  return { data, error, loading };\n' +
        '}';
    } else {
      text = imp + iface + multipartPrelude() + ctrl +
        'export async function ' + fn + '()' + retType + ' {\n' +
        ind(($('#optTryCatch').checked
          ? 'try {\n' +
            '  const response = await axios({\n' + ind(configLines(true).join('\n'), 4) + '\n  });\n\n' +
            '  return response.data' + (ts() ? ' as ApiResponse' : '') + ';\n' +
            '} ' + catchBlock(fn)
          : 'const response = await axios({\n' + ind(configLines(true).join('\n'), 2) + '\n});\n\nreturn response.data;'), 2) + '\n' +
        '}';
    }

    out.set(text, 'request.' + (ts() ? 'ts' : 'js'));
    $('#pill').textContent = m.method + ' · ' + (ts() ? 'TypeScript' : 'JavaScript');
    $('#pill').style.background = 'var(--purple-bg)'; $('#pill').style.color = 'var(--purple)';

    renderErrors();
    renderVs();
    renderWarn();
  }

  function renderErrors() {
    $('#errors').innerHTML =
      '<p style="color:var(--muted);font-size:13.8px;margin-bottom:14px">An Axios error falls into exactly three shapes. Checking them in this order is the difference between a useful log line and “Request failed”.</p>' +
      '<pre class="code">' + GT.esc(
        'try {\n' +
        '  const { data } = await api.get(\'/users\');\n' +
        '} catch (error) {\n' +
        '  if (!axios.isAxiosError(error)) throw error;\n\n' +
        '  if (error.response) {\n' +
        '    // 1. The server responded with 4xx or 5xx.\n' +
        '    error.response.status;      // 404\n' +
        '    error.response.data;        // parsed error body\n' +
        '    error.response.headers;\n' +
        '  } else if (error.request) {\n' +
        '    // 2. Request sent, no response: timeout, offline, DNS, CORS.\n' +
        '    error.code;                 // ECONNABORTED, ERR_NETWORK\n' +
        '  } else {\n' +
        '    // 3. Something broke before the request went out.\n' +
        '    error.message;\n' +
        '  }\n' +
        '}') + '</pre>' +
      '<h4 style="font-size:14.5px;margin:18px 0 8px">Common error codes</h4>' +
      [['ECONNABORTED', 'The timeout you configured was hit.'],
       ['ERR_NETWORK', 'No response at all — offline, DNS failure, or a CORS block in the browser.'],
       ['ERR_CANCELED', 'You aborted it via AbortController. Filter these out with <code>axios.isCancel()</code>.'],
       ['ECONNREFUSED', 'Nothing is listening on that host and port.'],
       ['ETIMEDOUT', 'The operating system gave up on the connection.']
      ].map(function (r) {
        return '<div class="kv"><span class="k"><code>' + r[0] + '</code></span><span class="v" style="font-family:var(--sans);font-weight:500;max-width:60%;text-align:right">' + r[1] + '</span></div>';
      }).join('');
  }

  function renderVs() {
    $('#vs').innerHTML =
      [['Rejects on 4xx/5xx', 'Yes, automatically', 'No — check response.ok yourself'],
       ['JSON handling', 'Automatic both ways', 'Manual JSON.stringify and .json()'],
       ['Timeout', 'Built-in <code>timeout</code> option', 'AbortSignal.timeout() by hand'],
       ['Interceptors', 'First-class', 'Wrap fetch yourself'],
       ['Upload progress', 'Supported', 'Not available without streams'],
       ['Bundle cost', '~13 KB gzipped', 'Zero — it is built in'],
       ['Node support', 'Works everywhere', 'Built in from Node 18'],
       ['XSRF token handling', 'Built in', 'Manual']
      ].map(function (r) {
        return '<div class="kv"><span class="k"><strong>' + r[0] + '</strong><br><span style="font-size:12.5px">Axios: ' + r[1] + '</span></span>' +
          '<span class="v" style="font-family:var(--sans);font-weight:500;max-width:45%;text-align:right;font-size:12.5px;color:var(--muted)">fetch: ' + r[2] + '</span></div>';
      }).join('') +
      '<div class="note note-info" style="margin-top:14px">' + I.info +
      '<span>Axios earns its 13 KB when you need interceptors for auth refresh, progress events for uploads, or consistent behaviour across a large codebase. For a handful of simple calls, <a href="/tools/fetch-api-request-generator">fetch</a> with a small wrapper is usually the better trade.</span></div>';
  }

  function renderWarn() {
    var w = [], m = req.model;
    var jv = req.jsonValid();
    if (!jv.ok) w.push(['err', 'The JSON body is invalid: ' + GT.esc(jv.msg)]);
    if (m.bodyType === 'json') w.push(['ok', 'Axios serialises plain objects and sets <code>Content-Type: application/json</code> automatically — no <code>JSON.stringify</code> needed.']);
    if (m.bodyType === 'multipart') w.push(['warn', 'For FormData, let Axios set <code>Content-Type</code> so the multipart boundary is included. In Node you may need <code>...formData.getHeaders()</code>.']);
    if (!$('#optTimeout').checked) w.push(['warn', 'No timeout set. Axios defaults to 0, which means wait forever.']);
    if ($('#optValidate').checked) w.push(['warn', 'A custom <code>validateStatus</code> changes which responses throw. With <code>status < 500</code>, a 404 resolves successfully — your code must then check the status itself.']);
    if (!$('#optEnv').checked && (m.auth === 'bearer' || m.auth === 'apikey')) w.push(['warn', 'The token is hard-coded. In browser bundles any token is readable by the user regardless — proxy through your own server if it must stay secret.']);
    if (!w.length) w.push(['ok', 'Request looks correctly configured.']);
    $('#warnBox').innerHTML = w.map(function (x) {
      return '<div class="note ' + (x[0] === 'ok' ? 'note-ok' : x[0] === 'warn' ? 'note-warn' : 'note-err') + '">' +
        (x[0] === 'ok' ? I.check : I.warn) + '<span>' + x[1] + '</span></div>';
    }).join('');
  }

  $('#lang').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    $$('#lang button').forEach(function (x) { x.classList.toggle('on', x === b); });
    lang = b.getAttribute('data-l'); build();
  });
  $('#tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    $$('#tabs button').forEach(function (x) { x.classList.toggle('on', x === b); });
    $$('[data-panel]').forEach(function (p) { p.hidden = p.getAttribute('data-panel') !== b.getAttribute('data-tab'); });
  });
  $('#cfg').addEventListener('submit', function (e) { e.preventDefault(); build(); });
  $('#cfg').addEventListener('input', build);
  $('#cfg').addEventListener('change', build);

  build();

  GT.page({
    slug: 'axios-request-generator',
    lede: 'Generate Axios requests, configured instances and interceptors — with the three-branch error handling that makes failures actually diagnosable.',
    steps: [
      { icon: 'gear', title: 'Describe the request', text: 'The same form as the cURL and fetch generators, so you can compare outputs directly.' },
      { icon: 'swap', title: 'Choose a pattern', text: 'One-off call, shared instance, interceptors for auth, or an instance with retry and backoff.' },

    guideTitle: 'Instances and interceptors are the reason to use Axios',
    guide:
      '<p style="color:var(--muted)">A single Axios call is barely different from a fetch call. What Axios actually buys you appears once you have thirty of them: a configured instance holds the base URL, timeout and default headers in one place, and interceptors let you attach auth, refresh expired tokens, log requests and normalise errors without touching a single call site.</p>' +
      '<div class="grid g2" style="margin-top:18px">' +
      '<div><h4 style="font-size:14.5px;margin-bottom:8px">What belongs in an interceptor</h4><ul style="color:var(--muted);font-size:13.8px;padding-left:18px;margin:0"><li>Attaching the auth header from wherever your token lives.</li><li>Catching 401s to refresh a token and replay the original request.</li><li>Adding a correlation ID header for tracing.</li><li>Converting API error shapes into your own error class.</li><li>Retry with backoff for 5xx and 429 responses.</li></ul></div>' +
      '<div><h4 style="font-size:14.5px;margin-bottom:8px">The error shape nobody reads carefully</h4><p style="color:var(--muted);font-size:13.8px">An Axios error has three mutually exclusive forms. <code>error.response</code> exists when the server replied with a bad status. <code>error.request</code> exists when the request went out but nothing came back — a timeout, an offline client, a CORS block. Neither exists when the failure happened while building the request.</p>' +
      '<p style="color:var(--muted);font-size:13.8px;margin-top:10px">Logging <code>error.message</code> alone collapses all three into "Request failed", which is why so much production debugging starts from nothing. The generated catch block branches on all three.</p></div></div>' +
      '<div class="note note-warn" style="margin-top:18px">' + GTI.warn + '<span><strong>Retry only idempotent requests.</strong> Retrying a GET is safe. Retrying a POST that timed out may create a second order, because the timeout tells you nothing about whether the server processed the first one. Restrict automatic retries to GET, PUT and DELETE, or require an idempotency key.</span></div>',
