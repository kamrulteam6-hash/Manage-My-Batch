  <form class="card card-pad" id="cfg" autocomplete="off">
    <div class="panel-title"><span class="ico" id="icoGear"></span>Generator Settings</div>

    <div class="field">
      <label for="count">How many?</label>
      <div class="row" style="grid-template-columns:minmax(0,1fr) auto">
        <input type="number" id="count" value="10" min="1" max="10000">
        <button type="button" class="btn btn-ghost" id="regen"><span id="icoReset"></span> Regenerate</button>
      </div>
    </div>

    <div class="field">
      <label for="size">ID length: <strong id="sizeLabel">21</strong> characters</label>
      <input type="range" id="size" min="4" max="64" value="21" style="width:100%;accent-color:var(--blue)">
      <div class="hint">21 is the library default and is roughly as collision-resistant as a UUID v4.</div>
    </div>

    <div class="field">
      <label for="preset">Alphabet</label>
      <select id="preset">
        <option value="default" selected>Default (A-Za-z0-9_-) — 64 chars, URL-safe</option>
        <option value="urlsafe">URL-friendly without _ and - (62 chars)</option>
        <option value="lower">Lowercase + digits (36 chars)</option>
        <option value="nolookalike">No look-alikes — omits 1lIO0 (49 chars)</option>
        <option value="nolookalike-safe">No look-alikes + no vowels (avoids words)</option>
        <option value="hex">Hexadecimal (16 chars)</option>
        <option value="numbers">Digits only (10 chars)</option>
        <option value="uppercase">Uppercase + digits (36 chars)</option>
        <option value="custom">Custom…</option>
      </select>
      <input type="text" id="customAlpha" style="margin-top:8px" hidden placeholder="Paste your alphabet">
      <div class="hint" id="alphaInfo"></div>
    </div>

    <div class="field">
      <div class="row">
        <div><label for="prefix">Prefix</label><input type="text" id="prefix" placeholder="user_"></div>
        <div><label for="suffix">Suffix</label><input type="text" id="suffix" placeholder=""></div>
      </div>
      <div class="hint">Prefixes such as <code>user_</code> or <code>inv_</code> make IDs self-describing in logs — the Stripe convention.</div>
    </div>

    <div class="field">
      <label for="output">Output as</label>
      <select id="output">
        <option value="lines">Plain list</option>
        <option value="json">JSON array</option>
        <option value="csv">CSV</option>
        <option value="sql">SQL INSERT values</option>
        <option value="quoted">Quoted &amp; comma-separated</option>
      </select>
    </div>

    <div class="divider"></div>

    <div class="field">
      <div class="label">Collision calculator</div>
      <div class="row">
        <div><label for="rate" style="font-weight:500;font-size:12.5px">IDs per hour</label><input type="number" id="rate" value="1000" min="1"></div>
        <div><label for="risk" style="font-weight:500;font-size:12.5px">Acceptable risk</label>
          <select id="risk"><option value="0.01">1%</option><option value="0.001" selected>0.1%</option><option value="0.000001">1 in a million</option></select></div>
      </div>
      <div id="collide" style="margin-top:12px"></div>
    </div>
  </form>

  <div class="card card-pad">
    <div class="panel-title"><span class="ico" id="icoSpark"></span>Generated IDs<span class="spacer"></span>

      <button type="button" class="on" data-tab="file">Output</button>

<script src="../assets/js/site.js"></script>
<script>
(function () {
  var I = GTI, $ = GT.$, $$ = GT.$$;
  ['icoGear:gear','icoSpark:spark','icoCopy:copy','icoDl:download','icoReset:reset']
    .forEach(function (p) { var a = p.split(':'); document.getElementById(a[0]).innerHTML = I[a[1]]; });

  var ALPHABETS = {
    'default': 'useandom-26T198340PX75pxJACKVERYMINDBUSHWOLF_GQZbfghjklqvwyzrict',
    'urlsafe': 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789',
    'lower': 'abcdefghijklmnopqrstuvwxyz0123456789',
    'nolookalike': '346789ABCDEFGHJKLMNPQRTUVWXYabcdefghijkmnpqrtwxyz',
    'nolookalike-safe': '6789BCDFGHJKLMNPQRTWbcdfghjkmnpqrtwz',
    'hex': '0123456789abcdef',
    'numbers': '0123456789',
    'uppercase': 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'
  };

  var ids = [];

  function alphabet() {
    var p = $('#preset').value;
    if (p === 'custom') return GT.uniq(($('#customAlpha').value || '').split('')).join('') || ALPHABETS['default'];
    return ALPHABETS[p];
  }

  function nanoid(size, alpha) {
    var bytes = new Uint8Array(size);
    crypto.getRandomValues(bytes);
    var id = '';
    /* Unbiased: reject bytes above the largest multiple of the alphabet length. */
    var limit = Math.floor(256 / alpha.length) * alpha.length;
    var i = 0;
    while (id.length < size) {
      if (i >= bytes.length) { bytes = new Uint8Array(size); crypto.getRandomValues(bytes); i = 0; }
      var b = bytes[i++];
      if (b < limit) id += alpha[b % alpha.length];
    }
    return id;
  }

  var out = GT.mountOutput({ pre: '#out', fileLabel: '#fname', meta: '#meta',
    copyBtn: '#copyBtn', downloadBtn: '#dlBtn', filename: 'nanoids.txt', mime: 'text/plain' });

  function build() {
    var n = Math.max(1, Math.min(10000, parseInt($('#count').value, 10) || 1));
    var size = parseInt($('#size').value, 10);
    var alpha = alphabet();
    var pre = $('#prefix').value, suf = $('#suffix').value;

    ids = [];
    for (var i = 0; i < n; i++) ids.push(pre + nanoid(size, alpha) + suf);

    var mode = $('#output').value, text, file = 'nanoids.txt';
    if (mode === 'json') { text = JSON.stringify(ids, null, 2); file = 'nanoids.json'; }
    else if (mode === 'csv') { text = 'index,id\n' + ids.map(function (x, i) { return (i + 1) + ',' + x; }).join('\n'); file = 'nanoids.csv'; }
    else if (mode === 'sql') { text = 'INSERT INTO records (id) VALUES\n' + ids.map(function (x) { return "  ('" + x + "')"; }).join(',\n') + ';'; file = 'nanoids.sql'; }
    else if (mode === 'quoted') text = ids.map(function (x) { return '"' + x + '"'; }).join(', ');
    else text = ids.join('\n');

    out.set(text, file);
    $('#sizeLabel').textContent = size;
    $('#alphaInfo').innerHTML = alpha.length + ' unique characters · ' +
      (Math.log2(alpha.length) * size).toFixed(1) + ' bits of entropy per ID';
    $('#pill').textContent = n.toLocaleString() + ' × ' + size + ' chars';
    $('#pill').style.background = 'var(--green-bg)'; $('#pill').style.color = 'var(--green)';

    renderCollision(alpha.length, size);
    renderEntropy(alpha.length, size);
    renderWarn(alpha, size);
  }

  /* Time until a given collision probability, using the birthday approximation. */
  function renderCollision(k, size) {
    var perHour = Math.max(1, parseInt($('#rate').value, 10) || 1);
    var risk = parseFloat($('#risk').value);
    var bits = Math.log2(k) * size;

    /* n ≈ sqrt(2 * N * ln(1/(1-p)))  where N = k^size */
    var lnTerm = Math.log(1 / (1 - risk));
    var logN = bits * Math.LN2;                       /* ln(N) */
    var logNeeded = 0.5 * (Math.log(2) + logN + Math.log(lnTerm));
    var needed = Math.exp(logNeeded);                 /* IDs before reaching that risk */
    var hours = needed / perHour;

    function human(h) {
      if (!isFinite(h)) return 'longer than the age of the universe';
      var y = h / 8766;
      if (y > 1e9) return (y / 1e9).toPrecision(3) + ' billion years';
      if (y > 1e6) return (y / 1e6).toPrecision(3) + ' million years';
      if (y > 1) return y.toPrecision(3) + ' years';
      var d = h / 24;
      if (d > 1) return d.toPrecision(3) + ' days';
      return h.toPrecision(3) + ' hours';
    }
    function bignum(x) {
      if (x > 1e15) return x.toExponential(3);
      return Math.round(x).toLocaleString();
    }

    $('#collide').innerHTML =
      '<div class="kv"><span class="k">Possible IDs</span><span class="v">' + (bits > 200 ? '2^' + bits.toFixed(0) : bignum(Math.pow(k, size))) + '</span></div>' +
      '<div class="kv"><span class="k">Entropy</span><span class="v">' + bits.toFixed(1) + ' bits</span></div>' +
      '<div class="kv"><span class="k">IDs before ' + (risk * 100) + '% risk</span><span class="v">' + bignum(needed) + '</span></div>' +
      '<div class="kv"><span class="k">At ' + perHour.toLocaleString() + '/hour, that is</span><span class="v">' + human(hours) + '</span></div>' +
      (bits < 64 ? '<div class="note note-warn" style="margin-top:10px">' + I.warn +
        '<span>Under 64 bits of entropy. Fine for short links or coupon codes, not for anything security-sensitive.</span></div>' : '') +
      (bits < 40 ? '<div class="note note-err" style="margin-top:10px">' + I.warn +
        '<span>Under 40 bits — collisions become likely at modest volume, and IDs are guessable by brute force.</span></div>' : '');
  }

  function renderEntropy(k, size) {
    var bits = Math.log2(k) * size;
    var rows = [
      ['This configuration', bits.toFixed(1) + ' bits', size + ' chars from a ' + k + '-character alphabet'],
      ['NanoID default', '126 bits', '21 chars, 64-character alphabet'],
      ['UUID v4', '122 bits', '36 characters including dashes'],
      ['UUID v7', '~74 random bits', 'The rest is a readable timestamp'],
      ['MongoDB ObjectId', '~64 random bits', 'Plus a timestamp and counter'],
      ['A 6-digit OTP', '~20 bits', 'Deliberately weak, protected by rate limiting']
    ];
    $('#entropy').innerHTML = rows.map(function (r) {
      return '<div class="kv"><span class="k">' + r[0] + '<br><span style="font-size:12.5px">' + r[2] + '</span></span>' +
        '<span class="v">' + r[1] + '</span></div>';
    }).join('') +
    '<div class="note note-info" style="margin-top:14px">' + I.info +
    '<span>Every extra character multiplies the ID space by the alphabet size. Going from 21 to 24 characters on the default alphabet takes you from 126 to 144 bits — a 260,000× larger space for three more characters.</span></div>' +
    '<div class="note note-warn" style="margin-top:10px">' + I.warn +
    '<span>Entropy only counts if the source is a CSPRNG. This tool uses <code>crypto.getRandomValues()</code> with rejection sampling, so every character is uniformly distributed. An implementation using <code>Math.random()</code> is predictable regardless of length.</span></div>';
  }

  function renderWarn(alpha, size) {
    var w = [];
    if ($('#preset').value === 'custom') {
      if (alpha.length < 2) w.push(['err', 'A custom alphabet needs at least two distinct characters.']);
      if (/[^\w\-~.]/.test(alpha)) w.push(['warn', 'Your alphabet contains characters that must be percent-encoded in URLs. Stick to letters, digits, <code>-</code>, <code>_</code>, <code>.</code> and <code>~</code> if the ID will appear in a path.']);
    }
    if ($('#preset').value === 'numbers' && size < 10) w.push(['warn', 'Digits only at this length is easy to enumerate. Use it for display codes, never for access.']);
    if (!w.length) w.push(['ok', 'Generated with rejection sampling over <code>crypto.getRandomValues()</code> — uniform and unbiased.']);
    $('#warnBox').innerHTML = w.map(function (x) {
      return '<div class="note ' + (x[0] === 'ok' ? 'note-ok' : x[0] === 'warn' ? 'note-warn' : 'note-err') + '">' +
        (x[0] === 'ok' ? I.check : I.warn) + '<span>' + x[1] + '</span></div>';
    }).join('');
  }

  $('#code').innerHTML = [
    ['JavaScript', "import { nanoid } from 'nanoid';\n\nconst id = nanoid();        // 21 chars\nconst short = nanoid(10);   // custom length"],
    ['Custom alphabet', "import { customAlphabet } from 'nanoid';\n\nconst nanoid = customAlphabet('0123456789abcdef', 12);\nconst id = nanoid();"],
    ['Async (non-blocking entropy)', "import { nanoid } from 'nanoid/async';\n\nconst id = await nanoid();"],
    ['Python', '# pip install nanoid\nfrom nanoid import generate\n\nid = generate(size=21)'],
    ['Go', '// go get github.com/matoous/go-nanoid/v2\nid, _ := gonanoid.New()'],
    ['Prisma schema', 'model User {\n  id String @id @default(nanoid())\n}'],
    ['Prefixed IDs (Stripe style)', "const userId = 'user_' + nanoid(16);\nconst invoiceId = 'inv_' + nanoid(16);"]
  ].map(function (b) {
    return '<div style="margin-bottom:18px"><h4 style="font-size:14.5px;margin-bottom:8px">' + b[0] + '</h4>' +
      '<pre class="code">' + GT.esc(b[1]) + '</pre></div>';
  }).join('');

  $('#preset').addEventListener('change', function () { $('#customAlpha').hidden = this.value !== 'custom'; build(); });
  $('#copyOne').addEventListener('click', function () { GT.copy(ids[0] || '', 'ID'); });
  $('#regen').addEventListener('click', build);
  $('#tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    $$('#tabs button').forEach(function (x) { x.classList.toggle('on', x === b); });
    $$('[data-panel]').forEach(function (p) { p.hidden = p.getAttribute('data-panel') !== b.getAttribute('data-tab'); });
  });
  $('#cfg').addEventListener('submit', function (e) { e.preventDefault(); build(); });
  $('#cfg').addEventListener('input', build);
  $('#cfg').addEventListener('change', build);

  build();

  GT.page({
    slug: 'nanoid-generator',
    lede: 'Generate URL-safe NanoIDs at any length or alphabet — with a collision calculator that tells you how long your configuration will actually last.',
    steps: [
      { icon: 'gear', title: 'Set length and alphabet', text: 'Shorter for share links, longer for anything unguessable. Pick a no-look-alike alphabet if humans will type it.' },
      { icon: 'leaf', title: 'Check the collision maths', text: 'Enter your real ID creation rate and see when the first collision becomes likely.' },
      { icon: 'copy', title: 'Export', text: 'Copy as a list, JSON, CSV or SQL — or grab the matching library code.' }
    ],
    guideTitle: 'Choosing a length that will not embarrass you later',
    guide:
      '<p style="color:var(--muted)">NanoID is popular because it is small, fast and URL-safe. The one decision that matters is length, and it is worth doing the arithmetic once rather than discovering the answer in production.</p>' +
      '<div class="grid g2" style="margin-top:18px">' +
      '<div><h4 style="font-size:14.5px;margin-bottom:8px">Reasonable defaults</h4><ul style="color:var(--muted);font-size:13.8px;padding-left:18px;margin:0"><li><strong>21 chars (default):</strong> 126 bits. Safe for essentially any volume — this is the right answer unless you have a specific reason.</li><li><strong>16 chars:</strong> 96 bits. Comfortable for user-facing IDs at high volume.</li><li><strong>10–12 chars:</strong> 60–72 bits. Fine for short links and public slugs.</li><li><strong>6–8 chars:</strong> Display codes only, and only with a uniqueness check on insert.</li></ul></div>' +
      '<div><h4 style="font-size:14.5px;margin-bottom:8px">Where teams get it wrong</h4><ul style="color:var(--muted);font-size:13.8px;padding-left:18px;margin:0"><li>Using a short ID as a security token. Length is not the same as secrecy — an 8-character ID is brute-forceable.</li><li>Assuming a database unique constraint makes collisions free. It makes them <em>visible</em>, as failed inserts under load.</li><li>Custom alphabets containing characters that need percent-encoding in URLs.</li><li>Reimplementing NanoID with a naive modulo, which biases the first characters of the alphabet.</li></ul></div></div>' +
      '<div class="note note-info" style="margin-top:18px">' + GTI.info + '<span><strong>NanoID has no timestamp.</strong> That is the trade-off against ULID and UUID v7: nothing leaks about when a record was created, but the IDs do not sort chronologically and give your database index no locality. Use NanoID for public-facing identifiers, and a time-ordered ID for the primary key.</span></div>',
    related: ['uuid-v7-generator', 'ulid-generator', 'random-hex-string-generator'],
faqs: [
      { q: 'What is the default NanoID length?', a: 'The standard Nano ID library uses 21 characters by default.' },
      { q: 'How much entropy does a 21-character NanoID have?', a: 'With the 64-character default alphabet, 21 characters provide 126 bits of entropy.' },
      { q: 'Is NanoID better than UUID?', a: 'It depends on the application. NanoID is shorter and customizable. UUID is standardized and widely supported by databases and APIs.' },
      { q: 'Can NanoID contain only numbers?', a: 'Yes. Use a numeric custom alphabet. Because ten symbols provide less entropy per character than 64 symbols, you will generally need a longer ID.' },
      { q: 'Does NanoID contain a timestamp?', a: 'No, not by default. If you need sortable timestamp-based identifiers, compare UUID v7 or ULID.' },
      { q: 'Can I use NanoID as a database primary key?', a: 'Yes, provided your schema and indexing strategy fit random text IDs. Enforce uniqueness at the database level.' },
      { q: 'Are NanoIDs safe in URLs?', a: 'The default alphabet is URL-friendly. Remember that a URL-safe identifier is not automatically a secret or authorization token.' },
      { q: 'Is this NanoID generator free?', a: 'Yes. Generate IDs, customize the format and calculate collision risk above without creating an account.' }
    ],
    seo: {
      title: 'NanoID Generator – Create Secure, URL-Safe IDs Online',
      lead: 'Need a compact unique ID without the long UUID format? Use the NanoID Generator above to create secure, URL-safe NanoIDs instantly. Choose the ID length, generate one or thousands at once, use the standard alphabet or enter your own, add a prefix or suffix and check the estimated collision risk before choosing a shorter format.',
      blocks: [
        { html: '<p>The default Nano ID format uses 21 characters from a 64-character URL-safe alphabet: uppercase letters, lowercase letters, numbers, underscore and hyphen.</p>' +
            '<p>That gives 126 bits of entropy and collision resistance in the same general range as UUID v4 while producing a shorter text identifier.</p>' +
            '<p>Generation happens locally in your browser using secure random values.</p>' },
        { h: 'What Is NanoID?',
          html: '<p>NanoID is a compact random identifier format popular in web applications, APIs and databases.</p><p>A default ID looks like:</p>' +
            '<pre class="code">V1StGXR8_Z5jdHi6B-myT</pre>' +
            '<p>Unlike UUID, NanoID has no fixed 36-character hexadecimal representation; you can control the length and alphabet.</p><p>That flexibility is useful when you need IDs that are:</p>',
          list: ['Shorter in URLs', 'Easy to embed in JSON', 'Compatible with a restricted character set', 'Self-describing with prefixes', 'Suitable for test data', 'Generated independently across distributed systems'],
          after: '<p>The official Nano ID library uses cryptographically secure random values and a URL-friendly default alphabet.</p>' },
        { h: 'How to Use This NanoID Generator',
          html: '<p>Start with the number of IDs you need.</p><p>For normal use, leave the length at 21 characters unless you have a specific reason to change it.</p>' +
            '<p>Next, choose the alphabet.</p><p>Use the standard URL-safe alphabet unless your system requires a restricted character set.</p><p>Add a prefix such as:</p>' +
            '<pre class="code">user_\norder_\ninv_</pre><p>or a suffix if your naming scheme requires one.</p>' +
            '<p>Then enter your expected generation volume in the collision calculator.</p>' +
            '<p>Generate the IDs only after checking whether the chosen length and alphabet provide enough identifier space for your application.</p>' },
        { h: 'Why Is the Default NanoID 21 Characters?',
          html: '<p>Nano ID’s default alphabet contains 64 symbols.</p><p>Each character therefore carries 6 bits of entropy because:</p>' +
            '<pre class="code">2^6 = 64</pre><p>At 21 characters:</p><pre class="code">21 × 6 = 126 bits</pre>' +
            '<p>That gives a huge number of possible IDs.</p>' +
            '<p>The default was designed to provide collision probability in a similar range to UUID v4 while using fewer text characters.</p>' +
            '<p>Shortening the ID reduces the identifier space quickly.</p>' +
            '<p>That may still be perfectly reasonable for a small application, but the decision should be based on expected generation volume rather than appearance alone.</p>' },
        { h: 'NanoID Collision Probability Explained',
          html: '<p>A collision happens when two independently generated identifiers are identical.</p><p>Collision risk depends mainly on three things:</p>',
          ol: ['Alphabet size', 'ID length', 'Number of IDs generated'],
          after: '<p>A longer ID creates more combinations.</p><p>A larger alphabet also creates more combinations per character.</p>' +
            '<p>For example, an 8-character numeric ID has far fewer possibilities than an 8-character NanoID using 64 symbols.</p>' +
            '<p>That is why “8 characters” by itself tells you very little about safety.</p>' +
            '<p>Use the collision calculator in this tool whenever you shorten the default length or reduce the alphabet.</p>' },
        { h: 'How Long Should a NanoID Be?',
          html: '<p>For most applications, 21 characters is the default. Shorten it only when you understand the tradeoff.</p><p>With a 64-character alphabet, approximate entropy is:</p>',
          table: { head: ['Length', 'Entropy'], rows: [['8', '48 bits'], ['10', '60 bits'], ['12', '72 bits'], ['16', '96 bits'], ['21', '126 bits']] },
          after: '<p>Estimate lifetime ID volume and choose a collision risk you can accept rather than selecting a length only because it looks tidy.</p>' +
            '<p>If duplicate IDs would cause serious damage, also enforce uniqueness in the database.</p>' },
        { h: 'Custom NanoID Alphabets',
          html: '<p>A custom alphabet controls which characters can appear.</p><p>Numeric only:</p><pre class="code">0123456789</pre>' +

            '<p>Human-friendly systems may remove characters that look alike, such as:</p>',
          list: ['0 and O', '1 and I', 'lowercase l'],
          after: '<p>Custom alphabets are useful for:</p><ul style="color:var(--muted);padding-left:18px"><li>Human-entered references</li><li>Printed labels</li><li>Case-insensitive systems</li><li>Coupon-like codes</li><li>Legacy databases</li><li>Restricted file names</li></ul>' +

        { h: 'NanoID vs UUID v4',

        { h: 'NanoID vs UUID v7',

        { h: 'NanoID vs ULID',

        { h: 'Are NanoIDs Secure?',

        { h: 'Prefixes and Suffixes',

        { h: 'Bulk NanoID Generation',

        { h: 'NanoID in Database Primary Keys',
