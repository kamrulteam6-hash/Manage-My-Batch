<body data-root="../">

<section class="hero" id="hero"></section>

<section id="toolApp">
<div class="wrap">
<div class="tool-grid">

  <form class="card card-pad" id="cfg" autocomplete="off">
    <div class="panel-title"><span class="ico" id="icoGear"></span>Exchange Setup</div>

    <div class="field">
      <label>Exchange style</label>
      <div class="seg" id="style">
        <button type="button" class="on" data-s="draw">Name draw</button>
        <button type="button" data-s="white">White elephant</button>
        <button type="button" data-s="groups">Family groups</button>
      </div>
      <div class="hint" id="styleHint"></div>
    </div>

    <div class="field">
      <label for="people" id="peopleLabel">Participants — one per line</label>
      <textarea id="people" style="min-height:170px">Ana | books, coffee
Ben | cycling gear
Cara | plants, candles
Dan | vinyl records
Eve | baking
Finn | board games
Gemma | stationery
Hari | hot sauce</textarea>
      <div class="hint">Add a wishlist after a pipe: <code>Ana | books, coffee</code>. Optional.</div>
      <div id="stats"></div>
    </div>

    <div class="field" id="groupsField" hidden>
      <label for="groups">Group membership — one per line</label>
      <textarea id="groups" style="min-height:80px" placeholder="Smith: Ana, Ben&#10;Jones: Cara, Dan">Smith: Ana, Ben
Jones: Cara, Dan</textarea>
      <div class="hint">People in the same group never draw each other — useful for families buying within households.</div>
    </div>

    <div class="field" id="exclField">
      <label for="exclusions">Never match — one pair per line</label>
      <textarea id="exclusions" style="min-height:60px" placeholder="Ana &amp; Ben"></textarea>
    </div>

    <div class="divider"></div>

    <div class="row">
      <div class="field"><label for="budget">Budget</label><input type="text" id="budget" value="£20"></div>
      <div class="field"><label for="date">Exchange date</label><input type="date" id="date"></div>
    </div>

    <div class="field">
      <label for="note">Note on every slip</label>
      <input type="text" id="note" placeholder="e.g. Wrap it and bring it to Sunday lunch">
    </div>

    <fieldset class="field">
      <legend class="label">Options</legend>
      <div class="check-list">
        <label class="check on"><input type="checkbox" id="optWishlist" checked>
          <span><span class="t">Show the recipient's wishlist on the slip</span></span></label>
        <label class="check on"><input type="checkbox" id="optHide" checked>
          <span><span class="t">Hide the result from me</span></span></label>
      </div>
    </fieldset>

    <div class="field">
      <label for="seed">Draw seed</label>
      <div class="row" style="grid-template-columns:minmax(0,1fr) auto;gap:8px">
        <input type="text" id="seed" value="swap-1">
        <button type="button" class="btn btn-soft" id="newSeed"><span id="icoReset"></span></button>
      </div>
    </div>

    <div class="out-actions">
      <button type="submit" class="btn btn-primary btn-block"><span id="icoBolt"></span> Run the Exchange</button>
    </div>
  </form>

  <div class="card card-pad">
    <div class="panel-title"><span class="ico" id="icoSpark"></span>Result<span class="spacer"></span>
      <span class="result-pill" id="pill"></span></div>

    <div class="tabs" id="tabs">
      <button type="button" class="on" data-tab="result">Result</button>
      <button type="button" data-tab="guide">Formats explained</button>
    </div>

    <div data-panel="result">
      <div id="result"></div>
      <div class="out-actions" style="margin-top:16px">
        <button type="button" class="btn btn-primary" id="printBtn"><span id="icoFile"></span> Print</button>
        <button type="button" class="btn btn-soft" id="regen"><span id="icoReset2"></span> Redraw</button>
      </div>
      <div id="checks"></div>
    </div>

    <div data-panel="guide" hidden><div id="guide"></div></div>
  </div>

</div>
</div>
</section>

<div id="afterTool"></div>

<script src="../assets/js/site.js"></script>
<script src="../assets/js/schedule.js"></script>
<script src="../assets/js/roster.js"></script>
<script>
(function () {
  var I = GTI, $ = GT.$, $$ = GT.$$, S = GTSched;
  ['icoGear:gear','icoSpark:spark','icoBolt:bolt','icoReset:reset','icoReset2:reset','icoFile:file']
    .forEach(function (p) { var a = p.split(':'); document.getElementById(a[0]).innerHTML = I[a[1]]; });

  var HINTS = {
    draw: 'Everyone is assigned one person to buy for. The classic format.',
    white: 'Everyone brings one wrapped gift; the draw sets the order for picking and stealing.',
    groups: 'Nobody draws someone from their own household or group.'
  };

  var style = 'draw', people = [], result = null;

  function parsePeople() {
    var seen = {}, list = [];
    GT.lines($('#people').value).forEach(function (l) {
      var i = l.indexOf('|');
      var name = (i === -1 ? l : l.slice(0, i)).replace(/^\s*\d+\s*[.)]\s*/, '').trim();
      var wish = i === -1 ? '' : l.slice(i + 1).trim();
      if (!name) return;
      var k = name.toLowerCase();
      if (seen[k]) return;
      seen[k] = 1;
      list.push({ name: name, wish: wish });
    });
    return list;
  }

  function groupExclusions() {
    var pairs = [];
    GT.lines($('#groups').value).forEach(function (l) {
      var i = l.indexOf(':');
      if (i === -1) return;
      var members = l.slice(i + 1).split(',').map(function (x) { return x.trim(); }).filter(Boolean);
      for (var a = 0; a < members.length; a++) {
        for (var b = a + 1; b < members.length; b++) pairs.push([members[a], members[b]]);
      }
    });
    return pairs;
  }

  function build() {
    people = parsePeople();
    $('#styleHint').textContent = HINTS[style];
    $('#groupsField').hidden = style !== 'groups';
    $('#peopleLabel').textContent = style === 'white' ? 'Participants — one per line' : 'Participants — one per line';

    var withWish = people.filter(function (p) { return p.wish; }).length;
    $('#stats').innerHTML = '<div class="note ' + (people.length ? 'note-ok' : 'note-warn') + '" style="margin-top:10px">' +
      (people.length ? I.check : I.warn) + '<span>' + people.length + ' participant' + (people.length === 1 ? '' : 's') +
      (withWish ? ' · ' + withWish + ' with wishlists' : '') + '</span></div>';

    if (people.length < 3) {
      $('#result').innerHTML = '<div class="empty">Add at least three participants.</div>';
      $('#pill').textContent = '—'; $('#checks').innerHTML = '';
      return;
    }

    var names = people.map(function (p) { return p.name; });

    if (style === 'white') {
      var order = S.rng($('#seed').value).shuffle(names);
      result = { order: order };
      renderWhite(order);
    } else {
      var exclusions = GTRoster.parsePairs($('#exclusions').value);
      if (style === 'groups') exclusions = exclusions.concat(groupExclusions());
      /* Normalise names against the participant list. */
      exclusions = exclusions.map(function (p) {
        var a = names.filter(function (n) { return n.toLowerCase() === String(p[0]).toLowerCase(); })[0];
        var b = names.filter(function (n) { return n.toLowerCase() === String(p[1]).toLowerCase(); })[0];
        return a && b ? [a, b] : null;
      }).filter(Boolean);

      result = S.drawNames(names, { seed: $('#seed').value, exclusions: exclusions, singleCycle: true });
      result.exclusions = exclusions;
      renderDraw();
    }

    renderChecks();
    $('#pill').textContent = result.error ? 'no valid draw' : people.length + ' participants';
    $('#pill').style.background = result.error ? 'var(--red-bg)' : 'var(--green-bg)';
    $('#pill').style.color = result.error ? 'var(--red)' : 'var(--green)';
  }

  function wishFor(name) {
    var p = people.filter(function (x) { return x.name === name; })[0];
    return p ? p.wish : '';
  }

  function renderDraw() {
    if (result.error) { $('#result').innerHTML = '<div class="empty">No valid draw — see below.</div>'; return; }
    var hide = $('#optHide').checked;
    $('#result').innerHTML = '<div class="grid g2">' + people.map(function (p) {
      var target = result.map[p.name];
      var wish = $('#optWishlist').checked ? wishFor(target) : '';
      return '<div class="card" style="padding:14px;box-shadow:none">' +
        '<div style="font-size:12px;color:var(--muted)">Slip for</div>' +
        '<div style="font-weight:700;font-size:15px;margin-bottom:8px">' + GT.esc(p.name) + '</div>' +
        '<div style="font-size:12px;color:var(--muted)">Buying for</div>' +
        '<div style="font-weight:700;font-size:15px;color:' + (hide ? 'var(--muted-2)' : 'var(--blue)') + '">' +
        (hide ? '• • • • •' : GT.esc(target)) + '</div>' +
        (wish && !hide ? '<div style="font-size:12.5px;color:var(--muted);margin-top:6px">Wishlist: ' + GT.esc(wish) + '</div>' : '') +
        '</div>';
    }).join('') + '</div>';
  }

  function renderWhite(order) {
    $('#result').innerHTML =
      '<div class="note note-info" style="margin-top:0">' + I.info +
      '<span>Everyone brings one wrapped gift. Player 1 opens a gift; each following player may either open a new one or steal an already-opened gift. A stolen gift cannot be immediately stolen back.</span></div>' +
      '<p class="more-label" style="margin-top:14px">Picking order</p><div class="more-list">' +
      order.map(function (n, i) {
        return '<div class="more-row"><span style="width:26px;flex:none;font-weight:700;color:var(--muted-2)">' +
          (i + 1) + '</span><span class="mval" style="font-family:var(--sans);font-size:14.5px;font-weight:500">' +
          GT.esc(n) + '</span></div>';
      }).join('') + '</div>';
  }

  function renderChecks() {
    var c = [];
    if (style === 'white') {
      c.push(['ok', 'Picking order shuffled. Going first means the smallest choice but the right to a final steal in most rule sets.']);
      c.push(['warn', 'Agree the steal limit before you start — commonly three steals per gift, after which it is frozen. Without a limit the game does not end.']);
    } else if (result.error) {
      var names = people.map(function (p) { return p.name; });
      var trouble = S.exclusionTrouble(names, result.exclusions || []);
      c.push(['err', 'No valid draw. ' + (trouble.length
        ? trouble.map(GT.esc).join(', ') + ' cannot be matched with anyone under the current rules.'
        : 'The group and exclusion rules leave no valid arrangement — try removing a rule.')]);
    } else {
      c.push(['ok', 'Valid draw — nobody has themselves, and no two people are buying for each other.']);
      if (style === 'groups') {
        var gp = groupExclusions();
        c.push([gp.length ? 'ok' : 'warn', gp.length
          ? gp.length + ' within-group pairing' + (gp.length === 1 ? '' : 's') + ' excluded.'
          : 'No groups defined yet — add them as <code>Household: Name, Name</code>.']);
      }
      var noWish = people.filter(function (p) { return !p.wish; });
      if ($('#optWishlist').checked && noWish.length) {
        c.push(['warn', noWish.length + ' participant' + (noWish.length === 1 ? ' has' : 's have') +
          ' no wishlist, so their slip will not show one. Add hints after a pipe character.']);
      }
    }
    $('#checks').innerHTML = c.map(function (x) {
      return '<div class="note ' + (x[0] === 'ok' ? 'note-ok' : x[0] === 'warn' ? 'note-warn' : 'note-err') + '">' +
        (x[0] === 'ok' ? I.check : I.warn) + '<span>' + x[1] + '</span></div>';
    }).join('');
  }

  $('#printBtn').addEventListener('click', function () {
    var meta = [];
    if ($('#budget').value.trim()) meta.push('Budget: ' + $('#budget').value.trim());
    if ($('#date').value) meta.push(S.fmtDateFull(new Date($('#date').value + 'T12:00:00')));
    if ($('#note').value.trim()) meta.push($('#note').value.trim());

    if (style === 'white') {
      GTRoster.printHtml('Gift exchange order',
        '<h1>White Elephant — picking order</h1>' +
        (meta.length ? '<p class="sub">' + GT.esc(meta.join(' · ')) + '</p>' : '') +
        '<table><tr><th style="width:60px">Order</th><th>Player</th></tr>' +
        result.order.map(function (n, i) {
          return '<tr><td>' + (i + 1) + '</td><td>' + GT.esc(n) + '</td></tr>';
        }).join('') + '</table>');
      return;
    }
    if (result.error) { GT.toast('Fix the draw first'); return; }

    var w = window.open('', '_blank');
    if (!w) { GT.toast('Allow pop-ups to print'); return; }
    w.document.write('<!DOCTYPE html><html><head><meta charset="utf-8"><title>Gift exchange slips</title><style>' +
      'body{font-family:Arial,Helvetica,sans-serif;color:#0f172a;margin:12mm}' +
      '.wrap{display:grid;grid-template-columns:1fr 1fr;gap:8mm}' +
      '.slip{border:1.5px dashed #94a3b8;border-radius:8px;padding:14px;break-inside:avoid;min-height:40mm}' +
      '.for{font-size:11px;color:#64748b}.name{font-size:17px;font-weight:700;margin:2px 0 10px}' +
      '.lbl{font-size:11px;color:#64748b}.rec{font-size:19px;font-weight:700}' +
      '.wish{font-size:11.5px;color:#475569;margin-top:6px}' +
      '.meta{margin-top:10px;font-size:11px;color:#475569;line-height:1.5}' +
      '@media print{body{margin:8mm}}</style></head><body><div class="wrap">' +
      people.map(function (p) {
        var target = result.map[p.name];
        var wish = $('#optWishlist').checked ? wishFor(target) : '';
        return '<div class="slip"><div class="for">Gift exchange slip for</div>' +
          '<div class="name">' + GT.esc(p.name) + '</div>' +
          '<div class="lbl">You are buying for</div>' +
          '<div class="rec">' + GT.esc(target) + '</div>' +
          (wish ? '<div class="wish">Wishlist: ' + GT.esc(wish) + '</div>' : '') +
          (meta.length ? '<div class="meta">' + meta.map(GT.esc).join('<br>') + '</div>' : '') +
          '</div>';
      }).join('') + '</div><script>window.onload=function(){window.print()}<' + '/script></body></html>');
    w.document.close();
  });

  $('#style').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    $$('#style button').forEach(function (x) { x.classList.toggle('on', x === b); });
    style = b.getAttribute('data-s');
    $('#exclField').hidden = style === 'white';
    build();
  });
  $('#newSeed').addEventListener('click', function () { $('#seed').value = Math.random().toString(36).slice(2, 8); build(); });
  $('#regen').addEventListener('click', function () { $('#seed').value = Math.random().toString(36).slice(2, 8); build(); GT.toast('Redrawn'); });

  $('#guide').innerHTML = [
    ['Name draw', 'Everyone is assigned one person and buys them a gift. Each person gives once and receives once, and with the single-chain draw used here nobody is buying for the person who is buying for them. The default, and the fairest.'],
    ['White elephant', 'Everyone brings one wrapped gift and the draw sets the picking order. Player one opens a gift; each subsequent player either opens a new one or steals an opened one. The person who stole loses their gift and picks again. Agree a steal limit — usually three per gift — or the game never ends.'],
    ['Family groups', 'For extended families where each household already buys internally. Everyone in the same group is excluded from drawing each other, so gifts cross between households. Add groups as <code>Household: Name, Name</code>.'],
    ['Wishlists prevent bad gifts', 'Two or three concrete hints — "books, coffee, plants" — make an enormous difference to what people actually receive, especially when the giver does not know the recipient well. They print on the slip so nobody has to ask around and give the secret away.'],
    ['Set a budget and say it twice', 'The most common source of awkwardness is mismatched spending. Put the budget on every slip, not just in the invitation, so it is in front of everyone when they shop.'],
    ['Going first is not always worst', 'In white elephant, player one has the least choice initially but in most rule sets gets a final steal at the end. It is worth stating which rule you are using before you start.']
  ].map(function (x) {
    return '<div style="margin-bottom:16px"><h4 style="font-size:14.5px;margin-bottom:6px">' + x[0] + '</h4>' +
      '<p style="color:var(--muted);font-size:13.8px">' + x[1] + '</p></div>';
  }).join('');

  $('#tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    $$('#tabs button').forEach(function (x) { x.classList.toggle('on', x === b); });
    $$('[data-panel]').forEach(function (p) { p.hidden = p.getAttribute('data-panel') !== b.getAttribute('data-tab'); });
  });
  $('#cfg').addEventListener('submit', function (e) { e.preventDefault(); build(); GT.toast('Exchange generated'); });
  $('#cfg').addEventListener('input', build);
  $('#cfg').addEventListener('change', build);

  build();

  GT.page({
    slug: 'random-gift-exchange-generator',
    lede: 'Run any gift swap — a name draw, white elephant, or a family exchange where households never draw each other — with wishlists and budgets on every printed slip.',
    steps: [
      { icon: 'gear', title: 'Pick a format', text: 'Name draw, white elephant picking order, or family groups.' },
      { icon: 'gift', title: 'Add wishlists', text: 'A pipe character after each name; two or three hints is plenty.' },
      { icon: 'file', title: 'Print the slips', text: 'Recipient, wishlist, budget and date all on one slip.' }
    ],
    guideTitle: 'Choosing a format',
    guide:
      '<p style="color:var(--muted)">"Gift exchange" covers several genuinely different games, and picking the wrong one is why some office swaps fall flat. The three here cover almost every case.</p>' +
      '<div class="grid g3" style="margin-top:18px">' +
      '<div><h4 style="font-size:14.5px;margin-bottom:8px">Name draw</h4><p style="color:var(--muted);font-size:13.8px">Each person is assigned someone and buys for them. Everyone gives once and receives once. Best when people know each other reasonably well and want a thoughtful gift.</p></div>' +
      '<div><h4 style="font-size:14.5px;margin-bottom:8px">White elephant</h4><p style="color:var(--muted);font-size:13.8px">Everyone brings one wrapped gift; the draw only sets the picking order. Stealing makes it a game. Best for groups where people do not know each other well.</p></div>' +
      '<div><h4 style="font-size:14.5px;margin-bottom:8px">Family groups</h4><p style="color:var(--muted);font-size:13.8px">Households are excluded from drawing internally, so gifts cross between families. Best for extended-family Christmases where people already buy within their own home.</p></div></div>' +
      '<div class="note note-info" style="margin-top:18px">' + GTI.info + '<span><strong>Wishlists matter more than budgets.</strong> Two or three concrete hints — "books, coffee, plants" — transform what people actually receive, particularly when the giver barely knows the recipient. They print on the slip, so nobody has to ask around and reveal who they drew.</span></div>' +
      '<div class="note note-warn" style="margin-top:12px">' + GTI.warn + '<span>If you run white elephant, agree the steal limit before the first gift is opened — commonly three steals per gift, after which it is frozen. Without a cap the game genuinely does not terminate.</span></div>',
    related: ['secret-santa-generator', 'chore-rotation-generator', 'team-generator'],
faqs: [
      { q: 'What gift exchange styles can I organize?', a: 'The tool supports a name draw, White Elephant-style exchange planning and family-group draws.' },
      { q: 'Can participants add wishlists?', a: 'Yes. Add the wishlist after the participant’s name using the pipe format shown in the tool.' },
      { q: 'Can people in the same family avoid drawing each other?', a: 'Yes. Add household or family group membership.' },
      { q: 'Can I also block individual pairs?', a: 'Yes. Use the never-match list for additional exclusions.' },
      { q: 'Can the organizer stay unaware of the assignments?', a: 'Yes. Enable the private result option.' },
      { q: 'What is the difference between Secret Santa and White Elephant?', a: 'Secret Santa assigns a recipient in advance. White Elephant normally uses unassigned gifts and a randomized selection/swapping order during the event.' },
      { q: 'Can the exchange be reproduced later?', a: 'Yes. Keep the same inputs and draw seed.' }
    ],
    seo: {
      title: 'Random Gift Exchange Generator – Organize Draws, Wishlists and Group Rules',
      lead: 'Use the Random Gift Exchange Generator above when your holiday or party gift swap needs more flexibility than a basic Secret Santa name draw.',
      blocks: [
        { html: '<p>Choose the exchange style, paste the participant list and optionally add each person’s wishlist after a pipe.</p>' +
            '<p>You can also define household or family groups so people in the same group do not draw one another, add specific never-match pairs, set a budget and event date, and print a shared note on every slip.</p>' +
            '<p>The tool supports three different planning styles: name draw, White Elephant, and family groups.</p>' +
            '<p>That distinction matters because not every gift exchange uses the same assignment rules.</p>' +
            '<p>A generator should follow the game you are actually playing rather than forcing every event into a Secret Santa format.</p>' },
        { h: 'What Is a Random Gift Exchange?',
          html: '<p>A random gift exchange is any event where participants or gift-selection order are randomized.</p><p>Common versions include:</p>' +
            '<p><strong>Secret Santa-style name draw</strong> — each participant receives one person to buy for.</p>' +
            '<p><strong>Family or household draw</strong> — participants draw outside their own household or group.</p>' +
            '<p><strong>White Elephant</strong> — participants bring an unassigned gift and the event uses a randomized selection order rather than a private giver-recipient assignment.</p>' +
            '<p>These formats share the idea of randomization but use it differently.</p>' +
            '<p>Before generating anything, agree on the exchange style.</p>' +
            '<p>Otherwise people may arrive expecting completely different rules.</p>' },
        { h: 'How to Use This Gift Exchange Generator',
          html: '<p>Choose the exchange style.</p><p>Then paste one participant per line.</p>' +
            '<p>You can add a wishlist using <code>Name | wishlist</code>.</p><p>Example:</p>' +
            '<pre class="code">Ana | books, coffee\nBen | cycling gear\nCara | plants, candles</pre>' +
            '<p>If the exchange includes families or households, enter the group membership.</p>' +
            '<p>You can also add never-match pairs for individual restrictions.</p><p>Set:</p>',
          list: ['budget', 'exchange date', 'note for every slip'],
          after: '<p>Choose whether recipient wishlists should appear on slips.</p>' +
            '<p>Enable Hide the result from me when the organizer should not see private assignments.</p>' +
