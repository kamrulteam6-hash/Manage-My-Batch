<section id="toolApp">

<div class="tool-grid">

  <form class="card card-pad" id="cfg" autocomplete="off">
    <div class="panel-title"><span class="ico" id="icoGear"></span>Table Settings</div>

    <div class="field">
      <label for="data">Paste CSV, TSV or Excel data</label>
      <textarea id="data" style="min-height:180px">Feature,Free,Pro,Enterprise
Projects,3,Unlimited,Unlimited
Storage,1 GB,100 GB,1 TB
Support,Community,Email,24/7 phone
Price,$0,$19,Custom</textarea>
      <div class="hint">Copy directly from a spreadsheet — tabs, commas, semicolons and pipes are detected automatically.</div>

    <div class="row">
      <div class="field">

          <option value="&#9;">Tab</option>
          <option value=";">Semicolon</option>
          <option value="|">Pipe</option>
        </select>
      </div>
      <div class="field">
        <label for="style">Output style</label>
        <select id="style">
          <option value="padded" selected>Aligned (padded columns)</option>

        <label class="check on"><input type="checkbox" id="optEscape" checked><span><span class="t">Escape pipe characters</span><span class="d">A raw <code>|</code> inside a cell splits the row. Escaped as <code>\\|</code>.</span></span></label>
        <label class="check on"><input type="checkbox" id="optOuter" checked><span><span class="t">Leading and trailing pipes</span><span class="d">Optional in the spec, but far more readable in raw form.</span></span></label>

        <label class="check"><input type="checkbox" id="optBreaks"><span><span class="t">Convert newlines to &lt;br&gt;</span><span class="d">Markdown tables cannot contain real line breaks inside a cell.</span></span></label>

<script src="../assets/js/site.js"></script>
<script>
(function () {
  var I = GTI, $ = GT.$, $$ = GT.$$;
  ['icoGear:gear','icoSpark:spark','icoCopy:copy','icoDl:download']
    .forEach(function (p) { var a = p.split(':'); document.getElementById(a[0]).innerHTML = I[a[1]]; });

  var aligns = [], grid = [];

  var out = GT.mountOutput({ pre: '#out', fileLabel: '#fname', meta: '#meta',
    copyBtn: '#copyBtn', downloadBtn: '#dlBtn', filename: 'table.md', mime: 'text/markdown' });

  function detectDelim(text) {
    var d = $('#delim').value;
    if (d !== 'auto') return d;
    var first = (text.split(/\r?\n/)[0] || '');
    var counts = [['\t', (first.match(/\t/g) || []).length], [',', (first.match(/,/g) || []).length],
                  [';', (first.match(/;/g) || []).length], ['|', (first.match(/\|/g) || []).length]];
    counts.sort(function (a, b) { return b[1] - a[1]; });
    return counts[0][1] ? counts[0][0] : ',';
  }

  function parseLine(line, d) {
    var arr = [], cur = '', inQ = false;
    for (var i = 0; i < line.length; i++) {
      var c = line[i];
      if (inQ) {
        if (c === '"') { if (line[i + 1] === '"') { cur += '"'; i++; } else inQ = false; }
        else cur += c;
      } else if (c === '"') inQ = true;
      else if (c === d) { arr.push(cur); cur = ''; }
      else cur += c;
    }
    arr.push(cur);
    return arr;
  }

  function readGrid() {
    var text = $('#data').value.replace(/\r\n/g, '\n').replace(/\n+$/, '');
    if (!text.trim()) return [];
    /* Accept an existing markdown table as input too. */
    if (/^\s*\|/.test(text) && /\|\s*$/m.test(text)) {
      var mdRows = text.split('\n').filter(function (l) { return l.trim(); })
        .filter(function (l) { return !/^\s*\|?[\s:\-|]+\|?\s*$/.test(l); })
        .map(function (l) {
          return l.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split(/(?<!\\)\|/).map(function (c) {
            return c.replace(/\\\|/g, '|').trim();
          });
        });
      if (mdRows.length) return normalize(mdRows);
    }
    var d = detectDelim(text);
    return normalize(text.split('\n').map(function (l) { return parseLine(l, d); }));
  }

  function normalize(g) {
    var width = Math.max.apply(null, g.map(function (r) { return r.length; }));
    g.forEach(function (r) { while (r.length < width) r.push(''); });
    if ($('#optTrim').checked) g = g.map(function (r) { return r.map(function (c) { return c.trim(); }); });
    return g;
  }

  function autoAlign(i) {
    var start = $('#optHeader').checked ? 1 : 0;
    var vals = grid.slice(start).map(function (r) { return (r[i] || '').trim(); }).filter(Boolean);
    if (!vals.length) return 'left';
    return vals.every(function (v) { return /^-?[$€£]?\s?[\d,]+(\.\d+)?%?$/.test(v); }) ? 'right' : 'left';
  }

  function renderAligns() {
    if (!grid.length) { $('#aligns').innerHTML = ''; return; }
    var head = $('#optHeader').checked ? grid[0] : grid[0].map(function (_, i) { return 'Column ' + (i + 1); });
    $('#aligns').innerHTML = head.map(function (h, i) {
      var cur = aligns[i] || 'auto';
      return '<div class="row" style="grid-template-columns:minmax(0,1fr) auto;margin-bottom:8px;align-items:center">' +
        '<span style="font-size:13.5px;font-weight:600;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' +
        GT.esc(h || 'Column ' + (i + 1)) + '</span>' +
        '<select data-align="' + i + '" style="width:auto;min-width:110px">' +
        ['auto:Auto', 'left:Left', 'center:Center', 'right:Right'].map(function (o) {
          var p = o.split(':');
          return '<option value="' + p[0] + '"' + (cur === p[0] ? ' selected' : '') + '>' + p[1] + '</option>';
        }).join('') + '</select></div>';
    }).join('');
  }

  $('#aligns').addEventListener('change', function (e) {
    var i = e.target.getAttribute('data-align');
    if (i == null) return;
    aligns[i] = e.target.value;
    build(true);
  });
  $('#alignAll').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    $$('#alignAll button').forEach(function (x) { x.classList.toggle('on', x === b); });
    var a = b.getAttribute('data-a');
    aligns = grid.length ? grid[0].map(function () { return a; }) : [];
    renderAligns(); build(true);
  });

  function escCell(v) {
    var s = String(v == null ? '' : v);
    if ($('#optEscape').checked) s = s.replace(/\|/g, '\\|');
    if ($('#optBreaks').checked) s = s.replace(/\n/g, '<br>');
    else s = s.replace(/\n/g, ' ');
    if (!s.trim()) s = $('#empty').value || '';
    return s;
  }

  function visualWidth(s) {
    /* Rough width: count wide CJK/emoji as two columns so padding looks right. */
    var w = 0;
    for (var i = 0; i < s.length; i++) {
      var c = s.codePointAt(i);
      if (c > 0x1100 && (c <= 0x115f || c === 0x2329 || c === 0x232a ||
          (c >= 0x2e80 && c <= 0xa4cf) || (c >= 0xac00 && c <= 0xd7a3) ||
          (c >= 0xf900 && c <= 0xfaff) || (c >= 0xfe30 && c <= 0xfe6f) ||
          (c >= 0xff00 && c <= 0xff60) || (c >= 0xffe0 && c <= 0xffe6) ||
          (c >= 0x1f300 && c <= 0x1faff))) { w += 2; if (c > 0xffff) i++; }
      else w += 1;
    }
    return w;
  }

  function pad(s, len, align) {
    var diff = Math.max(0, len - visualWidth(s));
    if (align === 'right') return new Array(diff + 1).join(' ') + s;
    if (align === 'center') {
      var l = Math.floor(diff / 2);
      return new Array(l + 1).join(' ') + s + new Array(diff - l + 1).join(' ');
    }
    return s + new Array(diff + 1).join(' ');
  }

  function build(keepAligns) {
    grid = readGrid();
    if (!grid.length) {
      out.set('<!-- paste some data -->', 'table.md');
      $('#pill').textContent = 'empty';
      $('#preview').innerHTML = '';
      return;
    }
    if (!keepAligns && aligns.length !== grid[0].length) {
      aligns = grid[0].map(function () { return 'auto'; });
      renderAligns();
    }

    var head, body;
    if ($('#optHeader').checked) { head = grid[0].slice(); body = grid.slice(1); }
    else { head = grid[0].map(function (_, i) { return 'Column ' + (i + 1); }); body = grid.slice(); }

    if ($('#optBoldHeader').checked) head = head.map(function (h) { return h.trim() ? '**' + h + '**' : h; });

    head = head.map(escCell);
    body = body.map(function (r) { return r.map(escCell); });

    var cols = head.length;
    var effAligns = [];
    for (var i = 0; i < cols; i++) {
      var a = aligns[i] || 'auto';
      effAligns.push(a === 'auto' ? autoAlign(i) : a);
    }

    var style = $('#style').value;
    var widths = [];
    for (var c = 0; c < cols; c++) {
      var w = visualWidth(head[c] || '');
      body.forEach(function (r) { w = Math.max(w, visualWidth(r[c] || '')); });
      /* Separator needs at least 3 characters to hold colons. */
      widths.push(style === 'compact' ? 3 : Math.max(3, w));
    }

    var padStr = style === 'pretty' ? '  ' : ' ';
    var lead = $('#optOuter').checked ? '|' : '';
    var tail = $('#optOuter').checked ? '|' : '';

    function row(cells) {
      return lead + cells.map(function (v, i2) {
        var s = style === 'compact' ? v : pad(v, widths[i2], effAligns[i2]);
        return padStr + s + padStr;
      }).join('|') + tail;
    }

    function sep() {
      return lead + effAligns.map(function (a2, i3) {
        var w2 = widths[i3];
        if (a2 === 'right') return padStr + new Array(Math.max(2, w2)).join('-') + ':' + padStr;
        if (a2 === 'center') return padStr + ':' + new Array(Math.max(1, w2 - 1)).join('-') + ':' + padStr;
        return padStr + new Array(Math.max(3, w2) + 1).join('-') + padStr;
      }).join('|') + tail;
    }

    var lines = [row(head), sep()].concat(body.map(row));
    var text = lines.join('\n') + '\n';

    out.set(text, 'table.md');
    $('#pill').textContent = body.length + ' rows × ' + cols + ' cols';
    $('#pill').style.background = 'var(--green-bg)'; $('#pill').style.color = 'var(--green)';

    renderPreview(head, body, effAligns);
    renderWarn(head, body);
    renderTips();
  }

  function renderPreview(head, body, al) {
    function inline(s) {
      return GT.esc(s)
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>')
        .replace(/&lt;br&gt;/g, '<br>')
        .replace(/\\\|/g, '|');
    }
    $('#preview').innerHTML =
      '<p style="color:var(--muted);font-size:13.5px;margin-bottom:12px">Approximate GitHub rendering — bold, code spans and links are shown.</p>' +
      '<table style="border-collapse:collapse;width:100%;font-size:13.5px">' +
      '<thead><tr>' + head.map(function (h, i) {
        return '<th style="text-align:' + al[i] + ';padding:9px 12px;border:1px solid var(--line);background:var(--bg-soft)">' + inline(h) + '</th>';
      }).join('') + '</tr></thead><tbody>' +
      body.map(function (r) {
        return '<tr>' + r.map(function (v, i) {
          return '<td style="text-align:' + al[i] + ';padding:9px 12px;border:1px solid var(--line)">' + inline(v) + '</td>';
        }).join('') + '</tr>';
      }).join('') + '</tbody></table>';
  }

  function renderWarn(head, body) {
    var w = [];
    var raw = $('#data').value;
    if (!$('#optEscape').checked && /\|/.test(raw)) {
      w.push(['err', 'Your data contains <code>|</code> characters and escaping is off — those rows will split into extra columns. Turn escaping back on.']);
    }
    if (/\n/.test(raw) && $('#optBreaks').checked) {
      w.push(['ok', 'Multi-line cell content is converted to <code>&lt;br&gt;</code>, which GitHub renders inside table cells.']);
    }
    var blank = head.some(function (h) { return !h.trim() || h === ($('#empty').value || ''); });
    if (blank) w.push(['warn', 'One or more header cells are empty. Markdown allows it, but the column has no accessible label.']);
    if (body.length > 40) w.push(['warn', body.length + ' rows is long for a README. Consider linking to a full table or collapsing it inside a <code>&lt;details&gt;</code> block.']);
    if (head.length > 6) w.push(['warn', head.length + ' columns will scroll horizontally on GitHub mobile. Fewer, wider columns usually read better.']);
    if (!w.length) w.push(['ok', 'Valid GitHub-flavored Markdown with an alignment row.']);
    $('#warnBox').innerHTML = w.map(function (x) {
      return '<div class="note ' + (x[0] === 'ok' ? 'note-ok' : x[0] === 'warn' ? 'note-warn' : 'note-err') + '">' +
        (x[0] === 'ok' ? I.check : I.warn) + '<span>' + x[1] + '</span></div>';
    }).join('');
  }

  function renderTips() {
    $('#tips').innerHTML = [
      ['The separator row is mandatory', 'A Markdown table is only recognised when the second line is a row of dashes. Without it the whole block renders as a paragraph full of pipes.'],
      ['Colons set alignment', '<code>---</code> is left, <code>:---:</code> is centred, <code>---:</code> is right. Alignment lives in the separator row only, never in the data rows.'],
      ['Column widths do not matter', 'The padding in the raw text has no effect on rendering — it only makes the source readable in a diff. Choose compact if you would rather keep the file narrow.'],
      ['Escape pipes inside cells', 'A literal <code>|</code> must be written <code>\\|</code>, otherwise it is read as a column separator. This matters constantly when documenting shell commands or regex.'],
      ['No real line breaks in cells', 'A table row must be one line. Use <code>&lt;br&gt;</code> for a visual line break inside a cell — GitHub renders it, and so do most other Markdown engines.'],
      ['Inline formatting works', 'Bold, italics, <code>code</code>, links and images all render inside cells. Block elements — lists, headings, fenced code blocks — do not.'],
      ['Tables are a GFM extension', 'They are not part of original Markdown or CommonMark. GitHub, GitLab, Obsidian, Notion and most static site generators support them, but a strict CommonMark renderer will not.']
    ].map(function (x) {
      return '<div style="margin-bottom:16px"><h4 style="font-size:14.5px;margin-bottom:6px">' + x[0] + '</h4>' +
        '<p style="color:var(--muted);font-size:13.8px">' + x[1] + '</p></div>';
    }).join('');
  }

  $('#tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    $$('#tabs button').forEach(function (x) { x.classList.toggle('on', x === b); });
    $$('[data-panel]').forEach(function (p) { p.hidden = p.getAttribute('data-panel') !== b.getAttribute('data-tab'); });
  });
  $('#cfg').addEventListener('submit', function (e) { e.preventDefault(); build(); });
  $('#data').addEventListener('input', function () { build(); });
  ['#delim','#style','#optHeader','#optEscape','#optOuter','#optBoldHeader','#optBreaks','#optTrim','#empty']
    .forEach(function (s) { $(s).addEventListener('change', function () { build(true); }); $(s).addEventListener('input', function () { build(true); }); });

  build();

  GT.page({
    slug: 'markdown-table-generator',
    lede: 'Turn spreadsheet data into clean, aligned GitHub-flavored Markdown tables — with pipe escaping, per-column alignment and a live preview.',
    steps: [
      { icon: 'gear', title: 'Paste your data', text: 'CSV, TSV, a copy from Excel, or an existing Markdown table you want to reformat.' },
      { icon: 'grid', title: 'Set alignment', text: 'Per column, or all at once. Numeric columns are right-aligned automatically.' },
      { icon: 'copy', title: 'Paste into your README', text: 'Padded output stays readable in the raw file and in diffs.' }
    ],
    guideTitle: 'Markdown tables, and where they run out',
    guide:
      '<p style="color:var(--muted)">Markdown tables are a GitHub-flavored extension rather than part of the original spec, which is why they are simultaneously everywhere and slightly inconsistent. The core is simple: a header row, a separator row of dashes, then data rows, all delimited by pipes.</p>' +
      '<div class="grid g2" style="margin-top:18px">' +
      '<div><h4 style="font-size:14.5px;margin-bottom:8px">Things that trip people up</h4><ul style="color:var(--muted);font-size:13.8px;padding-left:18px;margin:0"><li>Forgetting the separator row — the block silently renders as a paragraph.</li><li>An unescaped <code>|</code> inside a cell, which splits the row. Extremely common when documenting shell pipelines or regex.</li><li>Trying to put a bullet list or a fenced code block inside a cell. Only inline formatting works.</li><li>Expecting a real newline in a cell to render. Use <code>&lt;br&gt;</code>.</li><li>Assuming column padding affects the output. It does not — it is purely for the source.</li></ul></div>' +
      '<div><h4 style="font-size:14.5px;margin-bottom:8px">Aligned or compact?</h4><p style="color:var(--muted);font-size:13.8px"><strong>Aligned</strong> pads every column to the same width. The raw Markdown is readable as a table even before rendering, which makes reviews far easier — but any edit to one cell can reflow the whole block in a diff.</p>' +
      '<p style="color:var(--muted);font-size:13.8px;margin-top:10px"><strong>Compact</strong> uses minimal widths. Diffs stay tiny and edits touch one line, at the cost of an unreadable source. For tables that change often — a status matrix, a changelog — compact is usually the better trade.</p></div></div>' +
      '<div class="note note-info" style="margin-top:18px">' + GTI.info + '<span>Paste an existing Markdown table back into the input and it will be parsed and reformatted. That is the quickest way to realign a table that has drifted after editing, or to switch a whole file from padded to compact.</span></div>',
    related: ['html-table-generator', 'github-task-list-generator', 'csv-test-data-generator'],
faqs: [
      { q: 'How do I make a table in GitHub Markdown?', a: 'Create a header row, a delimiter row using hyphens and then the data rows. Pipes separate the cells.' },
      { q: 'How do I center a Markdown table column?', a: 'Use colons on both sides of the delimiter, such as <code>:---:</code>.' },
      { q: 'How do I right-align a Markdown column?', a: 'Use a trailing colon in the delimiter cell, such as <code>---:</code>.' },
