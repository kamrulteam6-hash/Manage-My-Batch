<section class="hero" id="hero"></section>

<section id="toolApp">
<div class="wrap">
<div class="tool-grid">

  <form class="card card-pad" id="cfg" autocomplete="off">
    <div class="panel-title"><span class="ico" id="icoGear"></span>Class Builder</div>

    <div class="field">
      <label for="preset">Common patterns</label>
      <select id="preset">
        <option value="custom" selected>Build my own</option>
        <option value="slug">URL slug</option>
        <option value="username">Username</option>
        <option value="hex">Hexadecimal</option>
        <option value="alnum">Alphanumeric</option>
        <option value="identifier">Code identifier</option>
        <option value="filename">Safe filename</option>
        <option value="whitespace">Whitespace</option>
        <option value="punctuation">Punctuation</option>
        <option value="unicodeletters">Unicode letters (any script)</option>
        <option value="emoji">Emoji</option>
        <option value="nonascii">Non-ASCII</option>
      </select>
    </div>

    <fieldset class="field">
      <legend class="label">Character ranges</legend>
      <div class="check-list two" id="ranges"></div>
    </fieldset>

    <div class="field">
      <label for="extra">Additional literal characters</label>
      <input type="text" id="extra" value="_-" placeholder="e.g. _-.@">
      <div class="hint">Type them plainly — <code>]</code>, <code>\</code>, <code>^</code> and <code>-</code> are escaped and positioned correctly for you.</div>
    </div>

    <div class="field">
      <label for="customRanges">Custom ranges</label>
      <input type="text" id="customRanges" placeholder="e.g. À-Ö, 0-7, а-я">
      <div class="hint">Comma-separated <code>start-end</code> pairs.</div>
    </div>

    <fieldset class="field">
      <legend class="label">Shorthand classes</legend>
      <div class="check-list two" id="shorthands"></div>
    </fieldset>

    <fieldset class="field">
      <legend class="label">Unicode properties <span style="font-weight:400;color:var(--muted)">(needs the u flag)</span></legend>
      <div class="check-list two" id="unicode"></div>
    </fieldset>

    <div class="divider"></div>

    <div class="field">
      <label class="check on" style="margin-bottom:12px"><input type="checkbox" id="optNegate">
        <span><span class="t">Negate the class</span><span class="d">Matches everything <em>except</em> these characters — <code>[^…]</code>.</span></span></label>
    </div>

    <div class="row">
      <div class="field">
        <label for="quant">Quantifier</label>
        <select id="quant">
          <option value="">None — single character</option>
          <option value="?">? — optional (0 or 1)</option>
          <option value="*">* — zero or more</option>
          <option value="+">+ — one or more</option>
          <option value="custom">{n,m} — exact range</option>
        </select>
      </div>
      <div class="field">
        <label for="lazy">Greediness</label>
        <select id="lazy">
          <option value="">Greedy (default)</option>
          <option value="?">Lazy (?)</option>
        </select>
      </div>
    </div>

    <div class="row" id="quantRange" hidden>
      <div class="field"><label for="qmin">Min</label><input type="number" id="qmin" value="3" min="0"></div>
      <div class="field"><label for="qmax">Max (blank = unlimited)</label><input type="number" id="qmax" value="16" min="0"></div>
    </div>

    <fieldset class="field">
      <legend class="label">Anchors &amp; flags</legend>
      <div class="check-list two">
        <label class="check"><input type="checkbox" id="optAnchors"><span><span class="t">Anchor whole string ^…$</span></span></label>
        <label class="check"><input type="checkbox" id="optGroup"><span><span class="t">Wrap in a group</span></span></label>
        <label class="check"><input type="checkbox" id="fg" checked><span><span class="t">g — global</span></span></label>
        <label class="check"><input type="checkbox" id="fi"><span><span class="t">i — ignore case</span></span></label>
        <label class="check"><input type="checkbox" id="fm"><span><span class="t">m — multiline</span></span></label>
        <label class="check"><input type="checkbox" id="fu"><span><span class="t">u — unicode</span></span></label>
      </div>
    </fieldset>
  </form>

  <div class="card card-pad">
    <div class="panel-title"><span class="ico" id="icoSpark"></span>Pattern<span class="spacer"></span>
      <span class="result-pill" id="pill"></span></div>

    <div class="tabs" id="tabs">
      <button type="button" class="on" data-tab="file">Pattern</button>
      <button type="button" data-tab="test">Live tester</button>
      <button type="button" data-tab="ref">Cheat sheet</button>

    <div data-panel="file">
      <div class="output-box">
        <div class="output-bar"><span class="fname" id="fname">pattern.txt</span><span class="chip" id="meta"></span></div>

      </div>
      <div class="out-actions">
        <button class="btn btn-primary" id="copyBtn"><span id="icoCopy"></span> Copy</button>
        <button class="btn btn-soft" id="copyClass">Copy class only</button>
        <button class="btn btn-ghost" id="dlBtn"><span id="icoDl"></span> Download</button>
      </div>
      <div id="explain"></div>
      <div id="warnBox"></div>
    </div>

    <div data-panel="test" hidden>
      <div class="field">
        <label for="testStr">Test string</label>
        <textarea id="testStr" style="min-height:110px;font-family:var(--mono)">Hello World_123!
user-name@example.com
Ünïcödé tëxt — 2026
  spaces   and	tabs</textarea>
      </div>
      <div id="testOut"></div>
    </div>

    <div data-panel="ref" hidden><div id="ref"></div></div>
  </div>

<script src="../assets/js/site.js"></script>
<script>
(function () {
  var I = GTI, $ = GT.$, $$ = GT.$$;
  ['icoGear:gear','icoSpark:spark','icoCopy:copy','icoDl:download']
    .forEach(function (p) { var a = p.split(':'); document.getElementById(a[0]).innerHTML = I[a[1]]; });

  var RANGES = [
    { id: 'lower', label: 'a-z', desc: 'Lowercase ASCII letters', v: 'a-z' },
    { id: 'upper', label: 'A-Z', desc: 'Uppercase ASCII letters', v: 'A-Z' },
    { id: 'digits', label: '0-9', desc: 'ASCII digits', v: '0-9' },
    { id: 'hexlower', label: 'a-f', desc: 'Hex letters, lowercase', v: 'a-f' },
    { id: 'hexupper', label: 'A-F', desc: 'Hex letters, uppercase', v: 'A-F' },
    { id: 'latin1', label: 'À-ÿ', desc: 'Latin-1 accented letters', v: '\\u00C0-\\u00FF' },
    { id: 'cyrillic', label: 'а-я', desc: 'Cyrillic', v: '\\u0400-\\u04FF' },
    { id: 'greek', label: 'α-ω', desc: 'Greek', v: '\\u0370-\\u03FF' },
    { id: 'arabic', label: 'Arabic', desc: 'Arabic script', v: '\\u0600-\\u06FF' },
    { id: 'cjk', label: 'CJK', desc: 'Chinese, Japanese, Korean ideographs', v: '\\u4E00-\\u9FFF' }
  ];

  var SHORT = [
    { id: 'd', label: '\\d', desc: 'Any digit — same as 0-9' },
    { id: 'w', label: '\\w', desc: 'Word character: [A-Za-z0-9_]' },
    { id: 's', label: '\\s', desc: 'Whitespace: space, tab, newline' },
    { id: 'D', label: '\\D', desc: 'Any non-digit' },
    { id: 'W', label: '\\W', desc: 'Any non-word character' },
    { id: 'S', label: '\\S', desc: 'Any non-whitespace' },
    { id: 't', label: '\\t', desc: 'Tab' },
    { id: 'n', label: '\\n', desc: 'Newline' },
    { id: 'r', label: '\\r', desc: 'Carriage return' },
    { id: 'space', label: 'space', desc: 'A literal space character' }
  ];

  var UNI = [
    { id: 'L', label: '\\p{L}', desc: 'Any letter, any script' },
    { id: 'Lu', label: '\\p{Lu}', desc: 'Uppercase letter' },
    { id: 'Ll', label: '\\p{Ll}', desc: 'Lowercase letter' },
    { id: 'N', label: '\\p{N}', desc: 'Any numeric character' },
    { id: 'P', label: '\\p{P}', desc: 'Punctuation' },
    { id: 'S', label: '\\p{S}', desc: 'Symbols, including currency and maths' },
    { id: 'Emoji', label: '\\p{Emoji_Presentation}', desc: 'Emoji' },
    { id: 'Script_Latin', label: '\\p{Script=Latin}', desc: 'Latin script' }
  ];

  function checkList(host, arr, key) {
    $(host).innerHTML = arr.map(function (r) {
      return '<label class="check"><input type="checkbox" data-' + key + '="' + r.id + '">' +
        '<span><span class="t"><code>' + GT.esc(r.label) + '</code></span><span class="d">' + r.desc + '</span></span></label>';
    }).join('');
  }
  checkList('#ranges', RANGES, 'r');
  checkList('#shorthands', SHORT, 's');
  checkList('#unicode', UNI, 'u');

  var out = GT.mountOutput({ pre: '#out', fileLabel: '#fname', meta: '#meta',
    copyBtn: '#copyBtn', downloadBtn: '#dlBtn', filename: 'pattern.txt', mime: 'text/plain' });

  var PRESETS = {
    slug: { r: ['lower', 'digits'], extra: '-', quant: '+', anchors: true, flags: { g: false } },
    username: { r: ['lower', 'upper', 'digits'], extra: '_-', quant: 'custom', min: 3, max: 16, anchors: true },
    hex: { r: ['digits', 'hexlower', 'hexupper'], extra: '', quant: '+' },
    alnum: { r: ['lower', 'upper', 'digits'], extra: '', quant: '+' },
    identifier: { r: ['lower', 'upper', 'digits'], extra: '_$', quant: '+' },
    filename: { r: ['lower', 'upper', 'digits'], extra: '._-', quant: '+', anchors: true },
    whitespace: { r: [], s: ['space', 't', 'n', 'r'], extra: '', quant: '+' },
    punctuation: { r: [], extra: '.,;:!?\'"()[]{}<>/\\|@#$%^&*+=~`-', quant: '+' },
    unicodeletters: { r: [], u: ['L'], extra: '', quant: '+', unicode: true },
    emoji: { r: [], u: ['Emoji'], extra: '', quant: '+', unicode: true },
    nonascii: { r: [], custom: '\\u0080-\\uFFFF', extra: '', quant: '+', negate: false }
  };

  /* Escape a literal for safe use inside a character class. */
  function escInClass(ch) {
    if (ch === '\\') return '\\\\';
    if (ch === ']') return '\\]';
    if (ch === '^') return '\\^';
    if (ch === '-') return '\\-';
    if (ch === '[') return '\\[';
    return ch;
  }

  function classBody() {
    var parts = [];
    RANGES.forEach(function (r) {
      if ($('[data-r="' + r.id + '"]').checked) parts.push(r.v);
    });
    var custom = $('#customRanges').value.split(',').map(function (x) { return x.trim(); }).filter(Boolean);
    custom.forEach(function (c) { parts.push(c); });

    SHORT.forEach(function (s) {
      if (!$('[data-s="' + s.id + '"]').checked) return;
      parts.push(s.id === 'space' ? ' ' : '\\' + s.id);
    });
    UNI.forEach(function (u) {
      if ($('[data-u="' + u.id + '"]').checked) parts.push(u.label);
    });

    var extra = $('#extra').value;
    var lit = '';
    for (var i = 0; i < extra.length; i++) lit += escInClass(extra[i]);
    if (lit) parts.push(lit);

    return parts.join('');
  }

  function quantifier() {
    var q = $('#quant').value;
    if (!q) return '';
    if (q === 'custom') {
      var mn = $('#qmin').value === '' ? '0' : $('#qmin').value;
      var mx = $('#qmax').value;
      return mx === '' ? '{' + mn + ',}' : (mn === mx ? '{' + mn + '}' : '{' + mn + ',' + mx + '}');
    }
    return q;
  }

  function flags() {
    return (($('#fg').checked ? 'g' : '') + ($('#fi').checked ? 'i' : '') +
            ($('#fm').checked ? 'm' : '') + ($('#fu').checked ? 'u' : ''));
  }

  function buildPattern() {
    var body = classBody();
    if (!body) return { cls: '', pattern: '' };
    var cls = '[' + ($('#optNegate').checked ? '^' : '') + body + ']';
    var p = cls + quantifier();
    if (quantifier() && $('#lazy').value) p += '?';
    if ($('#optGroup').checked) p = '(' + p + ')';
    if ($('#optAnchors').checked) p = '^' + p + '$';
    return { cls: cls, pattern: p };
  }

  var current = { cls: '', pattern: '' };

  function build() {
    current = buildPattern();
    var f = flags();

    if (!current.pattern) {
      out.set('// Select at least one range, shorthand or literal character.', 'pattern.txt');
      $('#pill').textContent = 'empty';
      $('#explain').innerHTML = '';
      $('#warnBox').innerHTML = '';
      $('#testOut').innerHTML = '';
      return;
    }

    var text = [
      '# Pattern',
      current.pattern,
      '',
      '# JavaScript',
      'const re = /' + current.pattern + '/' + f + ';',
      "const isMatch = re.test(input);",
      '',
      '# JavaScript (from a string — note the doubled backslashes)',
      "const re = new RegExp('" + current.pattern.replace(/\\/g, '\\\\').replace(/'/g, "\\'") + "', '" + f + "');",
      '',
      '# Python',
      'import re',
      'pattern = re.compile(r"' + current.pattern + '"' + (f.indexOf('i') > -1 ? ', re.IGNORECASE' : '') + ')',
      '',
      '# PHP',
      "preg_match('/" + current.pattern.replace(/\//g, '\\/') + "/" + f.replace('g', '') + "', $input, $m);",
      '',
      '# Go',
      're := regexp.MustCompile(`' + current.pattern + '`)',
      '',
      '# HTML input pattern attribute',
      '<input pattern="' + GT.escAttr(current.pattern.replace(/^\^/, '').replace(/\$$/, '')) + '">'
    ].join('\n');

    out.set(text, 'pattern.txt');
    $('#pill').textContent = current.pattern.length + ' chars';
    $('#pill').style.background = 'var(--green-bg)'; $('#pill').style.color = 'var(--green)';

    renderExplain();
    renderWarn();
    runTest();
    renderRef();
  }

  function renderExplain() {
    var parts = [];
    if ($('#optAnchors').checked) parts.push(['^', 'Start of string' + ($('#fm').checked ? ' or line (m flag)' : '')]);
    if ($('#optGroup').checked) parts.push(['(', 'Start capturing group']);
    parts.push([current.cls, ($('#optNegate').checked ? 'Any character NOT in this set' : 'Any one character from this set')]);
    var q = quantifier();
    if (q) {
      var desc = q === '+' ? 'One or more times' : q === '*' ? 'Zero or more times' : q === '?' ? 'Zero or one time'
        : 'Between ' + ($('#qmin').value || 0) + ' and ' + ($('#qmax').value || 'unlimited') + ' times';
      parts.push([q + ($('#lazy').value || ''), desc + ($('#lazy').value ? ', as few as possible (lazy)' : ', as many as possible (greedy)')]);
    }
    if ($('#optGroup').checked) parts.push([')', 'End capturing group']);
    if ($('#optAnchors').checked) parts.push(['$', 'End of string' + ($('#fm').checked ? ' or line' : '')]);

    $('#explain').innerHTML = '<h4 style="font-size:14px;margin:16px 0 8px">Breakdown</h4>' +
      parts.map(function (p) {
        return '<div class="kv"><span class="k" style="font-family:var(--mono);font-size:13px;color:var(--blue)">' +
          GT.esc(p[0]) + '</span><span class="v" style="font-family:var(--sans);font-weight:500;max-width:65%;text-align:right">' +
          p[1] + '</span></div>';
      }).join('');
  }

  function renderWarn() {
    var w = [];
    var body = classBody();
    var usesUnicode = UNI.some(function (u) { return $('[data-u="' + u.id + '"]').checked; });

    if (usesUnicode && !$('#fu').checked) {
      w.push(['err', 'Unicode property escapes such as <code>\\p{L}</code> require the <code>u</code> flag. Without it JavaScript throws a SyntaxError.']);
    }
    if ($('#quant').value === 'custom' && $('#qmax').value !== '' && +$('#qmax').value < +$('#qmin').value) {
      w.push(['err', 'Maximum is less than minimum — this pattern can never match.']);
    }
    if ($('#optNegate').checked && /\\D|\\W|\\S/.test(body)) {
      w.push(['warn', 'Negating a class that already contains a negated shorthand is confusing and often wrong. <code>[^\\D]</code> is just <code>\\d</code>.']);
    }
    if (/a-z/.test(body) && /A-Z/.test(body) && $('#fi').checked) {
      w.push(['warn', 'You have both cases in the class <em>and</em> the <code>i</code> flag. Drop one — keeping both makes intent unclear during review.']);
    }
    if (/0-9/.test(body) && /\\d/.test(body)) {
      w.push(['warn', '<code>0-9</code> and <code>\\d</code> are redundant together in this class.']);
    }
    if ($('#quant').value === '*' && $('#optAnchors').checked) {
      w.push(['warn', '<code>^[…]*$</code> matches the empty string. If the field is required, use <code>+</code> instead.']);
    }
    var extra = $('#extra').value;
    if (/[.^$*+?()[\]{}|\\]/.test(extra)) {
      w.push(['ok', 'Special characters in your literal list are escaped automatically — inside a class only <code>] \\ ^ -</code> actually need it.']);
    }
    if ($('#fg').checked && $('#optAnchors').checked) {
      w.push(['warn', 'The <code>g</code> flag with anchors is rarely useful for validation, and a global regex object keeps <code>lastIndex</code> state between <code>.test()</code> calls — a classic source of alternating true/false bugs.']);
    }
    if (!w.length) w.push(['ok', 'Pattern is valid and unambiguous.']);
    $('#warnBox').innerHTML = w.map(function (x) {
      return '<div class="note ' + (x[0] === 'ok' ? 'note-ok' : x[0] === 'warn' ? 'note-warn' : 'note-err') + '">' +
        (x[0] === 'ok' ? I.check : I.warn) + '<span>' + x[1] + '</span></div>';
    }).join('');
  }

  function runTest() {
    var str = $('#testStr').value;
    var el = $('#testOut');
    if (!current.pattern) { el.innerHTML = ''; return; }
    var re;
    try {
      re = new RegExp(current.pattern, flags().indexOf('g') > -1 ? flags() : flags() + 'g');
    } catch (e) {
      el.innerHTML = '<div class="note note-err">' + I.warn + '<span>Invalid pattern: ' + GT.esc(e.message) + '</span></div>';
      return;
    }

    var html = '', last = 0, count = 0, m, guard = 0;
    re.lastIndex = 0;
    while ((m = re.exec(str)) !== null && guard++ < 5000) {
      if (m.index >= last) {
        html += GT.esc(str.slice(last, m.index));
        html += '<mark style="background:#bfdbfe;color:#1e3a8a;border-radius:3px;padding:0 1px">' +
          GT.esc(m[0] === '' ? '∅' : m[0]) + '</mark>';
        last = m.index + (m[0].length || 1);
        count++;
      }
      if (m[0] === '') re.lastIndex++;
    }
    html += GT.esc(str.slice(last));

    var full = false;
    try {
      full = new RegExp('^(?:' + current.pattern + ')$', flags().replace('g', '')).test(str.split('\n')[0]);
    } catch (e) {}

    el.innerHTML =
      '<div class="note ' + (count ? 'note-ok' : 'note-warn') + '">' + (count ? I.check : I.warn) +
      '<span><strong>' + count + ' match' + (count === 1 ? '' : 'es') + '</strong> in the test string. ' +
      'First line ' + (full ? 'fully matches' : 'does not fully match') + ' the pattern.</span></div>' +
      '<div class="output-box" style="margin-top:12px"><div class="output-bar"><span class="fname">Highlighted matches</span></div>' +
      '<pre class="code" style="white-space:pre-wrap">' + html + '</pre></div>' +
      '<div class="kv" style="margin-top:12px"><span class="k">Pattern</span>' +
      '<span class="v">/' + GT.esc(current.pattern) + '/' + flags() + '</span></div>';
  }

  function renderRef() {
    $('#ref').innerHTML =
      '<h4 style="font-size:14.5px;margin-bottom:10px">Inside a character class</h4>' +
      [['<code>[abc]</code>', 'Any one of a, b or c'],
       ['<code>[^abc]</code>', 'Any character except a, b or c'],
       ['<code>[a-z]</code>', 'A range — everything from a to z by code point'],
       ['<code>[a-zA-Z0-9]</code>', 'Multiple ranges combined'],
       ['<code>[\\d\\s]</code>', 'Shorthands work inside classes'],
       ['<code>[.-]</code>', 'Most metacharacters are literal inside a class'],
       ['<code>[\\]\\\\^-]</code>', 'Only these four need escaping: ] \\ ^ -'],
       ['<code>[-abc]</code>', 'A hyphen first or last is literal, no escape needed']
      ].map(function (r) {
        return '<div class="kv"><span class="k">' + r[0] + '</span><span class="v" style="font-family:var(--sans);font-weight:500;max-width:62%;text-align:right">' + r[1] + '</span></div>';
      }).join('') +
      '<h4 style="font-size:14.5px;margin:20px 0 10px">Quantifiers</h4>' +
      [['<code>?</code>', 'Zero or one'], ['<code>*</code>', 'Zero or more'], ['<code>+</code>', 'One or more'],
       ['<code>{3}</code>', 'Exactly three'], ['<code>{3,}</code>', 'Three or more'], ['<code>{3,8}</code>', 'Between three and eight'],
