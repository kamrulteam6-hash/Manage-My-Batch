<body data-root="../">

<section class="hero" id="hero"></section>

<section id="toolApp">
<div class="wrap">
<div class="tool-grid">

  <form class="card card-pad" id="cfg" autocomplete="off">
    <div class="panel-title"><span class="ico" id="icoGear"></span>Generator Settings</div>

    <div class="field">
      <label>Ticket type</label>
      <div class="seg" id="preset">
        <button type="button" class="on" data-p="support">Support ticket</button>
        <button type="button" data-p="event">Event admission</button>
        <button type="button" data-p="queue">Queue number</button>
      </div>
      <div class="hint" id="presetHint"></div>
    </div>

    <div class="row">
      <div class="field"><label for="prefix">Prefix</label><input type="text" id="prefix" value="TKT"></div>
      <div class="field">
        <label for="sep">Separator</label>
        <select id="sep">
          <option value="-" selected>Hyphen (-)</option>
          <option value="">None</option>
          <option value="_">Underscore (_)</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label for="queue">Queue / category code</label>
      <input type="text" id="queue" placeholder="e.g. BILL, TECH, VIP">
      <div class="hint">Lets an agent see the routing from the reference alone.</div>
    </div>

    <div class="row">
      <div class="field">
        <label for="dateFormat">Date segment</label>
        <select id="dateFormat"></select>
      </div>
      <div class="field">
        <label for="pad">Number length</label>
        <select id="pad">
          <option value="4">4 digits</option>
          <option value="5">5 digits</option>
          <option value="6" selected>6 digits</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div class="field"><label for="start">Starting number</label><input type="number" id="start" value="100001" min="0"></div>
      <div class="field">
        <label for="checkDigit">Check digit</label>
        <select id="checkDigit"></select>
      </div>
    </div>

    <div class="field">
      <label for="randLen">Random segment length: <strong id="randLabel">none</strong></label>
      <input type="range" id="randLen" min="0" max="10" value="0" style="width:100%;accent-color:var(--blue)">
      <div class="hint" id="randHint">Essential for admission tickets — without it, anyone can forge a valid-looking ticket by counting.</div>
    </div>

    <div class="field">
      <label for="preview">Preview format</label>
      <div class="seq-preview" id="preview">TKT-100001</div>
    </div>

    <div class="divider"></div>

    <div class="row">
      <div class="field"><label for="count">How many</label><input type="number" id="count" value="6" min="1" max="5000"></div>
      <div class="field"><label for="date">Date</label><input type="date" id="date"></div>
    </div>

    <details class="faq" style="box-shadow:none;margin-bottom:16px">
      <summary style="padding:12px 14px;font-size:13.8px">Advanced format</summary>
      <div class="body" style="padding:0 14px 14px">
        <label for="pattern" style="margin-top:6px">Custom pattern</label>
        <input type="text" id="pattern" placeholder="e.g. {PREFIX}{SEP}{YY}{SEP}{SEQ:6}{SEP}{RAND:5}">
        <div class="token-help" id="tokenHelp"></div>
        <label for="suffix" style="margin-top:12px">Suffix</label>
        <input type="text" id="suffix" placeholder="optional">
      </div>
    </details>

    <div class="out-actions">
      <button type="submit" class="btn btn-primary btn-block"><span id="icoBolt"></span> Generate Ticket Numbers</button>
    </div>
  </form>

  <div class="card card-pad">
    <div class="panel-title"><span class="ico" id="icoSpark"></span>Generated Results<span class="spacer"></span>
      <span class="result-pill" id="pill"></span></div>

    <div class="tabs" id="tabs">
      <button type="button" class="on" data-tab="results">Results</button>
      <button type="button" data-tab="export">Export</button>
      <button type="button" data-tab="checks">Validation</button>
      <button type="button" data-tab="guide">Guidance</button>
    </div>

    <div data-panel="results">
      <div id="primary"></div>
      <div id="more"></div>
      <button type="button" class="btn btn-soft btn-block" id="regen" style="margin-top:18px">
        <span id="icoReset"></span> Regenerate</button>
      <div id="secNote"></div>
    </div>

    <div data-panel="export" hidden>
      <div class="field">
        <label for="exportAs">Export format</label>
        <select id="exportAs">
          <option value="lines">Plain list</option>
          <option value="csvIndexed">CSV with index</option>
          <option value="json">JSON array</option>
          <option value="sql">SQL INSERT</option>
        </select>
      </div>
      <div class="output-box">
        <div class="output-bar"><span class="fname" id="fname">ticket-numbers.txt</span><span class="chip" id="meta"></span></div>
        <pre class="code" id="out"></pre>
      </div>
      <div class="out-actions">
        <button class="btn btn-primary" id="copyBtn"><span id="icoCopy"></span> Copy all</button>
        <button class="btn btn-ghost" id="dlBtn"><span id="icoDl"></span> Download</button>
      </div>
    </div>

    <div data-panel="checks" hidden><div id="checks"></div></div>
    <div data-panel="guide" hidden><div id="guide"></div></div>
  </div>

</div>
</div>
</section>

<div id="afterTool"></div>

<script src="../assets/js/site.js"></script>
<script src="../assets/js/seqid.js"></script>
<script>
(function () {
  var I = GTI, $ = GT.$, $$ = GT.$$;
  ['icoGear:gear','icoSpark:spark','icoBolt:bolt','icoCopy:copy','icoDl:download','icoReset:reset']
    .forEach(function (p) { var a = p.split(':'); document.getElementById(a[0]).innerHTML = I[a[1]]; });

  $('#dateFormat').innerHTML = GTSeq.DATE_FORMATS.map(function (f) {
    return '<option value="' + f.id + '"' + (f.id === 'none' ? ' selected' : '') + '>' + f.label + '</option>';
  }).join('');
  $('#checkDigit').innerHTML = GTSeq.CHECK_DIGITS.map(function (c) {
    return '<option value="' + c.id + '">' + c.label + '</option>';
  }).join('');
  $('#tokenHelp').innerHTML = GTSeq.tokenHelpHtml();
  $('#date').value = GT.today();

  var HINTS = {
    support: 'A readable running reference agents and customers can quote in email subject lines.',
    event: 'Admission tickets must not be forgeable — a long random block is mandatory, and a check digit speeds up gate scanning.',
    queue: 'Short, human-callable numbers for a service desk or waiting room. Resets daily.'
  };
  var PRESETS = {
    support: { prefix: 'TKT', date: 'none', pad: 6, start: 100001, rand: 0, check: 'none' },
    event: { prefix: 'EVT', date: 'YYYY', pad: 5, start: 1, rand: 8, check: 'luhn' },
    queue: { prefix: 'Q', date: 'none', pad: 3, start: 1, rand: 0, check: 'none' }
  };

  var ids = [];
  var out = GT.mountOutput({ pre: '#out', fileLabel: '#fname', meta: '#meta',
    copyBtn: '#copyBtn', downloadBtn: '#dlBtn', filename: 'ticket-numbers.txt', mime: 'text/plain' });

  function opts() {
    var sep = $('#sep').value;
    var queue = $('#queue').value.trim().toUpperCase();
    var pattern = $('#pattern').value.trim();
    var randLen = parseInt($('#randLen').value, 10) || 0;
    if (!pattern && queue) {
      var df = GTSeq.DATE_FORMATS.filter(function (f) { return f.id === $('#dateFormat').value; })[0];
      var parts = ['{PREFIX}', queue];
      if (df && df.pattern) parts.push(df.pattern);
      if (randLen) parts.push('{RAND:' + randLen + '}');
      parts.push('{SEQ}');
      if ($('#suffix').value.trim()) parts.push('{SUFFIX}');
      pattern = parts.join(sep === '' ? '' : '{SEP}');
    }
    return {
      prefix: $('#prefix').value.trim(),
      suffix: $('#suffix').value.trim(),
      dateFormat: $('#dateFormat').value,
      sep: sep,
      start: $('#start').value,
      pad: parseInt($('#pad').value, 10),
      count: parseInt($('#count').value, 10),
      randLen: randLen,
      checkDigit: $('#checkDigit').value,
      date: $('#date').value ? new Date($('#date').value + 'T12:00:00') : new Date(),
      pattern: pattern
    };
  }

  function build() {
    var o = opts();
    ids = GTSeq.generate(o).ids;

    $('#randLabel').textContent = o.randLen || 'none';
    $('#preview').textContent = ids[0] || '—';
    GTSeq.renderResults({ ids: ids, primary: '#primary', more: '#more', noun: 'Ticket Number' });
    $('#pill').textContent = ids.length.toLocaleString() + ' generated';
    $('#pill').style.background = 'var(--green-bg)'; $('#pill').style.color = 'var(--green)';

    var mode = $('#exportAs').value;
    var ext = mode === 'json' ? 'json' : mode === 'sql' ? 'sql' : /csv/.test(mode) ? 'csv' : 'txt';
    out.set(GTSeq.exportAs(ids, mode, { column: 'ticket_number', table: 'tickets' }), 'ticket-numbers.' + ext);

    var isEvent = $$('#preset button').filter(function (b) { return b.classList.contains('on'); })[0].getAttribute('data-p') === 'event';
    $('#secNote').innerHTML = (isEvent && o.randLen < 6)
      ? '<div class="note note-err" style="margin-top:14px">' + I.warn +
        '<span><strong>Not safe for admission tickets.</strong> With a short or absent random block, anyone holding one ticket can generate other valid numbers. Use at least 8 random characters, and validate every ticket against your database at the gate.</span></div>'
      : o.randLen >= 6
        ? '<div class="note note-ok" style="margin-top:14px">' + I.check +
          '<span>A ' + o.randLen + '-character random block makes these numbers impractical to guess. Still validate each one against your database at scan time — an unguessable number is not the same as a verified one.</span></div>'
        : '<div class="note note-info" style="margin-top:14px">' + I.info +
          '<span>Sequential references are ideal for support desks: short, quotable in an email subject, and easy to search.</span></div>';

    var extra = [];
    if (o.checkDigit !== 'none') extra.push({ s: 'ok', m: 'Check digit appended — a scanner or agent can detect a mistyped ticket number before it hits your database.' });
    if (isEvent && o.checkDigit === 'none') extra.push({ s: 'warn', m: 'No check digit. For gate scanning, a check digit catches most manual-entry errors instantly rather than after a failed lookup.' });
    GTSeq.renderChecks('#checks', GTSeq.validate(ids, { humanEntry: true, sequential: o.randLen === 0, suggestCheck: true }).concat(extra));
  }

  $('#preset').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    $$('#preset button').forEach(function (x) { x.classList.toggle('on', x === b); });
    var k = b.getAttribute('data-p'), p = PRESETS[k];
    $('#prefix').value = p.prefix; $('#dateFormat').value = p.date; $('#pad').value = p.pad;
    $('#start').value = p.start; $('#randLen').value = p.rand; $('#checkDigit').value = p.check;
    $('#pattern').value = '';
    $('#presetHint').textContent = HINTS[k];
    build();
  });
  $('#presetHint').textContent = HINTS.support;

  $('#guide').innerHTML = [
    ['Support tickets: optimise for quoting', 'A support reference gets typed into email subjects, read on phone calls and pasted into chat. Short and sequential beats clever. <code>TKT-100042</code> works; a 24-character UUID does not.'],
    ['Event tickets: optimise against forgery', 'Admission tickets are worth money, so a predictable number is a printable forgery. Use a long random block, and treat the number as a lookup key that must be validated and marked used at the gate — never as proof of validity by itself.'],
    ['Check digits pay for themselves at a gate', 'When staff type ticket numbers manually under time pressure, a Luhn digit rejects the overwhelming majority of typos instantly rather than after a failed database lookup and a queue forming behind.'],
    ['Queue numbers should be short and reset', 'A waiting-room number is called out loud and displayed on a screen. Three digits, reset daily, no prefix beyond a letter. Anything longer is harder to hear correctly.'],
    ['Category codes help routing but age badly', 'A queue code in the reference is useful for triage, but tickets get reassigned. Keep the code as a hint, and store the authoritative queue in a field you can change.'],
    ['One ticket, one number, forever', 'Merging duplicate tickets should keep both references resolvable, with the merged one redirecting. Customers keep quoting the old number for months.']
  ].map(function (x) {
    return '<div style="margin-bottom:16px"><h4 style="font-size:14.5px;margin-bottom:6px">' + x[0] + '</h4>' +
      '<p style="color:var(--muted);font-size:13.8px">' + x[1] + '</p></div>';
  }).join('');

  GTSeq.bindCopy('#primary', function () { return ids; });
  GTSeq.bindCopy('#more', function () { return ids; });
  GTSeq.bindTokenHelp('#tokenHelp', '#pattern', build);

  $('#tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    $$('#tabs button').forEach(function (x) { x.classList.toggle('on', x === b); });
    $$('[data-panel]').forEach(function (p) { p.hidden = p.getAttribute('data-panel') !== b.getAttribute('data-tab'); });
  });
  $('#cfg').addEventListener('submit', function (e) { e.preventDefault(); build(); GT.toast('Ticket numbers generated'); });
  $('#cfg').addEventListener('input', build);
  $('#cfg').addEventListener('change', build);
  $('#regen').addEventListener('click', build);
  $('#exportAs').addEventListener('change', build);

  build();

  GT.page({
    slug: 'ticket-number-generator',
    lede: 'Generate support ticket references or forgery-resistant event admission numbers — with queue codes, check digits and random blocks sized for the job.',
    steps: [
      { icon: 'gear', title: 'Choose the ticket type', text: 'Support, event admission or a queue number — each needs a different shape.' },
      { icon: 'ticket', title: 'Set the security level', text: 'Random block length and check digit, sized to the risk.' },
      { icon: 'copy', title: 'Export', text: 'Copy a batch into your helpdesk or ticketing database.' }
    ],
    guideTitle: 'Two different problems wearing the same name',
    guide:
      '<p style="color:var(--muted)">A support ticket number and an event ticket number share a word and almost nothing else. One is a conversation reference optimised for humans repeating it; the other is a bearer token worth real money. Designing them the same way is how event organisers end up with duplicate admissions at the gate.</p>' +
      '<div class="grid g2" style="margin-top:18px">' +
      '<div><h4 style="font-size:14.5px;margin-bottom:8px">Support tickets</h4><p style="color:var(--muted);font-size:13.8px">Short, sequential, memorable. It lands in an email subject line and gets quoted over the phone. Predictability is not a risk because the ticket itself is protected by authentication, not by the number.</p>' +
      '<p style="color:var(--muted);font-size:13.8px;margin-top:10px">Good: <code>TKT-100042</code>, <code>SUP-2026-0042</code>.</p></div>' +
      '<div><h4 style="font-size:14.5px;margin-bottom:8px">Event admission</h4><p style="color:var(--muted);font-size:13.8px">The number often <em>is</em> the credential, so it must be unguessable and single-use. A long random block plus a database check at scan time is the minimum. A check digit on top catches manual entry errors at the gate.</p>' +
      '<p style="color:var(--muted);font-size:13.8px;margin-top:10px">Good: <code>EVT-2026-00042-K7QM9X3P</code>.</p></div></div>' +
      '<div class="note note-warn" style="margin-top:18px">' + GTI.warn + '<span><strong>An unguessable ticket number is not a validated ticket.</strong> Randomness stops people inventing numbers; it does nothing about someone photographing a real ticket and sharing it. Every admission system needs a server-side check that marks the ticket used on first scan.</span></div>',
    related: ['reference-number-generator', 'order-number-generator', 'receipt-number-generator'],
faqs: [
      { q: 'What is a ticket number?', a: 'It is an identifier assigned to a support case, IT request, event ticket, queue item or another ticketed record.' },
      { q: 'Should ticket numbers be sequential?', a: 'They can be. Sequential IDs are common because they are readable and easy to search.' },
      { q: 'Can I add a department prefix?', a: 'Yes. Stable project or queue prefixes can make ticket families easier to recognize.' },
      { q: 'What is a ticket check digit?', a: 'It is an extra character calculated from the rest of the reference to help detect typing errors. It is not a security feature.' },
      { q: 'Should ticket numbers contain customer names?', a: 'No. Keep personal data out of widely shared identifiers.' },
      { q: 'Can an event ticket use a simple sequential number?', a: 'It can use one as a reference, but admission should rely on a proper validation system rather than assuming the visible number is secret.' },
      { q: 'Can ticket numbers reset?', a: 'Short-lived queue numbers can reset when their scope is clearly limited. Durable support or service-ticket references are normally better kept unique over time.' }
    ],
    seo: {
      title: 'Ticket Number Generator – Create Support, Event and Queue References',
      lead: 'Use the Ticket Number Generator above to create clear identifiers for support tickets, event tickets, service requests, queue numbers and other trackable items.',
      blocks: [
        { html: '<p>Choose the numbering style, prefix, date or category segment, sequence length and starting value. Where manual entry matters, an optional check digit can help catch common typing mistakes.</p>' +
            '<p>A helpdesk might use <code>SUP-10421</code>. An IT team could use <code>IT-2026-00842</code>. An event organizer might use <code>EVT-A-004821</code>.</p>' +
            '<p>The purpose is simple: one ticket should have one stable reference that staff and users can quote without confusion.</p>' },
        { h: 'What Is a Ticket Number?',
          html: '<p>A ticket number is an identifier assigned to a request, task, admission record or queue item.</p>' +
            '<p>The word "ticket" is used in several contexts.</p>' +
            '<p><strong>Support ticket</strong> — tracks a customer or internal support request.</p>' +
            '<p><strong>IT service ticket</strong> — tracks an incident, problem, change or service request.</p>' +
            '<p><strong>Event ticket</strong> — identifies an admission entitlement or booking record.</p>' +
            '<p><strong>Queue ticket</strong> — represents a customer’s place or service reference.</p>' +
            '<p>The numbering requirements differ between these use cases.</p>' +
            '<p>A support ticket benefits from readability and searchability.</p>' +
            '<p>An admission ticket may also need anti-duplication controls, barcodes or validation at entry.</p>' +
            '<p>Do not assume one ticket-number format solves every ticketing problem.</p>' },
        { h: 'How to Use This Ticket Number Generator',
          html: '<p>Choose the type of ticket you are numbering.</p><p>Then set a prefix.</p><p>Examples:</p>',
          list: ['SUP', 'IT', 'EVT', 'Q'],
          after: '<p>Choose the separator and sequence length.</p>' +
            '<p>Add a date or category segment only if it helps staff understand the ticket.</p>' +
            '<p>Set the starting number and generate the batch.</p>' +
            '<p>If the reference will be typed manually, consider a check digit.</p>' +
            '<p>For a live support system, the application itself should normally own ticket creation and uniqueness.</p>' +
            '<p>The generator is useful for designing a numbering scheme, creating test data, preparing event batches or managing smaller manual workflows.</p>' },
        { h: 'Sequential Ticket Numbers',
          html: '<p>Many ticket systems use a simple counter.</p><p>For example:</p><pre class="code">SUP-1001\nSUP-1002\nSUP-1003</pre>' +
            '<p>Jira-style work item keys are a familiar example of a readable project key combined with a sequential number.</p>' +
            '<p>Sequential ticket IDs have several advantages:</p>',
          list: ['easy to search', 'easy to read', 'compact', 'naturally sortable', 'familiar to users'],
          after: '<p>They also reveal rough volume.</p>' +
            '<p>If a customer sees ticket 1002 today and 9002 next month, they can infer that many ticket records were created.</p>' +
            '<p>For most support desks this may not matter.</p>' +
            '<p>If business-volume disclosure matters, consider a less predictable public reference.</p>' },
        { h: 'Project or Queue Prefixes',
          html: '<p>Prefixes help users distinguish ticket families.</p><p>Examples:</p><pre class="code">BILL-10421\nTECH-8842\nHR-1204</pre>' +
            '<p>This mirrors the useful pattern of systems that combine a project or queue key with a counter.</p>' +
            '<p>Keep prefixes stable.</p>' +
            '<p>If "Customer Success" changes its internal department name, do not automatically rewrite old ticket references.</p>' +
            '<p>The identifier should remain the same after creation.</p>' +
            '<p>Use the database to store current department ownership.</p>' +
            '<p>Do not treat the prefix as live routing metadata unless your system is designed around that rule.</p>' },
        { h: 'Date-Based Ticket Numbers',
          html: '<p>A date component may help when tickets are processed by day or event.</p><p>Example:</p><pre class="code">EVT-20260815-00421</pre>' +
            '<p>A support desk might use:</p><pre class="code">SUP-2608-10421</pre>' +
            '<p>Date segments make references longer.</p><p>They also create rollover questions.</p>' +
            '<p>If the numeric portion resets every day, the date must remain part of the complete identifier.</p>' +
            '<p>If tickets can be created across time zones, define which timezone determines the date.</p>' +
            '<p>For global support systems, a continuous sequence may be easier than daily reset logic.</p>' +
            '<p>Use date segments only when they serve a real workflow.</p>' },
        { h: 'Support Ticket Numbers',
          html: '<p>A support ticket number should make it easy to locate one conversation or case.</p><p>Customers may quote it in:</p>',
          list: ['email subjects', 'chat', 'phone calls', 'follow-up forms', 'escalation messages'],
          after: '<p>Keep it readable.</p>' +
            '<p>A support agent should be able to type the number quickly without asking the customer to repeat a 30-character random value.</p>' +
            '<p>A compact prefix plus sequence works well in many organizations.</p>' +
            '<p>The ticket number identifies the case.</p>' +
            '<p>It should not contain the customer’s email address, phone number or other private information.</p>' },
        { h: 'Event Ticket Numbers',
          html: '<p>Event tickets have a different threat model from support references.</p>' +
            '<p>If the number itself is used to grant admission, a simple sequence can be easy to copy or guess.</p>' +
            '<p>Modern ticketing systems normally rely on:</p>',
          list: ['barcode or QR payloads', 'signed or server-validated codes', 'one-time redemption state', 'ticket ownership records'],
          after: '<p>A printed ticket number can still be useful for support, but it should not be the only security control if knowing the number grants entry.</p>' +
            '<p>For test or small manual events, generated ticket numbers can organize batches.</p>' +
            '<p>For real admission control, use a system designed to validate tickets at the gate.</p>' },
        { h: 'Optional Check Digits',
          html: '<p>A check digit can detect some transcription errors.</p>' +
            '<p>This is useful when users read ticket numbers over the phone or copy them from paper.</p>' +
            '<p>A check digit is calculated from the other characters or digits using a defined algorithm.</p>' +
            '<p>It is <strong>not</strong> a security feature.</p>' +
            '<p>It does not make the ticket secret.</p><p>It does not prove ownership.</p>' +
            '<p>It does not prevent someone from generating another syntactically valid number.</p>' +
            '<p>The purpose is error detection.</p>' +
            '<p>If your ticket numbers are short and frequently typed manually, that can be valuable.</p>' +
            '<p>If tickets are almost always scanned or copied digitally, a check digit may add unnecessary length.</p>' },
        { h: 'What a Check Digit Can Catch',
          html: '<p>Depending on the algorithm, check systems can detect many common mistakes such as:</p>',
          list: ['single mistyped digits', 'some transpositions', 'missing or incorrect characters'],
          after: '<p>No check-digit method catches every possible error.</p>' +
            '<p>The generator’s check option should therefore be treated as input-validation assistance.</p>' +
            '<p>Your application still needs to confirm that:</p>' +
            '<ul style="color:var(--muted);padding-left:18px"><li>the ticket exists</li><li>the ticket is valid</li><li>the user may access it</li></ul>' +
            '<p>A mathematically valid check digit only proves the reference passed the checksum rule.</p>' },
        { h: 'Ticket Numbers and Privacy',
          html: '<p>Do not embed personal information.</p><p>Avoid formats such as <code>SMITH-1985-10421</code> or <code>5551234567-10421</code>.</p>' +
            '<p>Ticket numbers often appear in:</p>',
          list: ['email', 'browser URLs', 'screenshots', 'support transcripts', 'exports', 'printed documents'],
          after: '<p>Use opaque organizational codes instead.</p>' +
            '<p>If support agents need customer identity, retrieve it after opening the authorized ticket.</p>' +
            '<p>The reference itself should expose as little personal information as practical.</p>' },
        { h: 'Ticket Numbers and Authorization',
          html: '<p>Predictable ticket numbers can create a serious problem only if the application allows unauthorized access when the number changes.</p>' +
            '<p>For example, <code>/tickets/10421</code> should not expose another user’s case merely because they try <code>/tickets/10422</code>.</p>' +
            '<p>The server must check authorization.</p>' +
            '<p>Randomizing the ticket number can reduce easy enumeration, but it cannot replace access control.</p>' +
            '<p>Valid ticket IDs leak through emails, screenshots, browser histories and logs.</p>' +
            '<p>Every request for ticket data must be authorized independently of how guessable the identifier is.</p>' },
        { h: 'Should Ticket Numbers Ever Be Reused?',
          html: '<p>Generally, avoid reusing a ticket reference for a different historical record.</p>' +
            '<p>Even after a case is closed, its ID may appear in:</p>',
          list: ['customer emails', 'knowledge-base links', 'reports', 'audit logs', 'internal notes'],
          after: '<p>Reusing the number creates ambiguity.</p>' +
            '<p>Queue tickets are an exception when the number is intentionally scoped to a short period such as one branch/day.</p>' +
            '<p>Define that limited scope clearly.</p>' +
            '<p>For durable support or IT tickets, stable non-reused references are far easier to maintain.</p>' },
        { h: 'Ticket Number vs Reference Number',
          html: '<p>A ticket number identifies a ticket.</p><p>A reference number is a broader concept.</p><p>References may identify:</p>',
          list: ['payments', 'correspondence', 'cases', 'applications', 'shipments', 'batches'],
          after: '<p>Use the Ticket Number Generator when the object is specifically a support, event or queue ticket.</p>' +
            '<p>Use the <a href="/tools/reference-number-generator">Reference Number Generator</a> when you need a neutral code that is not tied to one operational document type.</p>' +
            '<p>Naming matters because staff should understand what they are looking at from the prefix or context.</p>' },
        { h: 'Common Ticket Number Mistakes',
          html: '<p>Avoid these problems:</p>',
          list: ['encoding status or assigned agent in the number', 'using customer personal data', 'reusing durable support ticket IDs',
                 'assuming a checksum makes the ID secure', 'granting access based only on knowing the ticket number',
                 'making support references too long to read aloud', 'resetting sequences without defining scope',
                 'creating independent counters that can collide', 'using event ticket numbers as the sole admission-security mechanism',
                 'adding several prefixes that nobody can explain'],
          after: '<p>A ticket reference should help people find the record, not become the record’s business logic.</p>' }
      ],
      keywords: ['ticket number generator', 'support ticket number format', 'event ticket id generator', 'queue ticket number',
        'ticket check digit', 'it service ticket number', 'ticket number authorization security', 'support desk reference generator',
        'sequential ticket ids', 'ticket number prefix', 'bulk ticket number generator', 'ticket number vs reference number']
    }
