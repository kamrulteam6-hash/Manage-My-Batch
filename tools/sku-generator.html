<body data-root="../">

<section class="hero" id="hero"></section>

<section id="toolApp">
<div class="wrap">
<div class="tool-grid">

  <form class="card card-pad" id="cfg" autocomplete="off">
    <div class="panel-title"><span class="ico" id="icoGear"></span>SKU Structure</div>

    <div class="field">
      <label>Mode</label>
      <div class="seg" id="mode">
        <button type="button" class="on" data-m="single">Single product</button>
        <button type="button" data-m="matrix">Variant matrix</button>
      </div>
      <div class="hint" id="modeHint">Build one SKU from fixed attributes.</div>
    </div>

    <div class="field">
      <label for="segments">Segments — one per line</label>
      <textarea id="segments" style="min-height:130px">TSH: T-Shirt
BLK: Black
M: Medium</textarea>
      <div class="hint">Format <code>CODE: Meaning</code>. The code becomes part of the SKU; the meaning is only a note for you.</div>
    </div>

    <div id="matrixFields" hidden>
      <div class="field">
        <label for="base">Base code (product)</label>
        <input type="text" id="base" value="TSH" placeholder="TSH">
      </div>
      <div class="field">
        <label for="axis1">Variant axis 1 — e.g. colour</label>
        <textarea id="axis1" style="min-height:80px">BLK: Black
WHT: White
NVY: Navy</textarea>
      </div>
      <div class="field">
        <label for="axis2">Variant axis 2 — e.g. size <span style="font-weight:400;color:var(--muted)">(optional)</span></label>
        <textarea id="axis2" style="min-height:80px">S: Small
M: Medium
L: Large
XL: Extra large</textarea>
      </div>
    </div>

    <div class="divider"></div>

    <div class="row">
      <div class="field">
        <label for="sep">Separator</label>
        <select id="sep">
          <option value="-" selected>Hyphen (-)</option>
          <option value="">None</option>
          <option value="_">Underscore (_)</option>
          <option value=".">Dot (.)</option>
        </select>
      </div>
      <div class="field">
        <label for="seqLen">Trailing sequence</label>
        <select id="seqLen">
          <option value="0" selected>None</option>
          <option value="2">2 digits</option>
          <option value="3">3 digits</option>
          <option value="4">4 digits</option>
        </select>
      </div>
    </div>

    <fieldset class="field">
      <legend class="label">Options</legend>
      <div class="check-list">
        <label class="check on"><input type="checkbox" id="optUpper" checked><span><span class="t">Uppercase</span><span class="d">Avoids case-sensitivity bugs between systems.</span></span></label>
        <label class="check"><input type="checkbox" id="optNoVowel"><span><span class="t">Strip vowels from generated codes</span><span class="d">Shortens auto-derived codes: <code>BLACK → BLCK</code>.</span></span></label>
        <label class="check on"><input type="checkbox" id="optSafe" checked><span><span class="t">Remove unsafe characters</span><span class="d">Strips spaces, slashes and punctuation that break CSV imports and URLs.</span></span></label>
      </div>
    </fieldset>

    <div class="field">
      <label for="preview">Preview</label>
      <div class="seq-preview" id="preview">TSH-BLK-M</div>
    </div>

    <div class="out-actions">
      <button type="submit" class="btn btn-primary btn-block"><span id="icoBolt"></span> Generate SKUs</button>
    </div>
  </form>

  <div class="card card-pad">
    <div class="panel-title"><span class="ico" id="icoSpark"></span>Generated SKUs<span class="spacer"></span>
      <span class="result-pill" id="pill"></span></div>

    <div class="tabs" id="tabs">
      <button type="button" class="on" data-tab="results">Results</button>
      <button type="button" data-tab="export">Export</button>
      <button type="button" data-tab="checks">Validation</button>
      <button type="button" data-tab="guide">SKU design</button>
    </div>

    <div data-panel="results">
      <div id="primary"></div>
      <div id="more"></div>
      <div id="matrixTable" style="margin-top:16px;overflow-x:auto"></div>
    </div>

    <div data-panel="export" hidden>
      <div class="field">
        <label for="exportAs">Export format</label>
        <select id="exportAs">
          <option value="table">CSV with attributes</option>
          <option value="lines">Plain list</option>
          <option value="json">JSON array</option>
          <option value="sql">SQL INSERT</option>
        </select>
      </div>
      <div class="output-box">
        <div class="output-bar"><span class="fname" id="fname">skus.csv</span><span class="chip" id="meta"></span></div>
        <pre class="code" id="out"></pre>
      </div>
      <div class="out-actions">
        <button class="btn btn-primary" id="copyBtn"><span id="icoCopy"></span> Copy all</button>
        <button class="btn btn-ghost" id="dlBtn"><span id="icoDl"></span> Download</button>
      </div>
    </div>

    <div data-panel="checks" hidden><div id="checks"></div></div>
    <div data-panel="guide" hidden><div id="guide"></div></div>
  </div>

</div>
</div>
</section>

<div id="afterTool"></div>

<script src="../assets/js/site.js"></script>
<script src="../assets/js/seqid.js"></script>
<script>
(function () {
  var I = GTI, $ = GT.$, $$ = GT.$$;
  ['icoGear:gear','icoSpark:spark','icoBolt:bolt','icoCopy:copy','icoDl:download']
    .forEach(function (p) { var a = p.split(':'); document.getElementById(a[0]).innerHTML = I[a[1]]; });

  var mode = 'single', rows = [];
  var out = GT.mountOutput({ pre: '#out', fileLabel: '#fname', meta: '#meta',
    copyBtn: '#copyBtn', downloadBtn: '#dlBtn', filename: 'skus.csv', mime: 'text/csv' });

  function clean(code) {
    var s = String(code || '').trim();
    if ($('#optSafe').checked) s = s.replace(/[^A-Za-z0-9]/g, '');
    if ($('#optNoVowel').checked && s.length > 3) {
      s = s[0] + s.slice(1).replace(/[AEIOUaeiou]/g, '');
    }
    if ($('#optUpper').checked) s = s.toUpperCase();
    return s;
  }

  function parseSegs(text) {
    return GT.lines(text).map(function (l) {
      var i = l.indexOf(':');
      if (i === -1) return { code: clean(l), label: l.trim() };
      return { code: clean(l.slice(0, i)), label: l.slice(i + 1).trim() };
    }).filter(function (s) { return s.code; });
  }

  function build() {
    var sep = $('#sep').value;
    var seqLen = parseInt($('#seqLen').value, 10) || 0;
    rows = [];

    if (mode === 'single') {
      var segs = parseSegs($('#segments').value);
      var codes = segs.map(function (s) { return s.code; });
      if (seqLen) codes.push(String(1).padStart(seqLen, '0'));
      rows.push({ sku: codes.join(sep), attrs: segs.map(function (s) { return s.label; }) });
    } else {
      var base = clean($('#base').value);
      var a1 = parseSegs($('#axis1').value);
      var a2 = parseSegs($('#axis2').value);
      var n = 1;
      var list1 = a1.length ? a1 : [{ code: '', label: '' }];
      var list2 = a2.length ? a2 : [{ code: '', label: '' }];
      list1.forEach(function (x) {
        list2.forEach(function (y) {
          var parts = [base, x.code, y.code].filter(Boolean);
          if (seqLen) parts.push(String(n).padStart(seqLen, '0'));
          rows.push({ sku: parts.join(sep), attrs: [x.label, y.label].filter(Boolean) });
          n++;
        });
      });
    }

    var skus = rows.map(function (r) { return r.sku; });

    GTSeq.renderResults({ ids: skus, primary: '#primary', more: '#more', noun: 'SKU', maxMore: 14 });
    $('#preview').textContent = skus[0] || '—';
    $('#pill').textContent = skus.length.toLocaleString() + ' SKU' + (skus.length === 1 ? '' : 's');
    $('#pill').style.background = 'var(--green-bg)'; $('#pill').style.color = 'var(--green)';

    renderMatrix();
    renderExport(skus);
    renderChecks(skus);
  }

  function renderMatrix() {
    if (mode !== 'matrix') { $('#matrixTable').innerHTML = ''; return; }
    var a1 = parseSegs($('#axis1').value), a2 = parseSegs($('#axis2').value);
    if (!a1.length || !a2.length) { $('#matrixTable').innerHTML = ''; return; }
    var base = clean($('#base').value), sep = $('#sep').value;
    $('#matrixTable').innerHTML =
      '<p class="more-label">Variant matrix</p>' +
      '<table style="border-collapse:collapse;width:100%;font-size:12.5px;font-family:var(--mono)">' +
      '<tr><th style="padding:8px;border-bottom:1px solid var(--line);text-align:left"></th>' +
      a2.map(function (y) {
        return '<th style="padding:8px;border-bottom:1px solid var(--line);text-align:left">' + GT.esc(y.code) + '</th>';
      }).join('') + '</tr>' +
      a1.map(function (x) {
        return '<tr><th style="padding:8px;border-bottom:1px solid var(--line-2);text-align:left">' + GT.esc(x.code) + '</th>' +
          a2.map(function (y) {
            return '<td style="padding:8px;border-bottom:1px solid var(--line-2);white-space:nowrap">' +
              GT.esc([base, x.code, y.code].filter(Boolean).join(sep)) + '</td>';
          }).join('') + '</tr>';
      }).join('') + '</table>';
  }

  function renderExport(skus) {
    var m = $('#exportAs').value, text, file = 'skus.csv';
    if (m === 'table') {
      text = 'sku,attributes\n' + rows.map(function (r) {
        return r.sku + ',"' + r.attrs.join(' / ').replace(/"/g, '""') + '"';
      }).join('\n');
    } else if (m === 'json') {
      text = JSON.stringify(rows.map(function (r) { return { sku: r.sku, attributes: r.attrs }; }), null, 2);
      file = 'skus.json';
    } else if (m === 'sql') {
      text = 'INSERT INTO products (sku, description) VALUES\n' + rows.map(function (r) {
        return "  ('" + r.sku + "', '" + r.attrs.join(' / ').replace(/'/g, "''") + "')";
      }).join(',\n') + ';';
      file = 'skus.sql';
    } else { text = skus.join('\n'); file = 'skus.txt'; }
    out.set(text, file);
  }

  function renderChecks(skus) {
    var c = GTSeq.validate(skus, { humanEntry: true });
    var first = skus[0] || '';
    if (first.length > 20) c.push({ s: 'warn', m: 'SKUs are ' + first.length + ' characters. Many marketplaces and label printers cap around 20 — Amazon and eBay both truncate or reject longer values.' });
    if (/[^A-Z0-9\-_.]/i.test(first)) c.push({ s: 'err', m: 'Contains characters that break CSV imports, URLs or barcode symbologies. Enable “Remove unsafe characters”.' });
    if (/^\d/.test(first)) c.push({ s: 'warn', m: 'Starting with a digit makes spreadsheets treat the SKU as a number, stripping leading zeros. Begin with a letter.' });
    if (mode === 'matrix' && skus.length > 200) c.push({ s: 'warn', m: skus.length + ' variants is a large matrix. Check you actually stock every combination before importing.' });
    if (parseInt($('#seqLen').value, 10) > 0) c.push({ s: 'warn', m: 'A trailing sequence makes SKUs unique but meaningless — you lose the ability to read a SKU and know what it is. Only add it if attribute codes alone can collide.' });
    GTSeq.renderChecks('#checks', c);
  }

  $('#guide').innerHTML = [
    ['A SKU is for humans, a barcode is for machines', 'The whole value of a SKU is that a warehouse picker can glance at <code>TSH-BLK-M</code> and know it is a medium black t-shirt. If yours needs a lookup table to interpret, you have built a slower barcode.'],
    ['Structure it broad to narrow', 'Category, then product, then variant attributes, then size last. This makes SKUs sort into a genuinely useful order in any spreadsheet — all the black t-shirts group together, sizes ascending within them.'],
    ['Never encode price or supplier', 'Both change. A SKU is a permanent identifier for a stocked item; when the price changes you would have to reprint every label and break every historical sales record.'],
    ['Keep codes fixed width where you can', 'Three characters per segment sorts predictably. <code>S</code>, <code>M</code>, <code>L</code>, <code>XL</code> is the common exception — accept that sizes sort alphabetically, or use <code>01</code>–<code>05</code> if ordering matters more than readability.'],
    ['Start with a letter', 'A SKU beginning with a digit gets treated as a number by Excel and Google Sheets, which strips leading zeros and occasionally converts to scientific notation. This corrupts more product imports than any other single cause.'],
    ['One SKU per stocked variant', 'If you count it separately in stock, it needs its own SKU. Size and colour almost always warrant separate SKUs; packaging changes that do not affect picking usually do not.']
  ].map(function (x) {
    return '<div style="margin-bottom:16px"><h4 style="font-size:14.5px;margin-bottom:6px">' + x[0] + '</h4>' +
      '<p style="color:var(--muted);font-size:13.8px">' + x[1] + '</p></div>';
  }).join('');

  $('#mode').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    $$('#mode button').forEach(function (x) { x.classList.toggle('on', x === b); });
    mode = b.getAttribute('data-m');
    $('#matrixFields').hidden = mode !== 'matrix';
    $('#segments').closest('.field').hidden = mode === 'matrix';
    $('#modeHint').textContent = mode === 'matrix'
      ? 'Generate every combination of two variant axes — the full size/colour grid.'
      : 'Build one SKU from fixed attributes.';
    build();
  });

  GTSeq.bindCopy('#primary', function () { return rows.map(function (r) { return r.sku; }); });
  GTSeq.bindCopy('#more', function () { return rows.map(function (r) { return r.sku; }); });

  $('#tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    $$('#tabs button').forEach(function (x) { x.classList.toggle('on', x === b); });
    $$('[data-panel]').forEach(function (p) { p.hidden = p.getAttribute('data-panel') !== b.getAttribute('data-tab'); });
  });
  $('#cfg').addEventListener('submit', function (e) { e.preventDefault(); build(); GT.toast('SKUs generated'); });
  $('#cfg').addEventListener('input', build);
  $('#cfg').addEventListener('change', build);
  $('#exportAs').addEventListener('change', build);

  build();

  GT.page({
    slug: 'sku-generator',
    lede: 'Build SKUs a warehouse picker can actually read — structured from your own attribute codes, with one-click generation of the full variant matrix.',
    steps: [
      { icon: 'gear', title: 'Define your segments', text: 'Category, product, colour, size — each as a short code with a meaning you can refer back to.' },
      { icon: 'box', title: 'Generate the matrix', text: 'Two variant axes produce every combination in a readable grid.' },
      { icon: 'copy', title: 'Export to your store', text: 'CSV with attributes imports straight into Shopify, WooCommerce or a spreadsheet.' }
    ],
    guideTitle: 'What separates a good SKU from a random string',
    guide:
      '<p style="color:var(--muted)">A SKU is an internal identifier you control, unlike a barcode number which must be globally unique and purchased. That freedom is the point: you can make it <em>mean</em> something. <code>TSH-BLK-M</code> tells a picker what to grab without opening a system; <code>SKU-849271</code> tells them nothing.</p>' +
      '<div class="grid g2" style="margin-top:18px">' +
      '<div><h4 style="font-size:14.5px;margin-bottom:8px">A structure that scales</h4><p style="color:var(--muted);font-size:13.8px">Order segments from broad to narrow — category, product, colour, size. This makes an alphabetical sort genuinely useful: everything in a category groups together, then by product, then by variant.</p>' +
      '<p style="color:var(--muted);font-size:13.8px;margin-top:10px">Keep each segment a fixed width where you can. Mixed widths make columns ragged and sorting unpredictable.</p></div>' +
      '<div><h4 style="font-size:14.5px;margin-bottom:8px">Things that never belong in a SKU</h4><ul style="color:var(--muted);font-size:13.8px;padding-left:18px;margin:0"><li>Price — it changes, and the SKU cannot.</li><li>Supplier — you may switch or dual-source.</li><li>Season or year, unless you genuinely retire the item annually.</li><li>Stock location — the same item moves between bins.</li><li>Spaces, slashes or accents — they break CSV imports and URLs.</li></ul></div></div>' +
      '<div class="note note-warn" style="margin-top:18px">' + GTI.warn + '<span><strong>Never start a SKU with a digit.</strong> Excel and Google Sheets treat it as a number, strip leading zeros and sometimes convert to scientific notation. A SKU of <code>0012345</code> arrives at your supplier as <code>12345</code>, and this quietly corrupts more product imports than anything else on this list.</span></div>' +
      '<div class="note note-info" style="margin-top:12px">' + GTI.info + '<span>A SKU is not a barcode. If you sell through retail or major marketplaces you will also need a real GTIN from a GS1 prefix — see the <a href="/tools/barcode-number-generator">barcode number generator</a> for how that differs.</span></div>',
    related: ['barcode-number-generator', 'product-code-generator', 'coupon-code-generator'],
faqs: [
      { q: 'What does SKU stand for?', a: 'SKU stands for Stock Keeping Unit.' },
      { q: 'Is a SKU the same as a barcode?', a: 'No. A SKU is an internal inventory identifier. A barcode is a machine-readable representation of data and may encode a SKU or a standardized product number.' },
      { q: 'Is a SKU the same as UPC or EAN?', a: 'No. SKUs are created internally by the seller. UPC/EAN values are part of standardized GS1 product identification.' },
      { q: 'Should every product variant have a unique SKU?', a: 'Yes, when variants are tracked as separate inventory items. Each color/size combination should have its own SKU.' },
      { q: 'How long should a SKU be?', a: 'Keep it as short as practical. Shopify recommends concise SKUs and suggests no more than about 16 characters as a best-practice target, while platform limits vary.' },
      { q: 'Should SKUs contain spaces?', a: 'Avoid spaces and problematic special characters when possible because they can create search and integration issues.' },
      { q: 'Can I generate all color and size combinations?', a: 'Yes. Use the variant matrix mode to create a SKU for every combination of the selected variant axes.' }
    ],
    seo: {
      title: 'SKU Generator – Create Product and Variant Codes That Scale',
      lead: 'Use the SKU Generator above to create readable Stock Keeping Unit codes for individual products or complete variant combinations.',
      blocks: [
        { html: '<p>For one item, define the segments you want to use. For a product with color and size variants, enter the base product code and each variant axis. The tool can generate every combination automatically.</p>' +
            '<p>For example: Product T-Shirt, Color Black, Size Medium → SKU <code>TSH-BLK-M</code>.</p>' +
            '<p>Turn on uppercase formatting for consistency, strip vowels when you want shorter auto-derived codes, remove unsafe punctuation and add a trailing sequence when necessary for uniqueness.</p>' +
            '<p>The goal is not to create a clever code. A good SKU should help people and software identify the exact inventory item without guessing.</p>' },
        { h: 'What Is a SKU?',
          html: '<p>SKU stands for Stock Keeping Unit.</p>' +
            '<p>It is an internal code created by a business to identify an inventory item.</p><p>A SKU can represent:</p>',
          list: ['one product', 'one size', 'one color', 'one pack size', 'one material', 'one model variation'],
          after: '<p>For example, a black medium T-shirt and a white medium T-shirt should normally have different SKUs if they are tracked as separate inventory variants.</p>' +
            '<p>Shopify recommends assigning unique SKUs to products and variants so inventory can be managed accurately.</p>' +
            '<p>SKUs are business-controlled identifiers.</p>' +
            '<p>Unlike GTINs, UPCs or EANs, they are not assigned from a global GS1 numbering system.</p>' },
        { h: 'How to Use This SKU Generator',
          html: '<p>Choose the mode.</p><p><strong>Single product</strong> — enter the SKU segments you want to combine.</p><p>For example:</p>' +
            '<pre class="code">TSH: T-Shirt\nBLK: Black\nM: Medium</pre><p>The generated SKU becomes:</p><pre class="code">TSH-BLK-M</pre>' +
            '<p><strong>Variant matrix</strong> — enter a base product code, then one or two variant axes.</p><p>Example:</p>' +
            '<pre class="code">Colors: BLK: Black, WHT: White\nSizes: S: Small, M: Medium, L: Large</pre>' +
            '<p>The generator creates every color/size combination.</p>' +
            '<p>Export the results and assign each code to the matching product variant in your inventory or ecommerce platform.</p>' },
        { h: 'SKU vs UPC',
          html: '<p>A SKU is internal.</p><p>A UPC is a standardized retail barcode identifier used within the GS1 system.</p>' +
            '<p>You create your own SKU.</p><p>A legitimate retail GTIN/UPC is assigned according to GS1 rules.</p><p>Example:</p>' +
            '<pre class="code">SKU: TSH-BLK-M\nUPC: a numeric GS1 identification value assigned to the trade item</pre>' +
            '<p>The two can coexist.</p><p>A warehouse picker may recognize the readable SKU.</p>' +
            '<p>A retail scanner may use the UPC barcode.</p>' +
            '<p>Do not create a random 12-digit number and assume it is a valid retail UPC assigned to your company.</p>' +
            '<p>Use the <a href="/tools/barcode-number-generator">Barcode Number Generator</a> only for structural testing unless you have the appropriate GS1 company prefix or assigned numbers.</p>' },
        { h: 'SKU vs Product Code',
          html: '<p>The terms can overlap.</p>' +
            '<p>Some businesses use "product code," "item code" and "SKU" interchangeably.</p><p>A useful distinction is:</p>' +
            '<p><strong>Product code</strong> — identifies the model or base product.</p>' +
            '<p><strong>SKU</strong> — identifies the exact stock-tracked sellable variant.</p><p>Example:</p>' +
            '<pre class="code">Product: Classic T-Shirt\nProduct code: TSH100\nVariant SKUs: TSH100-BLK-S, TSH100-BLK-M, TSH100-WHT-M</pre>' +
            '<p>If your catalog has no variants, one product code and one SKU may be the same value.</p>' +
            '<p>Use whatever terminology your inventory platform uses consistently.</p>' },
        { h: 'Every Variant Should Have Its Own SKU',
          html: '<p>If size, color or another attribute creates separately tracked inventory, each combination needs its own identifier.</p>' +
            '<p>Suppose one product has 3 colors and 4 sizes.</p><p>That creates <code>3 × 4 = 12</code> inventory variants.</p>' +
            '<p>Each should have a unique SKU.</p><p>Otherwise stock counts become ambiguous.</p>' +
            '<p>You cannot reliably answer "How many black medium shirts remain?" if all colors and sizes share <code>TSH-001</code>.</p>' +
            '<p>Variant-level SKUs support accurate:</p>',
