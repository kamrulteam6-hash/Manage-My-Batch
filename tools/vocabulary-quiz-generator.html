<body data-root="../">

<section class="hero" id="hero"></section>

<section id="toolApp">
<div class="wrap">
<div class="tool-grid">

  <form class="card card-pad" id="cfg" autocomplete="off">
    <div class="panel-title"><span class="ico" id="icoGear"></span>Word List</div>

    <div class="field">
      <label for="words">Words and definitions</label>
      <textarea id="words" style="min-height:210px">abundant: existing in large quantities
brittle: hard but easily broken
candid: honest and direct in speech
diligent: showing careful and persistent effort
elusive: difficult to find or catch
frugal: careful with money and resources
gregarious: fond of company; sociable
hinder: to make something difficult or slow
inevitable: certain to happen
lucid: clear and easy to understand</textarea>
      <div class="hint">One per line as <code>word: definition</code>. A colon, dash, tab or equals sign all work as the separator.</div>
      <div id="stats"></div>
    </div>

    <div class="divider"></div>

    <div class="field">
      <label for="type">Quiz type</label>
      <select id="type">
        <option value="mc" selected>Multiple choice — definition given, pick the word</option>
        <option value="mcRev">Multiple choice — word given, pick the definition</option>
        <option value="match">Matching columns</option>
        <option value="fill">Fill in the blank</option>
        <option value="write">Write the definition</option>
        <option value="spell">Spelling — definition given, write the word</option>
      </select>
      <div class="hint" id="typeHint"></div>
    </div>

    <div class="row">
      <div class="field" id="choicesField">
        <label for="choices">Answer choices</label>
        <select id="choices">
          <option value="3">3 options</option>
          <option value="4" selected>4 options</option>
          <option value="5">5 options</option>
        </select>
      </div>
      <div class="field">
        <label for="count">Questions</label>
        <input type="number" id="count" value="10" min="1" max="100">
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label for="title">Worksheet title</label>
        <input type="text" id="title" value="Vocabulary Quiz">
      </div>
      <div class="field">
        <label for="columns">Print columns</label>
        <select id="columns">
          <option value="1">1</option>
          <option value="2" selected>2</option>
        </select>
      </div>
    </div>

    <fieldset class="field">
      <legend class="label">Options</legend>
      <div class="check-list">
        <label class="check on"><input type="checkbox" id="optShuffle" checked><span><span class="t">Shuffle question order</span></span></label>
        <label class="check on"><input type="checkbox" id="optKey" checked><span><span class="t">Include answer key page</span></span></label>
        <label class="check"><input type="checkbox" id="optWordBank"><span><span class="t">Add a word bank</span><span class="d">Lists all words at the top — makes fill-in and spelling tasks more accessible.</span></span></label>
      </div>
    </fieldset>

    <div class="field">
      <label for="seed">Seed</label>
      <div class="row" style="grid-template-columns:minmax(0,1fr) auto;gap:8px">
        <input type="text" id="seed" value="quiz-1">
        <button type="button" class="btn btn-soft" id="newSeed"><span id="icoReset"></span></button>
      </div>
      <div class="hint">Change the seed to make a second version of the same quiz — useful for two sittings or to deter copying.</div>
    </div>

    <div class="out-actions">
      <button type="submit" class="btn btn-primary btn-block"><span id="icoBolt"></span> Generate Quiz</button>
    </div>
  </form>

  <div class="card card-pad">
    <div class="panel-title"><span class="ico" id="icoSpark"></span>Quiz<span class="spacer"></span>
      <span class="result-pill" id="pill"></span></div>

    <div class="tabs" id="tabs">
      <button type="button" class="on" data-tab="preview">Preview</button>
      <button type="button" data-tab="key">Answer key</button>
      <button type="button" data-tab="guide">Teaching notes</button>
    </div>

    <div data-panel="preview">
      <div id="preview"></div>
      <div class="out-actions" style="margin-top:16px">
        <button type="button" class="btn btn-primary" id="printBtn"><span id="icoFile"></span> Print / PDF</button>
        <button type="button" class="btn btn-soft" id="regen"><span id="icoReset2"></span> New version</button>
      </div>
      <div id="checks"></div>
    </div>

    <div data-panel="key" hidden><div id="key"></div></div>
    <div data-panel="guide" hidden><div id="guide"></div></div>
  </div>

</div>
</div>
</section>

<div id="afterTool"></div>

<script src="../assets/js/site.js"></script>
<script src="../assets/js/worksheet.js"></script>
<script>
(function () {
  var I = GTI, $ = GT.$, $$ = GT.$$, W = GTWorksheet;
  ['icoGear:gear','icoSpark:spark','icoBolt:bolt','icoReset:reset','icoReset2:reset','icoFile:file']
    .forEach(function (p) { var a = p.split(':'); document.getElementById(a[0]).innerHTML = I[a[1]]; });

  var HINTS = {
    mc: 'The definition is the question; students choose the correct word. Best for recognition.',
    mcRev: 'The word is the question; students choose the correct definition. Slightly easier.',
    match: 'Two columns to join with lines. Fast to mark, good for a starter.',
    fill: 'A sentence with the word removed. Tests use in context, not just recall.',
    write: 'Open response — students write the definition in their own words.',
    spell: 'Definition given, word written out. Combines meaning and spelling.'
  };

  var pairs = [], items = [], meta = {};

  function parsePairs() {
    var out = [], dup = {}, dupes = 0;
    GT.lines($('#words').value).forEach(function (l) {
      var m = l.match(/^(.*?)\s*(?::|—|–|-{1,2}|=|\t)\s*(.+)$/);
      var word, def;
      if (m) { word = m[1].trim(); def = m[2].trim(); }
      else { word = l.trim(); def = ''; }
      if (!word) return;
      var k = word.toLowerCase();
      if (dup[k]) { dupes++; return; }
      dup[k] = 1;
      out.push({ word: word, def: def });
    });
    return { pairs: out, dupes: dupes };
  }

  function build() {
    var parsed = parsePairs();
    pairs = parsed.pairs;

    $('#stats').innerHTML = '<div class="note ' + (pairs.length ? 'note-ok' : 'note-warn') + '" style="margin-top:10px">' +
      (pairs.length ? I.check : I.warn) + '<span>' + pairs.length + ' word' + (pairs.length === 1 ? '' : 's') +
      (parsed.dupes ? ' · ' + parsed.dupes + ' duplicate removed' : '') +
      ' · ' + pairs.filter(function (p) { return p.def; }).length + ' with definitions</span></div>';

    var type = $('#type').value;
    $('#typeHint').textContent = HINTS[type];
    $('#choicesField').hidden = (type !== 'mc' && type !== 'mcRev');

    if (!pairs.length) {
      $('#preview').innerHTML = '<div class="empty">Add some words to begin.</div>';
      $('#pill').textContent = 'empty';
      $('#key').innerHTML = '';
      return;
    }

    var rand = W.rng($('#seed').value);
    var n = Math.max(1, Math.min(pairs.length, parseInt($('#count').value, 10) || 1));
    var selected = ($('#optShuffle').checked ? rand.shuffle(pairs) : pairs).slice(0, n);
    var nChoices = parseInt($('#choices').value, 10) || 4;

    items = [];
    if (type === 'match') {
      /* Matching is one block, not numbered items. */
      var left = selected;
      var right = rand.shuffle(selected);
      meta.matchRight = right;
      items = left.map(function (p, i) {
        var letter = String.fromCharCode(65 + right.indexOf(p));
        return {
          html: '<strong>' + GT.esc(p.word) + '</strong> <span style="color:#94a3b8">' +
            '……………</span>',
          answer: GT.esc(p.word) + ' = ' + letter
        };
      });
    } else {
      selected.forEach(function (p) {
        if (type === 'mc' || type === 'mcRev') {
          var distractors = rand.shuffle(pairs.filter(function (x) { return x.word !== p.word; })).slice(0, nChoices - 1);
          var opts = rand.shuffle(distractors.concat([p]));
          var correctIdx = opts.indexOf(p);
          var stem = type === 'mc' ? GT.esc(p.def || '(no definition)') : '<strong>' + GT.esc(p.word) + '</strong>';
          var body = opts.map(function (o, i) {
            return '<div style="margin:3px 0 0 2px">' +
              '<span style="display:inline-block;width:20px;font-weight:600">' + String.fromCharCode(97 + i) + ')</span> ' +
              GT.esc(type === 'mc' ? o.word : (o.def || o.word)) + '</div>';
          }).join('');
          items.push({
            html: stem + body,
            answer: String.fromCharCode(97 + correctIdx) + ') ' + GT.esc(type === 'mc' ? p.word : (p.def || p.word))
          });
        } else if (type === 'fill') {
          var blank = '<span style="display:inline-block;min-width:110px;border-bottom:1.5px solid #94a3b8">&nbsp;</span>';
          items.push({
            html: 'Complete the sentence: ' + blank + ' — ' + GT.esc(p.def || '(no definition)'),
            answer: GT.esc(p.word)
          });
        } else if (type === 'spell') {
          items.push({
            html: GT.esc(p.def || '(no definition)') +
              '<div style="margin-top:8px;border-bottom:1.5px solid #94a3b8;height:20px"></div>',
            answer: GT.esc(p.word)
          });
        } else {
          items.push({
            html: '<strong>' + GT.esc(p.word) + '</strong>' +
              '<div style="margin-top:6px;border-bottom:1px dotted #cbd5e1;height:18px"></div>' +
              '<div style="border-bottom:1px dotted #cbd5e1;height:18px"></div>',
            answer: GT.esc(p.def || '—')
          });
        }
      });
    }

    renderPreview(type);
    W.answerKeyPreview('#key', items);
    renderChecks(type, n);

    $('#pill').textContent = items.length + ' question' + (items.length === 1 ? '' : 's');
    $('#pill').style.background = 'var(--green-bg)'; $('#pill').style.color = 'var(--green)';
  }

  function wordBankHtml() {
    if (!$('#optWordBank').checked) return '';
    var rand = W.rng($('#seed').value + '-bank');
    return '<div style="border:1.5px solid #cbd5e1;border-radius:8px;padding:10px 12px;margin-bottom:14px">' +
      '<div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#64748b;margin-bottom:6px">Word bank</div>' +
      '<div style="font-size:13.5px;line-height:1.8">' +
      rand.shuffle(pairs).map(function (p) { return GT.esc(p.word); }).join(' &nbsp;·&nbsp; ') + '</div></div>';
  }

  function matchColumnsHtml() {
    var right = meta.matchRight || [];
    return '<div style="display:grid;grid-template-columns:1fr 1fr;gap:26px;font-size:14px">' +
      '<div>' + items.map(function (it, i) {
        return '<div style="margin-bottom:9px"><span style="font-weight:700;color:#334155">' + (i + 1) + '.</span> ' +
          it.html + '</div>';
      }).join('') + '</div>' +
      '<div>' + right.map(function (p, i) {
        return '<div style="margin-bottom:9px"><span style="font-weight:700;color:#334155">' +
          String.fromCharCode(65 + i) + '.</span> ' + GT.esc(p.def || p.word) + '</div>';
      }).join('') + '</div></div>';
  }

  function instructions(type) {
    return {
      mc: 'Read each definition and circle the letter of the correct word.',
      mcRev: 'Read each word and circle the letter of the correct definition.',
      match: 'Draw a line from each word on the left to its definition on the right.',
      fill: 'Write the word that matches each definition in the space provided.',
      write: 'Write a definition for each word in your own words.',
      spell: 'Read each definition and write the correct word on the line.'
    }[type];
  }

  function renderPreview(type) {
    if (type === 'match') {
      $('#preview').innerHTML = '<div style="border:1px solid var(--line);border-radius:12px;padding:18px;background:#fff">' +
        '<div style="font-weight:700;font-size:15px;margin-bottom:4px">' + GT.esc($('#title').value) + '</div>' +
        '<div style="font-size:13px;font-style:italic;color:var(--ink-2);margin-bottom:14px">' + instructions(type) + '</div>' +
        wordBankHtml() + matchColumnsHtml() + '</div>';
      return;
    }
    W.preview('#preview', {
      title: $('#title').value,
      instructions: instructions(type),
      items: items,
      previewColumns: parseInt($('#columns').value, 10) || 2
    });
    if ($('#optWordBank').checked) {
      var host = $('#preview > div');
      host.insertAdjacentHTML('afterbegin', wordBankHtml());
    }
  }

  function renderChecks(type, n) {
    var c = [];
    var noDef = pairs.filter(function (p) { return !p.def; }).length;
    if (noDef) c.push(['warn', noDef + ' word' + (noDef === 1 ? ' has' : 's have') +
      ' no definition. Add them as <code>word: definition</code> — multiple choice and matching need both halves.']);
    if ((type === 'mc' || type === 'mcRev') && pairs.length < parseInt($('#choices').value, 10)) {
      c.push(['err', 'Not enough words to build ' + $('#choices').value +
        ' answer options. Add more words, or reduce the number of choices.']);
    }
    if (n < parseInt($('#count').value, 10)) {
      c.push(['warn', 'Only ' + n + ' questions could be made — the word list has ' + pairs.length + ' entries.']);
    }
    if (type === 'match' && n > 12) {
      c.push(['warn', 'Matching exercises get hard to lay out beyond about 12 pairs. Consider splitting into two blocks.']);
    }
    if (!c.length) c.push(['ok', 'Quiz ready. Change the seed to produce a second version with different ordering and distractors.']);
    $('#checks').innerHTML = c.map(function (x) {
      return '<div class="note ' + (x[0] === 'ok' ? 'note-ok' : x[0] === 'warn' ? 'note-warn' : 'note-err') + '">' +
        (x[0] === 'ok' ? I.check : I.warn) + '<span>' + x[1] + '</span></div>';
    }).join('');
  }

  $('#printBtn').addEventListener('click', function () {
    var type = $('#type').value;
    if (type === 'match') {
      /* Matching needs a custom two-column body rather than the numbered list. */
      var w = window.open('', '_blank');
      if (!w) { GT.toast('Allow pop-ups to print'); return; }
      w.document.write('<!DOCTYPE html><html><head><meta charset="utf-8"><title>' + GT.esc($('#title').value) +
        '</title><style>body{font-family:Arial,Helvetica,sans-serif;color:#0f172a;margin:14mm}' +
        'h1{font-size:19px;margin:0 0 8px}.hdr{display:flex;gap:26px;border-bottom:1.5px solid #0f172a;' +
        'padding-bottom:9px;margin-bottom:14px;font-size:13px}.hdr .rule{display:inline-block;width:110px;' +
        'border-bottom:1px solid #94a3b8}.inst{font-size:13px;font-style:italic;margin:0 0 16px}' +
        '.pagebreak{page-break-before:always}@media print{body{margin:12mm}.noprint{display:none}}</style></head><body>' +
        '<h1>' + GT.esc($('#title').value) + '</h1>' +
        '<div class="hdr"><span>Name: <span class="rule"></span></span><span>Date: <span class="rule"></span></span>' +
        '<span>Score: <span class="rule"></span></span></div>' +
        '<p class="inst">' + instructions('match') + '</p>' + wordBankHtml() + matchColumnsHtml() +
        ($('#optKey').checked ? '<div class="pagebreak"></div><h1>Answer Key</h1><div style="columns:3;font-size:13px;line-height:1.9">' +
          items.map(function (it, i) { return '<div>' + (i + 1) + '. ' + it.answer + '</div>'; }).join('') + '</div>' : '') +
        '<script>window.onload=function(){window.print()}<' + '/script></body></html>');
      w.document.close();
      return;
    }
    W.print({
      title: $('#title').value,
      instructions: instructions(type),
      items: items,
      columns: parseInt($('#columns').value, 10) || 2,
      answerKey: $('#optKey').checked,
      answerColumns: 4
    });
  });

  $('#newSeed').addEventListener('click', function () { $('#seed').value = Math.random().toString(36).slice(2, 8); build(); });
  $('#regen').addEventListener('click', function () { $('#seed').value = Math.random().toString(36).slice(2, 8); build(); GT.toast('New version generated'); });

  $('#guide').innerHTML = [
    ['Recognition and recall are different skills', 'Multiple choice tests recognition — the answer is on the page and students eliminate. Spelling and write-the-definition test recall, which is substantially harder and a much better predictor of whether the vocabulary has actually stuck. Use multiple choice early in a unit and recall tasks later.'],
    ['Distractors do the teaching', 'In a multiple-choice question, the wrong options determine the difficulty. This tool draws distractors from your own word list, so they are always plausible words from the same topic rather than obvious throwaways.'],
    ['Two versions deter copying', 'Changing the seed reorders the questions and reshuffles the answer options, so neighbouring students see different letters for the same answer. Print version A and version B from the same word list.'],
    ['A word bank changes the task', 'Adding a word bank turns recall into recognition. That is the right scaffold for younger students or a first attempt, and the wrong one if you are assessing whether the words are known.'],
    ['Matching is fast but shallow', 'It marks quickly and works well as a starter, but process of elimination means the last few pairs come free. Keep matching blocks short — under about 12 pairs — so elimination does not dominate.'],
    ['Fill-in-the-blank tests use, not just meaning', 'Because the word has to fit a sentence grammatically as well as semantically, it catches students who have memorised a definition without understanding how the word behaves.']
  ].map(function (x) {
    return '<div style="margin-bottom:16px"><h4 style="font-size:14.5px;margin-bottom:6px">' + x[0] + '</h4>' +
      '<p style="color:var(--muted);font-size:13.8px">' + x[1] + '</p></div>';
  }).join('');

  $('#tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    $$('#tabs button').forEach(function (x) { x.classList.toggle('on', x === b); });
    $$('[data-panel]').forEach(function (p) { p.hidden = p.getAttribute('data-panel') !== b.getAttribute('data-tab'); });
  });
  $('#cfg').addEventListener('submit', function (e) { e.preventDefault(); build(); GT.toast('Quiz generated'); });
  $('#cfg').addEventListener('input', build);
  $('#cfg').addEventListener('change', build);

  build();

  GT.page({
    slug: 'vocabulary-quiz-generator',
    lede: 'Turn a word list into six kinds of printable quiz — with plausible distractors drawn from your own words, and an answer key generated automatically.',
    steps: [
      { icon: 'gear', title: 'Paste your word list', text: 'One per line as word: definition. Colons, dashes, tabs and equals signs all work.' },
      { icon: 'book', title: 'Choose a quiz type', text: 'Multiple choice, matching, fill-in-the-blank, spelling or open definition.' },
      { icon: 'file', title: 'Print with the key', text: 'The answer key prints on its own page, so you can hand out the front sheet.' }
    ],
    guideTitle: 'Choosing the right quiz format',
    guide:
      '<p style="color:var(--muted)">The format decides what you are actually measuring. A student can pass a multiple-choice vocabulary test by eliminating three options they know are wrong, without being able to produce the word themselves. That is not a flaw — recognition is a real stage of learning — but it is worth knowing which stage you are testing.</p>' +
      '<div class="grid g2" style="margin-top:18px">' +
      '<div><h4 style="font-size:14.5px;margin-bottom:8px">Recognition formats</h4><ul style="color:var(--muted);font-size:13.8px;padding-left:18px;margin:0"><li><strong>Multiple choice</strong> — the answer is on the page. Good early in a unit.</li><li><strong>Matching</strong> — fast to mark, but the last pairs come free by elimination.</li></ul>' +
      '<h4 style="font-size:14.5px;margin:16px 0 8px">Recall formats</h4><ul style="color:var(--muted);font-size:13.8px;padding-left:18px;margin:0"><li><strong>Spelling</strong> — definition given, word produced. Much harder.</li><li><strong>Write the definition</strong> — open response, shows real understanding.</li><li><strong>Fill in the blank</strong> — tests use in context as well as meaning.</li></ul></div>' +
      '<div><h4 style="font-size:14.5px;margin-bottom:8px">Distractors are the difficulty dial</h4><p style="color:var(--muted);font-size:13.8px">In multiple choice, the wrong answers determine how hard the question is. Options pulled from unrelated topics make the question trivial. This tool draws every distractor from your own word list, so they are always words from the same unit — which is what forces genuine discrimination rather than guessing.</p>' +
      '<p style="color:var(--muted);font-size:13.8px;margin-top:10px">Adding a word bank has the opposite effect: it converts any recall task into a recognition task. That is a useful scaffold, and a poor assessment.</p></div></div>' +
      '<div class="note note-info" style="margin-top:18px">' + GTI.info + '<span><strong>Print two versions.</strong> Changing the seed reorders questions and reshuffles the answer options, so students sitting next to each other see the correct answer under a different letter. Same word list, same difficulty, no copying.</span></div>',
    related: ['spelling-word-scramble-generator', 'random-question-picker', 'word-search-puzzle-generator'],
faqs: [
      { q: 'How do I make a vocabulary quiz from a word list?', a: 'Enter one word and definition per line, choose the quiz type and number of questions, then generate the worksheet.' },
      { q: 'What quiz types are available?', a: 'The tool supports formats such as multiple choice, matching, fill in the blank and definition questions.' },
      { q: 'Can I include an answer key?', a: 'Yes. Enable the answer-key option before generating.' },
      { q: 'Can I add a word bank?', a: 'Yes. A word bank can scaffold fill-in and matching tasks.' },
      { q: 'Can I make two different versions?', a: 'Yes. Change the seed or shuffle settings to create another version from the same vocabulary list.' },
      { q: 'Are vocabulary quizzes useful for retrieval practice?', a: 'They can be. Their value depends on question quality, low-stakes use where appropriate, feedback and how the quiz connects to instruction.' },
      { q: 'Can I print the quiz?', a: 'Yes. Generate the worksheet and use the print/PDF option.' }
    ],
    seo: {
      title: 'Vocabulary Quiz Generator – Turn a Word List Into a Printable Test',
      lead: 'Use the Vocabulary Quiz Generator above to turn your own vocabulary list into a printable quiz without writing every question and answer choice manually.',
      blocks: [
        { html: '<p>Enter each word with its definition, choose the quiz type, decide how many questions you want and generate a worksheet with an optional answer key.</p>' +
            '<p>The tool supports several useful formats, including multiple choice, matching, fill in the blank and definition-based questions.</p>' +
            '<p>You can shuffle question order, add a word bank and use a seed to create another reproducible version from the same vocabulary list.</p>' +
            '<p>That makes it useful for class review, homework, intervention, test preparation and quick low-stakes retrieval.</p>' },
        { h: 'How to Enter Vocabulary Words',
          html: '<p>Enter one word and definition per line.</p><p>For example:</p>' +
            '<pre class="code">abundant: existing in large quantities\nbrittle: hard but easily broken\ndiligent: showing careful and persistent effort</pre>' +
            '<p>The tool accepts common separators such as:</p>',
          list: ['colon', 'dash', 'tab', 'equals sign'],
          after: '<p>Keep each definition clear and specific.</p>' +
            '<p>Avoid definitions so vague that several words could reasonably match the same answer.</p>' +
            '<p>The quiz quality depends on the word-definition pairs.</p>' +
            '<p>A generator formats the assessment.</p>' +
            '<p>It cannot fix ambiguous source definitions automatically.</p>' },
        { h: 'What Is a Vocabulary Quiz Generator?',
          html: '<p>A vocabulary quiz generator converts a word list into questions.</p><p>Instead of manually creating:</p>',
          list: ['question text', 'answer options', 'matching columns', 'blanks', 'answer keys'],
          after: '<p>the tool builds the printable structure for you.</p>' +
            '<p>This is especially useful when the vocabulary changes every week.</p>' +
            '<p>A teacher can keep one master list for a topic and quickly produce different activities from it.</p>' +
            '<p>For example, the same ten words can become: Monday matching review, Wednesday fill-in-the-blank practice, Friday multiple-choice quiz.</p>' +
            '<p>The content stays consistent while the retrieval format changes.</p>' },
        { h: 'Multiple-Choice Vocabulary Quizzes',
          html: '<p>Multiple choice is useful when students need to identify the correct meaning among plausible alternatives.</p><p>Example:</p>' +
            '<p><strong>What does "frugal" mean?</strong></p>' +
            '<p>A. Careful with money and resources<br>B. Extremely noisy<br>C. Quick to become angry<br>D. Difficult to understand</p>' +
            '<p>The wrong answers are called distractors.</p>' +
            '<p>Good distractors should be plausible enough that students need real knowledge to choose correctly.</p>' +
            '<p>Poor distractors make the question too easy.</p>' +
            '<p>For example, if three choices are obviously unrelated, students may succeed through elimination without knowing the word.</p>' +
            '<p>Review automatically generated answer choices before using the quiz for important assessment.</p>' },
        { h: 'Matching Vocabulary Quizzes',
          html: '<p>Matching gives students a list of words and a list of definitions.</p><p>They connect each word to the correct meaning.</p>' +
            '<p>This format is compact and works well when many words need to be reviewed on one page.</p><p>Matching is especially useful for:</p>',
          list: ['quick checks', 'revision', 'homework', 'topic vocabulary', 'language learning'],
          after: '<p>One limitation is that students can sometimes solve later items by elimination.</p>' +
            '<p>If a student knows nine of ten definitions, the final match is automatic.</p>' +
            '<p>That is not necessarily a problem in practice work.</p>' +
            '<p>For a stronger independent measure of recall, include short-answer or fill-in formats as well.</p>' },
        { h: 'Fill-in-the-Blank Vocabulary',
          html: '<p>Fill-in-the-blank can require more active retrieval than recognition-only multiple choice.</p><p>Example:</p>' +
            '<p>"Someone who is careful with money and resources is ______." Answer: <code>frugal</code></p>' +
            '<p>A word bank makes the task easier because students choose from supplied options.</p>' +
            '<p>Without a word bank, they must retrieve the word independently.</p>' +
            '<p>Use the level of support that matches the learning stage.</p>' +
            '<p>Early practice: word bank may help.</p>' +
            '<p>Later review: remove the word bank.</p>' +
            '<p>Assessment: decide based on what knowledge you actually want to measure.</p>' +
            '<p>Scaffolding should support success without permanently doing the retrieval for the learner.</p>' },
        { h: 'Definition-to-Word Questions',
          html: '<p>Another useful format gives the definition and asks students for the word.</p><p>Example:</p>' +
            '<p><strong>Which word means "difficult to find or catch"?</strong> Answer: <code>elusive</code></p>' +
            '<p>This tests recall in the opposite direction from "What does elusive mean?"</p>' +
            '<p>Both directions matter.</p>' +
            '<p>A student may recognize the meaning when shown the word but struggle to retrieve the word when given the definition.</p>' +
            '<p>Mixing directions can reveal whether vocabulary knowledge is becoming flexible rather than remaining tied to one prompt format.</p>' },
        { h: 'Vocabulary Quizzes and Retrieval Practice',
          html: '<p>Retrieval practice involves recalling previously learned information instead of only rereading it.</p>' +
            '<p>Evidence reviewed by organizations such as the Education Endowment Foundation and the U.S. Institute of Education Sciences supports retrieval as a useful learning strategy when implemented thoughtfully.</p>' +
            '<p>A vocabulary quiz can create retrieval opportunities.</p>' +
            '<p>The important point is that the quiz should not become a high-pressure event every time.</p>' +
            '<p>Low-stakes review allows students to retrieve, check and correct knowledge.</p>' +
            '<p>After the quiz, use errors diagnostically.</p>' +
            '<p>A wrong answer tells you which word needs more teaching or another retrieval opportunity.</p>' },
        { h: 'Feedback Matters',
          html: '<p>A quiz is more useful when students find out what the correct answers are.</p>' +
            '<p>That is why the answer-key option matters.</p><p>Possible feedback routines include:</p>',
          list: ['self-marking', 'partner checking', 'teacher review', 'whole-class correction', 'targeted reteaching'],
          after: '<p>Do not simply collect the quiz and move on if the purpose is learning.</p>' +
            '<p>Students need a chance to correct incorrect retrieval.</p>' +
            '<p>For low-stakes practice, immediate or reasonably prompt feedback is often more useful than leaving errors unresolved.</p>' +
            '<p>The answer key also saves teacher time when the worksheet is used for independent practice.</p>' },
        { h: 'Use a Word Bank as Scaffolding',
          html: '<p>A word bank reduces the search space.</p>' +
            '<p>Instead of retrieving from every word the student knows, they choose from a smaller supplied set.</p><p>This can be helpful for:</p>',
          list: ['younger learners', 'English language learners', 'initial practice', 'students who need extra support'],
          after: '<p>A word bank can later be removed as knowledge becomes more secure.</p>' +
            '<p>Do not think of it as "cheating." It is a scaffold.</p>' +
            '<p>The question is whether the support matches the goal of the activity.</p>' +
            '<p>If the goal is independent recall, eventually students need practice without the bank.</p>' },
        { h: 'Create Different Quiz Versions',
          html: '<p>The seed lets you create reproducible versions.</p>' +
            '<p>Changing the seed can produce another ordering or selection from the same source list.</p><p>This is useful for:</p>',
          list: ['two class sittings', 'makeup work', 'parallel groups', 'revision version A and B', 'reducing answer copying'],
          after: '<p>Do not create different versions with unequal difficulty if the scores will be compared directly.</p>' +
            '<p>The vocabulary source and question type should remain comparable.</p>' +
            '<p>A different order is usually safer than giving one group much harder words.</p>' +
            '<p>The goal is variation, not accidental inequity.</p>' },
        { h: 'Choosing Good Vocabulary Definitions',
          html: '<p>Definitions should be:</p>',
          list: ['accurate', 'understandable', 'appropriate to the age group', 'distinct from other answers', 'concise enough for the worksheet'],
          after: '<p>Avoid dictionary wording that is more difficult than the word itself.</p>' +
            '<p>For example, teaching a simple word using several unfamiliar academic terms defeats the purpose.</p>' +
            '<p>When possible, pair direct definitions with examples, context, synonyms, non-examples.</p>' +
            '<p>The quiz may use only the short definition, but richer classroom instruction should go beyond memorizing one sentence.</p>' +
            '<p>Vocabulary knowledge grows through repeated meaningful encounters.</p>' },
        { h: 'Quiz Questions Should Match Teaching',
          html: '<p>Do not test a meaning students were never taught.</p><p>Many words have several definitions.</p>' +
            '<p>For example, <code>bank</code> can mean a financial institution or the side of a river.</p>' +
            '<p>If the lesson taught the geography meaning, make sure the quiz definition reflects that meaning.</p>' +
            '<p>Likewise, technical subjects may use words differently from everyday conversation.</p>' +
            '<p>The question bank should represent the intended curriculum context.</p>' +
            '<p>A quiz generator cannot know which sense of the word your class studied unless you provide it.</p>' },
        { h: 'Review Automatic Distractors',
          html: '<p>Automatically built multiple-choice distractors save preparation time, but they deserve a quick check.</p><p>Look for:</p>',
          list: ['two answers that could both be correct', 'obviously silly choices', 'duplicate definitions', 'clues caused by answer length', 'grammar that reveals the answer', 'repeated correct-option positions'],
          after: '<p>A generator handles the mechanics.</p><p>Teacher review protects question quality.</p>' +
            '<p>This is particularly important if the worksheet affects grades.</p>' +
            '<p>For informal retrieval practice, a less-than-perfect distractor may be harmless.</p>' +
            '<p>For formal assessment, ambiguity can undermine the result.</p>' },
        { h: 'Common Vocabulary Quiz Mistakes',
          html: '<p>Avoid these problems:</p>',
          list: ['using vague definitions', 'assuming multiple choice proves independent recall', 'leaving errors uncorrected',
                 'making distractors obviously wrong', 'testing meanings students were not taught', 'using a word bank forever instead of reducing support',
                 'creating version A and B with very different difficulty', 'squeezing long questions into cramped print columns',
                 'treating one quiz score as the complete picture of vocabulary knowledge', 'using automatic output without reviewing it'],
          after: '<p>The generator should reduce worksheet preparation, not remove the teacher’s quality check.</p>' }
      ],
      keywords: ['vocabulary quiz generator', 'printable vocabulary test maker', 'multiple choice vocabulary quiz', 'matching vocabulary worksheet',
        'fill in the blank vocabulary generator', 'vocabulary word bank scaffold', 'retrieval practice vocabulary quiz', 'vocabulary quiz answer key generator',
        'word definition quiz generator', 'vocabulary quiz seed version', 'classroom vocabulary review tool', 'printable word test generator']
    }
  });
})();
</script>
