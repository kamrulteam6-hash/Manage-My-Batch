<body data-root="../">

<section class="hero" id="hero"></section>

<section id="toolApp">
<div class="wrap">
<div class="tool-grid">

  <form class="card card-pad" id="cfg" autocomplete="off">
    <div class="panel-title"><span class="ico" id="icoGear"></span>Worksheet Settings</div>

    <div class="field">
      <label for="mode">Exercise type</label>
      <select id="mode">
        <option value="read" selected>Read the clock — write the time</option>
        <option value="draw">Draw the hands to show the time</option>
        <option value="match">Match analogue to digital</option>
        <option value="wordy">Write the time in words</option>
      </select>
      <div class="hint" id="modeHint"></div>
    </div>

    <div class="field">
      <label for="precision">Time precision</label>
      <select id="precision">
        <option value="60">O'clock only</option>
        <option value="30" selected>Half past</option>
        <option value="15">Quarter past / to</option>
        <option value="5">Five-minute intervals</option>
        <option value="1">Any minute</option>
      </select>
      <div class="hint" id="precHint"></div>
    </div>

    <div class="row">
      <div class="field">
        <label for="format">Digital format</label>
        <select id="format">
          <option value="12" selected>12-hour — 3:45</option>
          <option value="24">24-hour — 15:45</option>
        </select>
      </div>
      <div class="field">
        <label for="count">Questions</label>
        <input type="number" id="count" value="12" min="1" max="48">
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label for="size">Clock size</label>
        <select id="size">
          <option value="100">Small</option>
          <option value="130" selected>Medium</option>
          <option value="165">Large</option>
        </select>
      </div>
      <div class="field">
        <label for="columns">Print columns</label>
        <select id="columns">
          <option value="2">2</option>
          <option value="3" selected>3</option>
          <option value="4">4</option>
        </select>
      </div>
    </div>

    <fieldset class="field">
      <legend class="label">Options</legend>
      <div class="check-list">
        <label class="check on"><input type="checkbox" id="optNumbers" checked>
          <span><span class="t">Show clock numbers</span><span class="d">Turn off for a harder version with tick marks only.</span></span></label>
        <label class="check"><input type="checkbox" id="optNoHalfHour">
          <span><span class="t">Whole hours only for the hour hand</span><span class="d">Hour hand points exactly at the number — easier, but not how a real clock works.</span></span></label>
        <label class="check on"><input type="checkbox" id="optKey" checked>
          <span><span class="t">Include answer key page</span></span></label>
      </div>
    </fieldset>

    <div class="row">
      <div class="field">
        <label for="title">Worksheet title</label>
        <input type="text" id="title" value="Telling the Time">
      </div>
      <div class="field">
        <label for="seed">Seed</label>
        <div class="row" style="grid-template-columns:minmax(0,1fr) auto;gap:8px">
          <input type="text" id="seed" value="clock-1">
          <button type="button" class="btn btn-soft" id="newSeed"><span id="icoReset"></span></button>
        </div>
      </div>
    </div>

    <div class="out-actions">
      <button type="submit" class="btn btn-primary btn-block"><span id="icoBolt"></span> Generate Worksheet</button>
    </div>
  </form>

  <div class="card card-pad">
    <div class="panel-title"><span class="ico" id="icoSpark"></span>Worksheet<span class="spacer"></span>
      <span class="result-pill" id="pill"></span></div>

    <div class="tabs" id="tabs">
      <button type="button" class="on" data-tab="preview">Preview</button>
      <button type="button" data-tab="key">Answer key</button>
      <button type="button" data-tab="guide">Teaching notes</button>
    </div>

    <div data-panel="preview">
      <div id="preview"></div>
      <div class="out-actions" style="margin-top:16px">
        <button type="button" class="btn btn-primary" id="printBtn"><span id="icoFile"></span> Print / PDF</button>
        <button type="button" class="btn btn-soft" id="regen"><span id="icoReset2"></span> New times</button>
      </div>
      <div id="checks"></div>
    </div>

    <div data-panel="key" hidden><div id="key"></div></div>
    <div data-panel="guide" hidden><div id="guide"></div></div>
  </div>

<script>
(function () {
  var I = GTI, $ = GT.$, $$ = GT.$$, W = GTWorksheet;
  ['icoGear:gear','icoSpark:spark','icoBolt:bolt','icoReset:reset','icoReset2:reset','icoFile:file']
    .forEach(function (p) { var a = p.split(':'); document.getElementById(a[0]).innerHTML = I[a[1]]; });

  var MODE_HINTS = {
    read: 'A clock face is shown; the student writes the digital time.',
    draw: 'A digital time is given; the student draws the hands on a blank face.',
    match: 'Clocks and times are listed separately for the student to pair up.',
    wordy: 'The student writes the time in words — "quarter past three".'
  };
  var PREC_HINTS = {
    '60': 'Only o\'clock times. The first stage.',
    '30': 'O\'clock and half past.',
    '15': 'Adds quarter past and quarter to.',
    '5': 'Five-minute intervals — the main Year 2–3 skill.',
    '1': 'Any minute, including awkward ones like 7:23.'
  };

  var WORDS = ['twelve', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven'];
  var MIN_WORDS = { 0: "o'clock", 15: 'quarter past', 30: 'half past', 45: 'quarter to' };

  var items = [], times = [];

  function digital(h, m) {
    if ($('#format').value === '24') {
      return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
    }
    var hh = h % 12 === 0 ? 12 : h % 12;
    return hh + ':' + String(m).padStart(2, '0');
  }

  function inWords(h, m) {
    var hh = h % 12;
    var next = (hh + 1) % 12;
    if (m === 0) return WORDS[hh] + " o'clock";
    if (m === 15) return 'quarter past ' + WORDS[hh];
    if (m === 30) return 'half past ' + WORDS[hh];
    if (m === 45) return 'quarter to ' + WORDS[next];
    if (m < 30) return m + ' minutes past ' + WORDS[hh];
    return (60 - m) + ' minutes to ' + WORDS[next];
  }

  function build() {
    var mode = $('#mode').value;
    var step = parseInt($('#precision').value, 10);
    $('#modeHint').textContent = MODE_HINTS[mode];
    $('#precHint').textContent = PREC_HINTS[$('#precision').value];

    var rand = W.rng($('#seed').value);
    var n = Math.max(1, Math.min(48, parseInt($('#count').value, 10) || 1));
    var size = parseInt($('#size').value, 10);

    times = [];
    for (var i = 0; i < n; i++) {
      var h = rand.int(1, 12);
      var m = step === 60 ? 0 : rand.int(0, Math.floor(59 / step)) * step;
      if (m > 59) m = 0;
      times.push({ h: h, m: m });
    }

    var handMinute = function (t) { return $('#optNoHalfHour').checked ? 0 : t.m; };

    items = times.map(function (t) {
      var clockOpts = { size: size, numbers: $('#optNumbers').checked };

      if (mode === 'draw') {
        return {
          html: '<div style="font-weight:700;font-size:1.05em;margin-bottom:4px">' + digital(t.h, t.m) + '</div>' +
            W.clockFace(t.h, t.m, Object.assign({}, clockOpts, { showHands: false })),
          answer: digital(t.h, t.m)
        };
      }
      if (mode === 'wordy') {
        return {
          html: W.clockFace($('#optNoHalfHour').checked ? t.h : t.h, handMinute(t) === 0 && !$('#optNoHalfHour').checked ? t.m : t.m, clockOpts) +
            '<div style="border-bottom:1.5px solid #94a3b8;height:20px;margin-top:6px"></div>',
          answer: inWords(t.h, t.m)
        };
      }
      return {
        html: W.clockFace(t.h, t.m, clockOpts) +
          '<div style="border-bottom:1.5px solid #94a3b8;height:20px;margin-top:6px;max-width:110px"></div>',
        answer: digital(t.h, t.m)
      };
    });

    if (mode === 'match') {
      var shuffled = rand.shuffle(times.map(function (t, i) { return { t: t, i: i }; }));
      items = times.map(function (t, i) {
        var letter = String.fromCharCode(65 + shuffled.findIndex(function (s) { return s.i === i; }));
        return {
          html: W.clockFace(t.h, t.m, { size: size, numbers: $('#optNumbers').checked }) +
            '<div style="border-bottom:1.5px solid #94a3b8;height:18px;margin-top:6px;max-width:60px"></div>',
          answer: letter + ' — ' + digital(t.h, t.m)
        };
      });
      window.__matchList = shuffled.map(function (s) { return digital(s.t.h, s.t.m); });
    }

    renderPreview(mode);
    W.answerKeyPreview('#key', items);
    renderChecks(mode, step);

    $('#pill').textContent = items.length + ' clocks';
    $('#pill').style.background = 'var(--green-bg)'; $('#pill').style.color = 'var(--green)';
  }

  function matchBankHtml() {
    var list = window.__matchList || [];
    return '<div style="border:1.5px solid #cbd5e1;border-radius:8px;padding:10px 12px;margin-bottom:14px">' +
      '<div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#64748b;margin-bottom:6px">Times</div>' +
      '<div style="font-size:14px;line-height:1.9">' +
      list.map(function (d, i) {
        return '<span style="display:inline-block;margin-right:16px"><strong>' +
          String.fromCharCode(65 + i) + '.</strong> ' + d + '</span>';
      }).join('') + '</div></div>';
  }

  function instructions(mode) {
    return {
      read: 'Write the time shown on each clock.',
      draw: 'Draw the hour and minute hands to show each time.',
      match: 'Write the letter of the matching time under each clock.',
      wordy: 'Write each time in words.'
    }[mode];
  }

  function renderPreview(mode) {
    W.preview('#preview', {
      title: $('#title').value,
      instructions: instructions(mode),
      items: items,
      previewColumns: parseInt($('#columns').value, 10) || 3
    });
    if (mode === 'match') $('#preview > div').insertAdjacentHTML('afterbegin', matchBankHtml());
  }

  function renderChecks(mode, step) {
    var c = [];
    if (mode === 'draw' && $('#optNoHalfHour').checked) {
      c.push(['warn', 'With whole-hour hand positions, a drawn clock showing half past three would have the hour hand pointing straight at 3 — which is not what a real clock does. Turn this off for anything past the o\'clock stage.']);
    } else if ($('#optNoHalfHour').checked) {
      c.push(['warn', 'The hour hand points exactly at the hour regardless of minutes. This is a simplification — real clocks move the hour hand gradually, and children who learn the simplified version often misread real clocks later.']);
    } else {
      c.push(['ok', 'The hour hand moves gradually between numbers, exactly as a real clock does.']);
    }
    if (step === 1) c.push(['warn', 'Any-minute precision includes times like 7:23 that have no simple wording. Best for digital reading rather than "past and to" language.']);
    if (mode === 'wordy' && step === 1) c.push(['warn', 'Writing awkward minute times in words is very demanding. Consider five-minute precision for this exercise type.']);
    if (!$('#optNumbers').checked) c.push(['warn', 'Numbers are hidden — a significantly harder version. Make sure students are secure with numbered faces first.']);
    if (mode === 'match' && items.length > 12) c.push(['warn', 'Matching more than about 12 clocks gets unwieldy on one page.']);
    $('#checks').innerHTML = c.map(function (x) {
      return '<div class="note ' + (x[0] === 'ok' ? 'note-ok' : 'note-warn') + '">' +
        (x[0] === 'ok' ? I.check : I.warn) + '<span>' + x[1] + '</span></div>';
    }).join('');
  }

  $('#printBtn').addEventListener('click', function () {
    var mode = $('#mode').value;
    var opts = {
      title: $('#title').value,
      instructions: instructions(mode),
      items: items,
      columns: parseInt($('#columns').value, 10) || 3,
      answerKey: $('#optKey').checked,
      answerColumns: 4
    };
    if (mode === 'match') {
      opts.items = items.slice();
      opts.items[0] = { html: items[0].html, answer: items[0].answer };
    }
    W.print(opts);
  });
  $('#newSeed').addEventListener('click', function () { $('#seed').value = Math.random().toString(36).slice(2, 8); build(); });
  $('#regen').addEventListener('click', function () { $('#seed').value = Math.random().toString(36).slice(2, 8); build(); GT.toast('New times'); });

  $('#guide').innerHTML = [
    ['The hour hand is the part children get wrong', 'On a real clock at half past three, the hour hand sits <em>between</em> 3 and 4 — not on the 3. Worksheets that draw it pointing exactly at the hour teach a habit that breaks the moment a child looks at an actual clock. This tool moves the hour hand proportionally by default, and warns you if you switch that off.'],
    ['Follow the precision progression', 'O\'clock, then half past, then quarter past and quarter to, then five-minute intervals, then any minute. Each stage depends on the one before, and jumping to five-minute intervals before "past and to" language is secure is a common cause of stalling.'],
    ['Reading and drawing are different skills', 'Reading a clock is recognition; drawing the hands is production, and it is considerably harder. Children who can read the time confidently often place the hour hand wrongly when asked to draw it — which is exactly why the drawing exercise is diagnostically useful.'],
    ['Past and to is language, not maths', 'Quarter to four requires understanding that you are counting backwards towards the <em>next</em> hour. That is a linguistic hurdle as much as a numerical one, which is why "write the time in words" often reveals gaps that digital reading does not.'],
    ['Hide the numbers only when secure', 'A face with tick marks and no numerals forces genuine understanding of the twelve positions. It is a good extension task and a poor introduction.'],
    ['Twelve-hour first', 'Twenty-four-hour time adds an arithmetic step on top of the reading. Introduce it once analogue reading is fluent, not alongside it.']
  ].map(function (x) {
    return '<div style="margin-bottom:16px"><h4 style="font-size:14.5px;margin-bottom:6px">' + x[0] + '</h4>' +
      '<p style="color:var(--muted);font-size:13.8px">' + x[1] + '</p></div>';
  }).join('');

  $('#tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    $$('#tabs button').forEach(function (x) { x.classList.toggle('on', x === b); });
    $$('[data-panel]').forEach(function (p) { p.hidden = p.getAttribute('data-panel') !== b.getAttribute('data-tab'); });
  });
  $('#cfg').addEventListener('submit', function (e) { e.preventDefault(); build(); GT.toast('Worksheet generated'); });
  $('#cfg').addEventListener('input', build);
  $('#cfg').addEventListener('change', build);

  build();

  GT.page({
    slug: 'clock-reading-worksheet-generator',
    lede: 'Printable analogue clock worksheets with hour hands that move like real clocks do — read, draw, match or write in words, at five levels of precision.',
    steps: [
      { icon: 'gear', title: 'Choose the exercise', text: 'Read the clock, draw the hands, match to digital, or write in words.' },
      { icon: 'clock', title: 'Set the precision', text: "O'clock through to any minute — follow the teaching progression." },
      { icon: 'file', title: 'Print with the key', text: 'Crisp vector clock faces that stay sharp at any size.' }
    ],
    guideTitle: 'The detail most clock worksheets get wrong',
    guide:
      '<p style="color:var(--muted)">At half past three, where does the hour hand point? A great many printable worksheets draw it pointing directly at the 3. On a real clock it sits halfway between the 3 and the 4, because the hour hand moves continuously as the minutes pass.</p>' +
      '<p style="color:var(--muted);margin-top:12px">Children taught with the simplified version learn a rule that fails them on the classroom wall clock. Worse, when they later meet a correctly drawn clock showing 3:30, many read it as half past four, because the hour hand is closer to the 4 than they expect.</p>' +
      '<p style="color:var(--muted);margin-top:12px">This generator positions the hour hand proportionally by default. The simplified behaviour is available as an option — for the very first o\'clock lessons — but the tool warns you when it is on.</p>' +
      '<div class="grid g2" style="margin-top:18px">' +
      '<div><h4 style="font-size:14.5px;margin-bottom:8px">The precision progression</h4><ol style="color:var(--muted);font-size:13.8px;padding-left:18px;margin:0"><li>O\'clock — minute hand always at 12.</li><li>Half past — introduces the 6 position.</li><li>Quarter past and quarter to — introduces "to".</li><li>Five-minute intervals — counting in fives round the face.</li><li>Any minute — including awkward times like 7:23.</li></ol></div>' +
      '<div><h4 style="font-size:14.5px;margin-bottom:8px">Why drawing is harder than reading</h4><p style="color:var(--muted);font-size:13.8px">Reading is recognition — the hands are already there. Drawing requires the child to decide where the hour hand belongs, which is where the proportional-movement misconception surfaces. A child who reads clocks fluently but draws 3:30 with the hour hand on the 3 has a gap worth addressing.</p></div></div>',
    related: ['number-line-worksheet-generator', 'math-worksheet-generator', 'coordinate-grid-worksheet-generator'],
faqs: [
      { q: 'What types of clock worksheet can I generate?', a: 'You can create activities for reading clocks, drawing hands, matching analogue and digital time, and writing times in words.' },
      { q: 'Can I generate half-hour and quarter-hour practice?', a: 'Yes. Choose the time precision that matches the current stage.' },
      { q: 'Does the hour hand move between numbers?', a: 'On a real clock, yes. The generator can model realistic movement or keep the hour hand on whole-hour numbers for an intentionally easier introduction.' },
      { q: 'Can I hide the clock numbers?', a: 'Yes. Removing numbers makes the task harder and is useful after students understand the clock layout.' },
      { q: 'Can I use 24-hour time?', a: 'Choose the digital format that fits the lesson, including 24-hour notation where supported.' },
      { q: 'Does it include an answer key?', a: 'Yes. Enable the answer-key page before generating.' },
      { q: 'Can I make a new set of times?', a: 'Yes. Change the seed or use the new-times option to generate another worksheet.' }
    ],
    seo: {
      title: 'Clock Reading Worksheet Generator – Create Telling-Time Practice',
      lead: 'Use the Clock Reading Worksheet Generator above to create printable analogue-clock practice that matches the stage your learners are working on.',
      blocks: [
        { html: '<p>Choose whether students should read the clock and write the time, draw hands to show a time, match analogue and digital time, or write the time in words.</p>' +
            '<p>Then choose the time precision, digital format, clock size, question count and answer-key option.</p>' +
            '<p>You can show clock numbers for easier reading or remove them for a harder version.</p>' +
            '<p>The generator also lets the hour hand stay on an hour number or move naturally between hour marks as minutes pass.</p>' +
            '<p>That detail matters when students learn how real analogue clocks behave.</p>' },
        { h: 'What Is a Clock Reading Worksheet?',
          html: '<p>A clock-reading worksheet gives practice interpreting or creating analogue times.</p>' +
            '<p>A typical question might show a clock and ask "What time is it?"</p>' +
            '<p>Another might give <code>3:30</code> and ask the student to draw the hour and minute hands.</p>' +
            '<p>Worksheets can also connect:</p>',
          list: ['analogue time', 'digital time', 'written time'],
          after: '<p>These representations reinforce each other.</p>' +
            '<p>The purpose is not only to memorize where the hands point.</p>' +
            '<p>Students need to understand that the hour and minute hands move continuously around the same circular scale at different rates.</p>' },
        { h: 'How to Use the Clock Worksheet Generator',
          html: '<p>Choose the exercise type first.</p><p>Then choose the precision.</p><p>A useful progression is:</p>',
          ol: ['whole hours', 'half hours', 'quarter hours', 'five-minute intervals', 'individual minutes'],
          after: '<p>Set the digital format if the task includes digital time.</p><p>Then choose:</p>' +
            '<ul style="color:var(--muted);padding-left:18px"><li>number of questions</li><li>clock size</li><li>print columns</li><li>show or hide clock numbers</li><li>answer key</li></ul>' +
            '<p>Use the seed when you want to recreate the same set of times.</p>' +
            '<p>Generate the worksheet and preview it before printing.</p>' +
            '<p>For younger learners, larger numbered clocks are easier to read.</p>' },
        { h: 'Start with Whole Hours',
          html: '<p>Whole-hour questions establish the roles of the hands.</p>' +
            '<p>At <code>4:00</code> the minute hand points to 12. The hour hand points to 4.</p>' +
            '<p>Students should learn which hand carries which information.</p>' +
            '<p>A common early difficulty is treating whichever hand looks most noticeable as "the hour."</p>' +
            '<p>Use clear language: shorter hand → hour, longer hand → minutes.</p>' +
            '<p>Then connect the position of the minute hand to elapsed minutes around the clock.</p>' +
            '<p>Whole hours are a useful starting point because both hands align with familiar numbered marks.</p>' },
        { h: 'Half-Hour Time',
          html: '<p>At <code>4:30</code> the minute hand points to 6 because 30 minutes have passed.</p>' +
            '<p>The hour hand should be halfway between 4 and 5.</p>' +
            '<p>Many simplified worksheets draw the hour hand exactly on 4 at 4:30. That may make early questions easier, but it is not how a real analogue clock behaves.</p>' +
            '<p>As time passes, the hour hand gradually moves toward the next hour.</p>' +
            '<p>Use simplified "whole-hour-only" positioning only when it deliberately supports an early learning stage.</p>' +
            '<p>Then transition to realistic clock hands.</p>' },
        { h: 'Quarter Past and Quarter To',
          html: '<p>A quarter of an hour is 15 minutes.</p><p>So "quarter past 3" means <code>3:15</code>.</p>' +
            '<p>The minute hand points to 3.</p>' +
            '<p>Likewise, "quarter to 4" means <code>3:45</code>.</p>' +
            '<p>The minute hand points to 9, while the hour hand is approaching 4.</p>' +
            '<p>This language connects time to fractions.</p>' +
            '<p>The clock face is divided into four quarter-hour sections.</p><p>That makes time a useful context for:</p>',
          list: ['halves', 'quarters', 'equal parts'],
          after: '<p>If students understand fraction language, use that connection explicitly.</p>' },
        { h: 'Five-Minute Intervals',
          html: '<p>Each numbered hour position represents five minutes for the minute hand.</p>' +
            '<p>Starting from 12: 1 → 5 minutes, 2 → 10, 3 → 15, 4 → 20, and so on.</p>' +
            '<p>Students can use the five-times table to read many clock times quickly.</p>' +
