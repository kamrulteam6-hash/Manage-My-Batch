<title>Employee ID Generator – HR Staff Numbers Without Personal Data</title>
<meta name="description" content="Generate stable employee IDs with prefixes, department, site or hire-year codes, padded sequences, custom patterns and optional check digits.">

</head>
<body data-root="../">

<section class="hero" id="hero"></section>

<section id="toolApp">
<div class="wrap">
<div class="tool-grid">

  <form class="card card-pad" id="cfg" autocomplete="off">
    <div class="panel-title"><span class="ico" id="icoGear"></span>Generator Settings</div>

    <div class="field">
      <label>Scheme</label>
      <div class="seg" id="preset">
        <button type="button" class="on" data-p="simple">Simple sequence</button>
        <button type="button" data-p="dept">With department</button>
        <button type="button" data-p="year">With hire year</button>
      </div>
      <div class="hint" id="presetHint"></div>
    </div>

    <div class="row">
      <div class="field"><label for="prefix">Prefix</label><input type="text" id="prefix" value="EMP"></div>
      <div class="field">
        <label for="sep">Separator</label>
        <select id="sep">
          <option value="-" selected>Hyphen (-)</option>
          <option value="">None</option>
          <option value=".">Dot (.)</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div class="field"><label for="dept">Department code</label><input type="text" id="dept" placeholder="e.g. ENG, HR, OPS"></div>
      <div class="field"><label for="site">Site code</label><input type="text" id="site" placeholder="e.g. LON, NYC"></div>
    </div>

    <div class="row">
      <div class="field">
        <label for="dateFormat">Hire period segment</label>
        <select id="dateFormat"></select>
      </div>
      <div class="field">
        <label for="pad">Number length</label>
        <select id="pad">
          <option value="3">3 digits</option>
          <option value="4" selected>4 digits</option>
          <option value="5">5 digits</option>
          <option value="6">6 digits</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div class="field"><label for="start">Starting number</label><input type="number" id="start" value="1001" min="0"></div>
      <div class="field">
        <label for="checkDigit">Check digit</label>
        <select id="checkDigit"></select>
      </div>
    </div>

    <div class="field">
      <label for="preview">Preview format</label>
      <div class="seq-preview" id="preview">EMP-1001</div>
    </div>

    <div class="divider"></div>

    <div class="row">
      <div class="field"><label for="count">How many</label><input type="number" id="count" value="8" min="1" max="5000"></div>
      <div class="field"><label for="date">Hire date</label><input type="date" id="date"></div>
    </div>

    <details class="faq" style="box-shadow:none;margin-bottom:16px">
      <summary style="padding:12px 14px;font-size:13.8px">Advanced format</summary>
      <div class="body" style="padding:0 14px 14px">
        <label for="pattern" style="margin-top:6px">Custom pattern</label>
        <input type="text" id="pattern" placeholder="e.g. {PREFIX}{SEP}{YY}{SEP}{SEQ:4}">
        <div class="token-help" id="tokenHelp"></div>
        <label for="suffix" style="margin-top:12px">Suffix</label>
        <input type="text" id="suffix" placeholder="optional">
      </div>
    </details>

    <div class="out-actions">
      <button type="submit" class="btn btn-primary btn-block"><span id="icoBolt"></span> Generate Employee IDs</button>
    </div>
  </form>

  <div class="card card-pad">
    <div class="panel-title"><span class="ico" id="icoSpark"></span>Generated Results<span class="spacer"></span>
      <span class="result-pill" id="pill"></span></div>

    <div class="tabs" id="tabs">
      <button type="button" class="on" data-tab="results">Results</button>
      <button type="button" data-tab="export">Export</button>
      <button type="button" data-tab="checks">Validation</button>
      <button type="button" data-tab="guide">HR guidance</button>
    </div>

    <div data-panel="results">
      <div id="primary"></div>
      <div id="more"></div>
      <button type="button" class="btn btn-soft btn-block" id="regen" style="margin-top:18px">
        <span id="icoReset"></span> Regenerate</button>
      <div class="note note-warn" style="margin-top:14px"><span id="icoWarn"></span>
        <span><strong>Never build personal data into an employee ID.</strong> No dates of birth, initials, national insurance or social security numbers. The ID appears on badges, spreadsheets and third-party systems where that data does not belong.</span></div>
    </div>

    <div data-panel="export" hidden>
      <div class="field">
        <label for="exportAs">Export format</label>
        <select id="exportAs">
          <option value="lines">Plain list</option>
          <option value="csvIndexed">CSV with index</option>
          <option value="json">JSON array</option>
          <option value="sql">SQL INSERT</option>
        </select>
      </div>
      <div class="output-box">
        <div class="output-bar"><span class="fname" id="fname">employee-ids.txt</span><span class="chip" id="meta"></span></div>
        <pre class="code" id="out"></pre>
      </div>
      <div class="out-actions">
        <button class="btn btn-primary" id="copyBtn"><span id="icoCopy"></span> Copy all</button>
        <button class="btn btn-ghost" id="dlBtn"><span id="icoDl"></span> Download</button>
      </div>
    </div>

    <div data-panel="checks" hidden><div id="checks"></div></div>
    <div data-panel="guide" hidden><div id="guide"></div></div>
  </div>

</div>
</div>
</section>

<div id="afterTool"></div>

<script src="../assets/js/site.js"></script>
<script src="../assets/js/seqid.js"></script>
<script>
(function () {
  var I = GTI, $ = GT.$, $$ = GT.$$;
  ['icoGear:gear','icoSpark:spark','icoBolt:bolt','icoCopy:copy','icoDl:download','icoReset:reset','icoWarn:warn']
    .forEach(function (p) { var a = p.split(':'); document.getElementById(a[0]).innerHTML = I[a[1]]; });

  $('#dateFormat').innerHTML = GTSeq.DATE_FORMATS.map(function (f) {
    return '<option value="' + f.id + '"' + (f.id === 'none' ? ' selected' : '') + '>' + f.label + '</option>';
  }).join('');
  $('#checkDigit').innerHTML = GTSeq.CHECK_DIGITS.map(function (c) {
    return '<option value="' + c.id + '">' + c.label + '</option>';
  }).join('');
  $('#tokenHelp').innerHTML = GTSeq.tokenHelpHtml();
  $('#date').value = GT.today();

  var HINTS = {
    simple: 'One flat sequence for the whole organisation. The most durable choice — nothing in the ID can ever become wrong.',
    dept: 'Department code embedded. Convenient for reporting, but the ID becomes misleading when someone transfers.',
    year: 'Hire year embedded. Groups joiners by cohort, and reveals tenure to anyone who sees the badge.'
  };
  var PRESETS = {
    simple: { prefix: 'EMP', dept: '', site: '', date: 'none', pad: 4, start: 1001 },
    dept: { prefix: 'EMP', dept: 'ENG', site: '', date: 'none', pad: 4, start: 1001 },
    year: { prefix: 'EMP', dept: '', site: '', date: 'YYYY', pad: 4, start: 1 }
  };

  var ids = [];
  var out = GT.mountOutput({ pre: '#out', fileLabel: '#fname', meta: '#meta',
    copyBtn: '#copyBtn', downloadBtn: '#dlBtn', filename: 'employee-ids.txt', mime: 'text/plain' });

  function opts() {
    var sep = $('#sep').value;
    var dept = $('#dept').value.trim().toUpperCase();
    var site = $('#site').value.trim().toUpperCase();
    var pattern = $('#pattern').value.trim();
    if (!pattern && (dept || site)) {
      var df = GTSeq.DATE_FORMATS.filter(function (f) { return f.id === $('#dateFormat').value; })[0];
      var parts = ['{PREFIX}'];
      if (site) parts.push(site);
      if (dept) parts.push(dept);
      if (df && df.pattern) parts.push(df.pattern);
      parts.push('{SEQ}');
      if ($('#suffix').value.trim()) parts.push('{SUFFIX}');
      pattern = parts.join(sep === '' ? '' : '{SEP}');
    }
    return {
      prefix: $('#prefix').value.trim(),
      suffix: $('#suffix').value.trim(),
      dateFormat: $('#dateFormat').value,
      sep: sep,
      start: $('#start').value,
      pad: parseInt($('#pad').value, 10),
      count: parseInt($('#count').value, 10),
      checkDigit: $('#checkDigit').value,
      date: $('#date').value ? new Date($('#date').value + 'T12:00:00') : new Date(),
      pattern: pattern
    };
  }

  function build() {
    var o = opts();
    ids = GTSeq.generate(o).ids;

    $('#preview').textContent = ids[0] || '—';
    GTSeq.renderResults({ ids: ids, primary: '#primary', more: '#more', noun: 'Employee ID' });
    $('#pill').textContent = ids.length.toLocaleString() + ' generated';
    $('#pill').style.background = 'var(--green-bg)'; $('#pill').style.color = 'var(--green)';

    var mode = $('#exportAs').value;
    var ext = mode === 'json' ? 'json' : mode === 'sql' ? 'sql' : /csv/.test(mode) ? 'csv' : 'txt';
    out.set(GTSeq.exportAs(ids, mode, { column: 'employee_id', table: 'employees' }), 'employee-ids.' + ext);

    var extra = [];
    if ($('#dept').value.trim()) {
      extra.push({ s: 'warn', m: 'Department code embedded. When someone transfers between teams their ID will contradict their actual department — and changing the ID breaks payroll history, access logs and every downstream system. Consider keeping department in a field instead.' });
    }
    if ($('#site').value.trim()) {
      extra.push({ s: 'warn', m: 'Site code embedded. Relocations and office closures make it stale for the same reason.' });
    }
    if ($('#dateFormat').value !== 'none') {
      extra.push({ s: 'warn', m: 'Hire year embedded. It groups cohorts neatly, but it also puts tenure on every badge and in every exported list — which can feed age or length-of-service inference.' });
    }
    if (parseInt($('#pad').value, 10) < 4) {
      extra.push({ s: 'warn', m: 'Three digits caps you at 999 employees ever, including leavers whose IDs must never be reused.' });
    }
    GTSeq.renderChecks('#checks', GTSeq.validate(ids, { checkDigit: o.checkDigit, humanEntry: true }).concat(extra));
  }

  $('#guide').innerHTML = [
    ['Stability beats descriptiveness', 'An employee ID is a permanent key. It appears in payroll runs, access control logs, pension records and archived files that must remain readable for years. Anything encoded in it that can change — department, site, job grade — will eventually make the ID wrong, and by then it is far too late to alter.'],
    ['Never encode personal data', 'No initials, birth dates, national insurance or social security numbers. Employee IDs are shared with benefits providers, printed on badges and exported into spreadsheets that circulate widely. Personal identifiers in that context create real data-protection exposure.'],
    ['Do not reuse a leaver\'s ID', 'Reassigning an ID makes historical records ambiguous: a payroll entry or an access log from three years ago now appears to belong to a current employee. Retire IDs permanently and pad generously so you never feel pressure to recycle.'],
    ['Rehires keep their original ID', 'When someone returns, restoring the original ID reconnects their service history, pension record and prior training. Issuing a new one silently splits their record in two.'],
    ['Contractors need a distinguishable series', 'A separate prefix such as <code>CON-</code> makes it obvious in access reviews and audits who is permanent staff and who is not, without needing to look anyone up.'],
    ['Check digits help at the door', 'If IDs are typed into time clocks or door systems, a check digit rejects a mistyped number immediately instead of failing a lookup or, worse, matching a different employee.']
  ].map(function (x) {
    return '<div style="margin-bottom:16px"><h4 style="font-size:14.5px;margin-bottom:6px">' + x[0] + '</h4>' +
      '<p style="color:var(--muted);font-size:13.8px">' + x[1] + '</p></div>';
  }).join('');

  $('#preset').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    $$('#preset button').forEach(function (x) { x.classList.toggle('on', x === b); });
    var k = b.getAttribute('data-p'), p = PRESETS[k];
    $('#prefix').value = p.prefix; $('#dept').value = p.dept; $('#site').value = p.site;
    $('#dateFormat').value = p.date; $('#pad').value = p.pad; $('#start').value = p.start;
    $('#pattern').value = '';
    $('#presetHint').textContent = HINTS[k];
    build();
  });
  $('#presetHint').textContent = HINTS.simple;

  GTSeq.bindCopy('#primary', function () { return ids; });
  GTSeq.bindCopy('#more', function () { return ids; });
  GTSeq.bindTokenHelp('#tokenHelp', '#pattern', build);

  $('#tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    $$('#tabs button').forEach(function (x) { x.classList.toggle('on', x === b); });
    $$('[data-panel]').forEach(function (p) { p.hidden = p.getAttribute('data-panel') !== b.getAttribute('data-tab'); });
  });
  $('#cfg').addEventListener('submit', function (e) { e.preventDefault(); build(); GT.toast('Employee IDs generated'); });
  $('#cfg').addEventListener('input', build);
  $('#cfg').addEventListener('change', build);
  $('#regen').addEventListener('click', build);
  $('#exportAs').addEventListener('change', build);

  build();

  GT.page({
    slug: 'employee-id-generator',
    lede: 'Generate employee IDs that stay correct for an entire career — stable, privacy-safe, never reused, with optional check digits for badge and time-clock entry.',
    steps: [
      { icon: 'gear', title: 'Choose a scheme', text: 'A flat sequence is the most durable; department and year segments trade stability for convenience.' },
      { icon: 'user', title: 'Generate a block', text: 'Create IDs for a new intake or a whole migration.' },
      { icon: 'copy', title: 'Export to HR', text: 'Copy as CSV or SQL for your HRIS import.' }
    ],
    guideTitle: 'The employee ID mistake almost every company makes once',
    guide:
      '<p style="color:var(--muted)">It is tempting to make an employee ID descriptive: <code>EMP-ENG-LON-2021-042</code> tells you the person is an engineer in London who joined in 2021. It reads beautifully on the day it is issued. Three years later they have moved to the New York product team, and the ID now states three things that are false — in payroll history, in access logs and in every archived export.</p>' +
      '<p style="color:var(--muted);margin-top:12px">You cannot fix it by changing the ID, because the ID is the key that links years of records. So the wrong data stays, and everyone learns to ignore it.</p>' +
      '<div class="grid g2" style="margin-top:18px">' +
      '<div><h4 style="font-size:14.5px;margin-bottom:8px">Safe to encode</h4><ul style="color:var(--muted);font-size:13.8px;padding-left:18px;margin:0"><li>A prefix distinguishing employees from contractors.</li><li>Nothing else, in most organisations.</li></ul>' +
      '<h4 style="font-size:14.5px;margin:16px 0 8px">Keep in fields instead</h4><ul style="color:var(--muted);font-size:13.8px;padding-left:18px;margin:0"><li>Department, team, cost centre</li><li>Site or country</li><li>Job grade or title</li><li>Hire date and tenure</li></ul></div>' +
      '<div><h4 style="font-size:14.5px;margin-bottom:8px">Never encode</h4><ul style="color:var(--muted);font-size:13.8px;padding-left:18px;margin:0"><li>Date of birth or age</li><li>National insurance or social security numbers</li><li>Initials or surname fragments</li><li>Anything that identifies the person directly</li></ul>' +
      '<p style="color:var(--muted);font-size:13.8px;margin-top:12px">Employee IDs travel further than people expect — badges, benefits providers, training platforms, shared spreadsheets. Treat the ID as public within the organisation and design accordingly.</p></div></div>' +
      '<div class="note note-warn" style="margin-top:18px">' + GTI.warn + '<span><strong>Never reuse a leaver\'s ID.</strong> It makes historical payroll and access records ambiguous, and it is the kind of thing nobody notices until an investigation depends on it. Pad the sequence generously so recycling never looks attractive.</span></div>',
    related: ['asset-tag-number-generator', 'reference-number-generator', 'ticket-number-generator'],
faqs: [
      { q: 'What is an employee ID?', a: 'It is an internal identifier assigned to an employee or staff record so systems can refer to the person consistently.' },
      { q: 'Should employee IDs contain names?', a: 'Usually no. A neutral identifier avoids unnecessary personal data and remains stable if the employee’s name changes.' },
      { q: 'Can I include a department code?', a: 'Yes, but remember that departments change. If employees move frequently, a department-free permanent ID may be easier to maintain.' },
      { q: 'Is an employee ID personal data?', a: 'If it can be linked back to an identifiable employee, treat it as personal information under applicable data-protection rules.' },
      { q: 'Should employee IDs be sequential?', a: 'They can be. Sequential numbers are simple and easy to manage when uniqueness is enforced.' },
      { q: 'Should I reuse an ID after an employee leaves?', a: 'Avoid assigning the same historical ID to another person because old payroll, audit and HR records may still reference it.' },
      { q: 'Is an employee ID a login credential?', a: 'No. It may be used as a username in some systems, but it should not be treated as a password or proof of identity.' }
    ],
    seo: {
      title: 'Employee ID Generator – Create Stable, Privacy-Safe Staff Numbers',
      lead: 'Use the Employee ID Generator above to create structured internal staff identifiers without building names, dates of birth or government identifiers into the number.',
      blocks: [
        { html: '<p>Choose a simple sequence or add stable organizational segments such as department, site or hire year. Set the prefix, separator, number length and starting sequence, then optionally add a check digit for manual-entry validation.</p>' +
            '<p>Examples include <code>EMP-1001</code>, <code>EMP-ENG-1001</code>, <code>EMP-LON-26-1001</code>.</p>' +
            '<p>The most important rule is stability. An employee ID should keep identifying the same employee record even when role, manager, team or surname changes.</p>' },
        { h: 'What Is an Employee ID?',
          html: '<p>An employee ID is an identifier assigned to a worker or staff record.</p><p>It may appear in:</p>',
          list: ['HR systems', 'payroll', 'timesheets', 'staff directories', 'badges', 'expense systems', 'training records', 'asset assignments', 'support requests', 'access-management workflows'],
          after: '<p>The ID gives systems a stable key.</p><p>Names can change or be shared.</p>' +
            '<p>An employee number can remain stable across the entire employment relationship.</p>' +
            '<p>However, because it is linked to an identifiable person, treat the employee ID as personal information in contexts where data-protection rules apply.</p>' },
        { h: 'How to Use This Employee ID Generator',
          html: '<p>Choose the scheme.</p>' +
            '<p><strong>Simple sequence</strong> — example: <code>EMP-1001</code></p>' +
            '<p><strong>With department</strong> — example: <code>EMP-ENG-1001</code></p>' +
            '<p><strong>With hire year</strong> — example: <code>EMP-26-1001</code></p>' +
            '<p>Then configure:</p>',
          list: ['prefix', 'separator', 'department code', 'site code', 'hire period', 'number length', 'starting number', 'check digit'],
          after: '<p>The tool also supports a custom pattern for organizations with an established convention.</p>' +
            '<p>Generate the batch and export it.</p>' +
            '<p>Before assigning IDs to real staff, make sure the starting range does not overlap existing employee numbers.</p>' +
            '<p>Your HR system should remain the authoritative record of which ID belongs to which employee.</p>' },
        { h: 'Do Not Put Personal Data in an Employee ID',
          html: '<p>Avoid employee identifiers built from:</p>',
          list: ['initials', 'full name', 'date of birth', 'phone number', 'national insurance number', 'Social Security number', 'passport number', 'personal email address'],
          after: '<p>These values are unnecessary for the purpose of creating a stable staff identifier.</p>' +
            '<p>Data-protection guidance such as the UK GDPR data-minimization principle says personal data should be adequate, relevant and limited to what is necessary for the purpose.</p>' +
            '<p>A neutral ID like <code>EMP-10482</code> identifies the record without revealing extra personal information.</p>' +
            '<p>The HR system can map that ID to protected employee data.</p>' },
        { h: 'Employee ID Is Still Personal Data',
          html: '<p>Removing the employee’s name from the identifier does not automatically make the record anonymous.</p>' +
            '<p>If <code>EMP-10482</code> maps back to one employee in your HR system, it is still linkable to that individual.</p>' +
            '<p>NIST guidance similarly treats employee identification numbers as internal identifiers that may contribute to personally identifiable information.</p>' +
            '<p>This is an important distinction.</p>' +
            '<p>A neutral employee number reduces unnecessary exposure.</p><p>It does not remove your responsibilities for:</p>',
          list: ['access control', 'data retention', 'security', 'lawful processing', 'appropriate sharing'],
          after: '<p>Treat the identifier according to the data-protection rules that apply to your organization.</p>' },
        { h: 'Simple Sequential Employee IDs',
          html: '<p>A sequence is easy to manage:</p><pre class="code">EMP-1001\nEMP-1002\nEMP-1003</pre><p>Benefits include:</p>',
          list: ['short values', 'easy searching', 'easy badge printing', 'predictable format', 'straightforward imports'],
          after: '<p>The sequence may reveal approximate hiring volume.</p>' +
            '<p>For most internal systems, that is not a serious problem.</p>' +
            '<p>If employee numbers appear publicly and workforce size is sensitive, a less predictable format may be useful.</p>' +
            '<p>But do not add randomness purely for appearance.</p>' +
            '<p>The HR system still needs uniqueness and stable mapping.</p>' },
        { h: 'Department Codes',
          html: '<p>A department-based format can look like:</p><pre class="code">EMP-ENG-1042\nEMP-HR-1043\nEMP-OPS-1044</pre>' +
            '<p>This can help staff understand where the employee originally belongs.</p>' +
            '<p>However, departments change.</p><p>An engineer may move to Product.</p>' +
            '<p>HR may reorganize into People Operations.</p>' +
            '<p>If the department code is embedded in the ID, do <strong>not</strong> automatically change the employee number every time the organizational chart changes.</p>' +
            '<p>Stable identifiers are more valuable than perfectly current embedded metadata.</p>' +
            '<p>If mobility is common, a simple department-free ID may be better.</p>' },
        { h: 'Site Codes',
          html: '<p>For organizations with several locations, a site code can distinguish employee-number series.</p>' +
            '<p>Example:</p><pre class="code">EMP-LON-1042\nEMP-NYC-0831</pre>' +
            '<p>This is useful when local HR teams issue IDs independently.</p>' +
            '<p>To avoid collisions, the full identifier must include the site code or each site must receive a non-overlapping numeric range.</p>' +
            '<p>Document code ownership.</p>' +
            '<p>If a person transfers from London to New York, consider whether the ID should remain <code>EMP-LON-1042</code> even though the site segment is no longer current.</p>' +
            '<p>In many systems, yes—the ID should remain stable and the current location should live in a separate HR field.</p>' },
        { h: 'Hire-Year Segments',
          html: '<p>A hire-year segment can create:</p><pre class="code">EMP-26-1042</pre>' +
            '<p>This may help with historical scanning.</p>' +
            '<p>It also leaks approximate tenure to anyone who sees the ID.</p>' +
            '<p>Ask whether that information belongs in a staff identifier.</p>' +
            '<p>If the ID appears on badges, email signatures or support tickets, hire year may become more visible than intended.</p>' +
            '<p>The actual hire date already exists in HR records.</p>' +
            '<p>Use a hire-year segment only when it provides operational value.</p>' +
            '<p>Do not include the full birth date or any personal date merely because date tokens are available.</p>' },
        { h: 'Employee ID vs Badge Number',
          html: '<p>A physical access badge may contain a card or credential identifier that changes when the badge is replaced.</p>' +
            '<p>The employee ID should not necessarily change with it.</p><p>This distinction is useful:</p>' +
            '<pre class="code">Employee: EMP-1042\nOld badge: CARD-88214\nReplacement badge: CARD-94031</pre>' +
            '<p>The employee remains the same person while the credential changes.</p>' +
            '<p>Do not use one replaceable badge serial as the only long-term HR identifier unless your identity architecture explicitly defines it that way.</p>' +
            '<p>Keep person identity and credential identity conceptually separate.</p>' },
        { h: 'What Is a Check Digit on an Employee ID?',
          html: '<p>A check digit is an extra value calculated from the employee number.</p><p>Its purpose is to detect typing errors.</p>' +
            '<p>For example, payroll staff manually entering dozens of numbers may benefit from validation that catches a mistyped digit.</p>' +
            '<p>A checksum can reduce data-entry mistakes.</p><p>It does not prove identity.</p>' +
            '<p>A person who knows a valid employee ID plus check digit is not authenticated.</p>' +
            '<p>Do not use checksum validation as an access-control decision.</p>' +
            '<p>It is useful for data quality, especially in manual processes.</p>' },
        { h: 'Should Employee IDs Ever Be Reused?',
          html: '<p>Avoid reassigning a former employee’s ID to a different person.</p><p>Historical records may reference the number for years:</p>',
          list: ['payroll', 'expenses', 'training', 'incident reports', 'asset records', 'audit logs'],
          after: '<p>If <code>EMP-1042</code> belonged to one person and later belongs to someone else, old reports become ambiguous.</p>' +
            '<p>Mark the employee record inactive or terminated while preserving the identifier.</p>' +
            '<p>For rehires, your HR policy should decide whether the person receives the original ID or a new employment-record ID.</p>' +
            '<p>Whatever rule you choose, document it and apply it consistently.</p>' },
        { h: 'Employee IDs in URLs and Internal Systems',
          html: '<p>An employee ID can appear in internal application URLs: <code>/employees/EMP-1042</code>.</p>' +
            '<p>Do not assume the internal-looking reference protects the record.</p>' +
            '<p>Every request must still have proper authorization.</p>' +
            '<p>A manager may be allowed to view direct reports but not every employee.</p>' +
            '<p>A payroll administrator may have broader access.</p>' +
            '<p>The application must enforce those permissions.</p>' +
            '<p>Changing <code>EMP-1042</code> to <code>EMP-1043</code> must not expose another employee’s private HR data simply because the identifier is predictable.</p>' },
        { h: 'HR Data Minimization',
          html: '<p>A good employee number supports data minimization.</p>' +
            '<p>Instead of sending "Jane Smith, DOB 1983-04-18, Payroll Department" through every downstream process, systems may exchange <code>EMP-1042</code> and retrieve only the attributes actually needed.</p>' +
            '<p>This can reduce unnecessary copies of personal details.</p>' +
            '<p>But pseudonymous or neutral identifiers remain linkable when the organization can map them back to a person.</p>' +
            '<p>They still need protection.</p>' +
            '<p>Use the employee ID as a key to limit exposure, not as a reason to distribute HR records more broadly.</p>' },
        { h: 'Common Employee ID Mistakes',
          html: '<p>Avoid these problems:</p>',
          list: ['embedding date of birth or government identifiers', 'using employee initials as the primary uniqueness mechanism',
                 'changing IDs after department transfers', 'reusing IDs for different people', 'treating the ID as anonymous data',
                 'treating the ID as an authentication secret', 'using a badge serial as the only HR identity',
                 'generating a new overlapping range outside the HR system', 'exposing hire-year or site information without considering privacy',
                 'making the number too long for badges and manual entry'],
          after: '<p>A good employee ID should be stable, neutral and boring. That is a strength.</p>' }
      ],
      keywords: ['employee id generator', 'staff number format', 'hr employee id without personal data', 'department code employee id',
        'employee id data minimization', 'employee id privacy gdpr', 'employee id check digit', 'sequential employee numbers',

    }
