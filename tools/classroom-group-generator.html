<body data-root="../">

<section class="hero" id="hero"></section>

<section id="toolApp">
<div class="wrap">
<div class="tool-grid">

  <form class="card card-pad" id="cfg" autocomplete="off">
    <div class="panel-title"><span class="ico" id="icoGear"></span>Class Setup</div>

    <div class="field">
      <label for="names">Student names — one per line</label>
      <textarea id="names" style="min-height:200px">Amara
Ben
Chen
Diego
Elena
Farah
Grace
Hugo
Ines
Jonas
Layla
Mateo
Nadia
Omar
Priya
Rosa</textarea>
      <div id="rosterStats"></div>
    </div>

    <div class="divider"></div>

    <div class="field">
      <label>Split by</label>
      <div class="seg" id="mode">
        <button type="button" class="on" data-m="size">Students per group</button>
        <button type="button" data-m="count">Number of groups</button>
      </div>
    </div>

    <div class="field">
      <label for="value" id="valueLabel">Students per group</label>
      <input type="number" id="value" value="4" min="1" max="60">
      <div class="hint" id="splitHint"></div>
    </div>

    <div class="field">
      <label for="naming">Group names</label>
      <select id="naming">
        <option value="number" selected>Group 1, Group 2…</option>
        <option value="letter">Group A, Group B…</option>
        <option value="colour">Colours</option>
        <option value="animal">Animals</option>
        <option value="planet">Planets</option>
        <option value="custom">Custom list…</option>
      </select>
      <input type="text" id="customNames" placeholder="Comma separated names" style="margin-top:8px" hidden>
    </div>

    <div class="divider"></div>

    <div class="field">
      <label for="apart">Keep apart — one pair per line</label>
      <textarea id="apart" style="min-height:64px" placeholder="Ben & Chen"></textarea>
    </div>

    <div class="field">
      <label for="together">Keep together — one pair per line</label>
      <textarea id="together" style="min-height:64px" placeholder="Ines & Jonas"></textarea>
      <div class="hint">Useful for a paired support arrangement or a language buddy.</div>
    </div>

    <div class="field">
      <label for="seed">Seed</label>
      <div class="row" style="grid-template-columns:minmax(0,1fr) auto;gap:8px">
        <input type="text" id="seed" value="class-a">
        <button type="button" class="btn btn-soft" id="newSeed"><span id="icoReset"></span></button>
      </div>
    </div>

    <div class="out-actions">
      <button type="submit" class="btn btn-primary btn-block"><span id="icoBolt"></span> Generate Groups</button>
    </div>
  </form>

  <div class="card card-pad">
    <div class="panel-title"><span class="ico" id="icoSpark"></span>Groups<span class="spacer"></span>
      <span class="result-pill" id="pill"></span></div>

    <div class="tabs" id="tabs">
      <button type="button" class="on" data-tab="results">Groups</button>
      <button type="button" data-tab="export">Export</button>
      <button type="button" data-tab="guide">Teaching notes</button>
    </div>

    <div data-panel="results">
      <div id="groups"></div>
      <div class="out-actions" style="margin-top:18px">
        <button type="button" class="btn btn-primary" id="printBtn"><span id="icoFile"></span> Print / PDF</button>
        <button type="button" class="btn btn-ghost" id="copyBtn"><span id="icoCopy"></span> Copy</button>
        <button type="button" class="btn btn-soft" id="regen"><span id="icoReset2"></span> Reshuffle</button>
      </div>
      <div id="checks"></div>
    </div>

    <div data-panel="export" hidden>
      <div class="field">
        <label for="exportAs">Export format</label>
        <select id="exportAs">
          <option value="text">Readable list</option>
          <option value="csv">CSV — student, group</option>
          <option value="json">JSON</option>
        </select>
      </div>
      <div class="output-box">
        <div class="output-bar"><span class="fname" id="fname">groups.txt</span><span class="chip" id="meta"></span></div>
        <pre class="code" id="out"></pre>
      </div>
      <div class="out-actions">
        <button class="btn btn-primary" id="copyAllBtn"><span id="icoCopy2"></span> Copy all</button>
        <button class="btn btn-ghost" id="dlBtn"><span id="icoDl"></span> Download</button>
      </div>
    </div>

    <div data-panel="guide" hidden><div id="guide"></div></div>
  </div>

</div>
</div>
</section>

<div id="afterTool"></div>

<script src="../assets/js/site.js"></script>
<script src="../assets/js/roster.js"></script>
<script>
(function () {
  var I = GTI, $ = GT.$, $$ = GT.$$;
  ['icoGear:gear','icoSpark:spark','icoBolt:bolt','icoCopy:copy','icoCopy2:copy','icoDl:download','icoReset:reset','icoReset2:reset','icoFile:file']
    .forEach(function (p) { var a = p.split(':'); document.getElementById(a[0]).innerHTML = I[a[1]]; });

  var NAME_SETS = {
    colour: ['Red', 'Blue', 'Green', 'Yellow', 'Purple', 'Orange', 'Teal', 'Pink', 'Amber', 'Indigo'],
    animal: ['Otters', 'Falcons', 'Foxes', 'Dolphins', 'Bears', 'Herons', 'Lynx', 'Ravens', 'Badgers', 'Seals'],
    planet: ['Mercury', 'Venus', 'Earth', 'Mars', 'Jupiter', 'Saturn', 'Uranus', 'Neptune', 'Pluto', 'Ceres']
  };

  var mode = 'size', res = null, names = [], labels = [];
  var out = GT.mountOutput({ pre: '#out', fileLabel: '#fname', meta: '#meta',
    copyBtn: '#copyAllBtn', downloadBtn: '#dlBtn', filename: 'groups.txt', mime: 'text/plain' });

  function groupLabel(i) {
    var n = $('#naming').value;
    if (n === 'letter') return 'Group ' + String.fromCharCode(65 + i);
    if (n === 'custom') {
      var list = $('#customNames').value.split(',').map(function (x) { return x.trim(); }).filter(Boolean);
      return list[i] || ('Group ' + (i + 1));
    }
    if (NAME_SETS[n]) return NAME_SETS[n][i % NAME_SETS[n].length] + (i >= NAME_SETS[n].length ? ' ' + (Math.floor(i / NAME_SETS[n].length) + 1) : '');
    return 'Group ' + (i + 1);
  }

  function build() {
    var parsed = GTRoster.parseNames($('#names').value);
    names = parsed.names;
    GTRoster.rosterStats('#rosterStats', parsed);

    if (names.length < 2) {
      $('#groups').innerHTML = '<div class="empty">Add at least two students.</div>';
      $('#pill').textContent = '—';
      return;
    }

    var value = Math.max(1, parseInt($('#value').value, 10) || 1);
    res = GTRoster.makeGroups(names, {
      seed: $('#seed').value,
      mode: mode,
      value: value,
      apart: GTRoster.parsePairs($('#apart').value),
      together: GTRoster.parsePairs($('#together').value)
    });
    labels = res.groups.map(function (_, i) { return groupLabel(i); });

    var sizes = res.groups.map(function (g) { return g.length; });
    $('#splitHint').textContent = mode === 'size'
      ? 'Produces ' + res.groups.length + ' groups of ' + Math.min.apply(null, sizes) +
        (Math.max.apply(null, sizes) !== Math.min.apply(null, sizes) ? '–' + Math.max.apply(null, sizes) : '') + '.'
      : 'Produces groups of ' + Math.min.apply(null, sizes) +
        (Math.max.apply(null, sizes) !== Math.min.apply(null, sizes) ? '–' + Math.max.apply(null, sizes) : '') + ' students.';

    renderGroups();
    renderExport();
    renderChecks();

    $('#pill').textContent = res.groups.length + ' groups · ' + names.length + ' students';
    $('#pill').style.background = 'var(--green-bg)'; $('#pill').style.color = 'var(--green)';
  }

  function renderGroups() {
    $('#groups').innerHTML = '<div class="grid g2">' + res.groups.map(function (g, i) {
      return '<div class="card" style="padding:16px;box-shadow:none">' +
        '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">' +
        '<h3 style="font-size:15px">' + GT.esc(labels[i]) + '</h3>' +
        '<span class="chip" style="font-family:var(--sans)">' + g.length + '</span></div>' +
        '<ol style="margin:0;padding-left:20px;font-size:14px;line-height:1.9;color:var(--ink-2)">' +
        g.map(function (n) { return '<li>' + GT.esc(n) + '</li>'; }).join('') + '</ol></div>';
    }).join('') + '</div>';
  }

  function renderExport() {
    var m = $('#exportAs').value, text, file = 'groups.txt';
    if (m === 'csv') {
      text = 'student,group\n' + res.groups.map(function (g, i) {
        return g.map(function (n) { return '"' + n.replace(/"/g, '""') + '","' + labels[i] + '"'; }).join('\n');
      }).join('\n');
      file = 'groups.csv';
    } else if (m === 'json') {
      text = JSON.stringify(res.groups.map(function (g, i) {
        return { group: labels[i], students: g };
      }), null, 2);
      file = 'groups.json';
    } else {
      text = res.groups.map(function (g, i) {
        return labels[i] + '\n' + g.map(function (n) { return '  · ' + n; }).join('\n');
      }).join('\n\n');
    }
    out.set(text, file);
  }

  function renderChecks() {
    var c = [];
    var sizes = res.groups.map(function (g) { return g.length; });
    var min = Math.min.apply(null, sizes), max = Math.max.apply(null, sizes);
    c.push(['ok', res.groups.length + ' groups created, sizes ' + (min === max ? 'all ' + min : min + ' to ' + max) + '.']);

    if (res.violations.length) {
      c.push(['err', 'Could not honour every keep-apart rule: ' +
        res.violations.map(function (v) { return GT.esc(v[0]) + ' & ' + GT.esc(v[1]); }).join(', ') +
        '. There are too few groups to separate them — increase the number of groups or reduce group size.']);
    } else if ($('#apart').value.trim()) {
      c.push(['ok', 'All keep-apart rules satisfied.']);
    }

    if ($('#together').value.trim()) {
      c.push(['ok', 'Keep-together pairs are placed as a single unit, which can make their group one larger than the others.']);
    }
    if (max - min > 1) {
      c.push(['warn', 'Group sizes differ by more than one. This usually happens when keep-together pairs force uneven placement.']);
    }
    if (min === 1) {
      c.push(['warn', 'At least one group has a single student. Reduce the number of groups, or increase students per group.']);
    }
    $('#checks').innerHTML = c.map(function (x) {
      return '<div class="note ' + (x[0] === 'ok' ? 'note-ok' : x[0] === 'warn' ? 'note-warn' : 'note-err') + '">' +
        (x[0] === 'ok' ? I.check : I.warn) + '<span>' + x[1] + '</span></div>';
    }).join('');
  }

  $('#copyBtn').addEventListener('click', function () {
    GT.copy(res.groups.map(function (g, i) {
      return labels[i] + ': ' + g.join(', ');
    }).join('\n'), 'Groups');
  });

  $('#printBtn').addEventListener('click', function () {
    var body = '<h1>Class Groups</h1><p class="sub">' + names.length + ' students · ' +
      res.groups.length + ' groups · ' + new Date().toLocaleDateString() + '</p>' +
      '<div class="grid g3">' + res.groups.map(function (g, i) {
        return '<div class="card"><h3>' + GT.esc(labels[i]) + '</h3><ol>' +
          g.map(function (n) { return '<li>' + GT.esc(n) + '</li>'; }).join('') + '</ol></div>';
      }).join('') + '</div>';
    GTRoster.printHtml('Class Groups', body);
  });

  $('#mode').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    $$('#mode button').forEach(function (x) { x.classList.toggle('on', x === b); });
    mode = b.getAttribute('data-m');
    $('#valueLabel').textContent = mode === 'size' ? 'Students per group' : 'Number of groups';
    build();
  });
  $('#naming').addEventListener('change', function () { $('#customNames').hidden = this.value !== 'custom'; });
  $('#newSeed').addEventListener('click', function () { $('#seed').value = Math.random().toString(36).slice(2, 8); build(); });
  $('#regen').addEventListener('click', function () { $('#seed').value = Math.random().toString(36).slice(2, 8); build(); });

  $('#guide').innerHTML = [
    ['Group size changes the dynamic', 'Threes and fours are the sweet spot for discussion — everyone has to contribute. Fives and sixes let a quiet student disappear entirely. Pairs maximise talk time but limit the range of ideas. Choose the size for the task, not for the room layout.'],
    ['Keep-together is for support, not friendship', 'The keep-together rule is most useful for a language buddy, a paired support arrangement, or a student who needs a familiar peer. Using it for friendship groups tends to undo the point of randomising.'],
    ['Keep-apart needs enough groups', 'If you list several exclusions but only create two groups, the constraints become impossible to satisfy. The tool tells you exactly which rule it could not honour rather than silently ignoring it.'],
    ['Random is not always fairest', 'Purely random groups can concentrate confident students together. If that matters for the task, run the generator, then move one or two students by hand — the goal is a good lesson, not algorithmic purity.'],
    ['Named groups reduce friction', 'Colours, animals or planets give students something to identify with and make instructions easier to call across a room than "group four".'],
    ['Reuse the seed for continuity', 'For a multi-lesson project, keep the same seed so groups persist. Change it when you want a fresh mix.']
  ].map(function (x) {
    return '<div style="margin-bottom:16px"><h4 style="font-size:14.5px;margin-bottom:6px">' + x[0] + '</h4>' +
      '<p style="color:var(--muted);font-size:13.8px">' + x[1] + '</p></div>';
  }).join('');

  $('#tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    $$('#tabs button').forEach(function (x) { x.classList.toggle('on', x === b); });
    $$('[data-panel]').forEach(function (p) { p.hidden = p.getAttribute('data-panel') !== b.getAttribute('data-tab'); });
  });
  $('#cfg').addEventListener('submit', function (e) { e.preventDefault(); build(); GT.toast('Groups generated'); });
  $('#cfg').addEventListener('input', build);
  $('#cfg').addEventListener('change', build);
  $('#exportAs').addEventListener('change', build);

  build();

  GT.page({
    slug: 'classroom-group-generator',
    lede: 'Split a class into balanced random groups in one click — with keep-apart and keep-together rules that are actually enforced, and honest warnings when they cannot be.',
    steps: [
      { icon: 'gear', title: 'Paste your class list', text: 'Numbering and bullets copied from a register are stripped automatically.' },
      { icon: 'users', title: 'Set group size or count', text: 'The tool balances sizes and reports the spread.' },
      { icon: 'file', title: 'Print or export', text: 'A printable handout, or CSV for your gradebook.' }
    ],
    guideTitle: 'Constraints that are enforced, not just requested',
    guide:
      '<p style="color:var(--muted)">Most group generators shuffle a list and slice it. That works until you have two students who genuinely cannot sit together, or a pair who must stay together for support — at which point you end up rearranging by hand every time.</p>' +
      '<p style="color:var(--muted);margin-top:12px">This tool treats those as real constraints. Keep-together pairs are merged into a single unit before allocation, so they always land in the same group. Keep-apart pairs are checked as each student is placed, and the placement is scored to avoid them. If the constraints are impossible — three mutually exclusive students and only two groups — you get told which rule failed instead of a silently wrong answer.</p>' +
      '<div class="grid g2" style="margin-top:18px">' +
      '<div><h4 style="font-size:14.5px;margin-bottom:8px">Choosing a group size</h4><ul style="color:var(--muted);font-size:13.8px;padding-left:18px;margin:0"><li><strong>Pairs</strong> — maximum talk time, narrow range of ideas.</li><li><strong>Threes</strong> — hard to stay silent, good for discussion.</li><li><strong>Fours</strong> — the usual default; splits neatly into pairs for sub-tasks.</li><li><strong>Five or more</strong> — a quiet student can disappear entirely.</li></ul></div>' +
      '<div><h4 style="font-size:14.5px;margin-bottom:8px">Balance is best-effort</h4><p style="color:var(--muted);font-size:13.8px">With 16 students in groups of 5, someone gets a group of 4 or 6 — there is no arrangement that avoids it. The tool places the largest units first into the smallest group, which keeps sizes as even as the numbers allow, and reports the actual spread so there are no surprises when you print.</p>' +
      '<p style="color:var(--muted);font-size:13.8px;margin-top:10px">Student names stay in your browser and are never uploaded.</p></div></div>',
    related: ['random-student-pair-generator', 'classroom-seating-chart-generator', 'presentation-order-generator'],
faqs: [
      { q: 'How do I randomly divide students into groups?', a: 'Paste one student name per line, choose students per group or number of groups, then generate.' },
      { q: 'Can I keep two students together?', a: 'Yes. Add them as a keep-together pair.' },
      { q: 'Can I keep two students apart?', a: 'Yes. Add the pair to the keep-apart list.' },
      { q: 'What happens when the class does not divide evenly?', a: 'The generator distributes students so group sizes are as balanced as possible.' },
      { q: 'What group size is best?', a: 'It depends on the activity. Evidence reviews of collaborative learning often highlight groups of about three to five students, but the task and classroom constraints should guide the final choice.' },
      { q: 'What does the seed do?', a: 'It lets the same roster and settings reproduce the same randomized groups.' },
      { q: 'Should classroom groups always be random?', a: 'No. Random groups are useful for variety. Deliberate grouping is better when the learning objective or support needs require it.' }
    ],
    seo: {
      title: 'Classroom Group Generator – Make Balanced Student Groups Quickly',
      lead: 'Use the Classroom Group Generator above to divide a class into random groups without counting names, rebalancing the last group or manually moving students around.',
      blocks: [
        { html: '<p>Paste one student name per line, then choose either students per group or number of groups.</p>' +
            '<p>You can add custom group names, keep specific students apart, keep another pair together and enter a seed when you want the arrangement to be repeatable.</p>' +
            '<p>The tool aims to create groups that are as even in size as possible.</p>' +
            '<p>That matters because a common manual mistake is to create several groups of four and discover that the final group contains only one or two students.</p>' +
            '<p>A generator handles the arithmetic first so you can focus on whether the arrangement works for the lesson.</p>' },
        { h: 'What Is a Classroom Group Generator?',
          html: '<p>A classroom group generator divides a student list into smaller teams.</p><p>For example, 24 students could become 6 groups of 4 or 4 groups of 6 depending on the activity.</p>' +
            '<p>The groups can be randomized so the typed order does not determine who works together.</p><p>This is useful for:</p>',
          list: ['projects', 'discussion tasks', 'science labs', 'stations', 'jigsaw activities', 'peer review', 'revision challenges', 'classroom games', 'workshop activities'],
          after: '<p>The generator creates the roster arrangement.</p>' +
            '<p>The teacher still decides the purpose, roles and task structure.</p>' +
            '<p>Random grouping saves time, but useful collaboration still needs a clear learning goal.</p>' },
        { h: 'Choose Students per Group or Number of Groups',
          html: '<p>These settings solve slightly different planning problems.</p>' +
            '<p><strong>Students per group</strong> — use this when the activity is designed around a specific group size.</p>' +
            '<p>Example: "You need groups of four for the lab." Enter <code>4 students per group</code>.</p>' +
            '<p><strong>Number of groups</strong> — use this when classroom resources determine the number of teams.</p>' +
            '<p>Example: "There are five activity stations." Enter <code>5 groups</code>.</p>' +
            '<p>The tool distributes students as evenly as possible.</p>' +
            '<p>Think about what is fixed in the lesson: team size or number of destinations.</p><p>Choose that as the primary setting.</p>' },
        { h: 'What Does "Balanced" Mean Here?',
          html: '<p>For a purely random grouping tool, balanced usually means balanced group size.</p>' +
            '<p>Suppose there are 26 students and you want six groups.</p>' +
            '<p>The groups cannot all contain exactly the same number of students because 26 does not divide evenly by 6.</p>' +
            '<p>A sensible arrangement distributes the remainder rather than placing it all in the final group.</p><p>For example: two groups of 5, four groups of 4.</p>' +
            '<p>That is more balanced than: five groups of 4, one group of 6.</p>' +
            '<p>The generator is not claiming to balance attainment, language proficiency, gender or behavior unless those variables are explicitly part of the tool.</p>' },
        { h: 'Random Groups vs Ability Groups',
          html: '<p>Random grouping and attainment-based grouping serve different purposes.</p><p>Random groups are useful for:</p>',
          list: ['mixing social patterns', 'quick collaboration', 'low-stakes activities', 'avoiding obvious teacher preference'],
          after: '<p>Flexible instructional groups can be more appropriate when students currently share a specific learning need.</p>' +
            '<p>The Education Endowment Foundation describes flexible grouping as temporary grouping based on current needs, while also recognizing heterogeneous collaborative groups as another valid approach.</p>' +
            '<p>Avoid turning temporary attainment groups into fixed labels.</p>' +
            '<p>If students need targeted instruction, group for that purpose.</p>' +
            '<p>If they simply need partners for a discussion task, randomization may be enough.</p>' },
        { h: 'Group Size for Collaborative Learning',
          html: '<p>The ideal group size depends on the task.</p>' +
            '<p>The Education Endowment Foundation reports that promising collaborative-learning approaches often use groups of around three to five pupils with a shared outcome or goal.</p>' +
            '<p>That range makes practical sense for many classroom activities because it is large enough for several perspectives but small enough for each student to participate.</p>' +
            '<p>Still, it is not a universal rule.</p><p>A drama activity may need six.</p>' +
            '<p>A peer-review task may work better in threes.</p><p>A lab bench may physically fit four.</p>' +
            '<p>Choose group size from the task design, not from a generic recommendation alone.</p>' },
        { h: 'Keep-Together Rules',
          html: '<p>A keep-together rule places two students in the same group.</p><p>This can be useful for:</p>',
          list: ['language buddies', 'paired support', 'accessibility assistance', 'a planned peer mentor', 'students sharing one project role'],
          after: '<p>Use the rule intentionally.</p>' +
            '<p>Do not create permanent dependence where a student never gets the chance to work with other classmates.</p>' +
            '<p>If the arrangement is a support accommodation, follow the school’s plan and professional guidance.</p>' +
            '<p>The generator simply honors the pairing constraint where possible.</p>' +
            '<p>A keep-together pair effectively behaves like a small block that must fit into one group.</p>' +
            '<p>That can affect how the rest of the class is distributed.</p>' },
        { h: 'Keep-Apart Rules',
          html: '<p>Keep-apart rules prevent specified pairs from being placed in the same group.</p><p>Possible reasons include:</p>',
          list: ['known conflict', 'repeated off-task behavior', 'safeguarding', 'a classroom management plan', 'a need to widen participation'],
          after: '<p>Do not publish the constraint list.</p><p>Students only need the final group assignments.</p>' +
            '<p>Also avoid using dozens of keep-apart rules as a substitute for a broader classroom-management decision.</p>' +
            '<p>Once constraints become extensive, random grouping may no longer be the right tool.</p>' +
            '<p>A deliberately constructed group plan may be clearer and easier to explain.</p>' },
        { h: 'What If Keep-Together and Keep-Apart Rules Conflict?',
          html: '<p>Constraints can contradict one another.</p><p>Example: Amara must stay with Ben. Ben must stay with Chen. Amara must stay apart from Chen.</p>' +
            '<p>No grouping can satisfy all three instructions.</p><p>Group-size limits can create similar conflicts.</p>' +
            '<p>If a keep-together cluster contains four students but groups are set to three, the requested arrangement is impossible.</p>' +
            '<p>When the tool warns that a rule cannot be honored, review the constraints rather than repeatedly reshuffling.</p>' +
            '<p>Prioritize genuine safety and support requirements.</p>' +
            '<p>Then simplify lower-priority preferences until a valid arrangement exists.</p>' },
        { h: 'Custom Group Names',
          html: '<p>Custom group names are useful when the room already has table colors, station names, lab benches or project themes.</p>' +
            '<p>Examples: Red, Blue, Green, Yellow, or Station A, Station B, Station C.</p>' +
            '<p>Names reduce transition time because students can move directly to a known destination.</p>' +
            '<p>Avoid group names that imply ability.</p><p>Labels such as "Top," "Middle," "Low" can make instructional grouping unnecessarily public.</p>' +
            '<p>Use neutral names even when the teacher formed the groups deliberately.</p>' },
        { h: 'Why Use a Seed?',
          html: '<p>A seed makes the random grouping reproducible.</p><p>Same student list, settings, constraints and seed can reproduce the same result.</p><p>This is useful when:</p>',
          list: ['planning before class', 'sharing groups with a co-teacher', 'recreating a printed list', 'documenting group assignments', 'returning to the same teams next lesson'],
          after: '<p>Reshuffling without a fixed seed gives a different arrangement.</p>' +
            '<p>Use a seed when consistency matters.</p><p>Leave it flexible when the point is to make fresh groups each time.</p>' },
        { h: 'Random Does Not Mean Perfectly Fair Over Time',
          html: '<p>One random grouping can be fair in the sense that the teacher did not choose favorites.</p>' +
            '<p>That does not guarantee every student gets equally varied classmates over several weeks.</p>' +
            '<p>Pure randomization can produce repeats.</p>' +
            '<p>If your goal is systematically changing partners, use the <a href="/tools/random-student-pair-generator">Random Student Pair Generator</a>’s no-repeat mode for pair work.</p>' +
            '<p>For larger groups, track repeated combinations if that matters to the curriculum.</p>' +
            '<p>You do not need perfect combinatorial fairness for every short classroom activity.</p>' +
            '<p>The practical goal is usually enough variety to prevent the same social pattern from dominating.</p>' },
        { h: 'Protect Student Privacy',
          html: '<p>Use only the information needed to generate the groups.</p>' +
            '<p>Usually, student names or short teacher-recognizable labels are enough.</p>' +
            '<p>Do not paste sensitive notes into the roster.</p><p>Avoid entries such as:</p>' +
            '<pre class="code">Ben - behavior plan\nAmara - dyslexia\nChen - low reader</pre>' +
            '<p>Those labels do not belong in a random group list and may expose information if the screen is projected.</p>' +
            '<p>Student names and IDs can be personally identifiable information under education privacy rules.</p>' +
            '<p>Keep hidden constraints private and display only the final groups.</p>' },
        { h: 'Common Classroom Grouping Mistakes',
          html: '<p>Avoid these problems:</p>',
          list: ['confusing equal group size with equal academic ability', 'creating permanent ability labels', 'using more constraints than the schedule can satisfy',

                 'reshuffling repeatedly because someone dislikes the result', 'encoding sensitive student information in the roster',
                 'forgetting physical station capacity', 'treating generated groups as fixed when attendance changes'],
          after: '<p>Good grouping supports a specific task. There is no single arrangement that is "best" for every lesson.</p>' }

        'classroom group size collaborative learning', 'random groups vs ability groups', 'classroom station groups generator',
