<body data-root="../">

<section class="hero" id="hero"></section>

<section id="toolApp">
<div class="wrap">
<div class="tool-grid">

  <form class="card card-pad" id="cfg" autocomplete="off">
    <div class="panel-title"><span class="ico" id="icoGear"></span>Schema Builder</div>

    <div class="field">
      <label for="template">Start from a template</label>
      <select id="template">
        <option value="users" selected>Users</option>
        <option value="products">Products</option>
        <option value="orders">Orders</option>
        <option value="posts">Blog posts</option>
        <option value="events">Analytics events</option>
        <option value="empty">Empty schema</option>
      </select>
    </div>

    <div class="row">
      <div class="field">
        <label for="count">Rows</label>
        <input type="number" id="count" value="10" min="1" max="10000">
      </div>
      <div class="field">
        <label for="seed">Seed</label>
        <div class="row" style="grid-template-columns:minmax(0,1fr) auto;gap:8px">
          <input type="text" id="seed" value="gentools">
          <button type="button" class="btn btn-soft" id="newSeed"><span id="icoReset"></span></button>
        </div>
      </div>
    </div>
    <div class="hint" style="margin:-8px 0 16px">The same seed always produces the same data — commit it and your test fixtures stay stable across runs.</div>

    <div class="field">
      <div class="label" style="display:flex;justify-content:space-between;align-items:center">
        <span>Fields</span>
        <button type="button" class="btn btn-soft btn-sm" id="addField"><span id="icoPlus"></span> Add field</button>
      </div>
      <div id="fields"></div>
    </div>

    <div class="divider"></div>

    <div class="field">
      <label for="output">Output shape</label>
      <select id="output">
        <option value="array">Array of objects</option>
        <option value="wrapped">Wrapped in a data envelope</option>
        <option value="paginated">Paginated API response</option>
        <option value="ndjson">NDJSON (one object per line)</option>
        <option value="keyed">Object keyed by id</option>
        <option value="ts">TypeScript interface + data</option>
      </select>
      <input type="text" id="rootKey" value="data" placeholder="data" style="margin-top:8px" hidden>
    </div>

    <fieldset class="field">
      <legend class="label">Formatting</legend>
      <div class="check-list">
        <label class="check on"><input type="checkbox" id="optPretty" checked><span><span class="t">Pretty-print</span><span class="d">Two-space indentation. Off gives minified output.</span></span></label>
        <label class="check"><input type="checkbox" id="optSort"><span><span class="t">Sort keys alphabetically</span></span></label>
      </div>
    </fieldset>
  </form>

  <div class="card card-pad">
    <div class="panel-title"><span class="ico" id="icoSpark"></span>Generated JSON<span class="spacer"></span>
      <span class="result-pill" id="pill"></span></div>

    <div class="tabs" id="tabs">
      <button type="button" class="on" data-tab="file">JSON</button>
      <button type="button" data-tab="table">Preview table</button>
      <button type="button" data-tab="types">Types &amp; schema</button>
    </div>

    <div data-panel="file">
      <div class="output-box">
        <div class="output-bar"><span class="fname" id="fname">data.json</span><span class="chip" id="meta"></span></div>
        <pre class="code" id="out"></pre>
      </div>
      <div class="out-actions">
        <button class="btn btn-primary" id="copyBtn"><span id="icoCopy"></span> Copy</button>
        <button class="btn btn-ghost" id="dlBtn"><span id="icoDl"></span> Download</button>
      </div>
      <div id="warnBox"></div>
    </div>

    <div data-panel="table" hidden><div id="table" style="overflow-x:auto"></div></div>
    <div data-panel="types" hidden><div id="types"></div></div>
  </div>

</div>
</div>

<div id="afterTool"></div>

<script src="../assets/js/site.js"></script>
<script src="../assets/js/fake.js"></script>
<script>
(function () {
  var I = GTI, $ = GT.$, $$ = GT.$$;
  ['icoGear:gear','icoSpark:spark','icoCopy:copy','icoDl:download','icoReset:reset','icoPlus:plus']
    .forEach(function (p) { var a = p.split(':'); document.getElementById(a[0]).innerHTML = I[a[1]]; });

  var TEMPLATES = {
    users: [
      { name: 'id', type: 'id' }, { name: 'uuid', type: 'uuid' },
      { name: 'name', type: 'fullName' }, { name: 'email', type: 'email' },
      { name: 'role', type: 'role' }, { name: 'active', type: 'bool' },
      { name: 'country', type: 'country' }, { name: 'createdAt', type: 'datetime' }
    ],
    products: [
      { name: 'id', type: 'id' }, { name: 'sku', type: 'sku' },
      { name: 'name', type: 'product' }, { name: 'price', type: 'price' },
      { name: 'currency', type: 'currency' }, { name: 'stock', type: 'int', min: 0, max: 500 },
      { name: 'active', type: 'bool' }
    ],
    orders: [
      { name: 'orderId', type: 'uuid7' }, { name: 'customer', type: 'fullName' },
      { name: 'email', type: 'email' }, { name: 'total', type: 'price' },
      { name: 'currency', type: 'currency' }, { name: 'status', type: 'status' },
      { name: 'placedAt', type: 'datetime' }, { name: 'city', type: 'city' }
    ],
    posts: [
      { name: 'id', type: 'id' }, { name: 'slug', type: 'slug' },
      { name: 'title', type: 'sentence' }, { name: 'body', type: 'paragraph' },
      { name: 'author', type: 'fullName' }, { name: 'publishedAt', type: 'date' },
      { name: 'views', type: 'int', min: 0, max: 50000 }
    ],
    events: [
      { name: 'eventId', type: 'nanoid' }, { name: 'userId', type: 'uuid' },
      { name: 'event', type: 'enum', values: 'page_view,click,signup,purchase,logout' },
      { name: 'ip', type: 'ipv4' }, { name: 'url', type: 'url' },
      { name: 'timestamp', type: 'timestamp' }
    ],
    empty: [{ name: 'id', type: 'id' }]
  };

  var fields = JSON.parse(JSON.stringify(TEMPLATES.users));
  var editor = GTFake.mountFields($('#fields'), fields, build);

  $('#addField').addEventListener('click', function () {
    fields.push({ name: 'field_' + (fields.length + 1), type: 'word' });
    editor.render(); build();
  });
  $('#template').addEventListener('change', function () {
    fields.length = 0;
    JSON.parse(JSON.stringify(TEMPLATES[this.value] || [])).forEach(function (f) { fields.push(f); });
    editor.render(); build();
  });
  $('#newSeed').addEventListener('click', function () {
    $('#seed').value = Math.random().toString(36).slice(2, 10); build();
  });

  var out = GT.mountOutput({ pre: '#out', fileLabel: '#fname', meta: '#meta',
    copyBtn: '#copyBtn', downloadBtn: '#dlBtn', filename: 'data.json', mime: 'application/json' });

  var rows = [];

  function build() {
    var n = Math.max(1, Math.min(10000, parseInt($('#count').value, 10) || 1));
    var valid = fields.filter(function (f) { return (f.name || '').trim(); });
    rows = GTFake.rows(valid, n, $('#seed').value);

    if ($('#optSort').checked) {
      rows = rows.map(function (r) {
        var o = {}; Object.keys(r).sort().forEach(function (k) { o[k] = r[k]; }); return o;
      });
    }

    var indent = $('#optPretty').checked ? 2 : 0;
    var mode = $('#output').value, text, file = 'data.json';
    var key = $('#rootKey').value || 'data';

    if (mode === 'wrapped') {
      var w = {}; w[key] = rows;
      text = JSON.stringify(w, null, indent);
    } else if (mode === 'paginated') {
      text = JSON.stringify({
        data: rows,
        meta: { page: 1, perPage: n, total: n * 7, totalPages: 7 },
        links: { self: '/api/items?page=1', next: '/api/items?page=2', prev: null }
      }, null, indent);
    } else if (mode === 'ndjson') {
      text = rows.map(function (r) { return JSON.stringify(r); }).join('\n');
      file = 'data.ndjson';
    } else if (mode === 'keyed') {
      var idField = valid.find(function (f) { return /^(id|uuid|_id)$/i.test(f.name); }) || valid[0];
      var o = {};
      rows.forEach(function (r) { o[String(r[idField.name])] = r; });
      text = JSON.stringify(o, null, indent);
    } else if (mode === 'ts') {
      text = tsInterface(valid) + '\n\nexport const data: Item[] = ' + JSON.stringify(rows, null, 2) + ';';
      file = 'data.ts';
    } else {
      text = JSON.stringify(rows, null, indent);
    }

    out.set(text, file);
    $('#pill').textContent = n.toLocaleString() + ' rows · ' + valid.length + ' fields';
    $('#pill').style.background = 'var(--green-bg)'; $('#pill').style.color = 'var(--green)';

    renderTable(valid);
    renderTypes(valid);
    renderWarn(valid);
  }

  function tsInterface(valid) {
    return 'export interface Item {\n' + valid.map(function (f) {
      var t = GTFake.typeMeta(f.type).ts;
      return '  ' + f.name + (f.nullable ? '?' : '') + ': ' + t + (f.nullable ? ' | null' : '') + ';';
    }).join('\n') + '\n}';
  }

  function renderTable(valid) {
    var head = valid.map(function (f) { return f.name; });
    var slice = rows.slice(0, 15);
    $('#table').innerHTML =
      '<p style="color:var(--muted);font-size:13.5px;margin-bottom:12px">First ' + slice.length + ' of ' + rows.length + ' rows.</p>' +
      '<table style="border-collapse:collapse;width:100%;font-size:12.5px;font-family:var(--mono)">' +
      '<tr>' + head.map(function (h) {
        return '<th style="text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap">' + GT.esc(h) + '</th>';
      }).join('') + '</tr>' +
      slice.map(function (r) {
        return '<tr>' + head.map(function (h) {
          var v = r[h];
          var s = v === null ? '<span style="color:var(--muted-2)">null</span>' : GT.esc(String(v)).slice(0, 40);
          return '<td style="padding:8px;border-bottom:1px solid var(--line-2);white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis">' + s + '</td>';
        }).join('') + '</tr>';
      }).join('') + '</table>';
  }

  function renderTypes(valid) {
    var props = {};
    valid.forEach(function (f) {
      var t = GTFake.typeMeta(f.type).ts;
      props[f.name] = { type: t === 'null' ? 'null' : t };
    });
    $('#types').innerHTML =
      '<h4 style="font-size:14.5px;margin-bottom:8px">TypeScript</h4>' +
      '<pre class="code">' + GT.esc(tsInterface(valid)) + '</pre>' +
      '<h4 style="font-size:14.5px;margin:18px 0 8px">JSON Schema</h4>' +
      '<pre class="code">' + GT.esc(JSON.stringify({
        $schema: 'https://json-schema.org/draft/2020-12/schema',
        type: 'array',
        items: { type: 'object', properties: props, required: valid.filter(function (f) { return !f.nullable; }).map(function (f) { return f.name; }) }
      }, null, 2)) + '</pre>' +
      '<h4 style="font-size:14.5px;margin:18px 0 8px">Load in a test</h4>' +
      '<pre class="code">' + GT.esc("import data from './data.json';\n\ntest('renders every row', () => {\n  render(<List items={data} />);\n  expect(screen.getAllByRole('listitem')).toHaveLength(data.length);\n});") + '</pre>';
  }

  function renderWarn(valid) {
    var w = [];
    var names = valid.map(function (f) { return f.name; });
    var dup = names.filter(function (n, i) { return names.indexOf(n) !== i; });
    if (dup.length) w.push(['err', 'Duplicate field names: ' + GT.uniq(dup).join(', ') + ' — later fields silently overwrite earlier ones in a JSON object.']);
    if (!valid.length) w.push(['err', 'Add at least one field.']);
    var badName = valid.filter(function (f) { return !/^[A-Za-z_$][\w$]*$/.test(f.name); });
    if (badName.length) w.push(['warn', 'These names need bracket access in JavaScript: ' + badName.map(function (f) { return f.name; }).join(', ') + '.']);
    if (rows.length > 2000) w.push(['warn', rows.length.toLocaleString() + ' rows is a large fixture. Consider generating a smaller sample for unit tests and keeping the full set for load testing.']);
    if (!w.length) w.push(['ok', 'Deterministic output — seed “' + $('#seed').value + '” will reproduce this exact dataset.']);
    $('#warnBox').innerHTML = w.map(function (x) {
      return '<div class="note ' + (x[0] === 'ok' ? 'note-ok' : x[0] === 'warn' ? 'note-warn' : 'note-err') + '">' +
        (x[0] === 'ok' ? I.check : I.warn) + '<span>' + x[1] + '</span></div>';
    }).join('');
  }

  $('#output').addEventListener('change', function () { $('#rootKey').hidden = this.value !== 'wrapped'; build(); });
  $('#tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    $$('#tabs button').forEach(function (x) { x.classList.toggle('on', x === b); });
    $$('[data-panel]').forEach(function (p) { p.hidden = p.getAttribute('data-panel') !== b.getAttribute('data-tab'); });
  });
  $('#cfg').addEventListener('submit', function (e) { e.preventDefault(); build(); });
  ['#count','#seed','#optPretty','#optSort','#rootKey'].forEach(function (s) {
    $(s).addEventListener('change', build); $(s).addEventListener('input', build);
  });

  build();

  GT.page({
    slug: 'json-test-data-generator',
    lede: 'Design a schema, pick a seed, and get realistic JSON fixtures that are identical on every run — plus the TypeScript interface and JSON Schema to match.',
    steps: [
      { icon: 'gear', title: 'Build the schema', text: 'Start from a template, then add fields from 40 realistic types.' },
      { icon: 'braces', title: 'Set a seed', text: 'The same seed always produces the same data, so committed fixtures never drift.' },
      { icon: 'copy', title: 'Export', text: 'Array, envelope, paginated response, NDJSON, keyed object or a typed TypeScript module.' }
    ],
    guideTitle: 'Why seeded fixtures beat random ones',
    guide:
      '<p style="color:var(--muted)">Test data that changes on every run produces tests that fail on every third CI build for reasons nobody can reproduce locally. A seeded generator gives you the best of both: data that looks real enough to catch layout and encoding bugs, and values that are byte-identical every time you run it.</p>' +
      '<div class="grid g2" style="margin-top:18px">' +
      '<div><h4 style="font-size:14.5px;margin-bottom:8px">What realistic data catches</h4><ul style="color:var(--muted);font-size:13.8px;padding-left:18px;margin:0"><li>Layouts that break on a long name or a 4-line paragraph.</li><li>Sorting that only looks right because every fixture row said "Test User".</li><li>Currency and date formatting assumptions.</li><li>Null handling — turn on “sometimes null” and watch what falls over.</li><li>Pagination logic, using the paginated output shape.</li></ul></div>' +
      '<div><h4 style="font-size:14.5px;margin-bottom:8px">Choosing an output shape</h4><ul style="color:var(--muted);font-size:13.8px;padding-left:18px;margin:0"><li><strong>Array</strong> — the default for component fixtures.</li><li><strong>Envelope / paginated</strong> — match a real API contract so your client code is exercised properly.</li><li><strong>NDJSON</strong> — streaming, log pipelines, bulk import into Elasticsearch or BigQuery.</li><li><strong>Keyed object</strong> — normalized store shapes such as Redux or a lookup cache.</li><li><strong>TypeScript</strong> — typed fixtures that fail compilation when the schema drifts.</li></ul></div></div>' +
      '<div class="note note-info" style="margin-top:18px">' + GTI.info + '<span>All the names, emails and domains here come from reserved example ranges (<code>example.com</code>, <code>example.org</code>) and invented word lists. Nothing corresponds to a real person, and no email in the output can reach a live inbox.</span></div>',
    related: ['csv-test-data-generator', 'sql-insert-data-generator', 'json-array-generator'],
faqs: [
      { q: 'What is JSON test data?', a: 'It is fictional structured data used to test software without relying on live production records.' },
      { q: 'Can I generate the same JSON twice?', a: 'Yes. Use the same seed, schema and settings when you need deterministic repeatable fixtures.' },
      { q: 'Is generated JSON valid JSON?', a: 'The tool produces JSON-formatted output using supported JSON types. Always make sure your selected fields also match the contract your application expects.' },
      { q: 'Does JSON have a date type?', a: 'No. Dates are normally represented as strings or numeric timestamps by convention.' },
      { q: 'Can I generate an array of objects?', a: 'Yes. Use the appropriate output shape for a collection of generated records.' },
      { q: 'Should I use real customer data for testing?', a: 'Avoid it when synthetic data can cover the test. Generated fictional data reduces privacy and handling risks.' },
      { q: 'Can I download the generated data?', a: 'Yes. Generate the fixture, preview it, then copy or download the JSON file.' }
    ],
    seo: {
      title: 'JSON Test Data Generator – Create Realistic Mock Fixtures Online',
      lead: 'Need believable JSON for a UI, API test, seed file or demo without using real customer data? Use the JSON Test Data Generator above to build a schema and generate structured mock records in seconds.',
      blocks: [
        { html: '<p>Choose a template or define your own fields, set the number of rows, enter a seed when you need repeatable output, then copy or download the generated JSON. You can pretty-print the result for readability or keep it compact for smaller files.</p>' +
            '<p>The useful part is not simply producing random names. Good test data should match the shape your application expects, preserve JSON data types and remain reproducible when a test needs the same fixture tomorrow.</p>' },
        { h: 'What Is a JSON Test Data Generator?',
          html: '<p>A JSON test data generator creates fictional records formatted as valid JSON.</p><p>Instead of manually writing objects such as:</p>' +
            '<pre class="code">{"id":1,"name":"Example User","active":true}</pre><p>you define the fields once and generate many records.</p>' +
            '<p>Typical field types include IDs, sequences, UUIDs, names, emails, usernames, phone numbers, dates, timestamps, integers, decimals, booleans, prices, countries, cities, URLs, status values, lorem text and fixed values.</p>' +
            '<p>This is useful anywhere software needs realistic-shaped data but should not depend on production information.</p>' },
        { h: 'How to Use This JSON Test Data Generator',
          html: '<p>Start from a template if it resembles your data model.</p><p>Templates are useful for common records such as users, products, orders or API objects.</p>' +
            '<p>Otherwise, create the fields manually.</p><p>Give each field a meaningful property name and select the type of value it should contain.</p><p>For example:</p>' +
            '<pre class="code">id → sequence\nname → full name\nemail → email\nactive → boolean\ncreatedAt → timestamp</pre>' +
            '<p>Set the number of rows and choose the output shape.</p>' +
            '<p>Use a seed when you want the same schema and seed to produce the same fixture again.</p>' +
            '<p>Generate the JSON, inspect the preview and download the file when the structure matches your test.</p>' },
        { h: 'Why Seeded Test Data Matters',
          html: '<p>Random data is useful until a test fails once and cannot reproduce the same input.</p><p>A seed solves that problem.</p>' +
            '<p>With deterministic seeded generation, the same seed can produce the same sequence of generated values.</p>' +
            '<p>That gives you repeatable fixtures for unit tests, integration tests, visual regression tests, bug reproduction, demo environments, documentation screenshots and front-end development.</p>' +
            '<p>For example, a bug discovered with seed <code>checkout-1042</code> can be rerun later with the same fixture instead of hoping a random generator recreates the bad case.</p>' +
            '<p>Seeds also make generated files practical to commit to a test workflow without manually maintaining hundreds of fake rows.</p>' },
        { h: 'Valid JSON Data Types',
          html: '<p>JSON supports a small set of data types:</p>',
          list: ['string', 'number', 'boolean', 'null', 'object', 'array'],
          after: '<p>That simplicity is one reason JSON is widely used for APIs.</p><p>However, it also creates common test-data mistakes.</p>' +
            '<p>A number should not be wrapped in quotes if your API expects a JSON number.</p><p>Correct:</p><pre class="code">"age": 37</pre>' +
            '<p>Different type:</p><pre class="code">"age": "37"</pre>' +
            '<p>Likewise, JSON booleans are <code>true</code> and <code>false</code>, not <code>"true"</code> and <code>"false"</code>.</p>' +
            '<p>Good fixtures preserve these distinctions because validation, sorting, filtering and database mapping can behave differently when the type is wrong.</p>' },
        { h: 'JSON Objects and Arrays',
          html: '<p>Most API fixtures use one of two shapes.</p><p>An array of objects:</p><pre class="code">[{"id":1},{"id":2}]</pre>' +
            '<p>or a wrapper object:</p><pre class="code">{"data":[{"id":1},{"id":2}]}</pre><p>Both are valid JSON.</p>' +
            '<p>Choose the shape your application actually returns or consumes.</p>' +
            '<p>A wrapper object is useful when an API response also includes metadata such as pagination, total count, links, status or filters.</p>' +
            '<p>A plain array is simpler when the endpoint genuinely returns only a collection.</p>' +
            '<p>Do not choose a wrapper solely because it looks more “API-like.” Match the contract you are testing.</p>' },
        { h: 'Realistic Data vs Real Personal Data',
          html: '<p>Realistic test data should look plausible without copying actual customer records.</p><p>That distinction matters.</p>' +
            '<p>A production database may contain names, addresses, phone numbers, account IDs and other sensitive data that should not be moved into developer laptops or public demos.</p>' +
            '<p>Synthetic data lets a team test layout width, search, filtering, pagination, validation, imports, exports and API rendering without reusing live user information.</p>' +
            '<p>Mock data is not automatically anonymous production data. It is better to generate fictional values from scratch than to assume lightly edited customer data is safe.</p>' },
        { h: 'Test More Than the Happy Path',
          html: '<p>Perfectly clean fake data can hide bugs.</p><p>A useful test dataset should also challenge assumptions.</p>' +
            '<p>Depending on your application, include cases such as empty strings, null values, long names, Unicode characters, zero values, negative values, large numbers, duplicate-looking names, unusual dates, optional fields, false booleans and boundary values.</p>' +
            '<p>The right edge cases depend on the schema.</p>' +
            '<p>For example, a checkout form should test long addresses and non-ASCII names. A dashboard should test zero values and large totals. An API parser should test nulls where the contract permits them.</p>' },
        { h: 'Pretty-Printed vs Minified JSON',
          html: '<p>Pretty-printed JSON uses whitespace and indentation:</p><pre class="code">{\n  "id": 1,\n  "active": true\n}</pre>' +
            '<p>Minified JSON removes unnecessary whitespace:</p><pre class="code">{"id":1,"active":true}</pre>' +
            '<p>The data is equivalent.</p><p>Pretty printing is better for code review, documentation, debugging and hand inspection.</p>' +
            '<p>Minified output is smaller and may be more convenient for transfer-size tests.</p>' +
            '<p>Do not confuse formatting with data structure. Whitespace outside JSON strings does not change the represented values.</p>' },
        { h: 'JSON Dates Are Strings',
          html: '<p>JSON has no native date type.</p><p>Dates are normally represented as strings.</p><p>A common API format is an ISO 8601-style timestamp such as:</p>' +
            '<pre class="code">"2026-08-15T14:30:00Z"</pre><p>Your application must agree on the expected date representation.</p>' +
            '<p>Possible conventions include full UTC timestamps, date-only values, timestamps with offsets, Unix seconds as numbers or Unix milliseconds as numbers.</p>' +
            '<p>A generated date that looks reasonable can still break a test if it uses the wrong representation.</p><p>Match the actual API contract.</p>' },
        { h: 'IDs, UUIDs and Fixture Relationships',
          html: '<p>Random data becomes more useful when related records stay related.</p>' +
            '<p>Suppose an order contains <code>"userId": "..."</code> and your users fixture contains IDs.</p>' +
            '<p>If the two datasets are generated independently with unrelated values, relationship tests become awkward.</p>' +
            '<p>For complex test environments, generate parent IDs first and reuse them in dependent fixtures.</p>' +
            '<p>For simple single-file mock data, UUIDs and sequence IDs are useful because every row can have a stable-looking identity.</p>' +
            '<p>Use the <a href="/tools/uuid-v7-generator">UUID v7 Generator</a> when you specifically need standalone time-ordered UUID fixtures.</p>' },
        { h: 'JSON Schema and Generated Fixtures',
          html: '<p>A generator schema describes what data to create.</p><p>A formal JSON Schema describes what data is valid.</p><p>They are related, but they are not the same thing.</p>' +
            '<p>JSON Schema can express constraints such as required properties, data types, numeric limits, string patterns, array item rules and allowed values.</p>' +
            '<p>If your application publishes a JSON Schema, generated test data should ideally be validated against it.</p>' +
            '<p>A visually convincing object can still violate a formal contract.</p>' +
            '<p>Generation gives you examples; validation proves those examples satisfy the rules.</p>' },
        { h: 'Mock JSON for API Development',
          html: '<p>Front-end developers often need data before a backend endpoint is finished.</p>' +
            '<p>Generated JSON can unblock table layouts, cards, charts, profile screens, filters, pagination controls, loading states and empty states.</p>' +
            '<p>Start with the field names and types from the planned API contract.</p><p>Then generate enough rows to expose layout behavior.</p>' +
            '<p>Five perfect rows are not enough to test pagination. One short product name is not enough to prove a card handles long text.</p>' +
            '<p>Use the row count intentionally.</p>' },
        { h: 'Common JSON Test Data Mistakes',
          html: '<p>Avoid these problems:</p>',
          list: ['Using strings where numbers or booleans are expected', 'Copying production data instead of generating fictional records', 'Testing only clean happy-path values',
                 'Using fresh randomness when a failing test must be reproducible', 'Assuming JSON has a native date type', 'Depending on object key order',
                 'Generating IDs without maintaining relationships between fixtures', 'Creating thousands of rows when ten carefully chosen edge cases would test more',
                 'Assuming realistic-looking data automatically satisfies JSON Schema'],
          after: '<p>The best fixture is not the biggest. It is the one that exercises the behavior you actually need to verify. For flat CSV or SQL output instead, see the <a href="/tools/csv-test-data-generator">CSV Test Data Generator</a> and the <a href="/tools/sql-insert-data-generator">SQL Insert Data Generator</a>.</p>' }
      ],
      keywords: ['json test data generator', 'mock json fixtures', 'seeded json generator', 'realistic fake json data',
        'json schema test data', 'json array of objects generator', 'repeatable test fixtures', 'json date format testing',
        'pretty print json vs minified', 'json data types testing', 'fake api response generator', 'json edge case test data']
    }
  });
