<body data-root="../">

<section class="hero" id="hero"></section>

<section id="toolApp">
<div class="wrap">
<div class="tool-grid">

  <form class="card card-pad" id="cfg" autocomplete="off">
    <div class="panel-title"><span class="ico" id="icoGear"></span>Worksheet Settings</div>

    <div class="field">
      <label for="mode">Exercise type</label>
      <select id="mode">
        <option value="missing" selected>Fill in the missing numbers</option>
        <option value="plot">Plot the marked value</option>
        <option value="identify">What number is the dot on?</option>
        <option value="jump">Addition and subtraction jumps</option>
        <option value="fraction">Fractions on a number line</option>
      </select>
      <div class="hint" id="modeHint"></div>
    </div>

    <div class="row">
      <div class="field"><label for="min">Line starts at</label><input type="number" id="min" value="0"></div>
      <div class="field"><label for="max">Line ends at</label><input type="number" id="max" value="20"></div>
    </div>

    <div class="row">
      <div class="field">
        <label for="step">Interval</label>
        <select id="step">
          <option value="1" selected>1</option>
          <option value="2">2</option>
          <option value="5">5</option>
          <option value="10">10</option>
          <option value="0.5">0.5</option>
          <option value="0.1">0.1</option>
        </select>
      </div>
      <div class="field">
        <label for="blanks">Blanks per line</label>
        <input type="number" id="blanks" value="3" min="1" max="10">
      </div>
    </div>

    <div class="field" id="denomField" hidden>
      <label for="denom">Fraction denominator</label>
      <select id="denom">
        <option value="2">Halves</option>
        <option value="3">Thirds</option>
        <option value="4" selected>Quarters</option>
        <option value="5">Fifths</option>
        <option value="8">Eighths</option>
        <option value="10">Tenths</option>
      </select>
    </div>

    <div class="row">
      <div class="field"><label for="count">Questions</label><input type="number" id="count" value="8" min="1" max="30"></div>
      <div class="field">
        <label for="width">Line width</label>
        <select id="width">
          <option value="380">Narrow</option>
          <option value="460" selected>Medium</option>
          <option value="560">Wide</option>
        </select>
      </div>
    </div>

    <fieldset class="field">
      <legend class="label">Options</legend>
      <div class="check-list">
        <label class="check"><input type="checkbox" id="optNegatives">
          <span><span class="t">Include negative numbers</span><span class="d">Extends the line below zero.</span></span></label>
        <label class="check on"><input type="checkbox" id="optKey" checked>
          <span><span class="t">Include answer key page</span></span></label>
      </div>
    </fieldset>

    <div class="row">
      <div class="field">
        <label for="title">Worksheet title</label>
        <input type="text" id="title" value="Number Lines">
      </div>
      <div class="field">
        <label for="seed">Seed</label>
        <div class="row" style="grid-template-columns:minmax(0,1fr) auto;gap:8px">
          <input type="text" id="seed" value="nl-1">
          <button type="button" class="btn btn-soft" id="newSeed"><span id="icoReset"></span></button>
        </div>
      </div>
    </div>

    <div class="out-actions">
      <button type="submit" class="btn btn-primary btn-block"><span id="icoBolt"></span> Generate Worksheet</button>
    </div>
  </form>

  <div class="card card-pad">
    <div class="panel-title"><span class="ico" id="icoSpark"></span>Worksheet<span class="spacer"></span>
      <span class="result-pill" id="pill"></span></div>

    <div class="tabs" id="tabs">
      <button type="button" class="on" data-tab="preview">Preview</button>
      <button type="button" data-tab="key">Answer key</button>
      <button type="button" data-tab="guide">Teaching notes</button>
    </div>

    <div data-panel="preview">
      <div id="preview"></div>
      <div class="out-actions" style="margin-top:16px">
        <button type="button" class="btn btn-primary" id="printBtn"><span id="icoFile"></span> Print / PDF</button>
        <button type="button" class="btn btn-soft" id="regen"><span id="icoReset2"></span> New questions</button>
      </div>
      <div id="checks"></div>
    </div>

    <div data-panel="key" hidden><div id="key"></div></div>
    <div data-panel="guide" hidden><div id="guide"></div></div>
  </div>

</div>

<div id="afterTool"></div>

<script src="../assets/js/site.js"></script>
<script src="../assets/js/worksheet.js"></script>
<script>
(function () {
  var I = GTI, $ = GT.$, $$ = GT.$$, W = GTWorksheet;
  ['icoGear:gear','icoSpark:spark','icoBolt:bolt','icoReset:reset','icoReset2:reset','icoFile:file']
    .forEach(function (p) { var a = p.split(':'); document.getElementById(a[0]).innerHTML = I[a[1]]; });

  var HINTS = {
    missing: 'Some labels are removed; the student writes them in.',
    plot: 'A value is given; the student marks it on the line.',
    identify: 'A dot is placed; the student reads off the value.',
    jump: 'An arrow shows a jump; the student writes the calculation.',
    fraction: 'The line runs from 0 to 1 (or beyond) divided into equal fractional parts.'
  };

  var items = [];

  function build() {
    var mode = $('#mode').value;
    $('#modeHint').textContent = HINTS[mode];
    $('#denomField').hidden = mode !== 'fraction';

    var rand = W.rng($('#seed').value);
    var n = Math.max(1, Math.min(30, parseInt($('#count').value, 10) || 1));
    var width = parseInt($('#width').value, 10);
    var blanks = Math.max(1, parseInt($('#blanks').value, 10) || 1);

    var min = parseFloat($('#min').value), max = parseFloat($('#max').value);
    var step = parseFloat($('#step').value);
    if ($('#optNegatives').checked && min >= 0) min = -Math.abs(max);
    if (min > max) { var t = min; min = max; max = t; }

    items = [];

    for (var i = 0; i < n; i++) {
      if (mode === 'fraction') {
        var d = parseInt($('#denom').value, 10);
        var fMin = 0, fMax = 1, fStep = 1 / d;
        var ticks = [];
        for (var k = 0; k <= d; k++) ticks.push(k);
        var hidden = rand.shuffle(ticks.slice(1, d)).slice(0, Math.min(blanks, d - 1));
        var marks = ticks.map(function (k) {
          var v = k / d;
          var isHidden = hidden.indexOf(k) > -1;
          return { v: v, label: isHidden ? '?' : (k === 0 ? '0' : k === d ? '1' : k + '/' + d) };
        });
        items.push({
          html: W.numberLine(fMin, fMax, fStep, marks, { width: width }),
          answer: hidden.sort(function (a, b) { return a - b; }).map(function (k) { return k + '/' + d; }).join(', ')
        });
        continue;
      }

      var count = Math.round((max - min) / step);
      if (count < 2 || count > 60) { count = Math.max(2, Math.min(60, count)); }
      var values = [];
      for (var j = 0; j <= count; j++) values.push(+(min + j * step).toFixed(4));

      if (mode === 'missing') {
        var idxs = rand.shuffle(values.map(function (_, x) { return x; }).slice(1, values.length - 1))
          .slice(0, Math.min(blanks, values.length - 2));
        var marks2 = values.map(function (v, x) {
          return { v: v, label: idxs.indexOf(x) > -1 ? '' : W.formatNum(v) };
        });
        items.push({
          html: W.numberLine(min, max, step, marks2, { width: width }),
          answer: idxs.sort(function (a, b) { return a - b; }).map(function (x) { return W.formatNum(values[x]); }).join(', ')
        });
      } else if (mode === 'identify') {
        var pick = values[rand.int(1, values.length - 2)];
        var marks3 = values.map(function (v) { return { v: v, label: W.formatNum(v), dot: Math.abs(v - pick) < 1e-9 }; });
        items.push({
          html: W.numberLine(min, max, step, marks3, { width: width }) +
            '<div style="margin-top:2px">The dot is on <span style="display:inline-block;min-width:60px;border-bottom:1.5px solid #94a3b8">&nbsp;</span></div>',
          answer: W.formatNum(pick)
        });
      } else if (mode === 'plot') {
        var target = values[rand.int(1, values.length - 2)];
        items.push({
          html: '<div style="font-weight:700;margin-bottom:2px">Mark ' + W.formatNum(target) + ' on the line</div>' +
            W.numberLine(min, max, step, values.map(function (v) { return { v: v, label: W.formatNum(v) }; }), { width: width }),
          answer: W.formatNum(target)
        });
      } else {
        /* jump */
        var startIdx = rand.int(0, Math.max(0, values.length - 3));
        var jump = rand.int(1, Math.min(6, values.length - 1 - startIdx));
        var from = values[startIdx], to = values[startIdx + jump];
        var marks4 = values.map(function (v) { return { v: v, label: W.formatNum(v) }; });
        marks4.push({ v: from, dot: true, arrow: [from, to] });
        items.push({
          html: W.numberLine(min, max, step, marks4, { width: width }) +
            '<div style="margin-top:2px">' + W.formatNum(from) +
            ' + <span style="display:inline-block;min-width:38px;border-bottom:1.5px solid #94a3b8">&nbsp;</span> = ' +
            '<span style="display:inline-block;min-width:44px;border-bottom:1.5px solid #94a3b8">&nbsp;</span></div>',
          answer: W.formatNum(to - from) + ' → ' + W.formatNum(to)
        });
      }
    }

    W.preview('#preview', {
      title: $('#title').value,
      instructions: instructions(mode),
      items: items,
      previewColumns: 1
    });
    W.answerKeyPreview('#key', items);
    renderChecks(mode, min, max, step);

    $('#pill').textContent = items.length + ' number lines';
    $('#pill').style.background = 'var(--green-bg)'; $('#pill').style.color = 'var(--green)';
  }

  function instructions(mode) {
    return {
      missing: 'Write the missing numbers in the empty spaces on each number line.',
      plot: 'Mark the given number on each number line with a dot.',
      identify: 'Write the number that each dot is pointing to.',
      jump: 'Use the jump shown to complete each calculation.',
      fraction: 'Write the missing fractions on each number line.'
    }[mode];
  }

  function renderChecks(mode, min, max, step) {
    var c = [];
    var ticks = Math.round((max - min) / step) + 1;
    if (ticks > 25) {
      c.push(['warn', ticks + ' tick marks on one line will be cramped and hard to label. Increase the interval or narrow the range.']);
    } else if (ticks < 4) {
      c.push(['warn', 'Only ' + ticks + ' tick marks — the line may be too sparse to be useful.']);
    } else {
      c.push(['ok', ticks + ' tick marks per line.']);
    }
    if (parseInt($('#blanks').value, 10) >= ticks - 2 && mode === 'missing') {
      c.push(['warn', 'Almost every label is blank, which removes the reference points students need to count from. Leave more labels visible.']);
    }
    if ($('#optNegatives').checked) {
      c.push(['ok', 'Line extends below zero — good for introducing directed numbers and the idea that counting back continues past zero.']);
    }
    if (step < 1 && mode !== 'fraction') {
      c.push(['warn', 'Decimal intervals need careful labelling. Check the preview to make sure the numbers are readable at print size.']);
    }
    if (mode === 'fraction' && parseInt($('#denom').value, 10) > 8) {
      c.push(['warn', 'Denominators above 8 create many closely spaced ticks. Use a wide line, or fewer blanks.']);
    }
    $('#checks').innerHTML = c.map(function (x) {
      return '<div class="note ' + (x[0] === 'ok' ? 'note-ok' : 'note-warn') + '">' +
        (x[0] === 'ok' ? I.check : I.warn) + '<span>' + x[1] + '</span></div>';
    }).join('');
  }

  $('#printBtn').addEventListener('click', function () {
    W.print({
      title: $('#title').value,
      instructions: instructions($('#mode').value),
      items: items,
      columns: 1,
      answerKey: $('#optKey').checked,
      answerColumns: 3
    });
  });
  $('#newSeed').addEventListener('click', function () { $('#seed').value = Math.random().toString(36).slice(2, 8); build(); });
  $('#regen').addEventListener('click', function () { $('#seed').value = Math.random().toString(36).slice(2, 8); build(); GT.toast('New questions'); });

  $('#guide').innerHTML = [
    ['A number line makes structure visible', 'It turns number into distance. That is why it works so well for concepts that are hard to explain abstractly — that fractions live between whole numbers, that subtraction moves left, that −3 is genuinely smaller than −1. The picture does the explaining.'],
    ['Leave enough reference points', 'In a missing-number exercise, students count on from the labels that remain. Blanking almost everything removes the scaffold and turns the task into guesswork. Two or three blanks on a line of ten ticks is about right.'],
    ['Fractions on a line beat fractions as pizza', 'Circle diagrams work for halves and quarters and fall apart for sevenths. A number line handles any denominator, shows equivalence directly when two lines are stacked, and — crucially — shows that fractions are numbers with a position, not just parts of a shape.'],
    ['Negative numbers need the line', 'The idea that counting back past zero keeps going is much easier to see than to state. Extending the line below zero is often the moment directed numbers click.'],
    ['Jumps show the method, not just the answer', 'An arrow from 7 to 12 makes the relationship between the numbers visible, which supports mental strategies like bridging through ten. It is the difference between practising a fact and understanding it.'],
    ['Watch the tick density when printing', 'More than about twenty-five ticks on one line becomes unreadable at print size. Widen the line or increase the interval — the preview here matches the printed output.']
  ].map(function (x) {
    return '<div style="margin-bottom:16px"><h4 style="font-size:14.5px;margin-bottom:6px">' + x[0] + '</h4>' +
      '<p style="color:var(--muted);font-size:13.8px">' + x[1] + '</p></div>';
  }).join('');

  $('#tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    $$('#tabs button').forEach(function (x) { x.classList.toggle('on', x === b); });
    $$('[data-panel]').forEach(function (p) { p.hidden = p.getAttribute('data-panel') !== b.getAttribute('data-tab'); });
  });
  $('#cfg').addEventListener('submit', function (e) { e.preventDefault(); build(); GT.toast('Worksheet generated'); });
  $('#cfg').addEventListener('input', build);
  $('#cfg').addEventListener('change', build);

  build();

  GT.page({
    slug: 'number-line-worksheet-generator',
    lede: 'Five kinds of number line exercise — missing numbers, plotting, reading, jumps and fractions — drawn as crisp vectors with answer keys included.',
    steps: [
      { icon: 'gear', title: 'Choose the exercise', text: 'Missing numbers, plotting, identifying, jumps or fractions.' },
      { icon: 'ruler', title: 'Set the range', text: 'Start, end and interval — including decimals and negatives.' },
      { icon: 'file', title: 'Print with the key', text: 'One line per question, sized to stay readable on paper.' }
    ],
    guideTitle: 'Why the number line is the most useful diagram in primary maths',
    guide:
      '<p style="color:var(--muted)">A number line converts quantity into position. That single move makes a surprising number of difficult ideas visible rather than abstract — and it keeps working long after other models have broken down.</p>' +
      '<div class="grid g2" style="margin-top:18px">' +
      '<div><h4 style="font-size:14.5px;margin-bottom:8px">Where it outperforms other models</h4><ul style="color:var(--muted);font-size:13.8px;padding-left:18px;margin:0"><li><strong>Fractions.</strong> Pizza slices work for quarters and collapse at sevenths. A line handles any denominator and shows that a fraction is a number with a place.</li><li><strong>Negatives.</strong> Counting back past zero is obvious on a line and hard to state in words.</li><li><strong>Decimals.</strong> Zooming into the gap between 0.3 and 0.4 shows why 0.35 sits where it does.</li><li><strong>Mental strategies.</strong> A jump arrow makes bridging through ten a visible move.</li></ul></div>' +
      '<div><h4 style="font-size:14.5px;margin-bottom:8px">Getting the density right</h4><p style="color:var(--muted);font-size:13.8px">The most common problem with printed number lines is cramming. Past roughly twenty-five tick marks, labels overlap and the whole thing becomes unreadable — especially after a photocopier has had a go at it.</p>' +
      '<p style="color:var(--muted);font-size:13.8px;margin-top:10px">This tool warns you when the tick count gets too high, and the on-screen preview is the same vector drawing that prints, so what you see is genuinely what you get.</p></div></div>' +
      '<div class="note note-info" style="margin-top:18px">' + GTI.info + '<span>In missing-number exercises, keep some labels visible. Students count on from the reference points that remain — blank out too many and the exercise stops being about number sense and becomes guesswork.</span></div>',
    related: ['math-worksheet-generator', 'fraction-worksheet-generator', 'coordinate-grid-worksheet-generator'],
faqs: [
      { q: 'What number-line exercises can I generate?', a: 'The tool supports missing numbers, plotting, reading a marked value, addition/subtraction jumps and fractions on a number line.' },
      { q: 'Can I include negative numbers?', a: 'Yes. Enable negative numbers and choose a range that extends below zero.' },
      { q: 'Can I make fraction number lines?', a: 'Yes. Select the fraction exercise and choose the denominator used to partition the line.' },
      { q: 'Why are number lines useful for fractions?', a: 'They show fractions as numbers with magnitude and make ordering, equivalence and values greater than one visible.' },
      { q: 'Can the line start somewhere other than zero?', a: 'Yes. Set the start and end values to match the lesson.' },
      { q: 'Can I choose the interval?', a: 'Yes. The interval controls the value difference between adjacent marks.' },
      { q: 'Does the worksheet include an answer key?', a: 'Yes. Enable the answer-key page before generating.' }
    ],
    seo: {
      title: 'Number Line Worksheet Generator – Create Printable Number-Line Practice',
      lead: 'Use the Number Line Worksheet Generator above to build custom worksheets for whole numbers, negative numbers, arithmetic jumps and fractions.',
      blocks: [
        { html: '<p>Choose the exercise type, set the line’s start and end values, choose the interval and decide how many labels should be blank. For fraction practice, select a denominator. For integer work, extend the line below zero.</p>' +
            '<p>The tool supports activities such as fill in missing numbers, plot a marked value, identify the value of a dot, addition and subtraction jumps, and fractions on a number line.</p>' +
            '<p>You can also control question count, line width, worksheet title and answer-key output.</p>' +
            '<p>A number line is powerful because it represents numbers by position and distance, not just by written symbols.</p>' },
        { h: 'What Is a Number Line?',
          html: '<p>A number line places numbers along a straight line at equal intervals.</p>' +
            '<p>Values increase in one direction and decrease in the other.</p><p>A simple whole-number line may show:</p>' +
            '<pre class="code">0  1  2  3  4  5</pre>' +
            '<p>The equal spacing is important.</p>' +
            '<p>The distance from 1 to 2 represents the same numerical difference as the distance from 4 to 5.</p><p>Number lines can represent:</p>',
          list: ['whole numbers', 'negative numbers', 'fractions', 'decimals', 'arithmetic', 'magnitude', 'ordering'],
          after: '<p>They help students see numbers as locations and relationships rather than isolated written answers.</p>' },
        { h: 'How to Use This Number Line Worksheet Generator',
          html: '<p>Choose the exercise type first.</p><p>Then enter the line range.</p><p>Example: start <code>0</code>, end <code>20</code>.</p>' +
            '<p>Choose the interval: <code>1</code>, <code>2</code>, <code>5</code> or another supported step.</p>' +
            '<p>For missing-number questions, set how many labels should be blank.</p>' +
            '<p>For fraction questions, select the denominator.</p>' +
            '<p>Enable negative numbers when the practice should cross below zero.</p><p>Then choose:</p>',
          list: ['question count', 'line width', 'title', 'answer key'],
          after: '<p>Generate the worksheet and check that the scale matches the intended objective.</p>' +
            '<p>A number line with poor intervals can be mathematically valid but instructionally confusing.</p>' },
        { h: 'Why Equal Intervals Matter',
          html: '<p>A number line is not simply a row of numbers.</p><p>Position carries meaning.</p>' +
            '<p>If the labels are <code>0, 1, 2, 3</code>, the spaces between them should be equal.</p>' +
            '<p>Otherwise the diagram suggests incorrect numerical relationships.</p>' +
            '<p>This becomes even more important with fractions and decimals.</p>' +
            '<p>For example, <code>1/2</code> must sit exactly halfway between 0 and 1.</p>' +
            '<p><code>1/4</code> should sit one quarter of that unit distance from 0.</p>' +
            '<p>Students use the spatial relationship to reason about magnitude.</p>' +
            '<p>A worksheet should preserve the scale consistently.</p>' },
        { h: 'Fill in Missing Numbers',
          html: '<p>Missing-label exercises help students interpret the interval.</p>' +
            '<p>Suppose a line shows <code>0, 5, __, 15, __</code>.</p>' +
            '<p>The learner must notice that the scale increases by 5.</p>' +
            '<p>This practises more than counting.</p><p>It connects:</p>',
          list: ['sequence', 'interval size', 'position', 'skip counting'],
          after: '<p>Vary the starting value.</p>' +
            '<p>A student who can complete <code>0, 2, 4, 6</code> may struggle with <code>13, 15, 17, 19</code> even though both use an interval of 2.</p>' +
            '<p>Use non-zero starts when you want to check genuine interval understanding.</p>' },
        { h: 'Plot a Value',
          html: '<p>Plotting reverses a reading task.</p>' +
            '<p>Instead of seeing a dot and naming the number, students receive a value and must place it correctly.</p>' +
            '<p>For example, "Plot 7 on the number line."</p><p>This requires the learner to:</p>',
          ol: ['read the scale', 'identify the correct interval', 'locate the position', 'mark it'],
          after: '<p>Fraction plotting adds another layer because the student must partition the unit correctly.</p>' +
            '<p>Plotting tasks are useful because students cannot rely only on recognizing a familiar visual answer.</p>' +
            '<p>They must construct the representation.</p>' },
        { h: 'Identify the Value of a Dot',
          html: '<p>This exercise shows a point and asks for its value.</p><p>The learner needs to determine:</p>',
          list: ['starting value', 'interval', 'direction', 'exact point'],
          after: '<p>Do not always begin at zero.</p>' +
            '<p>A line from <code>20 to 40</code> with intervals of 5 asks students to interpret the scale rather than simply count labels from the origin.</p>' +
            '<p>For advanced practice, combine positive and negative values.</p>' +
            '<p>Keep the interval readable.</p>' +
            '<p>A worksheet becomes needlessly difficult when the scale itself is ambiguous.</p>' },
        { h: 'Addition and Subtraction on a Number Line',
          html: '<p>Addition can be represented as movement in the positive direction.</p>' +
            '<p>Example: <code>3 + 4</code>. Start at 3. Move 4 units forward. Land on 7.</p>' +

            '<p>For younger learners, jumps can connect concrete counting with symbolic equations.</p>' +
            '<p>Later, larger interval jumps can support mental arithmetic.</p>' +
            '<p>Subtraction can be represented by movement in the opposite direction.</p>' +
            '<p>Example: <code>8 - 3</code>. Start at 8. Move 3 units back. Land on 5.</p>' +
            '<p>Subtraction has several meanings in real problems, including taking away, finding a difference, missing addend and comparing quantities.</p>' +
            '<p>A number-line jump is one useful representation.</p>' +
            '<p>Pair it with varied problems so students do not reduce subtraction to one drawing routine.</p>' },

            '<p>Distance from zero also introduces absolute value later.</p>' +

            '<p>Do not present negative values as strange exceptions; they continue the same ordered number system.</p>' },

            '<p>Suppose the denominator is 4.</p>' +
            '<p>The interval from 0 to 1 can be partitioned into four equal parts: <code>0, 1/4, 2/4, 3/4, 1</code>.</p>' +

            '<p>For example, <code>2/4</code> occupies the same point as <code>1/2</code>.</p>' +
