<body data-root="../">

<section class="hero" id="hero"></section>

<section id="toolApp">
<div class="wrap">
<div class="tool-grid">

  <form class="card card-pad" id="cfg" autocomplete="off">
    <div class="panel-title"><span class="ico" id="icoGear"></span>Season Setup</div>

    <div class="field">
      <label for="teams">Teams — one per line</label>
      <textarea id="teams" style="min-height:170px">Riverside
Ashford
Kingsway
Northgate
Belmont
Carlton
Denton
Eastvale</textarea>
      <div id="stats"></div>
    </div>

    <div class="row">
      <div class="field">
        <label for="legs">Season format</label>
        <select id="legs">
          <option value="2" selected>Home and away (full season)</option>
          <option value="1">Single round only</option>
        </select>
      </div>
      <div class="field">
        <label for="start">Season starts</label>
        <input type="date" id="start">
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label for="every">Match weeks are</label>
        <select id="every">
          <option value="7" selected>Weekly</option>
          <option value="14">Fortnightly</option>
        </select>
      </div>
      <div class="field">
        <label for="breakAfter">Mid-season break after week</label>
        <input type="number" id="breakAfter" value="0" min="0" max="60">
      </div>
    </div>
    <div class="hint" style="margin:-8px 0 16px">Set to 0 for no break. A break inserts a gap before the return fixtures.</div>

    <div class="field">
      <label for="breakLen">Break length (weeks)</label>
      <input type="number" id="breakLen" value="2" min="1" max="12">
    </div>

    <div class="field">
      <label for="title">League name</label>
      <input type="text" id="title" value="Sunday League">
    </div>

    <div class="field">
      <label for="seed">Seed</label>
      <div class="row" style="grid-template-columns:minmax(0,1fr) auto;gap:8px">
        <input type="text" id="seed" value="league-1">
        <button type="button" class="btn btn-soft" id="newSeed"><span id="icoReset"></span></button>
      </div>
      <div class="hint">Changing the seed reshuffles which teams meet in which week.</div>
    </div>

    <div class="out-actions">
      <button type="submit" class="btn btn-primary btn-block"><span id="icoBolt"></span> Generate Season</button>
    </div>
  </form>

  <div class="card card-pad">
    <div class="panel-title"><span class="ico" id="icoSpark"></span>Season<span class="spacer"></span>
      <span class="result-pill" id="pill"></span></div>

    <div class="tabs" id="tabs">
      <button type="button" class="on" data-tab="weeks">Match weeks</button>
      <button type="button" data-tab="grid">Season grid</button>
      <button type="button" data-tab="fair">Fairness report</button>
      <button type="button" data-tab="guide">Notes</button>
    </div>

    <div data-panel="weeks">
      <div id="weeks"></div>
      <div class="out-actions" style="margin-top:16px">
        <button type="button" class="btn btn-primary" id="printBtn"><span id="icoFile"></span> Print / PDF</button>
        <button type="button" class="btn btn-ghost" id="csvBtn"><span id="icoDl"></span> Download CSV</button>
        <button type="button" class="btn btn-soft" id="regen"><span id="icoReset2"></span> Redraw</button>
      </div>
      <div id="checks"></div>
    </div>

    <div data-panel="grid" hidden><div id="grid" style="overflow-x:auto"></div></div>
    <div data-panel="fair" hidden><div id="fair"></div></div>
    <div data-panel="guide" hidden><div id="guide"></div></div>
  </div>

</div>
</div>
</section>

<div id="afterTool"></div>

<script src="../assets/js/site.js"></script>
<script src="../assets/js/schedule.js"></script>
<script src="../assets/js/roster.js"></script>
<script>
(function () {
  var I = GTI, $ = GT.$, $$ = GT.$$, S = GTSched;
  ['icoGear:gear','icoSpark:spark','icoBolt:bolt','icoDl:download','icoReset:reset','icoReset2:reset','icoFile:file']
    .forEach(function (p) { var a = p.split(':'); document.getElementById(a[0]).innerHTML = I[a[1]]; });

  $('#start').value = GT.today();
  var teams = [], rounds = [], dates = [];

  function build() {
    var parsed = GTRoster.parseNames($('#teams').value);
    teams = parsed.names;
    GTRoster.rosterStats('#stats', parsed);

    if (teams.length < 2) {
      $('#weeks').innerHTML = '<div class="empty">Add at least two teams.</div>';
      $('#pill').textContent = '—';
      return;
    }

    var order = S.rng($('#seed').value).shuffle(teams);
    rounds = S.roundRobin(order, { doubleRound: $('#legs').value === '2' });

    /* Insert a mid-season gap by shifting later dates. */
    var every = parseInt($('#every').value, 10);
    var breakAfter = parseInt($('#breakAfter').value, 10) || 0;
    var breakLen = parseInt($('#breakLen').value, 10) || 0;
    dates = [];
    var d0 = new Date($('#start').value + 'T12:00:00');
    var offsetWeeks = 0;
    for (var i = 0; i < rounds.length; i++) {
      if (breakAfter && i === breakAfter) offsetWeeks += breakLen;
      dates.push(new Date(d0.getTime() + (i * every + offsetWeeks * 7) * 86400000));
    }

    renderWeeks();
    renderGrid();
    renderFair();
    renderChecks();

    var total = rounds.reduce(function (a, r) { return a + r.length; }, 0);
    $('#pill').textContent = rounds.length + ' weeks · ' + total + ' matches';
    $('#pill').style.background = 'var(--green-bg)'; $('#pill').style.color = 'var(--green)';
  }

  function renderWeeks() {
    var breakAfter = parseInt($('#breakAfter').value, 10) || 0;
    $('#weeks').innerHTML = rounds.map(function (rd, ri) {
      var brk = breakAfter && ri === breakAfter
        ? '<div class="note note-info" style="margin:0 0 14px">' + I.info +
          '<span>Mid-season break — ' + $('#breakLen').value + ' week' +
          ($('#breakLen').value === '1' ? '' : 's') + ' off before the return fixtures.</span></div>' : '';
      return brk + '<div style="margin-bottom:18px">' +
        '<p class="more-label">Week ' + (ri + 1) + ' <span style="font-weight:500;color:var(--muted)">· ' +
        S.fmtDate(dates[ri]) + (rd.byeTeam ? ' · bye: ' + GT.esc(rd.byeTeam) : '') + '</span></p>' +
        '<div class="more-list">' + rd.map(function (m) {
          return '<div class="more-row"><span class="mval" style="font-family:var(--sans);font-size:14.5px;font-weight:500">' +
            GT.esc(m.home) + ' <span style="color:var(--muted-2);font-weight:400">v</span> ' + GT.esc(m.away) + '</span></div>';
        }).join('') + '</div></div>';
    }).join('');
  }

  function renderGrid() {
    var played = {};
    rounds.forEach(function (rd, ri) { rd.forEach(function (m) { played[m.home + '||' + m.away] = ri + 1; }); });
    $('#grid').innerHTML =
      '<p style="color:var(--muted);font-size:13.5px;margin-bottom:12px">Match week for every fixture. Rows are home teams, columns away.</p>' +
      '<table style="border-collapse:collapse;font-size:12px">' +
      '<tr><th style="padding:6px;border-bottom:1px solid var(--line)"></th>' +
      teams.map(function (t) {
        return '<th style="padding:6px;border-bottom:1px solid var(--line);writing-mode:vertical-rl;' +
          'text-orientation:mixed;height:80px;font-weight:600">' + GT.esc(t) + '</th>';
      }).join('') + '</tr>' +
      teams.map(function (h) {
        return '<tr><th style="padding:6px 10px 6px 0;text-align:left;border-bottom:1px solid var(--line-2);' +
          'white-space:nowrap;font-weight:600">' + GT.esc(h) + '</th>' +
          teams.map(function (a) {
            if (h === a) return '<td style="padding:6px;border-bottom:1px solid var(--line-2);background:var(--line-2)"></td>';
            var w = played[h + '||' + a];
            return '<td style="padding:6px;text-align:center;border-bottom:1px solid var(--line-2);' +
              (w ? 'color:var(--blue);font-weight:600' : 'color:var(--muted-2)') + '">' + (w || '·') + '</td>';
          }).join('') + '</tr>';
      }).join('') + '</table>';
  }

  function renderFair() {
    var t = S.homeAwayTally(rounds);
    /* Longest run of consecutive home or away games per team. */
    var runs = {};
    teams.forEach(function (team) {
      var seq = [];
      rounds.forEach(function (rd) {
        rd.forEach(function (m) {
          if (m.home === team) seq.push('H');
          else if (m.away === team) seq.push('A');
        });
      });
      var best = 0, cur = 0, last = null;
      seq.forEach(function (s) {
        if (s === last) cur++; else { cur = 1; last = s; }
        if (cur > best) best = cur;
      });
      runs[team] = best;
    });

    $('#fair').innerHTML =
      '<p style="color:var(--muted);font-size:13.5px;margin-bottom:12px">Home and away split, plus the longest run of consecutive matches on the same side. Long runs are the usual complaint in a league schedule.</p>' +
      teams.map(function (n) {
        var v = t[n] || { home: 0, away: 0 };
        var run = runs[n];
        return '<div class="kv"><span class="k">' + GT.esc(n) + '</span><span class="v">' +
          v.home + 'H · ' + v.away + 'A' +
          ' <span style="color:' + (run >= 4 ? 'var(--amber)' : 'var(--muted)') + '">· longest run ' + run + '</span>' +
          '</span></div>';
      }).join('');
  }

  function renderChecks() {
    var c = [];
    var total = rounds.reduce(function (a, r) { return a + r.length; }, 0);
    c.push(['ok', total + ' matches over ' + rounds.length + ' match weeks, ' +
      S.fmtDate(dates[0]) + ' to ' + S.fmtDate(dates[dates.length - 1]) + '.']);

    if ($('#legs').value === '2') {
      c.push(['ok', 'Home and away — every team hosts exactly as often as it travels.']);
    } else {
      var t = S.homeAwayTally(rounds);
      var worst = Math.max.apply(null, Object.keys(t).map(function (k) { return Math.abs(t[k].home - t[k].away); }));
      c.push(['warn', 'Single round — home and away differ by up to ' + worst +
        ' for some teams. A full home-and-away season removes any venue advantage.']);
    }
    if (teams.length % 2 === 1) {
      c.push(['warn', 'Odd number of teams, so one team is idle every week. Each gets the same number of byes across the season.']);
    }
    var breakAfter = parseInt($('#breakAfter').value, 10) || 0;
    if (breakAfter && breakAfter >= rounds.length) {
      c.push(['warn', 'The break is set after week ' + breakAfter + ' but the season only has ' +
        rounds.length + ' weeks, so it has no effect.']);
    }
    if (rounds.length > 30) {
      c.push(['warn', rounds.length + ' match weeks is a long season — check it fits the calendar you have.']);
    }
    $('#checks').innerHTML = c.map(function (x) {
      return '<div class="note ' + (x[0] === 'ok' ? 'note-ok' : 'note-warn') + '">' +
        (x[0] === 'ok' ? I.check : I.warn) + '<span>' + x[1] + '</span></div>';
    }).join('');
  }

  $('#csvBtn').addEventListener('click', function () {
    var rows = ['week,date,home,away'];
    rounds.forEach(function (rd, ri) {
      rd.forEach(function (m) {
        rows.push([ri + 1, dates[ri].toISOString().slice(0, 10),
          '"' + m.home.replace(/"/g, '""') + '"', '"' + m.away.replace(/"/g, '""') + '"'].join(','));
      });
    });
    GT.download(rows.join('\n'), 'league-schedule.csv', 'text/csv');
  });

  $('#printBtn').addEventListener('click', function () {
    GTRoster.printHtml($('#title').value,
      '<h1>' + GT.esc($('#title').value) + '</h1>' +
      '<p class="sub">' + teams.length + ' teams · ' + rounds.length + ' match weeks · ' +
      rounds.reduce(function (a, r) { return a + r.length; }, 0) + ' matches</p>' +
      '<div class="grid g2">' + rounds.map(function (rd, ri) {
        return '<div class="card"><h3>Week ' + (ri + 1) +
          ' <span style="font-weight:400;font-size:12px;color:#64748b">' + S.fmtDate(dates[ri]) + '</span></h3><ul>' +
          rd.map(function (m) { return '<li>' + GT.esc(m.home) + ' v ' + GT.esc(m.away) + '</li>'; }).join('') +
          (rd.byeTeam ? '<li style="color:#64748b"><em>' + GT.esc(rd.byeTeam) + ' — bye</em></li>' : '') +
          '</ul></div>';
      }).join('') + '</div>');
  });
  $('#newSeed').addEventListener('click', function () { $('#seed').value = Math.random().toString(36).slice(2, 8); build(); });
  $('#regen').addEventListener('click', function () { $('#seed').value = Math.random().toString(36).slice(2, 8); build(); GT.toast('Redrawn'); });

  $('#guide').innerHTML = [
    ['Home and away is the only truly fair format', 'In a single round some teams host more often than they travel, and if your venue has any advantage at all — pitch, crowd, familiarity — that is a real edge nobody chose. A full home-and-away season gives every team exactly the same number of home fixtures.'],
    ['Watch for long runs on the same side', 'Four consecutive away fixtures is the complaint that reaches the committee. The fairness report shows each team\'s longest run so you can spot it before publishing rather than after. Reshuffling the seed usually improves it.'],
    ['The return half mirrors the first', 'In a double round the second half repeats the first with venues swapped. That makes the season predictable in a good way — teams know that whoever they played at home in week 3, they visit in the matching return week.'],
    ['Mid-season breaks shift everything after them', 'Inserting a break moves every subsequent date. Decide on it before publishing, because a break added later invalidates every date teams have already put in their calendars.'],
    ['Odd team counts mean idle weeks', 'Someone sits out every week. Across the season it evens out, but a team that draws its bye in week 1 has a longer wait for its first match — worth checking before you publish.'],
    ['Publish the grid as well as the list', 'The season grid shows which week any given fixture falls in, which is how people actually look things up — "when do we play Kingsway at home?" is a grid question, not a list question.']
  ].map(function (x) {
    return '<div style="margin-bottom:16px"><h4 style="font-size:14.5px;margin-bottom:6px">' + x[0] + '</h4>' +
      '<p style="color:var(--muted);font-size:13.8px">' + x[1] + '</p></div>';
  }).join('');

  $('#tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    $$('#tabs button').forEach(function (x) { x.classList.toggle('on', x === b); });
    $$('[data-panel]').forEach(function (p) { p.hidden = p.getAttribute('data-panel') !== b.getAttribute('data-tab'); });
  });
  $('#cfg').addEventListener('submit', function (e) { e.preventDefault(); build(); GT.toast('Season generated'); });
  $('#cfg').addEventListener('input', build);
  $('#cfg').addEventListener('change', build);

  build();

  GT.page({
    slug: 'league-schedule-generator',
    lede: 'Build a full home-and-away season with dated match weeks, a mid-season break, a lookup grid and a fairness report that catches long runs of away fixtures.',
    steps: [
      { icon: 'gear', title: 'Add teams and a start date', text: 'Weekly or fortnightly match weeks.' },
      { icon: 'calendar', title: 'Check the fairness report', text: 'Home/away totals plus the longest run on the same side.' },
      { icon: 'file', title: 'Publish', text: 'Print the season, or export CSV for a spreadsheet.' }
    ],
    guideTitle: 'What makes a league schedule feel fair',
    guide:
      '<p style="color:var(--muted)">A home-and-away season already guarantees the headline fairness: every team hosts exactly as often as it travels. What it does not guarantee is the <em>distribution</em>, and that is where complaints come from.</p>' +
      '<p style="color:var(--muted);margin-top:12px">A team can finish with a perfect 7 home and 7 away and still have played four consecutive away fixtures in the middle of it. That is the run that gets raised at the committee meeting, and it is invisible in a totals column. The fairness report here shows each team\'s longest consecutive run alongside its totals, so you can spot the problem before publishing and reshuffle if it looks bad.</p>' +
      '<div class="grid g2" style="margin-top:18px">' +
      '<div><h4 style="font-size:14.5px;margin-bottom:8px">Season length</h4><ul style="color:var(--muted);font-size:13.8px;padding-left:18px;margin:0"><li><strong>6 teams</strong> — 10 weeks, 30 matches</li><li><strong>8 teams</strong> — 14 weeks, 56 matches</li><li><strong>10 teams</strong> — 18 weeks, 90 matches</li><li><strong>12 teams</strong> — 22 weeks, 132 matches</li></ul>' +
      '<p style="color:var(--muted);font-size:13.8px;margin-top:10px">Add weeks for any mid-season break, and check that total against the calendar you actually have.</p></div>' +
      '<div><h4 style="font-size:14.5px;margin-bottom:8px">Publish the grid too</h4><p style="color:var(--muted);font-size:13.8px">People do not read a season as a list. They ask "when do we play Kingsway at home?" — which is a lookup, not a scan. The season grid answers it directly: find the row, find the column, read the week number.</p>' +
      '<p style="color:var(--muted);font-size:13.8px;margin-top:10px">Send captains the grid and the CSV; pin the week-by-week list on the noticeboard.</p></div></div>' +
      '<div class="note note-warn" style="margin-top:18px">' + GTI.warn + '<span>Decide on a mid-season break <strong>before</strong> publishing. Adding one afterwards shifts every subsequent date, and by then those dates are in people\'s calendars.</span></div>',
    related: ['match-fixture-generator', 'round-robin-schedule-generator', 'tournament-bracket-generator'],
faqs: [
      { q: 'What is a league schedule generator?', a: 'It creates a season fixture list showing which teams play each other across organized match weeks and dates.' },
      { q: 'What is a home-and-away league?', a: 'Each team plays every opponent twice, normally once at home and once away.' },
      { q: 'How many matches are in a double round robin?', a: 'With n teams, the league contains n(n - 1) matches.' },
      { q: 'How many games does each team play?', a: 'Each team plays 2(n - 1) matches in a double round robin.' },
      { q: 'What happens with an odd number of teams?', a: 'One team has a bye in each round, rotated across the full schedule.' },
      { q: 'What does the fairness report check?', a: 'It helps review structural issues such as home/away balance, streaks and bye patterns.' },
      { q: 'Should I use this or the round robin generator?', a: 'Use this tool for a full dated home-and-away season. Use the Round Robin Schedule Generator for a simpler all-play-all pairing schedule.' }
    ],
    seo: {
      title: 'League Schedule Generator – Build a Full Home-and-Away Season',
      lead: 'Use the League Schedule Generator above when you need more than an opponent list—you need a complete season.',
      blocks: [
        { html: '<p>The tool creates full home-and-away league fixtures, organizes them into match weeks, attaches dates and provides a fairness report so the schedule can be reviewed before publication.</p>' +
            '<p>In a typical double round robin, every team plays every other team at home, every team plays every other team away, odd team counts create bye weeks, and the second set of fixtures reverses the venue relationship.</p>' +
            '<p>This is the right format for football, soccer, basketball, hockey, volleyball and many other league competitions where standings are built from results across an entire season.</p>' },
        { h: 'What Is a League Schedule?',
          html: '<p>A league schedule is the full set of fixtures that determines who plays whom and when across a season.</p>' +
            '<p>Unlike a knockout tournament, teams are not eliminated after one loss.</p>' +
            '<p>They continue playing through the fixture list and accumulate results.</p><p>A league schedule normally needs:</p>',
          list: ['teams', 'rounds or match weeks', 'home/away designation', 'dates', 'bye handling', 'season order'],
          after: '<p>A simple round robin can form the mathematical base.</p>' +
            '<p>The league schedule adds the calendar and home/away structure needed to run a season.</p>' +
            '<p>The tool also reports scheduling fairness so organizers can inspect patterns before publishing.</p>' },
        { h: 'Double Round Robin League Format',
          html: '<p>Many home-and-away leagues use double round robin.</p><p>If there are n teams, each team plays <code>2(n - 1)</code> matches. Total matches: <code>n(n - 1)</code>.</p>' +
            '<p>For 10 teams: each team 18 matches, total 90 matches.</p>' +
            '<p>For 20 teams: each team 38 matches, total 380 matches.</p>' +
            '<p>League size therefore has a major effect on season length.</p>' +
            '<p>Adding only two teams does more than add two games.</p>' +
            '<p>It creates new matchups between those teams and every existing team.</p>' +
            '<p>Calculate the full match volume before deciding the competition calendar.</p>' },
        { h: 'Single vs Double Round Robin',
          html: '<p>A single round robin has one meeting between each pair.</p><p>A double round robin has two.</p>' +
            '<p><strong>Single</strong> — fewer matches. Useful when season is short, venues are neutral, travel is expensive, or competition is recreational.</p>' +
            '<p><strong>Double</strong> — usually supports one home and one away meeting. Useful when home venue matters, season length allows it, or organizers want symmetrical pairings.</p>' +
            '<p>The League Schedule Generator is especially useful for full home-and-away seasons.</p>' +
            '<p>For a simple all-play-all tournament with no dates, the <a href="/tools/round-robin-schedule-generator">Round Robin Schedule Generator</a> is a lighter option.</p>' },
        { h: 'How Many Match Weeks Are Needed?',
          html: '<p>With an even number of teams in a single round robin, the schedule normally requires <code>n - 1</code> logical rounds.</p>' +
            '<p>A double round robin therefore needs <code>2(n - 1)</code> match weeks if every team plays one league match per round.</p>' +
            '<p>For 10 teams: single 9 match weeks, double 18 match weeks.</p>' +
            '<p>For 20 teams: single 19, double 38.</p>' +
            '<p>An odd number of teams creates a bye each round and changes the round count.</p>' +
            '<p>The generator handles this pairing structure.</p>' +
            '<p>Your real calendar may still contain additional empty weeks for holidays, cups, weather, international breaks or facility closures.</p>' },
        { h: 'Why Home and Away Balance Matters',
          html: '<p>Home advantage can matter in many sports.</p><p>The causes vary and may include:</p>',
          list: ['travel', 'familiarity', 'crowd', 'venue conditions', 'routine'],
          after: '<p>A double round robin reduces one obvious schedule imbalance because each pair can meet once at each venue.</p>' +
            '<p>But fairness is not only the final total of home and away games.</p><p>Sequence matters too.</p>' +
