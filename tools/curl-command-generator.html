    <div class="panel-title"><span class="ico" id="icoGear"></span>Request Builder</div>
    <div id="reqForm"></div>

    <div class="divider"></div>

    <div class="field">
      <label for="shell">Target shell</label>
      <select id="shell">
        <option value="bash" selected>bash / zsh (macOS, Linux)</option>
        <option value="cmd">Windows CMD</option>
        <option value="powershell">PowerShell</option>
        <option value="oneline">Single line (any shell)</option>
      </select>
      <div class="hint" id="shellHint"></div>
    </div>

    <fieldset class="field">
      <legend class="label">Common flags</legend>
      <div class="check-list">
        <label class="check"><input type="checkbox" id="fSilent"><span><span class="t">-sS — silent, but show errors</span><span class="d">Hides the progress meter without hiding failures. The right pair for scripts.</span></span></label>
        <label class="check"><input type="checkbox" id="fInclude"><span><span class="t">-i — include response headers</span></span></label>
        <label class="check"><input type="checkbox" id="fVerbose"><span><span class="t">-v — verbose, show the handshake</span><span class="d">The first thing to reach for when a request fails mysteriously.</span></span></label>
        <label class="check"><input type="checkbox" id="fLocation"><span><span class="t">-L — follow redirects</span></span></label>
        <label class="check"><input type="checkbox" id="fFail"><span><span class="t">-f — fail on HTTP errors</span><span class="d">Returns a non-zero exit code on 4xx/5xx instead of printing the error body.</span></span></label>
        <label class="check"><input type="checkbox" id="fCompressed"><span><span class="t">--compressed — request gzip</span></span></label>

      <div class="check-list">
        <label class="check"><input type="checkbox" id="fEnvToken" checked><span><span class="t">Read the token from an environment variable</span><span class="d">Keeps the secret out of your shell history and out of any snippet you paste.</span></span></label>
      </div>
    </fieldset>

  <div class="card card-pad">

<script>
(function () {
  var I = GTI, $ = GT.$, $$ = GT.$$;
  ['icoGear:gear','icoSpark:spark','icoCopy:copy','icoDl:download']
    .forEach(function (p) { var a = p.split(':'); document.getElementById(a[0]).innerHTML = I[a[1]]; });

  var req = GTReq.mount($('#reqForm'), build);

  var out = GT.mountOutput({ pre: '#out', fileLabel: '#fname', meta: '#meta',
    copyBtn: '#copyBtn', downloadBtn: '#dlBtn', filename: 'request.sh', mime: 'text/plain' });

  var SHELL_HINTS = {
    bash: 'Uses single quotes and backslash line continuations. Single quotes inside values are escaped as \'\\\'\'.',
    cmd: 'CMD has no single-quote string literal, so values use double quotes and inner quotes are doubled. Lines continue with ^.',
    powershell: 'PowerShell needs curl.exe explicitly — bare “curl” is an alias for Invoke-WebRequest. Lines continue with a backtick.',
    oneline: 'Everything on one line — best for pasting into a chat message or a CI step.'
  };

  function shell() { return $('#shell').value; }

  function qBash(s) { return "'" + String(s).replace(/'/g, "'\\''") + "'"; }
  function qCmd(s) { return '"' + String(s).replace(/"/g, '""') + '"'; }
  function qPs(s) { return "'" + String(s).replace(/'/g, "''") + "'"; }
  function quote(s) {
    var sh = shell();
    if (sh === 'cmd') return qCmd(s);
    if (sh === 'powershell') return qPs(s);
    return qBash(s);
  }

  function cont() {
    var sh = shell();
    if (sh === 'oneline') return ' ';
    if (sh === 'cmd') return ' ^\n  ';
    if (sh === 'powershell') return ' `\n  ';
    return ' \\\n  ';
  }

  function tokenRef() {
    var sh = shell();
    if (!$('#fEnvToken').checked) return null;
    return sh === 'cmd' ? '%API_TOKEN%' : sh === 'powershell' ? '$env:API_TOKEN' : '$API_TOKEN';
  }

  function build() {
    var m = req.model;
    var sh = shell();
    var bin = sh === 'powershell' ? 'curl.exe' : 'curl';
    var parts = [];

    /* flags */
    var flags = [];
    if ($('#fSilent').checked) flags.push('-sS');
    if ($('#fInclude').checked) flags.push('-i');
    if ($('#fVerbose').checked) flags.push('-v');
    if ($('#fLocation').checked) flags.push('-L');
    if ($('#fFail').checked) flags.push('-f');
    if ($('#fCompressed').checked) flags.push('--compressed');
    if (flags.length) parts.push(flags.join(' '));

    if (m.method !== 'GET') parts.push('-X ' + m.method);

    /* headers */
    var tok = tokenRef();
    req.allHeaders().forEach(function (h) {
      var val = h.v;
      if (tok && /^authorization$/i.test(h.k) && /^Bearer /.test(val)) {
        /* Interpolation requires a double-quoted string in bash and PowerShell. */
        var inner = h.k + ': Bearer ' + tok;
        parts.push('-H ' + (sh === 'cmd' ? qCmd(inner) : '"' + inner + '"'));
        return;
      }
      if (tok && m.auth === 'apikey' && h.k === (m.apiKeyName || 'X-API-Key')) {
        parts.push('-H ' + (sh === 'cmd' ? qCmd(h.k + ': ' + tok) : '"' + h.k + ': ' + tok + '"'));
        return;
      }
      parts.push('-H ' + quote(h.k + ': ' + val));
    });

    if (m.auth === 'basic') {
      parts.push('-u ' + quote((m.user || 'user') + ':' + (m.pass || 'pass')));
    }

    /* body */
    if (!req.noBody()) {
      if (m.bodyType === 'json' || m.bodyType === 'text') {
        var body = m.body;
        if (m.bodyType === 'json') {
          try { body = JSON.stringify(JSON.parse(m.body)); } catch (e) { /* leave as typed */ }
        }
        parts.push('-d ' + quote(body));
      } else if (m.bodyType === 'form') {
        parts.push('-d ' + quote(req.formEncoded()));
      } else if (m.bodyType === 'multipart') {
        m.form.filter(function (f) { return f.k.trim(); }).forEach(function (f) {
          parts.push('-F ' + quote(f.k.trim() + '=' + f.v));
        });
      }
    }

    if ($('#timeout').value) parts.push('--max-time ' + $('#timeout').value);
    if ($('#retry').value) parts.push('--retry ' + $('#retry').value);
    if ($('#fOutput').checked) parts.push('-o ' + quote($('#outFile').value || 'response.json'));
    if ($('#fTiming').checked) {
      parts.push('-w ' + quote('\\n\\ndns: %{time_namelookup}s  connect: %{time_connect}s  tls: %{time_appconnect}s  ttfb: %{time_starttransfer}s  total: %{time_total}s  status: %{http_code}\\n'));
    }

    parts.push(quote(req.fullUrl()));

    var cmd = bin + ' ' + parts.join(cont());

    var pre = '';
    if (tok && (m.auth === 'bearer' || m.auth === 'apikey')) {
      pre = sh === 'cmd' ? 'set API_TOKEN=your_token_here\n\n'
        : sh === 'powershell' ? '$env:API_TOKEN = "your_token_here"\n\n'
        : 'export API_TOKEN="your_token_here"   # or read it from your secrets manager\n\n';
    }

    var text = pre + cmd;
    out.set(text, sh === 'powershell' ? 'request.ps1' : sh === 'cmd' ? 'request.bat' : 'request.sh');

    $('#shellHint').textContent = SHELL_HINTS[sh];
    $('#pill').textContent = m.method + ' · ' + (req.allHeaders().length) + ' headers';
    $('#pill').style.background = 'var(--blue-50)'; $('#pill').style.color = 'var(--blue)';

    renderRaw();
    renderWarn();
    renderFlags();
  }

  function renderRaw() {
    var m = req.model;
    var u;
    try { u = new URL(req.fullUrl()); } catch (e) { u = null; }
    var lines = [];
    lines.push(m.method + ' ' + (u ? u.pathname + u.search : '/') + ' HTTP/1.1');
    lines.push('Host: ' + (u ? u.host : 'api.example.com'));
    req.allHeaders().forEach(function (h) { lines.push(h.k + ': ' + h.v); });
    var body = '';
    if (!req.noBody()) {
      body = m.bodyType === 'form' ? req.formEncoded()
        : m.bodyType === 'multipart' ? '<multipart form-data body>'
        : m.body;
      lines.push('Content-Length: ' + GT.byteLen(body));
    }
    $('#raw').innerHTML =
      '<p style="color:var(--muted);font-size:13.8px;margin-bottom:12px">The actual bytes curl will put on the wire. Useful when comparing against a server access log or a proxy trace.</p>' +
      '<pre class="code">' + GT.esc(lines.join('\n') + (body ? '\n\n' + body : '')) + '</pre>';
  }

  function renderWarn() {
    var w = [], m = req.model;
    var jv = req.jsonValid();
    if (!jv.ok) w.push(['err', 'The JSON body is invalid: ' + GT.esc(jv.msg) + '. curl will send it verbatim and the server will reject it.']);
    if (!/^https:/i.test(m.url.trim()) && /^http:/i.test(m.url.trim())) {
      w.push(['warn', 'This request uses plain HTTP. Any token in the Authorization header travels in clear text.']);
    }
    if (!$('#fEnvToken').checked && (m.auth === 'bearer' || m.auth === 'apikey')) {
      w.push(['warn', 'The token is inlined in the command. It will land in your shell history and in any snippet you paste. Turn on the environment-variable option.']);
    }
    if (req.noBody() && (m.method === 'POST' || m.method === 'PUT' || m.method === 'PATCH')) {
      w.push(['warn', 'A ' + m.method + ' with no body — set a body type if that is not intentional.']);
    }
    if (m.method === 'GET' && m.bodyType !== 'none') {
      w.push(['warn', 'GET requests should not carry a body. curl will silently switch to POST if you add <code>-d</code> without <code>-X GET</code>.']);
    }
    if ($('#fSilent').checked && !$('#fFail').checked) {
      w.push(['warn', 'With <code>-sS</code> but not <code>-f</code>, an HTTP 500 still exits 0. Add <code>-f</code> if a script should treat error responses as failures.']);
    }
    if (!w.length) w.push(['ok', 'Command is correctly quoted for ' + $('#shell').selectedOptions[0].textContent + '.']);
    $('#warnBox').innerHTML = w.map(function (x) {
      return '<div class="note ' + (x[0] === 'ok' ? 'note-ok' : x[0] === 'warn' ? 'note-warn' : 'note-err') + '">' +
        (x[0] === 'ok' ? I.check : I.warn) + '<span>' + x[1] + '</span></div>';
    }).join('');
  }

  function renderFlags() {
    $('#flags').innerHTML = [
      ['-X, --request', 'Sets the HTTP method. Often unnecessary — <code>-d</code> implies POST and <code>-I</code> implies HEAD.'],
      ['-H, --header', 'Adds a request header. Repeat it once per header. To remove a default header, pass it with an empty value: <code>-H "Accept:"</code>.'],
      ['-d, --data', 'Sends a request body and switches the method to POST. Use <code>--data-raw</code> to stop <code>@</code> being interpreted as a filename, and <code>-d @file.json</code> when you do want to read from a file.'],
      ['-F, --form', 'Sends multipart/form-data. Use <code>-F "file=@photo.jpg"</code> to attach a real file.'],
      ['-u, --user', 'Basic authentication. Prefer <code>-u user</code> without the password so curl prompts, keeping it out of your history.'],
      ['-s / -sS', '<code>-s</code> hides the progress meter and error messages; <code>-S</code> puts errors back. In scripts you almost always want both together.'],
      ['-f, --fail', 'Exits non-zero on 4xx and 5xx responses instead of printing the error body. Essential in CI, where a silent 500 otherwise looks like success.'],
      ['-L, --location', 'Follows redirects. By default curl stops at the 301 and prints nothing useful.'],
      ['-i / -I', '<code>-i</code> includes response headers with the body; <code>-I</code> sends a HEAD request and shows headers only.'],
      ['-o / -O', '<code>-o name</code> writes the body to a chosen filename; <code>-O</code> uses the name from the URL.'],
      ['--max-time / --connect-timeout', 'Total budget for the request versus time allowed to establish the connection. Always set one in automation.'],
      ['--retry', 'Retries transient failures with exponential backoff. Pair with <code>--retry-connrefused</code> when waiting for a service to boot.'],
      ['-w, --write-out', 'Prints selected variables after the transfer. The timing breakdown makes it obvious whether latency is DNS, TLS or the application.'],
      ['-k, --insecure', 'Skips certificate verification. Acceptable when poking at a local self-signed service, never in anything that runs unattended.']
    ].map(function (x) {
      return '<div class="kv"><span class="k"><code>' + x[0] + '</code><br><span style="font-size:12.5px">' + x[1] + '</span></span></div>';
    }).join('');
  }

  $('#fOutput').addEventListener('change', function () { $('#outFileWrap').hidden = !this.checked; build(); });
  $('#tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    $$('#tabs button').forEach(function (x) { x.classList.toggle('on', x === b); });
    $$('[data-panel]').forEach(function (p) { p.hidden = p.getAttribute('data-panel') !== b.getAttribute('data-tab'); });
  });
  $('#cfg').addEventListener('submit', function (e) { e.preventDefault(); build(); });
  $('#cfg').addEventListener('input', build);
  $('#cfg').addEventListener('change', build);

  build();

  GT.page({
    slug: 'curl-command-generator',
    lede: 'Build curl commands that are correctly quoted for your shell — with auth, JSON and multipart bodies, and the flags that stop a silent 500 looking like success.',
    steps: [
      { icon: 'gear', title: 'Describe the request', text: 'Method, URL, query parameters, headers, auth and body.' },
      { icon: 'terminal', title: 'Choose your shell', text: 'bash, CMD and PowerShell each quote differently — the output adapts.' },
      { icon: 'copy', title: 'Copy and run', text: 'Check the Raw HTTP tab to see exactly what goes on the wire.' }
    ],
    guideTitle: 'The curl details that cause real bugs',
    guide:
      '<p style="color:var(--muted)">curl is forgiving in ways that hide mistakes. It will happily send a malformed body, follow no redirects, and exit successfully on an HTTP 500. Most "curl works but my code does not" incidents come down to one of the four things below.</p>' +
      '<div class="grid g2" style="margin-top:18px">' +
      '<div><h4 style="font-size:14.5px;margin-bottom:8px">Quoting is shell-specific</h4><p style="color:var(--muted);font-size:13.8px">A command copied from a macOS blog post frequently fails on Windows because CMD has no single-quoted strings, and in PowerShell bare <code>curl</code> is an alias for <code>Invoke-WebRequest</code> with entirely different flags. Selecting the right shell above emits <code>curl.exe</code> and the correct escaping.</p>' +
      '<h4 style="font-size:14.5px;margin:16px 0 8px">-d implies POST</h4><p style="color:var(--muted);font-size:13.8px">Adding a body silently changes the method. If you meant to send a GET with a body — which most servers ignore anyway — you must say <code>-X GET</code> explicitly.</p></div>' +
      '<div><h4 style="font-size:14.5px;margin-bottom:8px">Exit codes lie by default</h4><p style="color:var(--muted);font-size:13.8px">Without <code>-f</code>, curl treats a 404 or a 500 as a successful transfer and exits 0. In a CI pipeline that means a broken deploy reports green. Use <code>-fsS</code> as the default flag set for any scripted request.</p>' +
      '<h4 style="font-size:14.5px;margin:16px 0 8px">Secrets end up in history</h4><p style="color:var(--muted);font-size:13.8px">A token pasted inline is written to <code>~/.bash_history</code>, captured in CI logs, and copied into every chat message that shares the command. Reading it from an environment variable costs one extra line and removes the whole class of leak.</p></div></div>' +
      '<div class="note note-info" style="margin-top:18px">' + GTI.info + '<span>The <code>-w</code> timing breakdown is the fastest way to diagnose slow requests: it separates DNS lookup, TCP connect, TLS handshake and time-to-first-byte, so you can tell whether the problem is the network, the certificate chain or the application itself.</span></div>',
    related: ['fetch-api-request-generator', 'axios-request-generator', 'dummy-api-key-generator'],
faqs: [
      { q: 'What does cURL stand for?', a: 'The project name is commonly associated with “Client URL,” and cURL is a tool and library for transferring data using URL syntax.' },
      { q: 'Do I need -X GET for a GET request?', a: 'Usually no. A basic cURL URL request uses GET by default.' },
      { q: 'How do I follow redirects?', a: 'Use <code>-L</code> or <code>--location</code>.' },
      { q: 'How do I make cURL fail on HTTP 404 or 500?', a: 'Use <code>-f</code> or <code>--fail</code> when you want HTTP error responses to produce a failure exit status.' },
      { q: 'Why does my cURL command work in Bash but not PowerShell?', a: 'The shells parse quoting and special characters differently. Generate the command specifically for the shell you are using.' },
      { q: 'Is cURL affected by CORS?', a: 'No. CORS is primarily enforced by browsers. A cURL request can succeed even when browser JavaScript is not permitted to read the same cross-origin response.' },
      { q: 'Can I keep my token out of shell history?', a: 'Yes. Referencing a protected environment variable is safer than embedding a real bearer token directly in the command.' }
    ],
    seo: {
      title: 'cURL Command Generator – Build Reliable API Requests Online',
      lead: 'Use the cURL Command Generator above to turn an API request into a command you can actually run in Bash, Windows CMD or PowerShell.',
      blocks: [
        { html: '<p>Enter the URL, choose the HTTP method, add headers, authentication, query parameters or a request body, then select the flags you need. The generator handles shell-specific quoting so JSON, spaces and special characters are less likely to break when you paste the command into a terminal.</p>' +
            '<p>You can also add useful operational options such as redirect following, HTTP-error handling, retries, timeouts, compressed responses, verbose output and response timing.</p>' +
            '<p>That makes the tool useful beyond a simple GET request. It can produce commands for debugging APIs, reproducing bug reports, testing authentication, downloading files and checking how a server behaves under real HTTP conditions.</p>' },
        { h: 'What Is cURL?',
          html: '<p>cURL is a command-line tool for transferring data using URLs.</p>' +
            '<p>Developers commonly use it for HTTP and HTTPS requests because it works well in terminals, scripts, CI pipelines and troubleshooting workflows.</p>' +
            '<p>A minimal request looks like:</p><pre class="code">curl https://api.example.com/users</pre>' +
            '<p>A JSON POST request may include a method, headers and body:</p><pre class="code">curl -X POST ...</pre>' +
            '<p>The command can become difficult to write correctly once authentication, JSON data, query strings, retries and different shell quoting rules are involved.</p>' +
            '<p>That is where a generator helps: you describe the request, and the tool builds the command syntax.</p>' },
        { h: 'How to Use This cURL Command Generator',
          html: '<p>Start with the target shell.</p><p>This matters because Bash, CMD and PowerShell do not quote arguments in exactly the same way.</p>' +
            '<p>Enter the request URL and choose the HTTP method.</p><p>Then add any required:</p>',
          list: ['headers', 'authorization', 'request body', 'query parameters', 'output file', 'timeout', 'retry count'],
          after: '<p>Choose additional flags based on what you are trying to inspect.</p><p>For example:</p>' +
            '<ul style="color:var(--muted);padding-left:18px"><li><code>-sS</code> for quieter script output while preserving errors</li>' +
            '<li><code>-i</code> to include response headers</li><li><code>-v</code> for verbose connection details</li>' +
            '<li><code>-L</code> to follow redirects</li><li><code>-f</code> to fail on HTTP error responses</li>' +
            '<li><code>--compressed</code> to request compressed content</li><li><code>-w</code> to print timing information</li>' +
            '<li><code>-o</code> to save the body to a file</li></ul>' +
            '<p>Generate the command, review it, then run it in the shell you selected.</p>' },
        { h: 'Why Shell Selection Matters',
          html: '<p>A cURL command is not interpreted by cURL first.</p><p>Your shell parses the command line before cURL receives the arguments.</p>' +
            '<p>That means quoting errors can change the request.</p>' +
            '<p>For example, JSON contains braces, quotes and spaces that different shells may interpret differently.</p>' +
            '<p>A command copied from a Bash tutorial may not work unchanged in Windows CMD or PowerShell.</p>' +
            '<p>The safest workflow is to generate specifically for the terminal you intend to use.</p><p>This is particularly important for:</p>',
          list: ['JSON request bodies', 'bearer tokens', 'URLs containing &amp;', 'form values with spaces', 'nested quotes', 'environment variables'],
          after: '<p>A syntactically correct HTTP request can still fail before it reaches cURL if the shell splits it incorrectly.</p>' },
        { h: 'POST JSON with cURL',
          html: '<p>A JSON POST commonly needs:</p>',
          list: ['POST behavior', '<code>Content-Type: application/json</code>', 'JSON request body'],
          after: '<p>The body must remain one shell argument after quoting.</p><p>This is one of the easiest places to make a copy-paste mistake.</p>' +
            '<p>The generator builds the body for the selected shell rather than assuming Unix quoting everywhere.</p>' +
            '<p>Also make sure the JSON itself is valid.</p>' +
            '<p>A shell can successfully pass invalid JSON to the server. cURL does not validate your application payload for you.</p>' +
            '<p>If you need realistic sample request bodies, create them with the <a href="/tools/json-test-data-generator">JSON Test Data Generator</a> and then place the result into the request builder.</p>' },
        { h: 'Add Request Headers',
          html: '<p>Headers carry request metadata.</p><p>Common examples include:</p>' +
            '<pre class="code">Accept: application/json\nContent-Type: application/json\nAuthorization: Bearer ...\nUser-Agent: ...</pre>' +
            '<p>Custom application headers may also be required.</p><p>Headers containing spaces should be correctly quoted.</p>' +
            '<p>Do not add <code>Content-Type: application/json</code> automatically to requests that are not sending JSON.</p>' +
            '<p>For multipart form uploads, the boundary is important and is often best handled by cURL itself when using the appropriate form options.</p>' +
            '<p>Match the header to the actual body format.</p>' },
        { h: 'Safer Bearer Token Handling',
          html: '<p>Pasting a real bearer token directly into a terminal command can leave it in shell history.</p><p>It can also leak when you:</p>',
          list: ['copy the command into chat', 'paste it into a ticket', 'record your screen', 'share terminal output', 'commit a script'],
          after: '<p>The generator can reference an environment variable instead of embedding the token directly.</p>' +
            '<p>That is a safer pattern for reusable commands.</p>' +
            '<p>A generated example should also use a dummy credential when it is going into documentation.</p>' +
            '<p>Use the <a href="/tools/dummy-api-key-generator">Dummy API Key Generator</a> for screenshots, README files and tutorials.</p>' +
            '<p>Do not turn a production secret into sample content.</p>' },
        { h: 'Follow Redirects with -L',
          html: '<p>HTTP redirects return a status and a <code>Location</code> header telling the client where to go next.</p>' +
            '<p>cURL does not always follow those redirects unless requested.</p><p>The <code>-L</code> or <code>--location</code> option follows them.</p>' +
            '<p>This is useful when testing:</p>',
          list: ['shortened URLs', 'HTTP-to-HTTPS redirects', 'moved API endpoints', 'authentication flows', 'download links'],
          after: '<p>When debugging a migration, you may want to inspect the original redirect first instead of following it immediately.</p>' +
            '<p>Use <code>-i</code> or verbose output to see the response status and <code>Location</code> header.</p>' +
            '<p>Then enable <code>-L</code> when you want to test the final destination.</p>' },
        { h: 'Make HTTP Errors Fail with -f',
          html: '<p>By default, a completed HTTP transfer can still produce a successful cURL process even when the server returns an HTTP error.</p>' +
            '<p>The <code>-f</code> or <code>--fail</code> option makes HTTP response errors such as 4xx or 5xx produce a failure exit status instead of treating the transfer as successful.</p>' +
            '<p>That matters in scripts and CI.</p>' +
            '<p>Without it, a command may download an error page and the script may continue as though the API call succeeded.</p>' +
            '<p>For automation, consider combining:</p><pre class="code">-f</pre><p>with:</p><pre class="code">-sS</pre>' +
            '<p>so normal progress output stays quiet but failures remain visible.</p>' },
        { h: 'Retry Transient Failures',
          html: '<p>Networks fail temporarily.</p><p>Servers return 429, 500, 502, 503 or 504.</p>' +
            '<p>A short connection interruption should not always terminate a batch job permanently.</p>' +
            '<p>cURL supports retry behavior for transient failures.</p><p>Set a retry count when the request is safe to retry.</p>' +
            '<p>Be careful with non-idempotent operations.</p>' +
            '<p>Repeating a POST that creates a payment, order or job can cause duplicates unless the API supports idempotency.</p>' +
            '<p>Retries are not simply a “make it reliable” switch.</p><p>Ask whether repeating the operation is safe.</p>' +
            '<p>For GET requests and explicitly idempotent APIs, retry behavior is often easier to justify.</p>' },
        { h: 'Timeouts Prevent Hanging Requests',
          html: '<p>A request that never completes can block a script longer than expected.</p>' +
            '<p>Set a timeout when your workflow has a clear maximum wait.</p><p>This is useful for:</p>',
          list: ['CI jobs', 'health checks', 'batch processing', 'API monitoring', 'deployment scripts'],
          after: '<p>A timeout should reflect the endpoint.</p>' +
            '<p>A two-second limit may be sensible for a fast health endpoint but unreasonable for a report export.</p>' +
            '<p>Do not choose a timeout solely because “five seconds sounds safe.”</p>' +
            '<p>Measure normal behavior and leave enough room for expected variance.</p>' },
        { h: 'Use Verbose Mode for Troubleshooting',
          html: '<p>When a request behaves differently from what you expect, <code>-v</code> is one of the most useful cURL flags.</p><p>Verbose output can reveal:</p>',
          list: ['DNS resolution', 'connection attempts', 'TLS negotiation', 'request headers', 'response headers', 'redirects', 'proxy behavior'],
          after: '<p>Be careful when sharing verbose logs.</p><p>They may contain credentials, cookies or sensitive headers.</p>' +
            '<p>Redact secrets before posting diagnostic output publicly.</p>' +
            '<p>For a clean production script, verbose mode is normally disabled. For debugging, it can explain problems that a response body alone cannot.</p>' },
        { h: 'Common cURL Mistakes',
          html: '<p>Avoid these problems:</p>',
          list: ['Using Bash quoting in PowerShell or CMD', 'Embedding production tokens in shared commands', 'Forgetting -L when testing a redirecting URL',
                 'Assuming a 404 automatically makes the process fail', 'Retrying a non-idempotent request without safeguards', 'Setting the wrong Content-Type',
                 'Printing binary output into the terminal', 'Sharing verbose logs without redacting secrets', 'Copying JSON that the shell breaks before cURL sees it',
                 'Assuming a working cURL request proves browser CORS will allow the same request'],
          after: '<p>cURL is not subject to browser CORS enforcement.</p>' +
            '<p>A request can work perfectly in cURL and still be blocked by a browser because of CORS policy. For the browser-side equivalent, see the <a href="/tools/fetch-api-request-generator">Fetch API Request Generator</a> and the <a href="/tools/axios-request-generator">Axios Request Generator</a>.</p>' }
      ],
      keywords: ['curl command generator', 'curl post json', 'curl bash cmd powershell', 'curl follow redirects -L',
        'curl fail on http error', 'curl bearer token', 'curl retry timeout', 'curl verbose debugging',
        'curl vs cors', 'curl shell quoting', 'curl download file', 'curl authentication header']
    }
  });
})();
</script>
