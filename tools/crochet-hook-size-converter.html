      '<div class="grid g2" style="margin-top:18px">' +
      '<div><h4 style="font-size:14.5px;margin-bottom:8px">The UK system counts down</h4><p style="color:var(--muted);font-size:13.8px">UK numbers get <strong>smaller as the hook gets bigger</strong>: UK 14 is 2 mm, UK 8 is 4 mm, UK 000 is 10 mm. Someone reading "a size 4 hook" in a British pattern needs 6 mm; the same phrase in a US pattern means 6.5 mm (K-10½) or a 2 mm steel hook, depending on context. This is the classic way a blanket comes out a foot too wide.</p>' +
      '<h4 style="font-size:14.5px;margin:16px 0 8px">Steel hooks overlap confusingly</h4><p style="color:var(--muted);font-size:13.8px">Thread hooks use a third scale that also counts down, and it reuses the same small numbers. A steel size 2 is 2.25 mm — a fine lace hook. A UK size 2 is 7 mm — thick enough for chunky yarn. Nothing in the number tells you which is meant.</p></div>' +

      { q: 'Why do UK crochet hook numbers go backwards?', a: 'The UK scale was built around wire gauge numbering, where a higher number means a thinner wire. So UK 14 is 2 mm and UK 000 is 10 mm — the opposite direction to US letters. It is worth double-checking any pattern that gives only a number.' },
      { q: 'What is the difference between steel and regular crochet hooks?', a: 'Steel hooks are much finer, made for crochet thread and lace, and run from about 0.75 mm to 3.5 mm. They have their own numbering that also counts downwards, and it overlaps with other scales — a steel size 2 is 2.25 mm, nothing like a UK size 2 at 7 mm.' },
      { q: 'Can I substitute a hook half a size up or down?', a: 'Usually yes, and that is exactly how you fix gauge. Going up a half size loosens your stitches and makes the piece bigger; going down tightens it. Change the hook rather than your tension — trying to crochet looser or tighter on purpose is very hard to sustain over a whole project.' },

    seo: {
      title: 'Crochet hook sizes: US, UK and metric, and why they disagree',
      lead: 'This <strong>crochet hook size converter</strong> translates between US letters, UK numbers and metric millimetres, covering both yarn hooks and steel thread hooks. Below: the full chart, why two of the three systems count backwards, and why the hook on the pattern is only ever a suggestion.',
      blocks: [
        {
          h: 'Millimetres are the real size',
          html: '<p>A crochet hook\'s size is the diameter of its <strong>shaft</strong> — the straight section behind the head, which is what the loop sits on and what therefore determines stitch size. That measurement is given in millimetres, and it is the only figure that means the same thing everywhere.</p>' +
