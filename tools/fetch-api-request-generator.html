<script src="../assets/js/httpreq.js"></script>
<script>
(function () {
  var I = GTI, $ = GT.$, $$ = GT.$$;
  ['icoGear:gear','icoSpark:spark','icoCopy:copy','icoDl:download']
    .forEach(function (p) { var a = p.split(':'); document.getElementById(a[0]).innerHTML = I[a[1]]; });

  var req = GTReq.mount($('#reqForm'), build);
  var lang = 'js';

  var out = GT.mountOutput({ pre: '#out', fileLabel: '#fname', meta: '#meta',
    copyBtn: '#copyBtn', downloadBtn: '#dlBtn', filename: 'request.js', mime: 'text/plain' });

  function ts() { return lang === 'ts'; }
  function ind(s, n) {
    var pad = new Array(n + 1).join(' ');
    return s.split('\n').map(function (l) { return l ? pad + l : l; }).join('\n');
  }

  function headersLiteral() {
    var m = req.model;
    var hs = req.allHeaders();
    if (!hs.length) return null;
    return '{\n' + hs.map(function (h) {
      var v;
      if (/^authorization$/i.test(h.k) && /^Bearer /.test(h.v) && $('#optEnv').checked) {
        v = '`Bearer ${process.env.API_TOKEN}`';
      } else if (m.auth === 'apikey' && h.k === (m.apiKeyName || 'X-API-Key') && $('#optEnv').checked) {
        v = 'process.env.API_KEY';
      } else if (h.v === 'Basic <base64 of user:pass>') {
        v = "`Basic ${btoa(`${username}:${password}`)}`";
      } else {
        v = "'" + h.v.replace(/'/g, "\\'") + "'";
      }
      return "  '" + h.k + "': " + v + ',';
    }).join('\n') + '\n}';
  }

  function bodyLiteral() {
    var m = req.model;
    if (req.noBody()) return null;
    if (m.bodyType === 'json') {
      var obj = m.body;
      try { obj = JSON.stringify(JSON.parse(m.body), null, 2); } catch (e) {}
      return 'JSON.stringify(' + obj + ')';
    }
    if (m.bodyType === 'text') return "'" + m.body.replace(/'/g, "\\'").replace(/\n/g, '\\n') + "'";
    if (m.bodyType === 'form') {
      return 'new URLSearchParams({\n' + m.form.filter(function (f) { return f.k.trim(); }).map(function (f) {
        return "  '" + f.k.trim() + "': '" + String(f.v).replace(/'/g, "\\'") + "',";
      }).join('\n') + '\n})';
    }
    if (m.bodyType === 'multipart') return 'formData';
    return null;
  }

  function optionsObject() {
    var m = req.model;
    var lines = [];
    lines.push("method: '" + m.method + "',");
    var h = headersLiteral();
    if (h) lines.push('headers: ' + h + ',');
    var b = bodyLiteral();
    if (b) lines.push('body: ' + b + ',');
    if ($('#optCreds').checked) lines.push("credentials: 'include',");
    if ($('#optTimeout').checked) lines.push('signal: AbortSignal.timeout(' + ($('#timeoutMs').value || 10000) + '),');
    return '{\n' + ind(lines.join('\n'), 2) + '\n}';
  }

  function multipartPrelude() {
    var m = req.model;
    if (req.noBody() || m.bodyType !== 'multipart') return '';
    return 'const formData = new FormData();\n' +
      m.form.filter(function (f) { return f.k.trim(); }).map(function (f) {
        return "formData.append('" + f.k.trim() + "', '" + String(f.v).replace(/'/g, "\\'") + "');";
      }).join('\n') +
      "\n// for a file: formData.append('file', fileInput.files[0]);\n\n";
  }

  function coreBody(resultType) {
    var lines = [];
    lines.push('const response = await fetch(' + JSON.stringify(req.fullUrl()) + ', ' + optionsObject() + ');');
    lines.push('');
    if ($('#optCheckOk').checked) {
      if ($('#optErrBody').checked) {
        lines.push('if (!response.ok) {');
        lines.push('  // Most APIs return a JSON error body — surface it rather than a bare status.');
        lines.push('  const detail = await response.text();');
        lines.push('  throw new Error(`Request failed ${response.status} ${response.statusText}: ${detail}`);');
        lines.push('}');
      } else {
        lines.push('// fetch only rejects on network failure, so status must be checked explicitly.');
        lines.push('if (!response.ok) {');
        lines.push('  throw new Error(`Request failed with status ${response.status}`);');
        lines.push('}');
      }
      lines.push('');
    }
    lines.push('return ' + (ts() ? '(await response.json()) as ' + (resultType || 'ApiResponse') : 'await response.json()') + ';');
    return lines.join('\n');
  }

  function retryWrapper(inner) {
    if (!$('#optRetry').checked) return inner;
    return 'let lastError' + (ts() ? ': unknown' : '') + ';\n' +
      'for (let attempt = 0; attempt < 3; attempt++) {\n' +
      '  try {\n' + ind(inner, 4) + '\n' +
      '  } catch (error) {\n' +
      '    lastError = error;\n' +
      '    // Exponential backoff: 250ms, 500ms, 1s\n' +
      '    await new Promise((r) => setTimeout(r, 250 * 2 ** attempt));\n' +
      '  }\n' +
      '}\n' +
      'throw lastError;';
  }

  function build() {
    var m = req.model;
    var style = $('#style').value;
    var fn = $('#fnName').value || 'makeRequest';
    var retType = ts() ? 'Promise<ApiResponse>' : '';
    var text = '';

    var envLine = $('#optEnv').checked && (m.auth === 'bearer' || m.auth === 'apikey')
      ? '// Reads the token from the environment — never hard-code a secret.\n' : '';

    if (style === 'inline') {
      text = multipartPrelude() +
        'const response = await fetch(' + JSON.stringify(req.fullUrl()) + ', ' + optionsObject() + ');\n' +
        'const data = await response.json();';
    } else if (style === 'promise') {
      text = multipartPrelude() +
        'fetch(' + JSON.stringify(req.fullUrl()) + ', ' + optionsObject() + ')\n' +
        '  .then((response) => {\n' +
        '    if (!response.ok) throw new Error(`HTTP ${response.status}`);\n' +
        '    return response.json();\n' +
        '  })\n' +
        '  .then((data) => console.log(data))\n' +
        '  .catch((error) => console.error(error));';
    } else if (style === 'react') {
      text = (ts() ? 'interface ApiResponse { [key: string]: unknown }\n\n' : '') +
        'function useData() {\n' +
        '  const [data, setData] = useState' + (ts() ? '<ApiResponse | null>' : '') + '(null);\n' +
        '  const [error, setError] = useState' + (ts() ? '<Error | null>' : '') + '(null);\n' +
        '  const [loading, setLoading] = useState(true);\n\n' +
        '  useEffect(() => {\n' +
        '    // Abort on unmount so a late response cannot set state on a dead component.\n' +
        '    const controller = new AbortController();\n\n' +
        '    fetch(' + JSON.stringify(req.fullUrl()) + ', {\n' +
        '      ...' + optionsObject().replace(/\n/g, '\n    ') + ',\n' +
        '      signal: controller.signal,\n' +
        '    })\n' +
        '      .then((r) => {\n' +
        '        if (!r.ok) throw new Error(`HTTP ${r.status}`);\n' +
        '        return r.json();\n' +
        '      })\n' +
        '      .then(setData)\n' +
        '      .catch((e) => {\n' +
        "        if (e.name !== 'AbortError') setError(e);\n" +
        '      })\n' +
        '      .finally(() => setLoading(false));\n\n' +
        '    return () => controller.abort();\n' +
        '  }, []);\n\n' +
        '  return { data, error, loading };\n' +
        '}';
    } else if (style === 'reactquery') {
      text = "import { useQuery } from '@tanstack/react-query';\n\n" +
        'export function useData() {\n' +
        '  return useQuery({\n' +
        "    queryKey: ['" + fn + "'],\n" +
        '    queryFn: async () => {\n' +
        '      const response = await fetch(' + JSON.stringify(req.fullUrl()) + ', ' + ind(optionsObject(), 6).trim() + ');\n' +
        '      if (!response.ok) throw new Error(`HTTP ${response.status}`);\n' +
        '      return response.json();\n' +
        '    },\n' +
        '    staleTime: 60_000,\n' +
        '  });\n' +
        '}';
    } else if (style === 'node') {
      text = "// Node 18+ has fetch built in — no node-fetch dependency needed.\n" +
        envLine + multipartPrelude() +
        'async function ' + fn + '()' + (ts() ? ': ' + retType : '') + ' {\n' +
        ind(($('#optTryCatch').checked
          ? 'try {\n' + ind(retryWrapper(coreBody()), 2) + '\n} catch (error) {\n' +
            "  console.error('" + fn + " failed:', error);\n  throw error;\n}"
          : retryWrapper(coreBody())), 2) + '\n' +
        '}\n\n' +
        fn + '().then(console.log).catch(() => process.exit(1));';
    } else if (style === 'wrapper') {
      text = (ts() ? 'type RequestOptions = RequestInit & { path: string };\n\n' : '') +
        'const BASE_URL = ' + JSON.stringify((function () {
          try { var u = new URL(req.fullUrl()); return u.origin; } catch (e) { return 'https://api.example.com'; }
        })()) + ';\n\n' +
        'async function apiRequest(path' + (ts() ? ': string' : '') + ', options' + (ts() ? ': RequestInit = {}' : ' = {}') + ')' + (ts() ? ': Promise<unknown>' : '') + ' {\n' +
        '  const response = await fetch(`${BASE_URL}${path}`, {\n' +
        '    ...options,\n' +
        '    headers: {\n' +
        "      'Content-Type': 'application/json',\n" +
        '      ...(process.env.API_TOKEN && { Authorization: `Bearer ${process.env.API_TOKEN}` }),\n' +
        '      ...options.headers,\n' +
        '    },\n' +
        '    signal: options.signal ?? AbortSignal.timeout(' + ($('#timeoutMs').value || 10000) + '),\n' +
        '  });\n\n' +
        '  if (!response.ok) {\n' +
        '    const detail = await response.text();\n' +
        '    throw new Error(`${response.status} ${response.statusText}: ${detail}`);\n' +
        '  }\n\n' +
        "  return response.status === 204 ? null : response.json();\n" +
        '}\n\n' +
        '// usage\n' +
        'const data = await apiRequest(' + JSON.stringify((function () {
          try { var u = new URL(req.fullUrl()); return u.pathname + u.search; } catch (e) { return '/'; }
        })()) + ', {\n' +
        "  method: '" + m.method + "',\n" +
        (bodyLiteral() ? '  body: ' + ind(bodyLiteral(), 2).trim() + ',\n' : '') +
        '});';
    } else {
      text = envLine + multipartPrelude() +
        (ts() ? 'interface ApiResponse {\n  [key: string]: unknown;\n}\n\n' : '') +
        'async function ' + fn + '()' + (ts() ? ': ' + retType : '') + ' {\n' +
        ind(($('#optTryCatch').checked
          ? 'try {\n' + ind(retryWrapper(coreBody()), 2) + '\n} catch (error) {\n' +
            '  // Network failures, aborts and the errors thrown above all land here.\n' +
            "  console.error('" + fn + " failed:', error);\n  throw error;\n}"
          : retryWrapper(coreBody())), 2) + '\n' +
        '}';
    }

    out.set(text, 'request.' + (ts() ? 'ts' : 'js'));
    $('#pill').textContent = m.method + ' · ' + (ts() ? 'TypeScript' : 'JavaScript');
    $('#pill').style.background = 'var(--blue-50)'; $('#pill').style.color = 'var(--blue)';

    renderTypes();
    renderWarn();
    renderGotchas();
  }

  function renderTypes() {
    var m = req.model, props = '  [key: string]: unknown;';
    if (m.bodyType === 'json') {
      try {
        var o = JSON.parse(m.body);
        props = Object.keys(o).map(function (k) {
          var v = o[k];
          var t = v === null ? 'null' : Array.isArray(v) ? 'unknown[]' : typeof v;
          return '  ' + k + ': ' + t + ';';
        }).join('\n');
      } catch (e) {}
    }
    $('#types').innerHTML =
      '<h4 style="font-size:14.5px;margin-bottom:8px">Request body type</h4>' +
      '<pre class="code">' + GT.esc('interface RequestBody {\n' + props + '\n}') + '</pre>' +
      '<h4 style="font-size:14.5px;margin:18px 0 8px">Typed wrapper</h4>' +
      '<pre class="code">' + GT.esc(
        'async function typedFetch<T>(\n' +
        '  url: string,\n' +
        '  options?: RequestInit,\n' +
        '): Promise<T> {\n' +
        '  const response = await fetch(url, options);\n' +
        '  if (!response.ok) throw new Error(`HTTP ${response.status}`);\n' +
        '  return response.json() as Promise<T>;\n' +
        '}\n\n' +
        '// TypeScript cannot verify the shape at runtime — validate if it matters:\n' +
        '// const data = UserSchema.parse(await typedFetch<unknown>(url));') + '</pre>' +
      '<div class="note note-warn" style="margin-top:14px">' + I.warn +
      '<span><code>response.json()</code> returns <code>any</code>. Casting it to a type is a promise to the compiler, not a runtime check — if the API changes shape your code fails at the point of use, not at the boundary. Validate with Zod or Valibot where correctness matters.</span></div>';
  }

  function renderWarn() {
    var w = [], m = req.model;
    var jv = req.jsonValid();
    if (!jv.ok) w.push(['err', 'The JSON body is invalid: ' + GT.esc(jv.msg)]);
    if (!$('#optCheckOk').checked) {
      w.push(['err', '<code>response.ok</code> is not checked. fetch resolves successfully on 404 and 500, so your code will try to parse an error page as data.']);
    }
    if (!$('#optTimeout').checked) {
      w.push(['warn', 'No timeout. fetch waits indefinitely by default — a hung request will hold the connection until the browser or runtime gives up.']);
    }
    if (m.bodyType === 'multipart') {
      w.push(['warn', 'Do not set <code>Content-Type</code> manually for FormData. The browser must add it itself so it can include the multipart boundary — remove that header if you added one.']);
    }
    if ($('#optCreds').checked) {
      w.push(['warn', '<code>credentials: "include"</code> sends cookies cross-origin. The server must respond with <code>Access-Control-Allow-Credentials: true</code> and a specific origin — a wildcard is rejected.']);
    }
    if (!$('#optEnv').checked && (m.auth === 'bearer' || m.auth === 'apikey')) {
      w.push(['warn', 'The token is hard-coded. In browser code any token is visible to the user regardless — proxy the request through your own backend if it must stay secret.']);
    }
    if (!w.length) w.push(['ok', 'Status checked, errors caught, and the request is correctly shaped.']);
    $('#warnBox').innerHTML = w.map(function (x) {
      return '<div class="note ' + (x[0] === 'ok' ? 'note-ok' : x[0] === 'warn' ? 'note-warn' : 'note-err') + '">' +
        (x[0] === 'ok' ? I.check : I.warn) + '<span>' + x[1] + '</span></div>';
    }).join('');
  }

  function renderGotchas() {
    $('#gotchas').innerHTML = [
      ['fetch does not reject on HTTP errors', 'A 404 or a 500 is a successful transfer as far as fetch is concerned. The promise only rejects on network failure, DNS problems or an abort. You must check <code>response.ok</code> yourself — this is the single most common fetch bug.'],
      ['There is no default timeout', 'A request can hang forever. Use <code>AbortSignal.timeout(ms)</code>, which is supported in modern browsers and Node 18+, or an <code>AbortController</code> with your own <code>setTimeout</code>.'],
      ['The body can only be read once', 'Calling <code>response.json()</code> after <code>response.text()</code> throws. If you need the raw text for an error message and the parsed body on success, read it once as text and parse it yourself, or clone the response first.'],
      ['Do not set Content-Type for FormData', 'The browser generates a multipart boundary and puts it in the header. Setting the header manually omits the boundary and the server cannot parse the body.'],
      ['204 has no body', 'Calling <code>.json()</code> on a 204 No Content response throws a parse error. Check the status before parsing — the reusable client style above handles this.'],
      ['CORS is enforced by the browser, not fetch', 'A blocked cross-origin request rejects with an opaque "Failed to fetch" and no status. The fix is always on the server: correct <code>Access-Control-Allow-Origin</code> headers and a working preflight response.'],
      ['Node 18+ has fetch built in', 'The <code>node-fetch</code> dependency is no longer needed. The global implementation is undici and behaves like the browser API, including the lack of a default timeout.']
    ].map(function (x) {
      return '<div style="margin-bottom:16px"><h4 style="font-size:14.5px;margin-bottom:6px">' + x[0] + '</h4>' +
        '<p style="color:var(--muted);font-size:13.8px">' + x[1] + '</p></div>';
    }).join('');
  }

  $('#lang').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    $$('#lang button').forEach(function (x) { x.classList.toggle('on', x === b); });
    lang = b.getAttribute('data-l'); build();
  });
  $('#tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    $$('#tabs button').forEach(function (x) { x.classList.toggle('on', x === b); });
    $$('[data-panel]').forEach(function (p) { p.hidden = p.getAttribute('data-panel') !== b.getAttribute('data-tab'); });
  });
  $('#cfg').addEventListener('submit', function (e) { e.preventDefault(); build(); });
  $('#cfg').addEventListener('input', build);
  $('#cfg').addEventListener('change', build);

  build();

  GT.page({
    slug: 'fetch-api-request-generator',
    lede: 'Generate fetch() code that handles the things fetch does not do for you — status checks, timeouts, error bodies and aborts — in JavaScript or TypeScript.',
    steps: [
      { icon: 'gear', title: 'Describe the request', text: 'Method, URL, headers, auth and body — shared with the cURL and Axios generators.' },
      { icon: 'send', title: 'Pick a code style', text: 'Plain async function, React hook, TanStack Query, Node script or a reusable client.' },
      { icon: 'copy', title: 'Copy production-ready code', text: 'Status checking and error handling are on by default, because fetch omits both.' }
    ],
    guideTitle: 'What fetch leaves for you to do',
    guide:
      '<p style="color:var(--muted)">fetch is deliberately minimal. It gives you a promise over an HTTP transfer and nothing else — no status handling, no timeout, no retries, no automatic JSON. Every one of those has to be written by hand, and skipping them is why so much fetch code fails quietly in production.</p>' +
      '<div class="grid g2" style="margin-top:18px">' +
      '<div><h4 style="font-size:14.5px;margin-bottom:8px">The three you cannot skip</h4><ol style="color:var(--muted);font-size:13.8px;padding-left:18px;margin:0"><li><strong>Check <code>response.ok</code>.</strong> A 500 resolves successfully. Without this check you parse an HTML error page as JSON and get a confusing syntax error far from the real problem.</li><li><strong>Set a timeout.</strong> <code>AbortSignal.timeout()</code> is one line and prevents a hung request from holding a connection indefinitely.</li><li><strong>Abort on unmount.</strong> In React, a response that arrives after the component is gone sets state on nothing and can leak. Every hook style above wires up an <code>AbortController</code>.</li></ol></div>' +
      '<div><h4 style="font-size:14.5px;margin-bottom:8px">fetch or a library?</h4><p style="color:var(--muted);font-size:13.8px">fetch is built in everywhere, adds no bundle weight, and works identically in browsers, Node 18+, Deno, Bun and edge runtimes. That makes it the right default.</p>' +
      '<p style="color:var(--muted);font-size:13.8px;margin-top:10px">Reach for <a href="axios-request-generator.html">Axios</a> when you want interceptors, upload progress, or automatic JSON handling without writing a wrapper. Reach for TanStack Query when the hard part is caching, refetching and request deduplication rather than the HTTP call itself.</p>' +
      '<p style="color:var(--muted);font-size:13.8px;margin-top:10px">The middle path — a small <code>apiRequest</code> wrapper like the one generated above — usually beats both for an internal API.</p></div></div>' +
      '<div class="note note-warn" style="margin-top:18px">' + GTI.warn + '<span><strong>Any token in browser code is public.</strong> Environment variables in a frontend bundle are inlined at build time and readable in DevTools. If a credential must stay secret, the request has to be proxied through a server you control.</span></div>',

      { q: 'Why does fetch not throw on a 404?', a: 'By design — the promise reflects whether the HTTP transfer completed, not whether the server was happy. A 404 is a successful transfer of an error response, so you must check <code>response.ok</code> or <code>response.status</code> yourself.' },
