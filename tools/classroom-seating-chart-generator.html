<section id="toolApp">
<div class="wrap">
<div class="tool-grid">

  <form class="card card-pad" id="cfg" autocomplete="off">
    <div class="panel-title"><span class="ico" id="icoGear"></span>Classroom Setup</div>

    <div class="field">
      <label for="names">Student names — one per line</label>
      <textarea id="names" style="min-height:170px">Amara
Ben
Chen
Diego
Elena
Farah
Grace
Hugo
Ines
Jonas
Layla
Mateo
Nadia
Omar

Rosa
Sam
Tess
Uma
Viktor</textarea>
      <div id="rosterStats"></div>
    </div>

    <div class="divider"></div>

    <div class="field">
      <label for="layout">Desk layout</label>
      <select id="layout">
        <option value="grid" selected>Rows of single desks</option>
        <option value="pairs">Paired desks</option>
        <option value="groups">Group tables</option>
        <option value="ushape">U-shape</option>
      </select>
    </div>

    <div class="row">
      <div class="field"><label for="rows" id="rowsLabel">Rows</label><input type="number" id="rows" value="4" min="1" max="15"></div>
      <div class="field"><label for="cols" id="colsLabel">Seats per row</label><input type="number" id="cols" value="6" min="1" max="15"></div>
    </div>

    <div class="field">
      <label for="fill">Seat assignment</label>

        <option value="random" selected>Random</option>

        <option value="entered">As entered</option>
      </select>
    </div>

    <div class="divider"></div>

    <div class="field">
      <label for="front">Seat at the front — one name per line</label>

      <div class="hint">For students with visual, hearing or attention needs. They are placed in row 1 before anyone else.</div>
    </div>

    <div class="field">
      <label for="apart">Keep apart — one pair per line</label>
      <textarea id="apart" style="min-height:60px" placeholder="Ben & Chen"></textarea>
      <div class="hint">Avoids seating them adjacent, or at the same table in group layouts.</div>
    </div>

    <fieldset class="field">

        <label class="check on"><input type="checkbox" id="optNumbers" checked>

    <div class="field">
      <label for="seed">Seed</label>

        <button type="button" class="btn btn-soft" id="newSeed"><span id="icoReset"></span></button>

    <div class="out-actions">
      <button type="submit" class="btn btn-primary btn-block"><span id="icoBolt"></span> Generate Seating Chart</button>
    </div>
  </form>

  <div class="card card-pad">
    <div class="panel-title"><span class="ico" id="icoSpark"></span>Seating Chart<span class="spacer"></span>

    <div class="tabs" id="tabs">
      <button type="button" class="on" data-tab="results">Chart</button>
      <button type="button" data-tab="list">Seat list</button>
      <button type="button" data-tab="guide">Teaching notes</button>

    <div data-panel="results">
      <div id="chart"></div>
      <div class="out-actions" style="margin-top:18px">
        <button type="button" class="btn btn-primary" id="printBtn"><span id="icoFile"></span> Print / PDF</button>
        <button type="button" class="btn btn-soft" id="regen"><span id="icoReset2"></span> Reshuffle</button>
      </div>
      <div id="checks"></div>

    <div data-panel="list" hidden>
      <div id="seatList"></div>
      <div class="out-actions" style="margin-top:14px">
        <button class="btn btn-ghost" id="copyBtn"><span id="icoCopy"></span> Copy seat list</button>
        <button class="btn btn-ghost" id="dlBtn"><span id="icoDl"></span> Download CSV</button>

<script src="../assets/js/site.js"></script>
<script src="../assets/js/roster.js"></script>
<script>
(function () {
  var I = GTI, $ = GT.$, $$ = GT.$$;
  ['icoGear:gear','icoSpark:spark','icoBolt:bolt','icoCopy:copy','icoDl:download','icoReset:reset','icoReset2:reset','icoFile:file']
    .forEach(function (p) { var a = p.split(':'); document.getElementById(a[0]).innerHTML = I[a[1]]; });

  var grid = [], names = [], layout = 'grid';

  function seatCount(rows, cols) {
    if (layout === 'ushape') return rows * 2 + cols;
    return rows * cols;
  }

  function adjacency(r, c, rows, cols) {
    /* Which seats count as "next to" this one, for keep-apart purposes. */
    var adj = [];
    if (layout === 'pairs') {
      var partner = c % 2 === 0 ? c + 1 : c - 1;
      if (partner >= 0 && partner < cols) adj.push([r, partner]);
    } else if (layout === 'groups') {
      /* Same table = same 2x2 block. */
      var br = Math.floor(r / 2) * 2, bc = Math.floor(c / 2) * 2;
      for (var i = br; i < br + 2 && i < rows; i++) {
        for (var j = bc; j < bc + 2 && j < cols; j++) {
          if (i !== r || j !== c) adj.push([i, j]);
        }
      }
    } else {
      if (c > 0) adj.push([r, c - 1]);
      if (c < cols - 1) adj.push([r, c + 1]);
    }
    return adj;
  }

  function build() {
    var parsed = GTRoster.parseNames($('#names').value);
    names = parsed.names;
    GTRoster.rosterStats('#rosterStats', parsed);

    layout = $('#layout').value;
    var rows = Math.max(1, Math.min(15, parseInt($('#rows').value, 10) || 1));
    var cols = Math.max(1, Math.min(15, parseInt($('#cols').value, 10) || 1));
    var seats = seatCount(rows, cols);

    $('#rowsLabel').textContent = layout === 'groups' ? 'Table rows' : 'Rows';
    $('#colsLabel').textContent = layout === 'pairs' ? 'Seats per row (pairs)' : layout === 'groups' ? 'Seats across' : 'Seats per row';
    $('#capacityHint').innerHTML = seats + ' seats for ' + names.length + ' students' +
      (seats < names.length ? ' — <strong style="color:var(--red)">' + (names.length - seats) + ' too few</strong>'
        : seats > names.length ? ' · ' + (seats - names.length) + ' empty' : ' · exact fit');

    if (!names.length) {
      $('#chart').innerHTML = '<div class="empty">Add student names.</div>';
      $('#pill').textContent = '—';
      return;
    }

    var rand = GTRoster.rng($('#seed').value);
    var frontNames = GT.lines($('#front').value).map(function (s) { return s.trim(); }).filter(Boolean);
    var apart = GTRoster.parsePairs($('#apart').value);

    /* Order the pool: front-row students first, then the rest per the fill mode. */
    var frontSet = {};
    frontNames.forEach(function (f) {
      var m = names.filter(function (n) { return n.toLowerCase() === f.toLowerCase(); })[0];
      if (m) frontSet[m] = 1;
    });
    var rest = names.filter(function (n) { return !frontSet[n]; });
    var fill = $('#fill').value;
    if (fill === 'random') rest = GTRoster.shuffle(rest, rand);
    else if (fill === 'alpha') rest = rest.slice().sort(function (a, b) { return a.localeCompare(b); });
    var pool = Object.keys(frontSet).concat(rest);

    /* Build the seat list in placement order. */
    var cells = [];
    if (layout === 'ushape') {
      for (var c1 = 0; c1 < cols; c1++) cells.push([0, c1]);
      for (var r1 = 1; r1 < rows; r1++) { cells.push([r1, 0]); cells.push([r1, cols - 1]); }
    } else {
      for (var r = 0; r < rows; r++) for (var c = 0; c < cols; c++) cells.push([r, c]);
    }

    grid = [];
    for (var i = 0; i < rows; i++) { grid.push([]); for (var j = 0; j < cols; j++) grid[i].push(undefined); }

    var placed = {}, violations = [];
    pool.forEach(function (name) {
      var target = null;
      for (var k = 0; k < cells.length; k++) {
        var cell = cells[k];
        if (grid[cell[0]][cell[1]] !== undefined) continue;
        var bad = adjacency(cell[0], cell[1], rows, cols).some(function (a) {
          var other = grid[a[0]] && grid[a[0]][a[1]];
          return other && GTRoster.conflicts(other, name, apart);
        });
        if (!bad) { target = cell; break; }
      }
      if (!target) {
        for (var k2 = 0; k2 < cells.length; k2++) {
          if (grid[cells[k2][0]][cells[k2][1]] === undefined) { target = cells[k2]; break; }
        }
        if (target) {
          adjacency(target[0], target[1], rows, cols).forEach(function (a) {
            var other = grid[a[0]] && grid[a[0]][a[1]];
            if (other && GTRoster.conflicts(other, name, apart)) violations.push([other, name]);
          });
        }
      }
      if (target) { grid[target[0]][target[1]] = name; placed[name] = 1; }
    });

    var unseated = names.filter(function (n) { return !placed[n]; });

    renderChart(rows, cols);
    renderList(rows, cols);
    renderChecks(seats, unseated, violations, frontNames);

    $('#pill').textContent = names.length + ' students · ' + seats + ' seats';
    $('#pill').style.background = unseated.length ? 'var(--red-bg)' : 'var(--green-bg)';
    $('#pill').style.color = unseated.length ? 'var(--red)' : 'var(--green)';
  }

  function displayRow(row) {
    return $('#optTeacherView').checked ? row.slice().reverse() : row;
  }

  function renderChart(rows, cols) {
    var n = 0;
    var html = '<div style="border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--bg-soft);overflow-x:auto">' +
      '<div style="text-align:center;font-size:12.5px;font-weight:700;letter-spacing:.08em;color:var(--muted);' +
      'border:1px dashed var(--line);border-radius:8px;padding:8px;margin-bottom:16px">FRONT · BOARD</div>';

    for (var r = 0; r < rows; r++) {
      var row = displayRow(grid[r]);
      var isEmptyRow = row.every(function (x) { return x === undefined; });
      if (isEmptyRow && layout === 'ushape') continue;
      html += '<div style="display:grid;grid-template-columns:repeat(' + cols + ',minmax(0,1fr));gap:8px;margin-bottom:8px">';
      row.forEach(function (name, ci) {
        n++;
        var gap = (layout === 'pairs' && ci % 2 === 1) ? 'margin-right:10px;' : '';
        if (name === undefined) {
          html += '<div style="' + gap + 'border:1px dashed var(--line);border-radius:8px;padding:11px 6px;text-align:center;' +
            'font-size:12px;color:var(--muted-2);min-height:42px;display:flex;align-items:center;justify-content:center">—</div>';
        } else {
          html += '<div style="' + gap + 'border:1px solid var(--line);background:#fff;border-radius:8px;padding:11px 6px;' +
            'text-align:center;font-size:13px;font-weight:600;color:var(--ink-2);min-height:42px;display:flex;' +
            'align-items:center;justify-content:center;flex-direction:column;gap:2px">' +
            ($('#optNumbers').checked ? '<span style="font-size:10px;font-weight:500;color:var(--muted-2)">' + n + '</span>' : '') +
            GT.esc(name) + '</div>';
        }
      });
      html += '</div>';
    }
    html += '</div>';
    if ($('#optTeacherView').checked) {
      html += '<p style="color:var(--muted);font-size:12.5px;margin-top:8px;text-align:center">' +
        'Mirrored — this is the view from the front of the room facing the class.</p>';
    }
    $('#chart').innerHTML = html;
  }

  function renderList(rows, cols) {
    var out = [], n = 0;
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        if (grid[r][c] === undefined) continue;
        n++;
        out.push({ seat: n, row: r + 1, col: c + 1, name: grid[r][c] });
      }
    }
    window.__seats = out;
    $('#seatList').innerHTML = out.length
      ? '<table style="border-collapse:collapse;width:100%;font-size:13.5px">' +
        '<tr><th style="text-align:left;padding:8px;border-bottom:1px solid var(--line)">Seat</th>' +
        '<th style="text-align:left;padding:8px;border-bottom:1px solid var(--line)">Row / position</th>' +
        '<th style="text-align:left;padding:8px;border-bottom:1px solid var(--line)">Student</th></tr>' +
        out.map(function (s) {
          return '<tr><td style="padding:8px;border-bottom:1px solid var(--line-2)">' + s.seat + '</td>' +
            '<td style="padding:8px;border-bottom:1px solid var(--line-2);color:var(--muted)">Row ' + s.row + ', seat ' + s.col + '</td>' +
            '<td style="padding:8px;border-bottom:1px solid var(--line-2)">' + GT.esc(s.name) + '</td></tr>';
        }).join('') + '</table>'
      : '<div class="empty">No seats assigned.</div>';
  }

  function renderChecks(seats, unseated, violations, frontNames) {
    var c = [];
    if (unseated.length) {
      c.push(['err', 'Not enough seats — ' + unseated.length + ' student' + (unseated.length === 1 ? '' : 's') +
        ' could not be placed: ' + unseated.slice(0, 6).map(GT.esc).join(', ') +
        (unseated.length > 6 ? '…' : '') + '. Add rows or seats per row.']);
    } else {
      c.push(['ok', 'All ' + names.length + ' students seated' +
        (seats > names.length ? ', with ' + (seats - names.length) + ' seats spare.' : '.')]);
    }
    if (violations.length) {
      c.push(['err', 'Could not separate ' + GT.uniq(violations.map(function (v) {
        return GT.esc(v[0]) + ' & ' + GT.esc(v[1]);
      })).join(', ') + '. There is not enough space to keep them apart — add seats or reduce keep-apart rules.']);
    } else if ($('#apart').value.trim()) {
      c.push(['ok', 'All keep-apart pairs are seated non-adjacent.']);
    }
    var unmatched = frontNames.filter(function (f) {
      return !names.some(function (n) { return n.toLowerCase() === f.toLowerCase(); });
    });
    if (unmatched.length) {
      c.push(['warn', 'These front-row names are not in the class list: ' + unmatched.map(GT.esc).join(', ') + '. Check the spelling.']);
    }
    $('#checks').innerHTML = c.map(function (x) {
      return '<div class="note ' + (x[0] === 'ok' ? 'note-ok' : x[0] === 'warn' ? 'note-warn' : 'note-err') + '">' +
        (x[0] === 'ok' ? I.check : I.warn) + '<span>' + x[1] + '</span></div>';
    }).join('');
  }

  $('#copyBtn').addEventListener('click', function () {
    GT.copy((window.__seats || []).map(function (s) {
      return s.seat + '\tRow ' + s.row + ', seat ' + s.col + '\t' + s.name;
    }).join('\n'), 'Seat list');
  });
  $('#dlBtn').addEventListener('click', function () {
    var csv = 'seat,row,position,student\n' + (window.__seats || []).map(function (s) {
      return s.seat + ',' + s.row + ',' + s.col + ',"' + s.name.replace(/"/g, '""') + '"';
    }).join('\n');
    GT.download(csv, 'seating-chart.csv', 'text/csv');
  });

  $('#printBtn').addEventListener('click', function () {
    var rows = Math.max(1, parseInt($('#rows').value, 10) || 1);
    var cols = Math.max(1, parseInt($('#cols').value, 10) || 1);
    var body = '<h1>Seating Chart</h1><p class="sub">' + names.length + ' students · ' +
      new Date().toLocaleDateString() + ($('#optTeacherView').checked ? ' · teacher view (mirrored)' : '') + '</p>' +
      '<div style="text-align:center;border:1px dashed #94a3b8;border-radius:8px;padding:8px;margin-bottom:16px;' +
      'font-weight:600;letter-spacing:.08em;font-size:12px">FRONT · BOARD</div>';
    for (var r = 0; r < rows; r++) {
      var row = displayRow(grid[r]);
      if (row.every(function (x) { return x === undefined; })) continue;
      body += '<div style="display:grid;grid-template-columns:repeat(' + cols + ',1fr);gap:8px;margin-bottom:8px">' +
        row.map(function (nm) {
          return '<div class="seat">' + (nm === undefined ? '<span class="empty">—</span>' : GT.esc(nm)) + '</div>';
        }).join('') + '</div>';
    }
    GTRoster.printHtml('Seating Chart', body);
  });

  $('#newSeed').addEventListener('click', function () { $('#seed').value = Math.random().toString(36).slice(2, 8); build(); });
  $('#regen').addEventListener('click', function () { $('#seed').value = Math.random().toString(36).slice(2, 8); build(); });

  $('#guide').innerHTML = [
    ['Teacher view is the one that matters at the door', 'A chart drawn from the students\' perspective is mirrored relative to what you see standing at the front. Every teacher has called on the wrong side of the room from a chart at least once. Tick teacher view and the left of the page is the left of what you are looking at.'],
    ['Front-row placements come first', 'Students with visual, hearing or attention needs are seated in row one before the randomiser touches anyone else. That ordering is deliberate — randomising first and then moving people undoes the balance you just created.'],
    ['Keep-apart works on adjacency, not distance', 'Two students on opposite sides of the same row are not adjacent, so the rule is satisfied. In group-table layouts, everyone at the same table counts as adjacent, which is usually what you want.'],
    ['Layout changes the lesson', 'Rows suit direct instruction and assessment. Paired desks suit think-pair-share. Group tables suit collaborative work but make whole-class attention harder. A U-shape maximises discussion and eye contact but seats fewer students in the same room.'],
    ['Reshuffle periodically, not constantly', 'Changing seats every lesson costs settling time. Once a half-term is a common rhythm — long enough to establish routine, short enough to break up unhelpful clusters.'],
    ['Print it for cover teachers', 'A printed chart with names is the single most useful thing you can leave for a substitute. Include it in your cover folder alongside the lesson plan.']
  ].map(function (x) {
    return '<div style="margin-bottom:16px"><h4 style="font-size:14.5px;margin-bottom:6px">' + x[0] + '</h4>' +
      '<p style="color:var(--muted);font-size:13.8px">' + x[1] + '</p></div>';
  }).join('');

  $('#tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    $$('#tabs button').forEach(function (x) { x.classList.toggle('on', x === b); });
    $$('[data-panel]').forEach(function (p) { p.hidden = p.getAttribute('data-panel') !== b.getAttribute('data-tab'); });
  });
  $('#cfg').addEventListener('submit', function (e) { e.preventDefault(); build(); GT.toast('Seating chart generated'); });
  $('#cfg').addEventListener('input', build);
  $('#cfg').addEventListener('change', build);

  build();

  GT.page({
    slug: 'classroom-seating-chart-generator',
    lede: 'Create a printable seating plan in seconds — four desk layouts, keep-apart rules, front-row placements for access needs, and a mirrored teacher view.',
    steps: [
      { icon: 'gear', title: 'Set your room layout', text: 'Rows, paired desks, group tables or a U-shape, sized to your classroom.' },
      { icon: 'seat', title: 'Add your constraints', text: 'Front-row students are placed first; keep-apart pairs are seated non-adjacent.' },
      { icon: 'file', title: 'Print it', text: 'A clean chart for the wall, your planner, or the cover folder.' }
    ],
    guideTitle: 'The mirroring problem every seating chart has',
    guide:
      '<p style="color:var(--muted)">A seating chart is drawn on paper from above, but you use it standing at the front of the room facing the class. Those two orientations are horizontal mirrors of each other. The student who appears on the left of your chart is on your right when you look up — which is how you end up asking the wrong child a question.</p>' +
      '<p style="color:var(--muted);margin-top:12px">Teacher view flips each row so the chart matches your actual view. It is worth generating both: the standard view for handing to a student or sticking on the wall, the mirrored one for the copy in your planner.</p>' +
      '<div class="grid g2" style="margin-top:18px">' +
      '<div><h4 style="font-size:14.5px;margin-bottom:8px">Choosing a layout</h4><ul style="color:var(--muted);font-size:13.8px;padding-left:18px;margin:0"><li><strong>Rows</strong> — direct instruction, tests, minimal chatter.</li><li><strong>Paired desks</strong> — think-pair-share, peer marking.</li><li><strong>Group tables</strong> — collaborative work; harder to regain whole-class attention.</li><li><strong>U-shape</strong> — discussion and eye contact, but fits fewer students.</li></ul></div>' +
      '<div><h4 style="font-size:14.5px;margin-bottom:8px">Constraint order matters</h4><p style="color:var(--muted);font-size:13.8px">Front-row students are placed before the randomiser runs. If you shuffle first and then move students who need to be near the board, you disturb every keep-apart arrangement you just made — so the tool does it in the order that holds up.</p>' +
      '<p style="color:var(--muted);font-size:13.8px;margin-top:10px">When constraints genuinely cannot be met — three students who all must be separated in a room with two spare seats — you are told which pair failed rather than being handed a chart that quietly ignores it.</p></div></div>' +
