<title>Product Code Generator – Model & Article Number Builder</title>
<meta name="description" content="Generate internal product, model and article codes with brand, category, sequence and revision segments. Create numbered series or codes from product names.">
<link rel="canonical" href="https://managemybatch.com/tools/product-code-generator">

<meta property="og:url" content="https://managemybatch.com/tools/product-code-generator">

<meta name="twitter:title" content="Product Code Generator – Model & Article Number Builder">

</head>
<body data-root="../">

<section class="hero" id="hero"></section>

<section id="toolApp">
<div class="wrap">
<div class="tool-grid">

  <form class="card card-pad" id="cfg" autocomplete="off">
    <div class="panel-title"><span class="ico" id="icoGear"></span>Generator Settings</div>

    <div class="field">
      <label>Mode</label>
      <div class="seg" id="mode">
        <button type="button" class="on" data-m="sequence">Numbered series</button>
        <button type="button" data-m="fromNames">From product names</button>
      </div>
      <div class="hint" id="modeHint">Generate a block of codes in a numbered series.</div>
    </div>

    <div class="row">
      <div class="field"><label for="prefix">Brand / range prefix</label><input type="text" id="prefix" value="ACM"></div>
      <div class="field">
        <label for="category">Category code</label>
        <input type="text" id="category" value="TL" placeholder="e.g. TL, AUD">
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label for="sep">Separator</label>
        <select id="sep">
          <option value="-" selected>Hyphen (-)</option>
          <option value="">None</option>
          <option value=".">Dot (.)</option>
          <option value="/">Slash (/)</option>
        </select>
      </div>
      <div class="field">
        <label for="pad">Number length</label>
        <select id="pad">
          <option value="3" selected>3 digits</option>
          <option value="4">4 digits</option>
          <option value="5">5 digits</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div class="field"><label for="start">Starting number</label><input type="number" id="start" value="100" min="0"></div>
      <div class="field"><label for="step">Increment by</label><input type="number" id="step" value="10" min="1"></div>
    </div>
    <div class="hint" style="margin:-8px 0 16px">Stepping by 10 leaves room to insert related models later without renumbering.</div>

    <div class="field">
      <label for="version">Version / revision suffix</label>
      <select id="version">
        <option value="">None</option>
        <option value="A">Letter — A, B, C</option>
        <option value="MK">MK1, MK2</option>
        <option value="V1">V1, V2</option>
      </select>
    </div>

    <div class="field" id="namesField" hidden>
      <label for="names">Product names — one per line</label>
      <textarea id="names" style="min-height:130px">Cordless Drill 18V
Impact Driver Compact
Circular Saw 190mm
Orbital Sander
Angle Grinder 115mm</textarea>
      <div class="hint">Codes are derived from initials, then made unique with the sequence.</div>
    </div>

    <div class="field">
      <label for="count" id="countLabel">How many codes</label>
      <input type="number" id="count" value="8" min="1" max="5000">
    </div>

    <div class="field">
      <label for="preview">Preview</label>
      <div class="seq-preview" id="preview">ACM-TL-100</div>
    </div>

    <div class="out-actions">
      <button type="submit" class="btn btn-primary btn-block"><span id="icoBolt"></span> Generate Product Codes</button>
    </div>
  </form>

  <div class="card card-pad">
    <div class="panel-title"><span class="ico" id="icoSpark"></span>Generated Codes<span class="spacer"></span>
      <span class="result-pill" id="pill"></span></div>

    <div class="tabs" id="tabs">
      <button type="button" class="on" data-tab="results">Results</button>
      <button type="button" data-tab="export">Export</button>
      <button type="button" data-tab="checks">Validation</button>
      <button type="button" data-tab="guide">Coding schemes</button>
    </div>

    <div data-panel="results">
      <div id="primary"></div>
      <div id="more"></div>
      <div id="mapTable" style="margin-top:16px;overflow-x:auto"></div>
      <button type="button" class="btn btn-soft btn-block" id="regen" style="margin-top:18px">
        <span id="icoReset"></span> Regenerate</button>
    </div>

    <div data-panel="export" hidden>
      <div class="field">
        <label for="exportAs">Export format</label>
        <select id="exportAs">
          <option value="table">CSV with product names</option>
          <option value="lines">Plain list</option>
          <option value="json">JSON array</option>
          <option value="sql">SQL INSERT</option>
        </select>
      </div>
      <div class="output-box">
        <div class="output-bar"><span class="fname" id="fname">product-codes.csv</span><span class="chip" id="meta"></span></div>
        <pre class="code" id="out"></pre>
      </div>
      <div class="out-actions">
        <button class="btn btn-primary" id="copyBtn"><span id="icoCopy"></span> Copy all</button>
        <button class="btn btn-ghost" id="dlBtn"><span id="icoDl"></span> Download</button>
      </div>
    </div>

    <div data-panel="checks" hidden><div id="checks"></div></div>
    <div data-panel="guide" hidden><div id="guide"></div></div>
  </div>

</div>
</div>
</section>

<div id="afterTool"></div>

<script src="../assets/js/site.js"></script>
<script src="../assets/js/seqid.js"></script>
<script>
(function () {
  var I = GTI, $ = GT.$, $$ = GT.$$;
  ['icoGear:gear','icoSpark:spark','icoBolt:bolt','icoCopy:copy','icoDl:download','icoReset:reset']
    .forEach(function (p) { var a = p.split(':'); document.getElementById(a[0]).innerHTML = I[a[1]]; });

  var mode = 'sequence', rows = [];
  var out = GT.mountOutput({ pre: '#out', fileLabel: '#fname', meta: '#meta',
    copyBtn: '#copyBtn', downloadBtn: '#dlBtn', filename: 'product-codes.csv', mime: 'text/csv' });

  function initials(name) {
    var words = String(name).replace(/[^A-Za-z0-9 ]/g, ' ').split(/\s+/).filter(Boolean);
    if (!words.length) return 'XX';
    if (words.length === 1) return words[0].slice(0, 3).toUpperCase();
    return words.slice(0, 3).map(function (w) { return w[0]; }).join('').toUpperCase();
  }

  function versionSuffix(i) {
    var v = $('#version').value;
    if (!v) return '';
    if (v === 'A') return String.fromCharCode(65 + (i % 26));
    if (v === 'MK') return 'MK1';
    if (v === 'V1') return 'V1';
    return '';
  }

  function build() {
    var sep = $('#sep').value;
    var prefix = $('#prefix').value.trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
    var cat = $('#category').value.trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
    var pad = parseInt($('#pad').value, 10);
    var start = parseInt($('#start').value, 10) || 0;
    var step = parseInt($('#step').value, 10) || 1;

    rows = [];

    if (mode === 'fromNames') {
      var names = GT.lines($('#names').value);
      names.forEach(function (nm, i) {
        var parts = [prefix, cat, initials(nm), String(start + i * step).padStart(pad, '0')].filter(Boolean);
        var v = versionSuffix(i); if (v) parts.push(v);
        rows.push({ code: parts.join(sep), name: nm });
      });
    } else {
      var n = Math.max(1, Math.min(5000, parseInt($('#count').value, 10) || 1));
      for (var i = 0; i < n; i++) {
        var parts2 = [prefix, cat, String(start + i * step).padStart(pad, '0')].filter(Boolean);
        var v2 = versionSuffix(i); if (v2) parts2.push(v2);
        rows.push({ code: parts2.join(sep), name: '' });
      }
    }

    var codes = rows.map(function (r) { return r.code; });
    $('#preview').textContent = codes[0] || '—';
    GTSeq.renderResults({ ids: codes, primary: '#primary', more: '#more', noun: 'Product Code', maxMore: 12 });
    $('#pill').textContent = codes.length.toLocaleString() + ' code' + (codes.length === 1 ? '' : 's');
    $('#pill').style.background = 'var(--green-bg)'; $('#pill').style.color = 'var(--green)';

    renderMap();
    renderExport(codes);

    var c = GTSeq.validate(codes, { humanEntry: true });
    if (step === 1) c.push({ s: 'warn', m: 'Incrementing by 1 leaves no room to insert a related model between two existing codes later. Stepping by 10 is the usual convention in product catalogues.' });
    if (!cat) c.push({ s: 'warn', m: 'No category code. A category segment is what lets someone read a code and know roughly what the product is.' });
    if ((codes[0] || '').length > 18) c.push({ s: 'warn', m: 'Long codes are awkward on product labels, packaging and spec sheets. Under about 15 characters is comfortable.' });
    if (mode === 'fromNames') {
      var inits = rows.map(function (r) { return initials(r.name); });
      var dup = inits.filter(function (x, i) { return inits.indexOf(x) !== i; });
      if (dup.length) c.push({ s: 'warn', m: 'Some products produce the same initials (' + GT.uniq(dup).join(', ') + '). The sequence keeps codes unique, but the letters no longer identify the product on their own.' });
    }
    GTSeq.renderChecks('#checks', c);
  }

  function renderMap() {
    if (mode !== 'fromNames' || !rows.length) { $('#mapTable').innerHTML = ''; return; }
    $('#mapTable').innerHTML = '<p class="more-label">Code → product</p>' +
      '<table style="border-collapse:collapse;width:100%;font-size:13px">' +
      rows.map(function (r) {
        return '<tr><td style="padding:8px;border-bottom:1px solid var(--line-2);font-family:var(--mono);white-space:nowrap">' +
          GT.esc(r.code) + '</td><td style="padding:8px;border-bottom:1px solid var(--line-2);color:var(--muted)">' +
          GT.esc(r.name) + '</td></tr>';
      }).join('') + '</table>';
  }

  function renderExport(codes) {
    var m = $('#exportAs').value, text, file = 'product-codes.csv';
    if (m === 'table') {
      text = 'product_code,product_name\n' + rows.map(function (r) {
        return r.code + ',"' + r.name.replace(/"/g, '""') + '"';
      }).join('\n');
    } else if (m === 'json') {
      text = JSON.stringify(rows.map(function (r) { return { code: r.code, name: r.name }; }), null, 2);
      file = 'product-codes.json';
    } else if (m === 'sql') {
      text = 'INSERT INTO products (product_code, name) VALUES\n' + rows.map(function (r) {
        return "  ('" + r.code + "', '" + r.name.replace(/'/g, "''") + "')";
      }).join(',\n') + ';';
      file = 'product-codes.sql';
    } else { text = codes.join('\n'); file = 'product-codes.txt'; }
    out.set(text, file);
  }

  $('#guide').innerHTML = [
    ['Product code, SKU and barcode are three different things', 'A product code identifies a <em>model</em> — the Cordless Drill 18V, regardless of colour or bundle. A <a href="/tools/sku-generator">SKU</a> identifies a stocked variant of it. A <a href="/tools/barcode-number-generator">barcode number</a> identifies it globally for retail scanning. Most catalogues need all three, and conflating them causes trouble later.'],
    ['Leave gaps in the sequence', 'Numbering 100, 110, 120 rather than 100, 101, 102 means you can slot a related model in at 105 without renumbering a catalogue, reprinting spec sheets or breaking every existing reference.'],
    ['Category codes make codes self-describing', 'Two or three letters for the product family lets anyone reading a code place it immediately. Unlike a department in an employee ID, a product family rarely changes, so this stays accurate.'],
    ['Version suffixes track revisions, not variants', 'Use a version suffix when the same product is revised — a MK2 with a different motor. Do not use it for colours or sizes; those are variants and belong in the SKU.'],
    ['Do not encode the year', 'It dates the product on every spec sheet and price list, and makes a perfectly current item look obsolete once the year rolls over.'],
    ['Keep it printable', 'Product codes go on packaging, labels, spec sheets and quotes. Under 15 characters keeps them readable and stops them wrapping awkwardly in tables.']
  ].map(function (x) {
    return '<div style="margin-bottom:16px"><h4 style="font-size:14.5px;margin-bottom:6px">' + x[0] + '</h4>' +
      '<p style="color:var(--muted);font-size:13.8px">' + x[1] + '</p></div>';
  }).join('');

  $('#mode').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    $$('#mode button').forEach(function (x) { x.classList.toggle('on', x === b); });
    mode = b.getAttribute('data-m');
    $('#namesField').hidden = mode !== 'fromNames';
    $('#count').closest('.field').hidden = mode === 'fromNames';
    $('#modeHint').textContent = mode === 'fromNames'
      ? 'Derive a code for each product name, using initials plus a sequence.'
      : 'Generate a block of codes in a numbered series.';
    build();
  });

  GTSeq.bindCopy('#primary', function () { return rows.map(function (r) { return r.code; }); });
  GTSeq.bindCopy('#more', function () { return rows.map(function (r) { return r.code; }); });

  $('#tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    $$('#tabs button').forEach(function (x) { x.classList.toggle('on', x === b); });
    $$('[data-panel]').forEach(function (p) { p.hidden = p.getAttribute('data-panel') !== b.getAttribute('data-tab'); });
  });
  $('#cfg').addEventListener('submit', function (e) { e.preventDefault(); build(); GT.toast('Product codes generated'); });
  $('#cfg').addEventListener('input', build);
  $('#cfg').addEventListener('change', build);
  $('#regen').addEventListener('click', build);
  $('#exportAs').addEventListener('change', build);

  build();

  GT.page({
    slug: 'product-code-generator',
    lede: 'Build internal product and model codes with category, range and version segments — either as a numbered series or derived automatically from a list of product names.',
    steps: [
      { icon: 'gear', title: 'Set brand and category', text: 'Short codes that make a product code self-describing.' },
      { icon: 'tag', title: 'Leave gaps', text: 'Stepping by 10 lets you insert related models later without renumbering.' },
      { icon: 'copy', title: 'Export the catalogue', text: 'CSV mapping each code to its product name.' }
    ],
    guideTitle: 'Product code, SKU or barcode — which do you actually need?',
    guide:
      '<p style="color:var(--muted)">These three identifiers get used interchangeably and should not be. Getting the distinction right early saves a painful catalogue migration later.</p>' +
      '<div class="grid g3" style="margin-top:18px">' +
      '<div><h4 style="font-size:14.5px;margin-bottom:8px">Product code</h4><p style="color:var(--muted);font-size:13.8px">Identifies a <strong>model</strong>. The Cordless Drill 18V has one product code regardless of which bundle or colour you sell. It appears on spec sheets, quotes and manuals.</p></div>' +
      '<div><h4 style="font-size:14.5px;margin-bottom:8px">SKU</h4><p style="color:var(--muted);font-size:13.8px">Identifies a <strong>stocked variant</strong>. The drill in a case, the drill bare-tool, and the drill with two batteries are three SKUs of one product code. Used for picking and stock counts.</p></div>' +
      '<div><h4 style="font-size:14.5px;margin-bottom:8px">Barcode / GTIN</h4><p style="color:var(--muted);font-size:13.8px">Identifies the item <strong>globally</strong>. Issued from a GS1 prefix you license, scanned at retail tills. You cannot invent these for real retail sale.</p></div></div>' +
      '<div class="note note-info" style="margin-top:18px">' + GTI.info + '<span><strong>Leave gaps in your numbering.</strong> A catalogue numbered 100, 110, 120 can absorb a new mid-range model at 105 forever. One numbered 100, 101, 102 forces you to either append it at the end — breaking the logical order — or renumber, which invalidates every printed reference.</span></div>' +
      '<div class="note note-warn" style="margin-top:12px">' + GTI.warn + '<span>Resist putting the launch year in a product code. It makes a current, well-selling product look obsolete on every price list the moment the year changes.</span></div>',
    related: ['sku-generator', 'barcode-number-generator', 'asset-tag-number-generator'],
faqs: [
      { q: 'What is a product code?', a: 'It is an internal identifier used to distinguish a product, model, article or catalog item.' },
      { q: 'Is a product code the same as a SKU?', a: 'Sometimes organizations use the terms interchangeably. A useful distinction is that a product code identifies a base product while a SKU identifies an exact stock-tracked variant.' },
      { q: 'Is a product code the same as UPC or EAN?', a: 'No. UPC/EAN values are standardized GS1 trade-item identifiers. An internal product code is controlled by your business.' },
      { q: 'Can I generate product codes from names?', a: 'Yes. The tool can derive mnemonic codes from product names and add sequence data to keep them unique.' },
      { q: 'Should product codes contain categories?', a: 'They can when categories are stable and useful to staff. Avoid category segments if your classification changes frequently.' },
      { q: 'Can I add revision letters?', a: 'Yes. Use revision suffixes when your product lifecycle genuinely treats revisions as distinct controlled versions.' },
      { q: 'Should old product codes be reused?', a: 'Avoid reuse because historical orders, manuals, returns and service records may still reference them.' }
    ],
    seo: {
      title: 'Product Code Generator – Create Model and Article Number Series',
      lead: 'Use the Product Code Generator above to create consistent internal product, model and article numbers.',
      blocks: [
        { html: '<p>Choose a brand or range prefix, add a category code, define the separator and numeric length, then generate a numbered series from a starting value. You can also paste product names and let the tool derive short mnemonic codes before adding a sequence for uniqueness.</p>' +
            '<p>For example: Brand ACM, Category TL, Sequence 100 → Result <code>ACM-TL-100</code>.</p>' +
            '<p>A revision suffix can distinguish a controlled model revision when your business genuinely treats the revision as part of the product identifier.</p>' +
            '<p>Product codes are internal business identifiers. They should not be confused with standardized retail GTINs, UPCs or EANs.</p>' },
        { h: 'What Is a Product Code?',
          html: '<p>A product code is an internal identifier assigned to a product or model.</p><p>Businesses use product codes to make catalog records easier to:</p>',
          list: ['search', 'order', 'quote', 'document', 'service', 'stock', 'export', 'integrate'],
          after: '<p>The term is broad.</p><p>Depending on the company, similar identifiers may be called:</p>' +
            '<ul style="color:var(--muted);padding-left:18px"><li>model number</li><li>article number</li><li>item code</li><li>part number</li><li>catalog number</li><li>product ID</li></ul>' +
            '<p>There is no single worldwide structure for an internal product code.</p><p>The company defines the scheme.</p>' +
            '<p>What matters is consistency, uniqueness and long-term stability.</p>' },
        { h: 'How to Use This Product Code Generator',
          html: '<p>Choose between <strong>numbered series</strong> or <strong>from product names</strong>.</p>' +
            '<p>For a numbered series, define:</p>',
          list: ['brand or range prefix', 'category', 'separator', 'starting number', 'number length', 'increment', 'optional revision'],
          after: '<p>For product-name mode, paste one product name per line.</p>' +
            '<p>The generator derives mnemonic initials and adds sequence data where needed to keep results distinct.</p>' +
            '<p>Review the output before assigning codes to real products.</p>' +
            '<p>A generated code becomes useful only when your catalog system records which product owns it.</p>' +
            '<p>Do not create a second parallel code series if your ERP already manages the authoritative identifiers.</p>' },
        { h: 'Product Code vs SKU',
          html: '<p>These terms are sometimes used interchangeably, but a useful distinction is:</p>' +
            '<p><strong>Product code</strong> — identifies a model or base product.</p>' +
            '<p><strong>SKU</strong> — identifies the exact inventory-tracked variant.</p><p>Example:</p>' +
            '<pre class="code">Base product: Classic T-Shirt\nProduct code: TSH100\nVariant SKUs: TSH100-BLK-S, TSH100-BLK-M, TSH100-WHT-M</pre>' +
            '<p>If the product has no variants, the product code and SKU may be the same value.</p>' +
            '<p>Use your software’s terminology consistently.</p>' +
            '<p>Do not force a separate product-code layer when it provides no operational benefit.</p>' },
        { h: 'Product Code vs GTIN',
          html: '<p>An internal product code is controlled by your company.</p>' +
            '<p>A GTIN is part of the GS1 system and is used to uniquely identify trade items in supply chains.</p><p>GTINs include formats commonly represented as:</p>',
          list: ['UPC / GTIN-12', 'EAN / GTIN-13', 'GTIN-14'],
          after: '<p>You cannot create a globally assigned retail GTIN simply by inventing a numeric product code.</p>' +
            '<p>If retailers, marketplaces or trading partners require a GS1-issued identifier, follow the GS1 assignment process.</p>' +
            '<p>Your internal code can still exist alongside it.</p><p>For example:</p>' +
            '<pre class="code">Internal product code: ACM-TL-100\nGTIN: a separate GS1 identification number</pre>' },
        { h: 'Product Code vs Manufacturer Part Number',
          html: '<p>A manufacturer part number, or MPN, is assigned by the manufacturer to identify its product or component.</p>' +
            '<p>If you are the manufacturer, your internal product code may also serve as the MPN.</p>' +
            '<p>If you are a reseller, keep the manufacturer’s identifier separate from your own catalog code.</p><p>Example:</p>' +
            '<pre class="code">Your item code: TOOL-00482\nManufacturer part: DCD796N-XE\nGTIN: another identifier</pre>' +
            '<p>Storing each field separately makes supplier changes and integrations easier.</p>' +
            '<p>Do not overwrite the manufacturer’s code with your own simply because both identify the same current item.</p>' },
        { h: 'Brand or Range Prefixes',
          html: '<p>A prefix helps staff identify the product family.</p><p>Examples:</p><pre class="code">ACM-\nPRO-\nHOME-</pre>' +
            '<p>A short range prefix is useful when several catalogs share one database.</p><p>Keep the code stable.</p>' +
            '<p>If a product moves from one marketing collection to another, changing its core identifier can break:</p>',
          list: ['historic orders', 'quotes', 'manuals', 'support records', 'integrations'],
          after: '<p>Choose prefixes based on durable product structure rather than temporary campaigns.</p>' +
            '<p>A marketing collection such as "Summer Picks" usually does not belong inside a permanent product ID.</p>' },
        { h: 'Category Codes',
          html: '<p>Category segments can make product codes easier to understand.</p><p>Examples:</p>' +
            '<p><code>TL</code> — tools</p><p><code>AUD</code> — audio</p><p><code>LGT</code> — lighting</p><p><code>ACC</code> — accessories</p>' +
            '<p>A code such as <code>ACM-AUD-120</code> gives staff immediate context.</p>' +
            '<p>Category codes work best when the taxonomy is stable.</p>' +
            '<p>If items are frequently recategorized, a category-neutral product sequence may be safer.</p>' +
            '<p>Do not automatically change the code when merchandising changes the website category.</p>' +
            '<p>The catalog can store current category membership separately.</p>' },
        { h: 'Numeric Series',
          html: '<p>A simple numeric sequence provides guaranteed internal structure.</p><p>Example:</p><pre class="code">ACM-TL-100\nACM-TL-110\nACM-TL-120</pre>' +
            '<p>The generator supports custom increments.</p>' +
            '<p>Stepping by 10 can leave room for related models: 100, 110, 120.</p>' +
