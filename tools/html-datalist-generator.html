<body data-root="../">

<section class="hero" id="hero"></section>

<section id="toolApp">
<div class="wrap">
<div class="tool-grid">

  <form class="card card-pad" id="cfg" autocomplete="off">
    <div class="panel-title"><span class="ico" id="icoGear"></span>Datalist Settings</div>

    <div class="field">
      <label for="preset">Preset suggestions</label>
      <select id="preset">
        <option value="custom" selected>My own list</option>
        <option value="countries">Countries</option>
        <option value="languages">Programming languages</option>
        <option value="frameworks">Frameworks</option>
        <option value="emails">Email domains</option>
        <option value="colors">CSS colours</option>
        <option value="timezones">Time zones</option>
        <option value="skills">Skills / tags</option>
      </select>
    </div>

    <div class="field">
      <label for="items">Suggestions — one per line</label>
      <textarea id="items" style="min-height:180px">JavaScript
TypeScript
Python
Rust
Go
Ruby
Java
C#
Swift
Kotlin</textarea>
      <div class="hint">Optionally use <code>value | description</code> to add a hint shown beside the suggestion in Chrome and Edge.</div>
    </div>

    <div class="divider"></div>

    <div class="row">
      <div class="field"><label for="inputId">Input id</label><input type="text" id="inputId" value="language"></div>
      <div class="field"><label for="listId">Datalist id</label><input type="text" id="listId" value="language-options"></div>
    </div>

    <div class="row">
      <div class="field"><label for="name">name attribute</label><input type="text" id="name" value="language"></div>
      <div class="field">
        <label for="type">Input type</label>
        <select id="type">
          <option value="text" selected>text</option>
          <option value="search">search</option>
          <option value="email">email</option>
          <option value="url">url</option>
          <option value="tel">tel</option>
          <option value="number">number</option>
          <option value="date">date</option>
          <option value="range">range</option>
          <option value="color">color</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label for="labelText">Label text</label>
      <input type="text" id="labelText" value="Preferred language">
    </div>

    <div class="field">
      <label for="placeholder">Placeholder</label>
      <input type="text" id="placeholder" value="Start typing…">
    </div>

    <fieldset class="field">
      <legend class="label">Options</legend>
      <div class="check-list">
        <label class="check on"><input type="checkbox" id="optLabel" checked><span><span class="t">Include a &lt;label&gt;</span></span></label>
        <label class="check"><input type="checkbox" id="optRequired"><span><span class="t">required</span></span></label>
        <label class="check"><input type="checkbox" id="optLabelAttr"><span><span class="t">Use the label attribute on options</span><span class="d">Chrome and Edge show it as a secondary hint; other browsers ignore it.</span></span></label>
        <label class="check"><input type="checkbox" id="optSort"><span><span class="t">Sort alphabetically</span></span></label>
        <label class="check"><input type="checkbox" id="optDedupe" checked><span><span class="t">Remove duplicates</span></span></label>
        <label class="check"><input type="checkbox" id="optAutocompleteOff" checked><span><span class="t">Set autocomplete="off"</span><span class="d">Stops the browser's own saved-value list competing with your suggestions.</span></span></label>
        <label class="check"><input type="checkbox" id="optValidate"><span><span class="t">Add JS restricting input to the list</span><span class="d">datalist is only a suggestion — free text is always allowed without this.</span></span></label>
      </div>
    </fieldset>

    <div class="field">
      <label for="format">Output format</label>
      <select id="format">
        <option value="html" selected>HTML</option>
        <option value="jsx">JSX / React</option>
        <option value="vue">Vue template</option>
        <option value="json">JSON array</option>
      </select>
    </div>
  </form>

  <div class="card card-pad">
    <div class="panel-title"><span class="ico" id="icoSpark"></span>Generated Markup<span class="spacer"></span>
      <span class="result-pill" id="pill"></span></div>

    <div class="tabs" id="tabs">
      <button type="button" class="on" data-tab="file">Code</button>
      <button type="button" data-tab="preview">Live preview</button>
      <button type="button" data-tab="notes">Browser behaviour</button>
    </div>

    <div data-panel="file">
      <div class="output-box">
        <div class="output-bar"><span class="fname" id="fname">datalist.html</span><span class="chip" id="meta"></span></div>
        <pre class="code" id="out"></pre>
      </div>
      <div class="out-actions">
        <button class="btn btn-primary" id="copyBtn"><span id="icoCopy"></span> Copy</button>
        <button class="btn btn-ghost" id="dlBtn"><span id="icoDl"></span> Download</button>
      </div>
      <div id="warnBox"></div>
    </div>

    <div data-panel="preview" hidden>
      <p style="color:var(--muted);font-size:13.5px;margin-bottom:12px">A working datalist — click the field and start typing.</p>
      <div id="preview"></div>
    </div>

    <div data-panel="notes" hidden><div id="notes"></div></div>
  </div>

</div>

<div id="afterTool"></div>

<script src="../assets/js/site.js"></script>
<script>
(function () {
  var I = GTI, $ = GT.$, $$ = GT.$$;
  ['icoGear:gear','icoSpark:spark','icoCopy:copy','icoDl:download']
    .forEach(function (p) { var a = p.split(':'); document.getElementById(a[0]).innerHTML = I[a[1]]; });

  var PRESETS = {
    countries: 'Argentina\nAustralia\nBrazil\nCanada\nChina\nEgypt\nFrance\nGermany\nIndia\nIndonesia\nItaly\nJapan\nKenya\nMexico\nNetherlands\nNigeria\nPoland\nPortugal\nSouth Africa\nSpain\nSweden\nUnited Kingdom\nUnited States\nVietnam',
    languages: 'JavaScript\nTypeScript\nPython\nRust\nGo\nRuby\nJava\nC#\nC++\nSwift\nKotlin\nPHP\nScala\nElixir\nHaskell\nLua',
    frameworks: 'React\nVue\nAngular\nSvelte\nSolid\nNext.js\nNuxt\nRemix\nAstro\nDjango\nRails\nLaravel\nSpring\nFastAPI\nExpress',
    emails: 'gmail.com\noutlook.com\nhotmail.com\nyahoo.com\nicloud.com\nproton.me\nfastmail.com',
    colors: 'aliceblue\naquamarine\nchartreuse\ncoral\ncornflowerblue\ncrimson\ndarkslategray\ngoldenrod\nindigo\nlavender\nmediumseagreen\nmidnightblue\norchid\nrebeccapurple\nsalmon\nseagreen\nslateblue\nteal\ntomato\nturquoise',
    timezones: 'UTC\nAmerica/New_York\nAmerica/Chicago\nAmerica/Denver\nAmerica/Los_Angeles\nAmerica/Sao_Paulo\nEurope/London\nEurope/Paris\nEurope/Berlin\nAfrica/Lagos\nAfrica/Nairobi\nAsia/Dubai\nAsia/Kolkata\nAsia/Shanghai\nAsia/Tokyo\nAustralia/Sydney',
    skills: 'Accessibility | WCAG, ARIA\nCI/CD | Pipelines and automation\nDocker | Containers\nGraphQL | Schema design\nKubernetes | Orchestration\nPostgreSQL | Relational databases\nRedis | Caching\nTerraform | Infrastructure as code\nTesting | Unit and E2E\nWebAssembly | Low-level web'
  };

  var out = GT.mountOutput({ pre: '#out', fileLabel: '#fname', meta: '#meta',
    copyBtn: '#copyBtn', downloadBtn: '#dlBtn', filename: 'datalist.html', mime: 'text/html' });

  var items = [];

  function parse() {
    var arr = GT.lines($('#items').value).map(function (l) {
      var i = l.indexOf('|');
      if (i > -1) return { value: l.slice(0, i).trim(), label: l.slice(i + 1).trim() };
      return { value: l.trim(), label: '' };
    }).filter(function (o) { return o.value; });
    if ($('#optDedupe').checked) {
      var seen = {}, o2 = [];
      arr.forEach(function (o) { if (!seen[o.value]) { seen[o.value] = 1; o2.push(o); } });
      arr = o2;
    }
    if ($('#optSort').checked) arr.sort(function (a, b) { return a.value.localeCompare(b.value); });
    return arr;
  }

  function build() {
    items = parse();
    var inputId = $('#inputId').value || 'field';
    var listId = $('#listId').value || inputId + '-options';
    var name = $('#name').value || inputId;
    var type = $('#type').value;
    var fmt = $('#format').value;
    var useLabelAttr = $('#optLabelAttr').checked;

    function optionTag(o, jsx) {
      var attrs = ' value="' + GT.escAttr(o.value) + '"';
      if (useLabelAttr && o.label) attrs += ' label="' + GT.escAttr(o.label) + '"';
      return '<option' + attrs + (jsx ? ' />' : '></option>');
    }

    var text = '';
    if (fmt === 'html') {
      var L = [];
      if ($('#optLabel').checked) {
        L.push('<label for="' + GT.escAttr(inputId) + '">' + GT.esc($('#labelText').value || 'Choose') + '</label>');
      }
      L.push('<input');
      L.push('  type="' + type + '"');
      L.push('  id="' + GT.escAttr(inputId) + '"');
      L.push('  name="' + GT.escAttr(name) + '"');
      L.push('  list="' + GT.escAttr(listId) + '"');
      if ($('#placeholder').value) L.push('  placeholder="' + GT.escAttr($('#placeholder').value) + '"');
      if ($('#optAutocompleteOff').checked) L.push('  autocomplete="off"');
      if ($('#optRequired').checked) L.push('  required');
      L.push('>');
      L.push('');
      L.push('<datalist id="' + GT.escAttr(listId) + '">');
      items.forEach(function (o) { L.push('  ' + optionTag(o)); });
      L.push('</datalist>');

      if ($('#optValidate').checked) {
        L.push('');
        L.push('<script>');
        L.push('  // A datalist only suggests — free text is still accepted.');
        L.push('  // This enforces that the final value is one of the options.');
        L.push("  const input = document.getElementById('" + inputId + "');");
        L.push("  const allowed = [...document.querySelectorAll('#" + listId + " option')]");
        L.push('    .map((o) => o.value);');
        L.push('');
        L.push("  input.addEventListener('change', () => {");
        L.push('    const ok = allowed.includes(input.value);');
        L.push("    input.setCustomValidity(ok ? '' : 'Choose a value from the list');");
        L.push('  });');
        L.push('<' + '/script>');
      }
      text = L.join('\n');
    } else if (fmt === 'jsx') {
      var J = [];
      J.push('const options = ' + JSON.stringify(items.map(function (o) { return o.value; }), null, 2) + ';');
      J.push('');
      J.push('<>');
      if ($('#optLabel').checked) J.push('  <label htmlFor="' + inputId + '">' + GT.esc($('#labelText').value) + '</label>');
      J.push('  <input');
      J.push('    type="' + type + '"');
      J.push('    id="' + inputId + '"');
      J.push('    name="' + name + '"');
      J.push('    list="' + listId + '"');
      if ($('#placeholder').value) J.push('    placeholder="' + GT.escAttr($('#placeholder').value) + '"');
      J.push('    value={value}');
      J.push('    onChange={(e) => setValue(e.target.value)}');
      if ($('#optRequired').checked) J.push('    required');
      J.push('  />');
      J.push('  <datalist id="' + listId + '">');
      J.push('    {options.map((o) => (');
      J.push('      <option key={o} value={o} />');
      J.push('    ))}');
      J.push('  </datalist>');
      J.push('</>');
      text = J.join('\n');
    } else if (fmt === 'vue') {
      var V = [];
      V.push('<template>');
      if ($('#optLabel').checked) V.push('  <label :for="\'' + inputId + '\'">' + GT.esc($('#labelText').value) + '</label>');
      V.push('  <input');
      V.push('    type="' + type + '"');
      V.push('    id="' + inputId + '"');
      V.push('    list="' + listId + '"');
      V.push('    v-model="value"');
      if ($('#placeholder').value) V.push('    placeholder="' + GT.escAttr($('#placeholder').value) + '"');
      V.push('  >');
      V.push('  <datalist id="' + listId + '">');
      V.push('    <option v-for="o in options" :key="o" :value="o" />');
      V.push('  </datalist>');
      V.push('</template>');
      V.push('');
      V.push('<script setup>');
      V.push("const value = ref('');");
      V.push('const options = ' + JSON.stringify(items.map(function (o) { return o.value; }), null, 2) + ';');
      V.push('<' + '/script>');
      text = V.join('\n');
    } else {
      text = JSON.stringify(useLabelAttr ? items : items.map(function (o) { return o.value; }), null, 2);
    }

    out.set(text, fmt === 'json' ? 'options.json' : fmt === 'jsx' ? 'Field.jsx' : 'datalist.html');
    $('#pill').textContent = items.length + ' suggestions';
    $('#pill').style.background = 'var(--green-bg)'; $('#pill').style.color = 'var(--green)';

    renderPreview(inputId, listId, type);
    renderWarn(inputId, listId);
    renderNotes();
  }

  function renderPreview(inputId, listId, type) {
    var pid = 'prev-' + inputId, plid = 'prev-' + listId;
    $('#preview').innerHTML =
      ($('#optLabel').checked ? '<label for="' + pid + '" style="display:block;font-size:13.5px;font-weight:600;margin-bottom:7px">' +
        GT.esc($('#labelText').value || 'Choose') + '</label>' : '') +
      '<input type="' + (type === 'range' || type === 'color' ? type : 'text') + '" id="' + pid + '" list="' + plid + '"' +
      ' placeholder="' + GT.escAttr($('#placeholder').value) + '"' +
      ' style="width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:14.5px">' +
      '<datalist id="' + plid + '">' +
      items.map(function (o) {
        return '<option value="' + GT.escAttr(o.value) + '"' +
          ($('#optLabelAttr').checked && o.label ? ' label="' + GT.escAttr(o.label) + '"' : '') + '></option>';
      }).join('') + '</datalist>';
  }

  function renderWarn(inputId, listId) {
    var w = [];
    if (!items.length) w.push(['err', 'No suggestions — add at least one line.']);
    if (inputId === listId) w.push(['err', 'The input id and the datalist id must be different. The input\'s <code>list</code> attribute points at the datalist\'s <code>id</code>.']);
    if (!$('#optLabel').checked) w.push(['warn', 'No <code>&lt;label&gt;</code>. A placeholder disappears on focus and is not an accessible name.']);
    if (!$('#optValidate').checked) w.push(['warn', 'A datalist <strong>suggests</strong> values; it never restricts them. Users can type anything, so validate on the server regardless of what the field allows.']);
    if ($('#optLabelAttr').checked) w.push(['warn', 'The <code>label</code> attribute on options is only displayed by Chrome and Edge. Safari and Firefox ignore it, so never put essential information there.']);
    if (items.length > 500) w.push(['warn', items.length + ' suggestions is a lot of DOM. For very large lists, fetch matches from the server as the user types instead.']);
    if ($('#type').value === 'date' || $('#type').value === 'color' || $('#type').value === 'range') {
      w.push(['warn', 'Datalist support on <code>' + $('#type').value + '</code> inputs is inconsistent across browsers — it renders as tick marks or preset swatches where supported, and is silently ignored elsewhere.']);
    }
    if (!w.length) w.push(['ok', 'Input and datalist are correctly wired via list and id.']);
    $('#warnBox').innerHTML = w.map(function (x) {
      return '<div class="note ' + (x[0] === 'ok' ? 'note-ok' : x[0] === 'warn' ? 'note-warn' : 'note-err') + '">' +
        (x[0] === 'ok' ? I.check : I.warn) + '<span>' + x[1] + '</span></div>';
    }).join('');
  }

  function renderNotes() {
    $('#notes').innerHTML = [
      ['It suggests, it does not restrict', 'This is the single most misunderstood thing about datalist. The user can ignore every suggestion and type whatever they like. If the value must come from a fixed set, use a <a href="/tools/html-select-option-generator">select</a> — or keep the datalist and validate, which is what the optional script does.'],
      ['Wiring is by id, not nesting', 'The input carries <code>list="some-id"</code> and the datalist carries <code>id="some-id"</code>. The datalist can sit anywhere in the document; it is never rendered itself.'],
      ['Styling is not possible', 'The suggestion dropdown is drawn by the browser, outside your CSS. If you need custom styling, highlighting of matched substrings, or grouped results, you need a real combobox component with the ARIA combobox pattern.'],
      ['Matching behaviour varies', 'Chrome matches anywhere in the string, Firefox historically matched from the start. Do not build interactions that depend on a particular matching rule.'],
      ['The label attribute is Chromium-only', 'Chrome and Edge show <code>label</code> as a secondary hint beside the value. Firefox and Safari ignore it entirely, so it must never carry information the user needs.'],
      ['Great for hybrid fields', 'Datalist shines where there are common answers but free text is legitimate: job titles, tags, email domains, city names. The user gets speed without being boxed in.'],
      ['Combine with autocomplete="off"', 'Otherwise the browser\'s own saved-form-values dropdown can appear alongside or instead of your suggestions, which is confusing for the user and hard to debug.']
    ].map(function (x) {
      return '<div style="margin-bottom:16px"><h4 style="font-size:14.5px;margin-bottom:6px">' + x[0] + '</h4>' +
        '<p style="color:var(--muted);font-size:13.8px">' + x[1] + '</p></div>';
    }).join('');
  }

  $('#preset').addEventListener('change', function () {
    if (PRESETS[this.value]) {
      $('#items').value = PRESETS[this.value];
      if (this.value === 'skills') $('#optLabelAttr').checked = true;
      build();
    }
  });
  $('#inputId').addEventListener('input', function () {
    $('#listId').value = (this.value || 'field') + '-options';
    $('#name').value = this.value;
    build();
  });
  $('#tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    $$('#tabs button').forEach(function (x) { x.classList.toggle('on', x === b); });
    $$('[data-panel]').forEach(function (p) { p.hidden = p.getAttribute('data-panel') !== b.getAttribute('data-tab'); });
  });
  $('#cfg').addEventListener('submit', function (e) { e.preventDefault(); build(); });
  $('#cfg').addEventListener('input', build);
  $('#cfg').addEventListener('change', build);

  build();

  GT.page({
    slug: 'html-datalist-generator',
    lede: 'Generate native autocomplete markup — a datalist correctly wired to its input, with presets, optional value restriction and a working live preview.',
    steps: [
      { icon: 'gear', title: 'Add your suggestions', text: 'One per line, or pick a preset. Use value | description for a Chrome hint.' },
      { icon: 'list', title: 'Wire up the input', text: 'The ids are kept in sync automatically so list and id always match.' },
      { icon: 'copy', title: 'Copy the markup', text: 'HTML, JSX, Vue or a JSON array — plus optional validation if the value must come from the list.' }
    ],
    guideTitle: 'The autocomplete you get for free',
    guide:
      '<p style="color:var(--muted)">A <code>&lt;datalist&gt;</code> gives an ordinary text input a native suggestion dropdown, with no JavaScript, no dependency and no accessibility work. It is the right answer far more often than the combobox library people reach for instead — and the wrong answer in a few specific cases worth knowing.</p>' +
      '<div class="grid g2" style="margin-top:18px">' +
      '<div><h4 style="font-size:14.5px;margin-bottom:8px">Use it when</h4><ul style="color:var(--muted);font-size:13.8px;padding-left:18px;margin:0"><li>There are common answers but free text is legitimate — job titles, tags, city names.</li><li>You want to speed up typing without constraining the user.</li><li>The list is moderate in size and does not need grouping.</li><li>You would rather ship no JavaScript for this field.</li></ul></div>' +
      '<div><h4 style="font-size:14.5px;margin-bottom:8px">Do not use it when</h4><ul style="color:var(--muted);font-size:13.8px;padding-left:18px;margin:0"><li>The value <strong>must</strong> come from a fixed set — use a <a href="/tools/html-select-option-generator">select</a>.</li><li>You need to style the dropdown, highlight matches, or show rich content.</li><li>Suggestions come from a server as the user types and need debouncing and loading states.</li><li>You need multi-select or removable tokens.</li></ul></div></div>' +
      '<div class="note note-warn" style="margin-top:18px">' + GTI.warn + '<span><strong>A datalist never validates anything.</strong> It is a convenience layer over a plain text input, so the submitted value can be anything the user types. Validate on the server as you would for any free-text field — the optional client-side check generated here improves the experience but is not a security control.</span></div>' +
      '<div class="note note-info" style="margin-top:12px">' + GTI.info + '<span>Because the dropdown is rendered by the browser, it inherits native keyboard handling, touch behaviour and screen-reader support at no cost. A hand-rolled combobox has to reimplement all of that correctly, and most do not.</span></div>',
    related: ['html-select-option-generator', 'html-table-generator', 'json-array-generator'],
faqs: [
      { q: 'What does HTML datalist do?', a: 'It provides a list of suggested values for an associated input control.' },
      { q: 'How do I connect an input to a datalist?', a: 'Set the input’s <code>list</code> attribute to the same value as the datalist’s <code>id</code>.' },
      { q: 'Does datalist force the user to choose one option?', a: 'No. Datalist normally provides suggestions while still allowing other valid input.' },
      { q: 'What is the difference between datalist and select?', a: 'Select restricts users to defined options. Datalist suggests values for a free-form input.' },
      { q: 'Can I make datalist required?', a: 'You can make the input required, which prevents an empty submission. That alone does not require the value to match a datalist option.' },
      { q: 'Can datalist options have descriptions?', a: 'Options can use labels or text to provide additional context, but display behavior varies by browser.' },
      { q: 'Is datalist supported in every browser the same way?', a: 'No. Support, rendering and accessibility behavior vary, so test the browsers relevant to your users.' }
    ],
    seo: {
      title: 'HTML Datalist Generator – Create Native Autocomplete Suggestions',
      lead: 'Use the HTML Data List Generator above to create native autocomplete markup without building a custom JavaScript combobox.',
      blocks: [
        { html: '<p>Enter one suggestion per line, optionally add descriptions, choose the input type, set the input and datalist IDs, include a visible label and generate the connected <code>&lt;input&gt;</code> and <code>&lt;datalist&gt;</code> elements.</p>' +
            '<p>You can sort suggestions, remove duplicates, control browser autocomplete behavior and optionally add JavaScript when the field must be restricted to the suggested list.</p>' +
            '<p>That last point matters because a datalist is normally a suggestion mechanism, not a closed dropdown. Users can generally type a value that is not listed.</p>' +
            '<p>If the value must come from a fixed set, use a <code>&lt;select&gt;</code> instead.</p>' },
        { h: 'What Is an HTML datalist?',
          html: '<p>The <code>&lt;datalist&gt;</code> element contains a set of <code>&lt;option&gt;</code> suggestions for another form control.</p><p>A simple example looks like:</p>' +
            '<pre class="code">&lt;label for="browser"&gt;Browser&lt;/label&gt;\n&lt;input id="browser" name="browser" list="browsers"&gt;\n\n&lt;datalist id="browsers"&gt;\n  &lt;option value="Chrome"&gt;&lt;/option&gt;\n  &lt;option value="Firefox"&gt;&lt;/option&gt;\n  &lt;option value="Safari"&gt;&lt;/option&gt;\n&lt;/datalist&gt;</pre>' +
            '<p>The connection comes from matching:</p><pre class="code">input list="browsers"</pre><p>with:</p><pre class="code">datalist id="browsers"</pre>' +
            '<p>When the user interacts with the input, the browser can show matching suggestions.</p>' +
            '<p>The input remains the form control.</p><p>The datalist provides recommended values.</p>' },
        { h: 'How to Use This Datalist Generator',
          html: '<p>Enter the suggested values.</p><p>One per line is easiest.</p>' +
            '<p>Optionally use the tool’s value/description format when you want a supporting hint.</p><p>Set:</p>',
          list: ['input <code>id</code>', 'datalist <code>id</code>', 'input <code>name</code>', 'input type', 'label text', 'placeholder'],
          after: '<p>Then choose options such as:</p><ul style="color:var(--muted);padding-left:18px"><li>include label</li><li>required</li><li>use option labels</li><li>sort suggestions</li><li>remove duplicates</li><li>disable browser-saved autocomplete</li><li>add strict-list JavaScript</li></ul>' +
            '<p>Generate the markup and test the live preview.</p>' +
            '<p>Because rendering varies between browsers, test the field in browsers your users use.</p>' },
        { h: 'How the list Attribute Connects the Input',
          html: '<p>The <code>&lt;datalist&gt;</code> is not automatically attached to an input.</p>' +
            '<p>The input’s <code>list</code> attribute must equal the datalist’s <code>id</code>.</p><p>Example:</p>' +
            '<pre class="code">&lt;input list="cities"&gt;\n\n&lt;datalist id="cities"&gt;</pre>' +
            '<p>If those values do not match, the suggestions are not connected.</p>' +
            '<p>Use a unique datalist ID in the document.</p>' +
            '<p>A page can have several autocomplete fields, each with its own list.</p>' +
            '<p>In reusable components, be careful not to generate duplicate IDs.</p>' +
            '<p>The tool separates the input ID from the datalist ID so both relationships remain explicit.</p>' },
        { h: 'Datalist Is Not the Same as Select',
          html: '<p>This is the most important concept on the page.</p>' +
            '<p>A <code>&lt;select&gt;</code> asks the user to choose from a fixed set of options.</p>' +
            '<p>A <code>&lt;datalist&gt;</code> suggests values for an input.</p><p>The user can normally type something else.</p>' +
            '<p>Example: suggested programming languages:</p>',
          list: ['JavaScript', 'Python', 'Rust'],
          after: '<p>The user might still enter:</p><pre class="code">Elixir</pre>' +
            '<p>and the input can accept it if normal validation allows that value.</p>' +
            '<p>Use datalist for open-ended input with helpful suggestions.</p>' +
            '<p>Use select when only predefined values are valid.</p>' },
        { h: 'Datalist Does Not Enforce the Suggested Values',
          html: '<p>Developers sometimes assume:</p><p>“If it appears in a dropdown, the user must choose one of those values.”</p>' +
            '<p>That is not how datalist works by default.</p><p>The suggestions do not create a strict enum.</p>' +
            '<p>If your application requires a value from the list, you need additional validation.</p><p>That can happen:</p>',
          list: ['in JavaScript', 'during form submission', 'on the server'],
          after: '<p>The generator can add JavaScript that checks whether the current value exists in the suggestion set.</p>' +
            '<p>Even then, server-side validation is still required when the submitted value matters to application integrity.</p>' +
            '<p>Client-side checks improve UX; they are not security boundaries.</p>' },
        { h: 'Option value Is the Actual Suggested Input',
          html: '<p>Inside a datalist, each <code>&lt;option&gt;</code> should provide a <code>value</code>.</p>' +
            '<p>That value is what the browser inserts into the associated input when the user chooses the suggestion.</p><p>Example:</p>' +
            '<pre class="code">&lt;option value="JavaScript"&gt;&lt;/option&gt;</pre>' +
            '<p>You can also provide a label or descriptive text.</p><p>Browser display behavior varies.</p>' +
            '<p>Some browsers may show the label alongside the value.</p><p>Others may display it differently.</p>' +
            '<p>Do not design the interaction around a description being rendered identically everywhere.</p>' +
            '<p>The actual inserted input value comes from the option value.</p>' },
        { h: 'Add Descriptions to Suggestions',
          html: '<p>Descriptions can help distinguish similar values.</p><p>For example:</p>' +
            '<pre class="code">JFK | New York — John F. Kennedy International</pre>' +
            '<p>could become a suggestion where:</p><pre class="code">JFK</pre>' +
            '<p>is the value and the longer text provides context.</p><p>This is useful for:</p>',
          list: ['airport codes', 'product codes', 'city names', 'technical identifiers', 'employee lookup', 'category suggestions'],
          after: '<p>However, datalist labels are not rendered consistently across browsers.</p>' +
            '<p>Treat the description as enhancement.</p>' +
            '<p>The value itself should remain understandable enough for the field.</p>' +
            '<p>If rich, fully controlled suggestion cards are essential, a custom accessible combobox may be more appropriate.</p>' },
        { h: 'Use a Real label',
          html: '<p>The associated input should normally have a visible label.</p><p>Example:</p>' +
            '<pre class="code">&lt;label for="framework"&gt;Framework&lt;/label&gt;</pre>' +
            '<p>A placeholder such as:</p><pre class="code">Start typing…</pre><p>does not explain the field permanently.</p>' +
            '<p>Once the user types, the placeholder disappears.</p>' +
            '<p>A label remains available and can be programmatically associated with the control through matching <code>for</code> and <code>id</code>.</p>' +
            '<p>This improves usability and accessibility.</p>' +
            '<p>The datalist itself is not the field label.</p><p>It is only the source of suggestions.</p>' },
        { h: 'required with Datalist',
          html: '<p>Adding <code>required</code> means the input cannot be empty during normal browser form validation.</p>' +
            '<p>It does <strong>not</strong> mean the value must match one of the datalist options.</p>' +
            '<p>This distinction is easy to miss.</p>' +
            '<p>A required datalist-backed field can still accept free text that is not in the suggestion list, as long as the input’s other validation rules accept it.</p>' +
            '<p>If membership in the list is mandatory, add explicit validation.</p>' +
            '<p>The generator’s strict-list option is designed for this scenario.</p>' +
            '<p>Still validate on the server when the rule affects real application data.</p>' },
        { h: 'Browser Compatibility and Rendering Differences',
          html: '<p>Datalist is not rendered exactly the same everywhere.</p><p>Current browser support and accessibility behavior vary.</p><p>Differences can include:</p>',
          list: ['how labels are displayed', 'how suggestions are filtered', 'whether certain input types use the list', 'visual styling', 'zoom behavior', 'screen-reader announcements'],
          after: '<p>MDN currently flags datalist as not universally Baseline because support gaps remain in widely used browser combinations.</p>' +
            '<p>For a convenience feature, progressive enhancement may be acceptable.</p>' +
            '<p>For a mission-critical controlled selection, test carefully or use a more robust alternative.</p>' },
        { h: 'Accessibility Considerations',
          html: '<p>Native HTML usually gives you a useful semantic starting point, but datalist has known accessibility limitations.</p><p>Current documentation notes issues such as:</p>',
          list: ['suggestion text that may not scale with page zoom', 'limited high-contrast styling', 'some screen reader/browser combinations not announcing the suggestion popup well'],
          after: '<p>That does not make datalist unusable.</p>' +
            '<p>It means the decision should depend on how essential the autocomplete interaction is.</p>' +
            '<p>Provide a real label.</p><p>Keep free typing functional where appropriate.</p>' +
            '<p>Test with keyboard navigation and assistive technology if the field is important to the workflow.</p>' },
        { h: 'Strict Datalist Validation',
          html: '<p>Sometimes you want autocomplete behavior visually but still require a known value.</p>' +
            '<p>The generator can add JavaScript that compares the submitted input against the allowed options.</p>' +
            '<p>This can produce a helpful browser-side message before submission.</p>' +
            '<p>However, do not treat JavaScript membership checking as your only validation.</p><p>A user can:</p>',
          list: ['disable JavaScript', 'modify the DOM', 'send a request directly', 'alter the submitted value'],
          after: '<p>If the server expects one of a known set of codes, validate it there too.</p>' +
            '<p>Client validation improves feedback.</p><p>Server validation protects the data contract.</p>' },
        { h: 'Datalist vs Custom Autocomplete',
          html: '<p>Use datalist when:</p>',
          list: ['suggestions are simple text values', 'free text is allowed', 'browser-native appearance is acceptable', 'minimal JavaScript is preferred'],
          after: '<p>Use a custom autocomplete or combobox when you need:</p>' +
            '<ul style="color:var(--muted);padding-left:18px"><li>remote search</li><li>rich result templates</li><li>complex ranking</li><li>fully controlled styling</li><li>advanced keyboard behavior</li><li>consistent cross-browser rendering</li><li>strict option selection with richer UX</li></ul>' +
            '<p>Native HTML is valuable when it fits.</p>' +
            '<p>A custom component is justified when the product requirements exceed the native control’s capabilities.</p>' },
        { h: 'Common HTML Datalist Mistakes',
          html: '<p>Avoid these problems:</p>',
          list: ['assuming suggestions restrict the user to the list', 'mismatching the input list value and datalist id', 'omitting a real label',
                 'depending on option descriptions rendering identically in every browser', 'using datalist when a fixed enum should be a select',
                 'expecting full CSS control over the suggestion popup', 'using required and assuming it forces list membership',
                 'shipping strict-list JavaScript without server validation', 'ignoring screen-reader and browser differences',
                 'choosing datalist for a complex rich-search experience it was not designed to provide'],
          after: '<p>Use the native element for lightweight input suggestions. For a fixed set of valid choices, see the <a href="/tools/html-select-option-generator">HTML Select Option Generator</a>.</p>' }
      ],
      keywords: ['html datalist generator', 'datalist autocomplete example', 'datalist vs select', 'input list attribute',
        'datalist not enforcing values', 'datalist strict validation', 'datalist browser support', 'datalist accessibility',
        'native html autocomplete', 'datalist option value label', 'datalist required attribute', 'datalist multiple suggestions']
    }
  });
})();
</script>
