<body data-root="../">

<section class="hero" id="hero"></section>

<section id="toolApp">
<div class="wrap">
<div class="tool-grid">

  <form class="card card-pad" id="cfg" autocomplete="off">
    <div class="panel-title"><span class="ico" id="icoGear"></span>Setup</div>

    <div class="field">
      <label for="teams">Teams or players — one per line</label>
      <textarea id="teams" style="min-height:190px">Riverside
Ashford
Kingsway
Northgate
Belmont
Carlton
Denton</textarea>
      <div id="stats"></div>
    </div>

    <div class="divider"></div>

    <div class="field">
      <label for="legs">Format</label>
      <select id="legs">
        <option value="1" selected>Single round — everyone plays everyone once</option>
        <option value="2">Double round — home and away</option>
      </select>
      <div class="hint" id="legsHint"></div>
    </div>

    <div class="row">
      <div class="field">
        <label for="courts">Simultaneous courts / pitches</label>
        <input type="number" id="courts" value="0" min="0" max="20">
      </div>
      <div class="field">
        <label for="label">Round word</label>
        <select id="label">
          <option value="Round" selected>Round</option>
          <option value="Week">Week</option>
          <option value="Matchday">Matchday</option>
          <option value="Session">Session</option>
        </select>
      </div>
    </div>
    <div class="hint" style="margin:-8px 0 16px">Set courts to 0 if all matches in a round happen at once.</div>

    <fieldset class="field">
      <legend class="label">Options</legend>
      <div class="check-list">
        <label class="check on"><input type="checkbox" id="optHomeAway" checked>
          <span><span class="t">Show home and away</span><span class="d">Off for neutral venues — just shows "v".</span></span></label>
        <label class="check"><input type="checkbox" id="optShuffle">
          <span><span class="t">Shuffle team order first</span><span class="d">Stops the fixture pattern following your typed order.</span></span></label>
      </div>
    </fieldset>

    <div class="row">
      <div class="field">
        <label for="title">Competition name</label>
        <input type="text" id="title" value="Round Robin">
      </div>
      <div class="field">
        <label for="seed">Seed</label>
        <div class="row" style="grid-template-columns:minmax(0,1fr) auto;gap:8px">
          <input type="text" id="seed" value="rr-1">
          <button type="button" class="btn btn-soft" id="newSeed"><span id="icoReset"></span></button>
        </div>
      </div>
    </div>

    <div class="out-actions">
      <button type="submit" class="btn btn-primary btn-block"><span id="icoBolt"></span> Generate Schedule</button>
    </div>
  </form>

  <div class="card card-pad">
    <div class="panel-title"><span class="ico" id="icoSpark"></span>Schedule<span class="spacer"></span>
      <span class="result-pill" id="pill"></span></div>

    <div class="tabs" id="tabs">
      <button type="button" class="on" data-tab="rounds">Rounds</button>
      <button type="button" data-tab="grid">Fixture grid</button>
      <button type="button" data-tab="balance">Home / away</button>
      <button type="button" data-tab="guide">How it works</button>
    </div>

    <div data-panel="rounds">
      <div id="rounds"></div>
      <div class="out-actions" style="margin-top:16px">
        <button type="button" class="btn btn-primary" id="printBtn"><span id="icoFile"></span> Print / PDF</button>
        <button type="button" class="btn btn-ghost" id="copyBtn"><span id="icoCopy"></span> Copy</button>
        <button type="button" class="btn btn-soft" id="regen"><span id="icoReset2"></span> Reshuffle</button>
      </div>
      <div id="checks"></div>
    </div>

    <div data-panel="grid" hidden><div id="grid" style="overflow-x:auto"></div></div>
    <div data-panel="balance" hidden><div id="balance"></div></div>
    <div data-panel="guide" hidden><div id="guide"></div></div>
  </div>

</div>
</div>
</section>

<div id="afterTool"></div>

<script src="../assets/js/site.js"></script>
<script src="../assets/js/schedule.js"></script>
<script src="../assets/js/roster.js"></script>
<script>
(function () {
  var I = GTI, $ = GT.$, $$ = GT.$$, S = GTSched;
  ['icoGear:gear','icoSpark:spark','icoBolt:bolt','icoCopy:copy','icoReset:reset','icoReset2:reset','icoFile:file']
    .forEach(function (p) { var a = p.split(':'); document.getElementById(a[0]).innerHTML = I[a[1]]; });

  var teams = [], rounds = [];

  function build() {
    var parsed = GTRoster.parseNames($('#teams').value);
    teams = parsed.names;
    GTRoster.rosterStats('#stats', parsed);

    var dbl = $('#legs').value === '2';
    $('#legsHint').textContent = dbl
      ? 'Each pair meets twice, once at each venue. Doubles the number of rounds.'
      : 'Each pair meets exactly once. The shortest complete schedule.';

    if (teams.length < 2) {
      $('#rounds').innerHTML = '<div class="empty">Add at least two teams.</div>';
      $('#pill').textContent = '—'; $('#grid').innerHTML = ''; $('#balance').innerHTML = '';
      return;
    }

    var order = $('#optShuffle').checked ? S.rng($('#seed').value).shuffle(teams) : teams.slice();
    rounds = S.roundRobin(order, { doubleRound: dbl });

    renderRounds();
    renderGrid();
    renderBalance();
    renderChecks();

    var total = rounds.reduce(function (a, r) { return a + r.length; }, 0);
    $('#pill').textContent = rounds.length + ' rounds · ' + total + ' matches';
    $('#pill').style.background = 'var(--green-bg)'; $('#pill').style.color = 'var(--green)';
  }

  function vs(m) {
    return $('#optHomeAway').checked
      ? GT.esc(m.home) + '  <span style="color:var(--muted-2)">v</span>  ' + GT.esc(m.away)
      : GT.esc(m.home) + '  <span style="color:var(--muted-2)">v</span>  ' + GT.esc(m.away);
  }

  function courtLabel(i) {
    var c = parseInt($('#courts').value, 10) || 0;
    if (!c) return '';
    return 'Court ' + ((i % c) + 1);
  }

  function renderRounds() {
    var word = $('#label').value;
    $('#rounds').innerHTML = rounds.map(function (rd, ri) {
      return '<div style="margin-bottom:18px">' +
        '<p class="more-label">' + word + ' ' + (ri + 1) +
        (rd.byeTeam ? ' <span style="font-weight:500;color:var(--amber)">· ' + GT.esc(rd.byeTeam) + ' has a bye</span>' : '') +
        '</p><div class="more-list">' +
        rd.map(function (m, i) {
          return '<div class="more-row">' +
            '<span class="mval" style="font-family:var(--sans);font-size:14.5px;font-weight:500">' + vs(m) + '</span>' +
            (courtLabel(i) ? '<span class="chip">' + courtLabel(i) + '</span>' : '') + '</div>';
        }).join('') + '</div></div>';
    }).join('');
  }

  function renderGrid() {
    var list = teams.slice();
    var played = {};
    rounds.forEach(function (rd, ri) {
      rd.forEach(function (m) {
        played[m.home + '||' + m.away] = ri + 1;
      });
    });
    $('#grid').innerHTML =
      '<p style="color:var(--muted);font-size:13.5px;margin-bottom:12px">Which ' +
      $('#label').value.toLowerCase() + ' each fixture falls in. Rows are home teams, columns are away.</p>' +
      '<table style="border-collapse:collapse;font-size:12px">' +
      '<tr><th style="padding:6px;border-bottom:1px solid var(--line)"></th>' +
      list.map(function (t) {
        return '<th style="padding:6px;border-bottom:1px solid var(--line);writing-mode:vertical-rl;' +
          'text-orientation:mixed;height:76px;font-weight:600">' + GT.esc(t) + '</th>';
      }).join('') + '</tr>' +
      list.map(function (h) {
        return '<tr><th style="padding:6px 10px 6px 0;text-align:left;border-bottom:1px solid var(--line-2);' +
          'white-space:nowrap;font-weight:600">' + GT.esc(h) + '</th>' +
          list.map(function (a) {
            if (h === a) return '<td style="padding:6px;border-bottom:1px solid var(--line-2);background:var(--line-2)"></td>';
            var r = played[h + '||' + a];
            return '<td style="padding:6px;text-align:center;border-bottom:1px solid var(--line-2);' +
              (r ? 'color:var(--blue);font-weight:600' : 'color:var(--muted-2)') + '">' + (r || '·') + '</td>';
          }).join('') + '</tr>';
      }).join('') + '</table>';
  }

  function renderBalance() {
    var t = S.homeAwayTally(rounds);
    var names = Object.keys(t).sort();
    $('#balance').innerHTML =
      '<p style="color:var(--muted);font-size:13.5px;margin-bottom:12px">The circle method alternates sides as it rotates, which keeps home and away close to even. A difference of one is unavoidable in a single round with an odd fixture count.</p>' +
      names.map(function (n) {
        var v = t[n], d = v.home - v.away;
        return '<div class="kv"><span class="k">' + GT.esc(n) + '</span><span class="v">' +
          v.home + ' home · ' + v.away + ' away' +
          (d === 0 ? '' : ' <span style="color:' + (Math.abs(d) > 1 ? 'var(--amber)' : 'var(--muted)') + '">(' +
            (d > 0 ? '+' : '') + d + ')</span>') + '</span></div>';
      }).join('');
  }

  function renderChecks() {
    var c = [];
    var n = teams.length;
    var expected = n * (n - 1) / 2 * ($('#legs').value === '2' ? 2 : 1);
    var total = rounds.reduce(function (a, r) { return a + r.length; }, 0);

    c.push(['ok', total + ' matches across ' + rounds.length + ' ' + $('#label').value.toLowerCase() +
      's — every pair meets ' + ($('#legs').value === '2' ? 'twice' : 'exactly once') + '.']);

    if (n % 2 === 1) {
      c.push(['warn', 'Odd number of teams, so one team sits out each ' + $('#label').value.toLowerCase() +
        '. Over a full cycle everyone gets exactly one bye.']);
    }
    var t = S.homeAwayTally(rounds);
    var worst = Math.max.apply(null, Object.keys(t).map(function (k) { return Math.abs(t[k].home - t[k].away); }));
    if (worst > 2) {
      c.push(['warn', 'Home/away difference reaches ' + worst + ' for some teams. A double round evens this out completely.']);
    } else {
      c.push(['ok', 'Home and away are balanced to within ' + worst + ' match' + (worst === 1 ? '' : 'es') + ' for every team.']);
    }
    var courts = parseInt($('#courts').value, 10) || 0;
    if (courts && rounds[0] && courts < rounds[0].length) {
      c.push(['warn', 'Only ' + courts + ' court' + (courts === 1 ? '' : 's') + ' for ' + rounds[0].length +
        ' simultaneous matches — each round will need ' + Math.ceil(rounds[0].length / courts) + ' time slots.']);
    }
    if (n > 20) c.push(['warn', n + ' teams means ' + (n - 1) + ' rounds and ' + expected + ' matches. Check that fits your calendar.']);
    $('#checks').innerHTML = c.map(function (x) {
      return '<div class="note ' + (x[0] === 'ok' ? 'note-ok' : 'note-warn') + '">' +
        (x[0] === 'ok' ? I.check : I.warn) + '<span>' + x[1] + '</span></div>';
    }).join('');
  }

  function asText() {
    var word = $('#label').value;
    return rounds.map(function (rd, ri) {
      return word + ' ' + (ri + 1) + (rd.byeTeam ? '  (bye: ' + rd.byeTeam + ')' : '') + '\n' +
        rd.map(function (m) { return '  ' + m.home + ' v ' + m.away; }).join('\n');
    }).join('\n\n');
  }

  $('#copyBtn').addEventListener('click', function () { GT.copy(asText(), 'Schedule'); });
  $('#printBtn').addEventListener('click', function () {
    var word = $('#label').value;
    GTRoster.printHtml($('#title').value,
      '<h1>' + GT.esc($('#title').value) + '</h1>' +
      '<p class="sub">' + teams.length + ' teams · ' + rounds.length + ' ' + word.toLowerCase() + 's · ' +
      rounds.reduce(function (a, r) { return a + r.length; }, 0) + ' matches</p>' +
      '<div class="grid g2">' + rounds.map(function (rd, ri) {
        return '<div class="card"><h3>' + word + ' ' + (ri + 1) +
          (rd.byeTeam ? ' <span style="font-weight:400;font-size:12px;color:#64748b">(bye: ' +
            GT.esc(rd.byeTeam) + ')</span>' : '') + '</h3><ul>' +
          rd.map(function (m) { return '<li>' + GT.esc(m.home) + ' v ' + GT.esc(m.away) + '</li>'; }).join('') +
          '</ul></div>';
      }).join('') + '</div>');
  });
  $('#newSeed').addEventListener('click', function () { $('#seed').value = Math.random().toString(36).slice(2, 8); build(); });
  $('#regen').addEventListener('click', function () {
    $('#optShuffle').checked = true;
    $('#optShuffle').closest('.check').classList.add('on');
    $('#seed').value = Math.random().toString(36).slice(2, 8); build(); GT.toast('Reshuffled');
  });

  $('#guide').innerHTML = [
    ['The circle method', 'One team stays fixed while the others rotate around it. After each rotation you read off the pairings. It guarantees that every team meets every other exactly once, in the minimum possible number of rounds — n−1 for an even count, n for odd.'],
    ['Odd numbers create byes automatically', 'With seven teams the schedule adds a phantom eighth. Whoever is drawn against it sits out that round. Over the full cycle each team gets exactly one bye, so it stays fair without any manual adjustment.'],
    ['Home and away alternate as it rotates', 'A naive circle method gives the fixed team the same side every round. Alternating which side it takes, and flipping every other pairing, keeps each team within a match or so of an even split — which matters if your venue has any advantage at all.'],
    ['Match count grows quadratically', 'Six teams is 15 matches. Twelve teams is 66. Twenty is 190. Round robin is the fairest format and the least scalable — beyond about twelve entrants, consider groups feeding a knockout.'],
    ['Double rounds fix the balance completely', 'Playing home and away means every team hosts exactly as often as it travels. If venue advantage matters, a double round is the only format that removes it entirely.'],
    ['Court allocation is separate from the schedule', 'The round structure says which matches happen together; how many can physically run at once depends on your venue. Setting the court count shows how many time slots each round actually needs.']
  ].map(function (x) {
    return '<div style="margin-bottom:16px"><h4 style="font-size:14.5px;margin-bottom:6px">' + x[0] + '</h4>' +
      '<p style="color:var(--muted);font-size:13.8px">' + x[1] + '</p></div>';
  }).join('');

  $('#tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    $$('#tabs button').forEach(function (x) { x.classList.toggle('on', x === b); });
    $$('[data-panel]').forEach(function (p) { p.hidden = p.getAttribute('data-panel') !== b.getAttribute('data-tab'); });
  });
  $('#cfg').addEventListener('submit', function (e) { e.preventDefault(); build(); GT.toast('Schedule generated'); });
  $('#cfg').addEventListener('input', build);
  $('#cfg').addEventListener('change', build);

  build();

  GT.page({
    slug: 'round-robin-schedule-generator',
    lede: 'Everyone plays everyone, in the fewest possible rounds — with home and away balanced as it goes, and byes handled automatically for odd numbers.',
    steps: [
      { icon: 'gear', title: 'List your teams', text: 'Any number. Odd counts get automatic byes, one each per cycle.' },
      { icon: 'repeat', title: 'Single or double round', text: 'Double gives everyone an equal number of home fixtures.' },
      { icon: 'file', title: 'Print the fixtures', text: 'Round-by-round cards, plus a grid showing when each fixture falls.' }
    ],
    guideTitle: 'The circle method, and why home/away needs care',
    guide:
      '<p style="color:var(--muted)">A round robin is generated by fixing one team in place and rotating the rest around it. Read off the pairings after each rotation and you get a complete schedule in n−1 rounds, with every pair meeting exactly once. It is elegant and it has been the standard approach for well over a century.</p>' +
      '<p style="color:var(--muted);margin-top:12px">The catch is that the naive version gives the fixed team the same side in every single round — it ends up at home every week, or away every week. This tool alternates the fixed team\'s side each round and flips alternating pairings, which keeps every team within about one match of an even home/away split. The Home / away tab shows the actual figures.</p>' +
      '<div class="grid g2" style="margin-top:18px">' +
      '<div><h4 style="font-size:14.5px;margin-bottom:8px">Rounds and matches</h4><ul style="color:var(--muted);font-size:13.8px;padding-left:18px;margin:0"><li><strong>4 teams</strong> — 3 rounds, 6 matches</li><li><strong>6 teams</strong> — 5 rounds, 15 matches</li><li><strong>8 teams</strong> — 7 rounds, 28 matches</li><li><strong>12 teams</strong> — 11 rounds, 66 matches</li><li><strong>20 teams</strong> — 19 rounds, 190 matches</li></ul>' +
      '<p style="color:var(--muted);font-size:13.8px;margin-top:10px">Double those for home and away.</p></div>' +
      '<div><h4 style="font-size:14.5px;margin-bottom:8px">Odd numbers</h4><p style="color:var(--muted);font-size:13.8px">An odd team count adds a phantom opponent. Whoever draws it sits out that round, and across the full cycle every team gets exactly one bye — no manual balancing needed.</p>' +
      '<p style="color:var(--muted);font-size:13.8px;margin-top:10px">This is also why an odd count takes n rounds rather than n−1: there are more rounds, but fewer matches in each.</p></div></div>' +
      '<div class="note note-info" style="margin-top:18px">' + GTI.info + '<span>Round robin is the fairest format and the least scalable — match count grows with the square of the entry list. Past about twelve teams, a group stage feeding a <a href="/tools/tournament-bracket-generator">knockout bracket</a> is usually more practical.</span></div>',
    related: ['league-schedule-generator', 'match-fixture-generator', 'tournament-bracket-generator'],
    faqs: [
      { q: 'How many rounds does a round robin take?', a: 'One fewer than the number of teams if that number is even, or the same as the number of teams if it is odd. Eight teams need seven rounds; seven teams need seven rounds with one bye each.' },
      { q: 'What happens with an odd number of teams?', a: 'A phantom opponent is added, and whoever is drawn against it sits out. Across the complete cycle every team receives exactly one bye, so it stays fair automatically.' },
      { q: 'Is home and away balanced?', a: 'Close to it. The schedule alternates sides as the rotation proceeds, keeping every team within about one match of an even split. A double round makes it exactly equal.' },
      { q: 'How many matches will there be?', a: 'n × (n−1) ÷ 2 for a single round — 15 for six teams, 66 for twelve. Double that for home and away. The count grows quadratically, so large fields get long quickly.' },
      { q: 'What is the difference from a knockout bracket?', a: 'In a round robin nobody is eliminated and everyone plays the same number of matches. A knockout removes half the field after each round, so it is much shorter but far less forgiving.' },
      { q: 'Can I fit the matches around limited courts?', a: 'Set the number of courts and the tool shows how many time slots each round needs. The round structure stays the same — courts only affect how many matches can run simultaneously.' }
    ],
    seo: {
      title: 'Round robin scheduling: the circle method, byes and home/away balance',
      lead: 'This <strong>round robin generator</strong> schedules everyone against everyone in the fewest possible rounds, balancing home and away as it goes and handling odd numbers automatically. Below: how the circle method works, how many matches to expect, and how to fit a schedule around limited courts.',
      blocks: [
        {
          h: 'What a round robin is',
          html: '<p>A <strong>round robin</strong> is a format where every entrant plays every other entrant exactly once. Nobody is eliminated, results are decided on total points rather than a single bad day, and the final standings reflect a full set of comparisons.</p>' +
            '<p>The trade-off against a knockout is time. A knockout with 16 entrants finishes in 4 rounds and 15 matches; a round robin with the same 16 needs 15 rounds and 120 matches. What you buy with that time is fairness — one poor result does not end anyone\'s tournament, and the winner has beaten the field rather than a path through it.</p>',
          table: {
            head: ['Entrants', 'Rounds', 'Total matches', 'Matches per round'],
            rows: [
              ['4', '3', '6', '2'],
              ['6', '5', '15', '3'],
              ['8', '7', '28', '4'],
              ['10', '9', '45', '5'],
              ['12', '11', '66', '6'],
              ['16', '15', '120', '8'],
              ['20', '19', '190', '10']
            ]
          },
          after: '<p>The formulas: with <em>n</em> entrants there are <em>n</em>&nbsp;−&nbsp;1 rounds and <em>n</em>(<em>n</em>&nbsp;−&nbsp;1)/2 matches in total. For an odd <em>n</em>, there are <em>n</em> rounds, because one entrant sits out each round.</p>'
        },
        {
          h: 'The circle method',
          html: '<p>Scheduling a round robin by hand is surprisingly error-prone — it is easy to produce a pairing that repeats or one that leaves a team idle twice. The <strong>circle method</strong> solves it mechanically.</p>',
          steps: [
            { t: 'Fix one entrant in place', d: 'Write the entrants in two rows. The first position never moves.' },
            { t: 'Pair down the columns', d: 'Each column is one match in this round.' },
            { t: 'Rotate everyone else one position', d: 'Clockwise around the fixed entrant, like turning a dial.' },
            { t: 'Repeat', d: 'After <em>n</em>&nbsp;−&nbsp;1 rotations, every pairing has occurred exactly once and you are back at the start.' }
          ],
          after: '<p>The method is provably complete — no repeats, no omissions — which is why it underlies essentially every scheduling tool, including this one.</p>'
        },
        {
          h: 'Odd numbers and byes',
          html: '<p>With an odd number of entrants, one has no opponent each round. The standard treatment is to add a phantom entrant — the <strong>bye</strong> — bringing the count to even and letting the circle method run unchanged.</p>' +
            '<p>Whoever is paired with the phantom sits that round out. Because the rotation is uniform, each entrant receives exactly one bye across the schedule, which is the fairest distribution available.</p>',
          callout: { type: 'tip', text: 'Byes are worth scheduling deliberately when you can. A bye in the final round is a meaningful disadvantage in a tight league — the team has no chance to respond to results around them. If the format allows, place byes early and tell everyone the rule in advance, so nobody feels the draw decided the outcome.' }
        },
        {
          h: 'Home and away balance',
          html: '<p>The naive circle method produces a legal schedule with badly unbalanced venues: some teams get long runs of home games and others long runs away. This is the part most simple generators skip.</p>',
