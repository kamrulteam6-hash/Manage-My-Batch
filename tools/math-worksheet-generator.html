        <label class="check"><input type="checkbox" data-op="div"><span><span class="t">Division ÷</span></span></label>
      </div>
    </div>

    <div class="field">
      <label for="level">Quick level</label>
      <select id="level">
        <option value="">Custom…</option>
        <option value="1">Year 1 — numbers to 10</option>
        <option value="2" selected>Year 2 — numbers to 20</option>
        <option value="3">Year 3 — 2-digit</option>
        <option value="4">Year 4 — 3-digit</option>

      </select>
    </div>

    <div class="row">
      <div class="field"><label for="minA">First number: min</label><input type="number" id="minA" value="1"></div>
      <div class="field"><label for="maxA">max</label><input type="number" id="maxA" value="20"></div>
    </div>
    <div class="row">
      <div class="field"><label for="minB">Second number: min</label><input type="number" id="minB" value="1"></div>

        <label class="check on"><input type="checkbox" id="optWholeDiv" checked>

        <label class="check"><input type="checkbox" id="optNoRegroup">

<script>
(function () {
  var I = GTI, $ = GT.$, $$ = GT.$$, W = GTWorksheet;
  ['icoGear:gear','icoSpark:spark','icoBolt:bolt','icoReset:reset','icoReset2:reset','icoFile:file']
    .forEach(function (p) { var a = p.split(':'); document.getElementById(a[0]).innerHTML = I[a[1]]; });

  var LEVELS = {
    '1': { a: [1, 10], b: [1, 10] },
    '2': { a: [1, 20], b: [1, 20] },
    '3': { a: [10, 99], b: [10, 99] },
    '4': { a: [100, 999], b: [10, 99] },
    '5': { a: [1000, 9999], b: [100, 999] },
    'tables': { a: [1, 12], b: [1, 12] }
  };

  var items = [];

  function ops() {
    return $$('#ops input:checked').map(function (i) { return i.getAttribute('data-op'); });
  }

  function noRegroupPair(rand, min, max, op) {
    /* Build digit-by-digit so no column ever carries or borrows. */
    var digits = String(max).length;
    for (var attempt = 0; attempt < 60; attempt++) {
      var a = 0, b = 0, mult = 1, ok = true;
      for (var d = 0; d < digits; d++) {
        var da, db;
        if (op === 'add') {
          da = rand.int(0, 9); db = rand.int(0, 9 - da);
        } else {
          da = rand.int(0, 9); db = rand.int(0, da);
        }
        a += da * mult; b += db * mult; mult *= 10;
      }
      if (a >= min && a <= max && b >= min && b <= max && a > 0 && b > 0) return [a, b];
    }
    return null;
  }

  function makeQuestion(rand) {
    var op = rand.pick(ops());
    var minA = parseInt($('#minA').value, 10), maxA = parseInt($('#maxA').value, 10);
    var minB = parseInt($('#minB').value, 10), maxB = parseInt($('#maxB').value, 10);
    if (minA > maxA) { var t = minA; minA = maxA; maxA = t; }
    if (minB > maxB) { var t2 = minB; minB = maxB; maxB = t2; }

    var a, b, ans, sym;

    if (op === 'add') {
      sym = '+';
      if ($('#optNoRegroup').checked) {
        var p = noRegroupPair(rand, Math.min(minA, minB), Math.max(maxA, maxB), 'add');
        if (p) { a = p[0]; b = p[1]; } else { a = rand.int(minA, maxA); b = rand.int(minB, maxB); }
      } else { a = rand.int(minA, maxA); b = rand.int(minB, maxB); }
      ans = a + b;
    } else if (op === 'sub') {
      sym = '−';
      if ($('#optNoRegroup').checked) {
        var p2 = noRegroupPair(rand, Math.min(minA, minB), Math.max(maxA, maxB), 'sub');
        if (p2) { a = p2[0]; b = p2[1]; } else { a = rand.int(minA, maxA); b = rand.int(minB, maxB); }
      } else { a = rand.int(minA, maxA); b = rand.int(minB, maxB); }
      if ($('#optNoNeg').checked && b > a) { var s = a; a = b; b = s; }
      ans = a - b;
    } else if (op === 'mul') {
      sym = '×';
      a = rand.int(minA, maxA); b = rand.int(minB, maxB); ans = a * b;
    } else {
      sym = '÷';
      if ($('#optWholeDiv').checked) {
        /* Construct from the quotient so the division is always exact. */
        b = Math.max(1, rand.int(Math.max(1, minB), Math.max(1, maxB)));
        var q = rand.int(Math.max(1, Math.ceil(minA / b)) || 1, Math.max(2, Math.floor(maxA / b)) || 2);
        a = b * q; ans = q;
      } else {
        a = rand.int(minA, maxA); b = Math.max(1, rand.int(Math.max(1, minB), Math.max(1, maxB)));
        ans = Math.round((a / b) * 100) / 100;
      }
    }
    return { a: a, b: b, ans: ans, sym: sym, op: op };
  }

  function renderItem(q) {
    var blank = '<span style="display:inline-block;min-width:52px;border-bottom:1.5px solid #94a3b8">&nbsp;</span>';
    var box = '<span style="display:inline-block;width:26px;height:22px;border:1.5px solid #94a3b8;border-radius:3px;vertical-align:-5px"></span>';

    if ($('#optMissing').checked) {
      /* Hide one of the operands instead of the result. */
      var hideFirst = (q.a + q.b) % 2 === 0;
      var shownA = hideFirst ? box : q.a;
      var shownB = hideFirst ? q.b : box;
      return {
        html: '<span style="font-size:1.05em">' + shownA + ' ' + q.sym + ' ' + shownB + ' = ' + q.ans + '</span>',
        answer: String(hideFirst ? q.a : q.b)
      };
    }

    if ($('#layout').value === 'vertical') {
      var w = String(Math.max(q.a, q.b)).length;
      return {
        html: '<div style="font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.12em;line-height:1.45;' +
          'display:inline-block;text-align:right;min-width:' + (w + 2) + 'ch">' +
          '<div>' + q.a + '</div>' +
          '<div style="border-bottom:1.6px solid #0f172a;padding-bottom:2px">' + q.sym + ' ' + q.b + '</div>' +
          '<div style="height:24px"></div></div>',
        answer: String(q.ans)
      };
    }

    return {
      html: '<span style="font-size:1.05em">' + q.a + ' ' + q.sym + ' ' + q.b + ' = ' + blank + '</span>',
      answer: String(q.ans)
    };
  }

  function build() {
    var selected = ops();
    if (!selected.length) {
      $('#preview').innerHTML = '<div class="empty">Select at least one operation.</div>';
      $('#pill').textContent = 'no operations';
      $('#key').innerHTML = '';
      return;
    }

    var rand = W.rng($('#seed').value);
    var n = Math.max(1, Math.min(120, parseInt($('#count').value, 10) || 1));
    items = [];
    var seen = {}, attempts = 0;

    while (items.length < n && attempts < n * 40) {
      attempts++;
      var q = makeQuestion(rand);
      if ($('#optNoDupes').checked) {
        var k = q.a + q.sym + q.b;
        if (seen[k]) continue;
        seen[k] = 1;
      }
      var it = renderItem(q);
      it.q = q;
      items.push(it);
    }

    W.preview('#preview', {
      title: $('#title').value,
      instructions: instructions(),
      items: items,
      previewColumns: parseInt($('#columns').value, 10) || 3
    });
    W.answerKeyPreview('#key', items);
    renderChecks(n, attempts);

    $('#pill').textContent = items.length + ' questions';
    $('#pill').style.background = 'var(--green-bg)'; $('#pill').style.color = 'var(--green)';
  }

  function instructions() {
    if ($('#optMissing').checked) return 'Write the missing number in each box.';
    if ($('#layout').value === 'vertical') return 'Work out each calculation using the column method.';
    return 'Work out the answer to each calculation.';
  }

  function renderChecks(wanted, attempts) {
    var c = [];
    if (items.length < wanted) {
      c.push(['warn', 'Only ' + items.length + ' of ' + wanted +
        ' questions could be made without duplicates. Widen the number ranges or allow duplicates.']);
    }
    if ($('#optNoRegroup').checked && ops().some(function (o) { return o === 'mul' || o === 'div'; })) {
      c.push(['warn', 'The no-regrouping constraint only applies to addition and subtraction. Multiplication and division questions ignore it.']);
    }
    if (ops().indexOf('div') > -1 && !$('#optWholeDiv').checked) {
      c.push(['warn', 'Division may produce decimal answers, rounded to two places on the key. Turn on exact division for whole-number answers.']);
    }
    if (ops().indexOf('sub') > -1 && !$('#optNoNeg').checked) {
      c.push(['warn', 'Negative answers are allowed. Fine for older students working with integers; confusing for early primary.']);
    }
    var big = items.filter(function (i) { return i.q && Math.abs(i.q.ans) > 100000; });
    if (big.length) c.push(['warn', 'Some answers exceed 100,000, which may be beyond the intended level.']);
    if (!c.length) c.push(['ok', items.length + ' questions generated. Change the seed for a fresh sheet with the same settings.']);
    $('#checks').innerHTML = c.map(function (x) {
      return '<div class="note ' + (x[0] === 'ok' ? 'note-ok' : 'note-warn') + '">' +
        (x[0] === 'ok' ? I.check : I.warn) + '<span>' + x[1] + '</span></div>';
    }).join('');
  }

  $('#level').addEventListener('change', function () {
    var L = LEVELS[this.value];
    if (!L) return;
    $('#minA').value = L.a[0]; $('#maxA').value = L.a[1];
    $('#minB').value = L.b[0]; $('#maxB').value = L.b[1];
    if (this.value === 'tables') {
      $$('#ops input').forEach(function (i) {
        i.checked = i.getAttribute('data-op') === 'mul';
        i.closest('.check').classList.toggle('on', i.checked);
      });
    }
    build();
  });

  $('#printBtn').addEventListener('click', function () {
    W.print({
      title: $('#title').value,
      instructions: instructions(),
      items: items,
      columns: parseInt($('#columns').value, 10) || 3,
      answerKey: $('#optKey').checked,
      answerColumns: 5
    });
  });
  $('#newSeed').addEventListener('click', function () { $('#seed').value = Math.random().toString(36).slice(2, 8); build(); });
  $('#regen').addEventListener('click', function () { $('#seed').value = Math.random().toString(36).slice(2, 8); build(); GT.toast('New questions'); });

  $('#guide').innerHTML = [
    ['No-regrouping questions are built, not filtered', 'Generating random pairs and discarding the ones that carry wastes most attempts and skews the distribution. This tool constructs each number digit by digit so that no column can ever exceed 9 — which means the questions are genuinely representative of the range, not just the easy corner of it.'],
    ['Exact division works backwards', 'Picking a dividend and divisor at random almost always leaves a remainder. Instead the tool picks the divisor and the quotient, then multiplies to get the dividend — so every question divides exactly, by construction.'],
    ['Missing-number problems test different thinking', '7 + ☐ = 12 requires the inverse operation, so it is genuinely harder than 7 + 5 = ☐ and reveals whether a child understands the relationship rather than just the procedure. Worth mixing in regularly.'],
    ['Vertical layout is for teaching the algorithm', 'Column format is the right choice when the point of the lesson is the written method. Horizontal is better for mental arithmetic fluency, because it does not prompt a particular strategy.'],
    ['Same settings, endless sheets', 'Change the seed and you get a completely different worksheet at the identical difficulty. That makes it practical to give daily practice without reusing the same questions or hand-building each sheet.'],
    ['Print two versions for a test', 'Two seeds produce two sheets that are equally hard but have different questions — useful for retests, or for adjacent desks.']
  ].map(function (x) {
    return '<div style="margin-bottom:16px"><h4 style="font-size:14.5px;margin-bottom:6px">' + x[0] + '</h4>' +
      '<p style="color:var(--muted);font-size:13.8px">' + x[1] + '</p></div>';
  }).join('');

  $('#tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    $$('#tabs button').forEach(function (x) { x.classList.toggle('on', x === b); });
    $$('[data-panel]').forEach(function (p) { p.hidden = p.getAttribute('data-panel') !== b.getAttribute('data-tab'); });
  });
  $('#cfg').addEventListener('submit', function (e) { e.preventDefault(); build(); GT.toast('Worksheet generated'); });
  $('#cfg').addEventListener('input', build);
  $('#cfg').addEventListener('change', build);

  build();

  GT.page({
    slug: 'math-worksheet-generator',
    lede: 'Generate arithmetic practice at exactly the level you need — with no-regrouping questions that are constructed rather than filtered, and exact division by design.',
    steps: [
      { icon: 'gear', title: 'Pick operations and level', text: 'Quick levels set sensible ranges, or set your own minimum and maximum.' },
      { icon: 'calculator', title: 'Add constraints', text: 'No negatives, no regrouping, exact division, or missing-number problems.' },
      { icon: 'file', title: 'Print with the key', text: 'Answer key on its own page. Change the seed for another sheet at the same difficulty.' }
    ],
    guideTitle: 'Constraints that are built in, not filtered out',
    guide:
      '<p style="color:var(--muted)">Most worksheet generators produce random questions and then throw away the ones that break your rules. That works badly: asking for two-digit addition without carrying rejects the overwhelming majority of random pairs, and the handful that survive cluster around small digits. The resulting sheet is not representative of the range you asked for.</p>' +
      '<div class="grid g2" style="margin-top:18px">' +
      '<div><h4 style="font-size:14.5px;margin-bottom:8px">How no-regrouping is generated</h4><p style="color:var(--muted);font-size:13.8px">Each column is built independently: pick the first digit, then pick a second digit that cannot push the column past 9 (or, for subtraction, cannot go below 0). Assemble the numbers from those digits. Every question satisfies the constraint by construction, and the full range of the digits is used.</p></div>' +
      '<div><h4 style="font-size:14.5px;margin-bottom:8px">How exact division is generated</h4><p style="color:var(--muted);font-size:13.8px">Random dividend ÷ random divisor almost never divides evenly. Instead the divisor and the quotient are chosen first, then multiplied together to produce the dividend. The division is exact by definition, with no rejection loop and no bias.</p></div></div>' +
      '<div class="note note-info" style="margin-top:18px">' + GTI.info + '<span><strong>Missing-number problems are worth using more than they usually are.</strong> <code>7 + ☐ = 12</code> forces the inverse operation, so it distinguishes a child who understands the relationship between addition and subtraction from one who has simply learned a procedure. Same numbers, considerably more diagnostic.</span></div>',
    related: ['fraction-worksheet-generator', 'number-line-worksheet-generator', 'clock-reading-worksheet-generator'],
faqs: [
      { q: 'What operations can I generate?', a: 'The tool supports addition, subtraction, multiplication and division, including mixed-operation worksheets.' },
      { q: 'Can I stop subtraction answers becoming negative?', a: 'Yes. Enable the no-negative-answers constraint.' },
      { q: 'Can I generate division with no remainder?', a: 'Yes. The exact-division setting creates questions that divide evenly.' },
      { q: 'What does avoid regrouping mean?', a: 'It removes addition and subtraction questions that require carrying or borrowing, which is useful for students learning the earlier stage of written methods.' },
      { q: 'Can I make missing-number questions?', a: 'Yes. The generator can place the blank inside the equation instead of always placing it after the equals sign.' },
      { q: 'Does the worksheet include answers?', a: 'You can include a separate answer-key page.' },
      { q: 'Can I make another version with the same difficulty?', a: 'Yes. Keep the settings and change the seed to generate a fresh question set from the same rules.' }
    ],
    seo: {
      title: 'Math Worksheet Generator – Create Targeted Arithmetic Practice',
      lead: 'Use the Math Worksheet Generator above to create printable addition, subtraction, multiplication and division practice that matches the skill your students are actually working on.',
      blocks: [
        { html: '<p>Choose one operation or mix several, set the number ranges, then add constraints such as no negative answers, exact division, no regrouping or missing-number questions. You can also control the layout, question count and answer key.</p>' +
            '<p>A seed lets you reproduce the same worksheet later or create a fresh version without rebuilding every setting.</p>' +
            '<p>That makes the tool useful for class practice, homework, intervention, tutoring, warm-ups and short fluency checks.</p>' +
            '<p>The important part is not generating more questions. It is generating the right questions.</p>' },
        { h: 'What Is a Math Worksheet Generator?',
          html: '<p>A math worksheet generator creates a new set of arithmetic problems from rules you choose.</p>' +
            '<p>Instead of searching for a worksheet that happens to use the number range you need, you define the range yourself.</p><p>For example, you might create:</p>',
          list: ['addition within 20', 'subtraction with no negative answers', 'multiplication using selected number ranges', 'division with no remainder', 'mixed-operation review', 'missing-number equations'],
          after: '<p>The generated worksheet can then be printed with or without an answer key.</p>' +
            '<p>Because the questions are generated from settings rather than stored as one fixed sheet, you can create another version for extra practice without repeating the exact same problems.</p>' },
        { h: 'How to Use This Math Worksheet Generator',
          html: '<p>Start by choosing the operation.</p><p>You can select:</p>',
          list: ['addition', 'subtraction', 'multiplication', 'division'],
          after: '<p>or combine operations for mixed review.</p>' +
            '<p>Next set the minimum and maximum values for the first and second numbers.</p>' +
            '<p>Then add only the constraints that match the current learning goal.</p><p>Useful options include:</p>' +
            '<p><strong>No negative answers</strong> — keeps subtraction results at zero or above.</p>' +
            '<p><strong>Division with no remainder</strong> — creates exact division questions.</p>' +
            '<p><strong>Avoid regrouping</strong> — removes carrying or borrowing from the generated problems.</p>' +
            '<p><strong>Missing number problems</strong> — changes a normal equation such as <code>7 + 5 = □</code> into <code>7 + □ = 12</code>.</p>' +
            '<p>Finally, choose the question count, layout, title and answer-key option.</p>' },
        { h: 'Choose Number Ranges Deliberately',
          html: '<p>The number range controls much of the worksheet difficulty.</p><p>Compare <code>6 + 7</code> with <code>468 + 759</code>.</p>' +
            '<p>Both are addition, but they demand very different knowledge.</p>' +
            '<p>When students are learning a new procedure, a smaller range can reduce unrelated difficulty and keep attention on the method.</p>' +
            '<p>When the method is secure, increase the numbers.</p>' +
            '<p>Avoid assuming that larger numbers always mean better practice.</p>' +
            '<p>If a learner is still unsure about place value or multiplication facts, increasing every range at once can make it hard to tell what caused an error.</p>' +
            '<p>Change one difficulty feature at a time when possible.</p>' },
        { h: 'Addition Worksheets',
          html: '<p>Addition practice can target several stages.</p><p>Early questions may focus on:</p>',
          list: ['number bonds', 'adding within 10', 'adding within 20'],
          after: '<p>Later practice can include:</p>' +
            '<ul style="color:var(--muted);padding-left:18px"><li>two-digit addition</li><li>larger whole numbers</li><li>regrouping</li><li>mixed missing-number equations</li></ul>' +
            '<p>A worksheet is most useful after students understand what addition represents.</p>' +
            '<p>Procedural practice should reinforce understanding rather than replace it.</p>' +
            '<p>For learners who are still developing the concept, use manipulatives, diagrams, number lines or contextual problems alongside symbolic equations.</p>' +
            '<p>Once the idea is established, a generated worksheet can provide enough varied examples to build accuracy and fluency.</p>' },
        { h: 'Subtraction Worksheets',
          html: '<p>Subtraction creates an important choice: should negative answers be allowed?</p>' +
            '<p>For younger learners working only with non-negative whole numbers, turn on No negative answers.</p>' +
            '<p>That prevents questions such as <code>4 - 9</code> until negative numbers are part of the lesson.</p>' +
            '<p>Later, negative results can be valuable practice.</p>' +
            '<p>Another useful progression is to separate subtraction without regrouping from subtraction with regrouping.</p>' +
            '<p>A student who can calculate <code>54 - 21</code> may still need explicit teaching before <code>52 - 28</code> because the second problem requires exchanging or regrouping.</p>' +
            '<p>Generate practice that matches the method currently being taught.</p>' },
        { h: 'What Does "Avoid Regrouping" Mean?',
          html: '<p>Regrouping is the process often described as carrying in addition or borrowing in subtraction.</p>' +
            '<p>For example, <code>24 + 13</code> does not require regrouping. But <code>28 + 17</code> does.</p>' +
            '<p>Likewise, <code>53 - 21</code> is simpler than <code>53 - 28</code> for a learner who has not yet learned to exchange one ten for ten ones.</p>' +
            '<p>The Avoid regrouping option lets teachers isolate the earlier stage.</p>' +
            '<p>That can be useful for initial practice.</p><p>It should not become a permanent setting.</p>' +
            '<p>Once students understand place value and the written method, they need experience with questions that do require regrouping.</p>' },
        { h: 'Multiplication Worksheets',
          html: '<p>Multiplication worksheets can focus on:</p>',
          list: ['fact recall', 'one table at a time', 'mixed facts', 'larger factors', 'multi-digit reasoning where supported by the chosen ranges'],
          after: '<p>If the goal is multiplication-fact fluency, choose number ranges that actually correspond to the facts students are learning.</p>' +
            '<p>Randomly generating huge factors does not improve basic fact recall.</p>' +
            '<p>Fluency includes accuracy, efficiency and flexibility—not simply answering as fast as possible.</p>' +
            '<p>Use short practice sets when the aim is recall.</p>' +
            '<p>Use richer problems and explanations when the aim is conceptual understanding or application.</p>' },
        { h: 'Division Worksheets',
          html: '<p>The Division with no remainder option is useful when students are first learning exact division.</p>' +
            '<p>Instead of producing awkward decimal or remainder answers, the generator builds questions that divide evenly.</p>' +
            '<p>Examples: <code>24 ÷ 6</code>, <code>42 ÷ 7</code>.</p><p>Later, students can work with:</p>',
          list: ['remainders', 'fractions', 'decimals'],
          after: '<p>depending on the curriculum.</p>' +
            '<p>Do not interpret exact division as the only "correct" kind of division.</p><p>It is simply one stage of practice.</p>' +
            '<p>Students should eventually understand what a remainder means and how the context determines what to do with it.</p>' },
        { h: 'Missing Number Problems',
          html: '<p>Missing-number equations change the thinking required.</p><p>Compare <code>7 + 5 = □</code> with <code>7 + □ = 12</code>.</p>' +
            '<p>The second question asks the learner to reason about the relationship among all three values.</p><p>It can connect addition and subtraction.</p>' +
            '<p>Likewise, <code>□ × 6 = 42</code> encourages students to use inverse relationships rather than only carry out a forward calculation.</p>' +
            '<p>Missing-number problems are useful for checking whether students understand equation structure.</p>' +
            '<p>They also help reveal a misconception that the equals sign always means "the answer comes next."</p>' +
            '<p>Use them alongside ordinary calculations rather than treating them as a separate topic.</p>' },
        { h: 'Mixed Operation Worksheets',
          html: '<p>Mixed operation worksheets are useful for review because students must first identify the operation before calculating.</p>' +
            '<p>That creates a different demand from completing 20 addition questions in a row.</p>' +
            '<p>Use mixed practice after the individual operations are reasonably secure.</p>' +
            '<p>If multiplication is still new, combining it immediately with division, addition and subtraction can overload the task.</p>' +
            '<p>A sensible sequence is:</p>',
          ol: ['teach the idea', 'practise the skill in a focused set', 'mix it with previously learned material'],
          after: '<p>Mixed review is powerful when it asks students to choose among known strategies.</p>' +
            '<p>It is less useful when several included skills are still unfamiliar.</p>' },
        { h: 'Use Seeds for Reproducible Worksheets',
          html: '<p>A seed makes generated questions repeatable.</p><p>The same settings and seed can recreate the same sheet.</p><p>Useful for:</p>',
          list: ['answer-key recovery', 'homework copies', 'absent students', 'co-teachers', 'stored lesson plans'],
          after: '<p>Change the seed when you want another version with equivalent settings.</p>' +
            '<p>That is helpful for additional practice or separate sittings.</p>' +
            '<p>Keep in mind that two random versions can still vary slightly in difficulty.</p>' +
            '<p>If the worksheet is used for formal assessment, review both versions rather than assuming random generation guarantees identical challenge.</p>' },
        { h: 'Answer Keys as Feedback',
          html: '<p>An answer key saves marking time, but it is most useful when it supports correction.</p><p>Students can:</p>',
          ol: ['solve the question', 'check the answer', 'identify the error', 'retry the calculation'],
          after: '<p>A sheet that is marked and forgotten provides less learning value.</p>' +
            '<p>For homework or independent practice, an answer key can support self-checking where appropriate.</p>' +
            '<p>For diagnostic work, teachers may want to inspect the incorrect method before students correct it.</p>' +
            '<p>Choose the feedback routine based on why the worksheet was assigned.</p>' },
        { h: 'Common Math Worksheet Mistakes',
          html: '<p>Avoid these problems:</p>',
          list: ['choosing number ranges that are too difficult for the target skill', 'leaving negative answers on before negative numbers are taught',
                 'using regrouping questions before the method has been introduced', 'assuming exact division is the final form of division',
                 'mixing operations before students know the individual skills', 'using missing-number questions without discussing equation meaning',
                 'generating excessive question counts', 'treating answer keys only as marking tools',
                 'assuming every random version has identical difficulty', 'relying on worksheets as the entire math lesson'],
          after: '<p>The generator should make targeted practice easier to prepare, not make practice less intentional.</p>' }
      ],
      keywords: ['math worksheet generator', 'printable arithmetic worksheet maker', 'addition subtraction worksheet generator', 'multiplication division worksheet generator',
        'missing number worksheet generator', 'no regrouping math worksheet', 'exact division worksheet', 'mixed operation math worksheet',
        'math worksheet answer key generator', 'seeded math worksheet generator', 'classroom math practice sheets', 'custom number range worksheet']
    }
  });
