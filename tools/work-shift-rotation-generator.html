<body data-root="../">

<section class="hero" id="hero"></section>

<section id="toolApp">
<div class="wrap">
<div class="tool-grid">

  <form class="card card-pad" id="cfg" autocomplete="off">
    <div class="panel-title"><span class="ico" id="icoGear"></span>Rota Setup</div>

    <div class="field">
      <label for="staff">Staff — one per line</label>
      <textarea id="staff" style="min-height:120px">Alex
Sam
Jo
Kit
Robin
Mo</textarea>
      <div id="staffStats"></div>
    </div>

    <div class="field">
      <label for="shifts">Shifts — one per line</label>
      <textarea id="shifts" style="min-height:100px">Early 06:00–14:00
Late 14:00–22:00
Night 22:00–06:00
Off</textarea>
      <div class="hint">Include an <code>Off</code> line so people get rest days in the rotation.</div>
      <div id="shiftStats"></div>
    </div>

    <div class="divider"></div>

    <div class="row">
      <div class="field"><label for="days">Days to schedule</label><input type="number" id="days" value="14" min="1" max="90"></div>
      <div class="field"><label for="start">Starting</label><input type="date" id="start"></div>
    </div>

    <div class="field">
      <label for="cycle">Rotate shift every</label>
      <select id="cycle">
        <option value="1">Day</option>
        <option value="2">2 days</option>
        <option value="3">3 days</option>
        <option value="4">4 days</option>
        <option value="7" selected>Week</option>
      </select>
      <div class="hint">Slower rotation is easier on sleep patterns, especially where nights are involved.</div>
    </div>

    <fieldset class="field">
      <legend class="label">Options</legend>
      <div class="check-list">
        <label class="check on"><input type="checkbox" id="optForward" checked>
          <span><span class="t">Forward rotation</span><span class="d">Early → Late → Night. Easier to adapt to than rotating backwards.</span></span></label>
        <label class="check"><input type="checkbox" id="optWeekend">
          <span><span class="t">Highlight weekends</span></span></label>
      </div>
    </fieldset>

    <div class="field">
      <label for="title">Rota title</label>
      <input type="text" id="title" value="Shift Rota">
    </div>

    <div class="field">
      <label for="seed">Seed</label>
      <div class="row" style="grid-template-columns:minmax(0,1fr) auto;gap:8px">
        <input type="text" id="seed" value="shift-1">
        <button type="button" class="btn btn-soft" id="newSeed"><span id="icoReset"></span></button>
      </div>
    </div>

    <div class="out-actions">
      <button type="submit" class="btn btn-primary btn-block"><span id="icoBolt"></span> Generate Rota</button>
    </div>
  </form>

  <div class="card card-pad">
    <div class="panel-title"><span class="ico" id="icoSpark"></span>Rota<span class="spacer"></span>
      <span class="result-pill" id="pill"></span></div>

    <div class="tabs" id="tabs">
      <button type="button" class="on" data-tab="grid">Rota grid</button>
      <button type="button" data-tab="coverage">Coverage</button>
      <button type="button" data-tab="fair">Fairness</button>
      <button type="button" data-tab="guide">Notes</button>
    </div>

    <div data-panel="grid">
      <div id="grid" style="overflow-x:auto"></div>
      <div class="out-actions" style="margin-top:16px">
        <button type="button" class="btn btn-primary" id="printBtn"><span id="icoFile"></span> Print rota</button>
        <button type="button" class="btn btn-ghost" id="csvBtn"><span id="icoDl"></span> CSV</button>
        <button type="button" class="btn btn-soft" id="regen"><span id="icoReset2"></span> Reshuffle</button>
      </div>
      <div id="checks"></div>
    </div>

    <div data-panel="coverage" hidden><div id="coverage" style="overflow-x:auto"></div></div>
    <div data-panel="fair" hidden><div id="fair"></div></div>
    <div data-panel="guide" hidden><div id="guide"></div></div>
  </div>

</div>

<div id="afterTool"></div>

<script src="../assets/js/site.js"></script>
<script src="../assets/js/schedule.js"></script>
<script src="../assets/js/roster.js"></script>
<script>
(function () {
  var I = GTI, $ = GT.$, $$ = GT.$$, S = GTSched;
  ['icoGear:gear','icoSpark:spark','icoBolt:bolt','icoDl:download','icoReset:reset','icoReset2:reset','icoFile:file']
    .forEach(function (p) { var a = p.split(':'); document.getElementById(a[0]).innerHTML = I[a[1]]; });

  $('#start').value = GT.today();
  var staff = [], shifts = [], grid = [], dates = [];

  function isOff(s) { return /^off\b/i.test(s) || /rest/i.test(s); }
  function isNight(s) { return /night/i.test(s); }

  function build() {
    var sp = GTRoster.parseNames($('#staff').value);
    var sh = GTRoster.parseNames($('#shifts').value);
    staff = sp.names; shifts = sh.names;
    GTRoster.rosterStats('#staffStats', sp);
    GTRoster.rosterStats('#shiftStats', sh);

    if (!staff.length || !shifts.length) {
      $('#grid').innerHTML = '<div class="empty">Add staff and at least one shift.</div>';
      $('#pill').textContent = '—'; $('#coverage').innerHTML = ''; $('#fair').innerHTML = '';
      return;
    }

    var days = Math.max(1, Math.min(90, parseInt($('#days').value, 10) || 1));
    var cycle = parseInt($('#cycle').value, 10) || 1;
    var rand = S.rng($('#seed').value);
    var order = rand.shuffle(staff);

    dates = S.dateSeries($('#start').value, days, 1);
    grid = [];
    for (var d = 0; d < days; d++) {
      var block = Math.floor(d / cycle);
      var row = order.map(function (person, i) {
        var step = $('#optForward').checked ? (i + block) : (i - block);
        var idx = ((step % shifts.length) + shifts.length) % shifts.length;
        return { person: person, shift: shifts[idx] };
      });
      grid.push(row);
    }
    window.__order = order;

    renderGrid(order);
    renderCoverage();
    renderFair(order);
    renderChecks(order, cycle);

    $('#pill').textContent = staff.length + ' staff · ' + days + ' days';
    $('#pill').style.background = 'var(--green-bg)'; $('#pill').style.color = 'var(--green)';
  }

  function shiftColour(s) {
    if (isOff(s)) return 'background:var(--bg-soft);color:var(--muted-2)';
    if (isNight(s)) return 'background:#ede9fe;color:#5b21b6';
    if (/early|morn/i.test(s)) return 'background:#dcfce7;color:#166534';
    if (/late|even/i.test(s)) return 'background:#fef3c7;color:#92400e';
    return 'background:#dbeafe;color:#1e40af';
  }
  function shortShift(s) {
    var m = s.match(/^([A-Za-z]+)/);
    return m ? m[1].slice(0, 5) : s.slice(0, 5);
  }

  function renderGrid(order) {
    $('#grid').innerHTML =
      '<table style="border-collapse:collapse;font-size:12px">' +
      '<tr><th style="text-align:left;padding:7px;border-bottom:1.5px solid var(--line);white-space:nowrap">Date</th>' +
      order.map(function (p) {
        return '<th style="padding:7px;border-bottom:1.5px solid var(--line);white-space:nowrap">' + GT.esc(p) + '</th>';
      }).join('') + '</tr>' +
      grid.map(function (row, i) {
        var d = dates[i];
        var wknd = $('#optWeekend').checked && (d.getDay() === 0 || d.getDay() === 6);
        return '<tr' + (wknd ? ' style="background:#fff7ed"' : '') + '>' +
          '<td style="padding:7px;border-bottom:1px solid var(--line-2);white-space:nowrap;color:var(--muted)">' +
          S.fmtDate(d) + '</td>' +
          row.map(function (c) {
            return '<td style="padding:5px 7px;border-bottom:1px solid var(--line-2);text-align:center">' +
              '<span style="' + shiftColour(c.shift) + ';border-radius:5px;padding:3px 7px;display:inline-block;' +
              'font-weight:600;font-size:11.5px">' + GT.esc(shortShift(c.shift)) + '</span></td>';
          }).join('') + '</tr>';
      }).join('') + '</table>';
  }

  function renderCoverage() {
    var working = shifts.filter(function (s) { return !isOff(s); });
    $('#coverage').innerHTML =
      '<p style="color:var(--muted);font-size:13.5px;margin-bottom:12px">How many people are on each shift each day. Any zero is a gap in cover.</p>' +
      '<table style="border-collapse:collapse;font-size:12.5px">' +
      '<tr><th style="text-align:left;padding:7px;border-bottom:1.5px solid var(--line)">Date</th>' +
      working.map(function (s) {
        return '<th style="padding:7px;border-bottom:1.5px solid var(--line);white-space:nowrap">' +
          GT.esc(shortShift(s)) + '</th>';
      }).join('') + '<th style="padding:7px;border-bottom:1.5px solid var(--line)">Off</th></tr>' +
      grid.map(function (row, i) {
        var counts = {};
        row.forEach(function (c) { counts[c.shift] = (counts[c.shift] || 0) + 1; });
        var offCount = shifts.filter(isOff).reduce(function (a, s) { return a + (counts[s] || 0); }, 0);
        return '<tr><td style="padding:7px;border-bottom:1px solid var(--line-2);color:var(--muted);white-space:nowrap">' +
          S.fmtDate(dates[i]) + '</td>' +
          working.map(function (s) {
            var n = counts[s] || 0;
            return '<td style="padding:7px;text-align:center;border-bottom:1px solid var(--line-2);' +
              (n === 0 ? 'background:var(--red-bg);color:var(--red);font-weight:700' : '') + '">' + n + '</td>';
          }).join('') +
          '<td style="padding:7px;text-align:center;border-bottom:1px solid var(--line-2);color:var(--muted)">' +
          offCount + '</td></tr>';
      }).join('') + '</table>';
  }

  function renderFair(order) {
    var stats = {};
    order.forEach(function (p) { stats[p] = { total: 0, nights: 0, weekends: 0, off: 0 }; });
    grid.forEach(function (row, i) {
      var d = dates[i];
      var wknd = d.getDay() === 0 || d.getDay() === 6;
      row.forEach(function (c) {
        if (isOff(c.shift)) { stats[c.person].off++; return; }
        stats[c.person].total++;
        if (isNight(c.shift)) stats[c.person].nights++;
        if (wknd) stats[c.person].weekends++;
      });
    });
    $('#fair').innerHTML =
      '<p style="color:var(--muted);font-size:13.5px;margin-bottom:12px">Shifts worked, nights and weekends per person. Nights and weekends are the two things staff compare.</p>' +
      order.map(function (p) {
        var s = stats[p];
        return '<div class="kv"><span class="k">' + GT.esc(p) + '</span><span class="v">' +
          s.total + ' shifts · ' + s.nights + ' nights · ' + s.weekends + ' weekend · ' + s.off + ' off</span></div>';
      }).join('');
  }

  function renderChecks(order, cycle) {
    var c = [];
    var working = shifts.filter(function (s) { return !isOff(s); });
    var offShifts = shifts.filter(isOff);

    /* Any working shift with nobody on it, on any day */
    var gaps = 0;
    grid.forEach(function (row) {
      var counts = {};
      row.forEach(function (x) { counts[x.shift] = (counts[x.shift] || 0) + 1; });
      working.forEach(function (s) { if (!counts[s]) gaps++; });
    });
    if (gaps) {
      c.push(['err', gaps + ' shift slot' + (gaps === 1 ? '' : 's') +
        ' across the period have nobody rostered. You need at least as many staff as working shifts — see the Coverage tab.']);
    } else {
      c.push(['ok', 'Every working shift is covered on every day.']);
    }

    if (!offShifts.length) {
      c.push(['err', 'No rest days in the rotation — add an <code>Off</code> line to the shift list, or everyone works every day.']);
    }

    /* Night followed immediately by an early is the classic unsafe transition. */
    var quickTurn = [];
    order.forEach(function (p) {
      for (var i = 0; i < grid.length - 1; i++) {
        var today = grid[i].filter(function (x) { return x.person === p; })[0];
        var tomorrow = grid[i + 1].filter(function (x) { return x.person === p; })[0];
        if (today && tomorrow && isNight(today.shift) && /early|morn/i.test(tomorrow.shift)) {
          quickTurn.push(p);
          break;
        }
      }
    });
    if (quickTurn.length) {
      c.push(['warn', 'Night shift immediately followed by an early for: ' + GT.uniq(quickTurn).map(GT.esc).join(', ') +
        '. That leaves almost no rest between shifts — slow the rotation or insert an off day after nights.']);
    }

    if (staff.length < working.length) {
      c.push(['err', 'Only ' + staff.length + ' staff for ' + working.length +
        ' working shifts. Some shifts cannot be filled at all.']);
    }
    if (cycle === 1 && shifts.some(isNight)) {
      c.push(['warn', 'Rotating every day with nights included is very hard on sleep. Three to seven days on the same shift is far easier to adapt to.']);
    }
    if (!$('#optForward').checked) {
      c.push(['warn', 'Backward rotation (Night → Late → Early) shortens the gap between shifts each time you move. Forward rotation is generally considered easier to adjust to.']);
    }
    $('#checks').innerHTML = c.map(function (x) {
      return '<div class="note ' + (x[0] === 'ok' ? 'note-ok' : x[0] === 'warn' ? 'note-warn' : 'note-err') + '">' +
        (x[0] === 'ok' ? I.check : I.warn) + '<span>' + x[1] + '</span></div>';
    }).join('') +
      '<div class="note note-warn" style="margin-top:8px">' + I.warn +
      '<span>This is a scheduling aid, not a compliance tool. Working-time limits, minimum rest periods and night-work rules vary by country and sector — check the rota against the rules that apply to you.</span></div>';
  }

  $('#csvBtn').addEventListener('click', function () {
    var order = window.__order || staff;
    var rows = ['date,' + order.map(function (p) { return '"' + p.replace(/"/g, '""') + '"'; }).join(',')];
    grid.forEach(function (row, i) {
      rows.push(dates[i].toISOString().slice(0, 10) + ',' +
        row.map(function (c) { return '"' + c.shift.replace(/"/g, '""') + '"'; }).join(','));
    });
    GT.download(rows.join('\n'), 'shift-rota.csv', 'text/csv');
  });

  $('#printBtn').addEventListener('click', function () {
    var order = window.__order || staff;
    GTRoster.printHtml($('#title').value,
      '<h1>' + GT.esc($('#title').value) + '</h1>' +
      '<p class="sub">' + staff.length + ' staff · ' + grid.length + ' days from ' + S.fmtDate(dates[0]) + '</p>' +
      '<table style="font-size:11px"><tr><th>Date</th>' +
      order.map(function (p) { return '<th>' + GT.esc(p) + '</th>'; }).join('') + '</tr>' +
      grid.map(function (row, i) {
        return '<tr><td>' + S.fmtDate(dates[i]) + '</td>' +
          row.map(function (c) { return '<td>' + GT.esc(shortShift(c.shift)) + '</td>'; }).join('') + '</tr>';
      }).join('') + '</table>');
  });

  $('#newSeed').addEventListener('click', function () { $('#seed').value = Math.random().toString(36).slice(2, 8); build(); });
  $('#regen').addEventListener('click', function () { $('#seed').value = Math.random().toString(36).slice(2, 8); build(); GT.toast('Reshuffled'); });

  $('#guide').innerHTML = [
    ['Rotate forwards, not backwards', 'Early → Late → Night moves each shift later, which lengthens the gap between finishing one and starting the next. Backward rotation shortens it every time. Forward rotation is widely regarded as easier to adapt to, and the tool warns you if you switch it off.'],
    ['Never put an early straight after a night', 'Finishing at 06:00 and starting again at 06:00 the next morning leaves essentially no rest. It is the single most common unsafe pattern in a hand-built rota, and the tool checks every person for it explicitly.'],
    ['Include an Off shift', 'If your shift list is only working shifts, the rotation gives everybody work every single day. Adding one or more <code>Off</code> lines builds rest days into the cycle automatically.'],
    ['You need at least as many staff as shifts', 'Three working shifts cannot be covered by two people. The coverage tab shows the headcount on each shift each day and highlights any zero in red — those are the gaps that turn into last-minute phone calls.'],
    ['Slower rotation is kinder', 'Changing shift every day gives the body no chance to adjust. Three to seven days on the same shift is much easier, particularly where nights are involved.'],
    ['Nights and weekends are what people compare', 'Nobody counts total hours, but everyone knows how many weekends they worked. The fairness tab breaks both out per person, which is the conversation you want to have with the numbers in front of you.']
  ].map(function (x) {
    return '<div style="margin-bottom:16px"><h4 style="font-size:14.5px;margin-bottom:6px">' + x[0] + '</h4>' +
      '<p style="color:var(--muted);font-size:13.8px">' + x[1] + '</p></div>';
  }).join('');

  $('#tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    $$('#tabs button').forEach(function (x) { x.classList.toggle('on', x === b); });
    $$('[data-panel]').forEach(function (p) { p.hidden = p.getAttribute('data-panel') !== b.getAttribute('data-tab'); });
  });
  $('#cfg').addEventListener('submit', function (e) { e.preventDefault(); build(); GT.toast('Rota generated'); });
  $('#cfg').addEventListener('input', build);
  $('#cfg').addEventListener('change', build);

  build();

  GT.page({
    slug: 'work-shift-rotation-generator',
    lede: 'Rotating shift patterns with the checks that matter — full coverage every day, no night-to-early turnarounds, and a fairness split on nights and weekends.',
    steps: [
      { icon: 'gear', title: 'List staff and shifts', text: 'Include an Off line so rest days are built into the rotation.' },
      { icon: 'clock', title: 'Choose the rotation speed', text: 'Weekly is easiest on sleep; daily is hardest.' },
      { icon: 'file', title: 'Check coverage, then print', text: 'Red cells are shifts with nobody on them.' }
    ],
    guideTitle: 'Two rules that make a rota safe',
    guide:
      '<p style="color:var(--muted)">Most hand-built rotas fail in one of two ways, and both are easy to miss when you are looking at a grid of names.</p>' +
      '<div class="grid g2" style="margin-top:18px">' +
      '<div><h4 style="font-size:14.5px;margin-bottom:8px">1. Rotate forwards</h4><p style="color:var(--muted);font-size:13.8px">Early → Late → Night moves each shift later in the day, which lengthens the gap between finishing one and starting the next. Rotating the other way shortens it every single time, compressing rest.</p>' +
      '<p style="color:var(--muted);font-size:13.8px;margin-top:10px">Forward rotation is the standard recommendation in shift-work guidance, and it costs nothing to follow.</p></div>' +
      '<div><h4 style="font-size:14.5px;margin-bottom:8px">2. Never night → early</h4><p style="color:var(--muted);font-size:13.8px">Finishing a night at 06:00 and starting an early at 06:00 the next day leaves no meaningful rest at all. It slips into hand-built rotas constantly because on a grid it looks like two ordinary shifts.</p>' +
      '<p style="color:var(--muted);font-size:13.8px;margin-top:10px">This tool checks every person for that transition and names anyone affected.</p></div></div>' +
      '<div class="note note-info" style="margin-top:18px">' + GTI.info + '<span><strong>Coverage is a hard constraint.</strong> With three working shifts and two staff, at least one shift is empty every day. The coverage tab shows the headcount per shift per day and marks any zero in red — those are the gaps that become last-minute phone calls.</span></div>' +
      '<div class="note note-warn" style="margin-top:12px">' + GTI.warn + '<span>This is a scheduling aid, not a compliance tool. Working-time limits, minimum daily rest and night-work rules differ by country and sector — check any rota against the rules that actually apply to your workplace.</span></div>',
    related: ['chore-rotation-generator', 'cleaning-schedule-generator', 'league-schedule-generator'],
faqs: [
      { q: 'What is a rotating shift schedule?', a: 'It is a rota where employees move between different time periods such as early, late and night shifts according to a repeated pattern.' },
      { q: 'What is forward rotation?', a: 'Forward rotation moves from earlier to later shifts, for example Early → Late → Night.' },
      { q: 'Should I include off days?', a: 'Yes, when rest days are part of the intended rotation. Add an Off line to the shift pattern.' },
      { q: 'Does the generator check coverage?', a: 'The tool includes a coverage view so you can inspect how staff are assigned across the rota.' },
      { q: 'Does equal distribution mean the rota is fair?', a: 'Not automatically. Review nights, weekends, transitions, eligibility and workload as well as total counts.' },
      { q: 'Is this a working-time compliance checker?', a: 'No. Working-time rules vary by jurisdiction and industry. Treat the generator as a scheduling aid.' },
      { q: 'Can I reproduce the same rota later?', a: 'Yes. Keep the same staff, shifts, settings and seed.' }
    ],
    seo: {
      title: 'Work Shift Rotation Generator – Build a Clear Staff Rota',
      lead: 'Use the Work Shift Rotation Generator above to create a repeating staff rota from your own shift pattern.',
      blocks: [
        { html: '<p>Enter one staff member per line, then define the shifts.</p><p>For example:</p>' +
            '<pre class="code">Early 06:00–14:00\nLate 14:00–22:00\nNight 22:00–06:00\nOff</pre>' +
            '<p>Choose how many days to schedule, the starting date and how often staff rotate from one shift to the next.</p>' +
            '<p>The tool can use forward rotation, highlight weekends and show separate rota, coverage and fairness views before you print or export the schedule.</p>' +
            '<p>This is a planning aid. It does <strong>not</strong> replace local working-time law, employment agreements, fatigue-risk assessment, clinical staffing rules or industry-specific rostering requirements.</p>' },
        { h: 'What Is a Shift Rotation?',
          html: '<p>A shift rotation changes which time period an employee works over a recurring cycle.</p>' +
            '<p>A simple pattern may move through Early → Late → Night → Off.</p>' +
            '<p>Another workplace may use Day → Night → Off or a much slower pattern where staff remain on one shift for several days or weeks before changing.</p>' +
            '<p>Rotating schedules are common in:</p>',
          list: ['healthcare', 'manufacturing', 'security', 'hospitality', 'logistics', 'utilities', 'emergency services', '24-hour operations'],
          after: '<p>The schedule needs to do more than fill cells.</p>' +
            '<p>It should provide the required coverage while giving staff a workable pattern of work and rest.</p>' },
