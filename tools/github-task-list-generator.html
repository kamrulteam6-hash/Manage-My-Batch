<body data-root="../">

<section class="hero" id="hero"></section>

<section id="toolApp">
<div class="wrap">
<div class="tool-grid">

  <form class="card card-pad" id="cfg" autocomplete="off">
    <div class="panel-title"><span class="ico" id="icoGear"></span>Checklist Builder</div>

    <div class="field">
      <label for="template">Start from a template</label>
      <select id="template">
        <option value="custom" selected>My own list</option>
        <option value="pr">Pull request checklist</option>
        <option value="release">Release checklist</option>
        <option value="feature">Feature breakdown</option>
        <option value="bug">Bug triage</option>
        <option value="onboarding">Onboarding</option>
      </select>
    </div>

    <div class="field">
      <label for="items">Tasks — one per line</label>
      <textarea id="items" style="min-height:230px">Design review
  Wireframes approved
  Copy signed off
Build
  API endpoint
  Frontend form
  Validation and error states
Testing
  Unit tests
  Manual QA on staging
Ship
  Feature flag enabled
  Docs updated</textarea>
      <div class="hint">Indent with two spaces (or a tab) to nest a subtask. Prefix a line with <code>x </code> to mark it complete.</div>
    </div>

    <div class="row">
      <div class="field">
        <label for="marker">Checkbox style</label>
        <select id="marker">
          <option value="dash" selected>- [ ] (hyphen)</option>
          <option value="star">* [ ] (asterisk)</option>
          <option value="plus">+ [ ] (plus)</option>
        </select>
      </div>
      <div class="field">
        <label for="indentSize">Indent width</label>
        <select id="indentSize">
          <option value="2" selected>2 spaces</option>
          <option value="4">4 spaces</option>
        </select>
      </div>
    </div>

    <div class="divider"></div>

    <fieldset class="field">
      <legend class="label">Options</legend>
      <div class="check-list">
        <label class="check"><input type="checkbox" id="optProgress"><span><span class="t">Add a progress line</span><span class="d">A count and a bar at the top, e.g. <code>3 / 12 complete</code>.</span></span></label>
        <label class="check"><input type="checkbox" id="optParentHeading"><span><span class="t">Top level as headings</span><span class="d">Turns unindented lines into <code>###</code> headings instead of tasks.</span></span></label>
        <label class="check"><input type="checkbox" id="optAssignee"><span><span class="t">Add assignee placeholders</span><span class="d">Appends <code>@username</code> to each task.</span></span></label>
        <label class="check"><input type="checkbox" id="optIssueRefs"><span><span class="t">Add issue reference placeholders</span><span class="d">Appends <code>#000</code> so GitHub links and tracks them.</span></span></label>
        <label class="check"><input type="checkbox" id="optDetails"><span><span class="t">Wrap in a collapsible &lt;details&gt;</span><span class="d">Keeps long checklists from dominating an issue.</span></span></label>
        <label class="check on"><input type="checkbox" id="optAllUnchecked" checked><span><span class="t">Ignore existing x markers</span><span class="d">Force everything to unchecked.</span></span></label>
      </div>
    </fieldset>

    <div class="field" id="detailsWrap" hidden>
      <label for="summaryText">Collapsible summary text</label>
      <input type="text" id="summaryText" value="Implementation checklist">
    </div>

    <div class="field">
      <label for="title">Heading above the list</label>
      <input type="text" id="title" placeholder="## Checklist">
    </div>
  </form>

  <div class="card card-pad">
    <div class="panel-title"><span class="ico" id="icoSpark"></span>Task List<span class="spacer"></span>
      <span class="result-pill" id="pill"></span></div>

    <div class="tabs" id="tabs">
      <button type="button" class="on" data-tab="file">Markdown</button>
      <button type="button" data-tab="preview">Preview</button>
      <button type="button" data-tab="tips">GitHub behaviour</button>
    </div>

    <div data-panel="file">
      <div class="output-box">
        <div class="output-bar"><span class="fname" id="fname">checklist.md</span><span class="chip" id="meta"></span></div>
        <pre class="code" id="out"></pre>
      </div>
      <div class="out-actions">
        <button class="btn btn-primary" id="copyBtn"><span id="icoCopy"></span> Copy</button>
        <button class="btn btn-ghost" id="dlBtn"><span id="icoDl"></span> Download</button>
      </div>
      <div id="warnBox"></div>
    </div>

    <div data-panel="preview" hidden>
      <p style="color:var(--muted);font-size:13.5px;margin-bottom:12px">Tick boxes here to update the generated markdown.</p>
      <div id="preview"></div>
    </div>

    <div data-panel="tips" hidden><div id="tips"></div></div>
  </div>

</div>
</div>
</section>

<div id="afterTool"></div>

<script src="../assets/js/site.js"></script>
<script>
(function () {
  var I = GTI, $ = GT.$, $$ = GT.$$;
  ['icoGear:gear','icoSpark:spark','icoCopy:copy','icoDl:download']
    .forEach(function (p) { var a = p.split(':'); document.getElementById(a[0]).innerHTML = I[a[1]]; });

  var TEMPLATES = {
    pr: 'Code\n  Self-reviewed the diff\n  No debug logging or commented-out code\n  Naming matches surrounding conventions\nTests\n  New tests cover the change\n  Full suite passes locally\n  Edge cases considered\nDocs\n  README or docs updated if behaviour changed\n  Changelog entry added\nReview\n  Screenshots attached for UI changes\n  Breaking changes called out in the description',
    release: 'Pre-release\n  All milestone issues closed\n  Changelog written\n  Version number bumped\n  Dependencies audited\nStaging\n  Deployed to staging\n  Smoke tests pass\n  Migrations run cleanly\nRelease\n  Tag created\n  Production deploy\n  Monitoring dashboards checked\nPost-release\n  Release notes published\n  Announcement sent\n  Rollback plan documented',
    feature: 'Discovery\n  Requirements confirmed\n  Edge cases listed\n  Technical approach agreed\nBackend\n  Data model\n  API endpoints\n  Authorization rules\n  Tests\nFrontend\n  Component built\n  Loading and error states\n  Responsive behaviour\n  Accessibility pass\nLaunch\n  Feature flag added\n  Analytics events\n  Documentation',
    bug: 'Triage\n  Reproduced locally\n  Severity assigned\n  Affected versions identified\nInvestigation\n  Root cause found\n  Regression window identified\nFix\n  Patch written\n  Regression test added\n  Reviewed\nVerification\n  Verified on staging\n  Verified in production\n  Reporter notified',
    onboarding: 'Access\n  GitHub organisation\n  Cloud console\n  Password manager\n  On-call rota\nEnvironment\n  Repository cloned\n  Dependencies installed\n  Local app running\n  Tests passing\nContext\n  Architecture overview read\n  Paired with a teammate\n  First good-first-issue picked'
  };

  var out = GT.mountOutput({ pre: '#out', fileLabel: '#fname', meta: '#meta',
    copyBtn: '#copyBtn', downloadBtn: '#dlBtn', filename: 'checklist.md', mime: 'text/markdown' });

  var tree = [];

  function parse() {
    var lines = $('#items').value.replace(/\r\n/g, '\n').split('\n');
    var items = [];
    lines.forEach(function (raw) {
      if (!raw.trim()) return;
      var expanded = raw.replace(/\t/g, '  ');
      var lead = expanded.match(/^ */)[0].length;
      var text = expanded.trim();
      /* Accept existing markdown checkboxes and bullets as input. */
      var checked = false;
      var md = text.match(/^[-*+]\s*\[([ xX])\]\s*(.*)$/);
      if (md) { checked = md[1].toLowerCase() === 'x'; text = md[2]; }
      else {
        text = text.replace(/^[-*+]\s+/, '');
        var xm = text.match(/^x\s+(.*)$/i);
        if (xm) { checked = true; text = xm[1]; }
      }
      if ($('#optAllUnchecked').checked) checked = false;
      items.push({ depth: Math.floor(lead / 2), text: text, checked: checked });
    });
    /* Normalise depths so a jump of two levels does not produce broken nesting. */
    var prev = -1;
    items.forEach(function (it) {
      if (it.depth > prev + 1) it.depth = prev + 1;
      prev = it.depth;
    });
    return items;
  }

  function build() {
    tree = parse();
    var marker = { dash: '-', star: '*', plus: '+' }[$('#marker').value] || '-';
    var iw = parseInt($('#indentSize').value, 10) || 2;
    var headings = $('#optParentHeading').checked;

    var total = 0, done = 0;
    tree.forEach(function (it) {
      if (headings && it.depth === 0) return;
      total++; if (it.checked) done++;
    });

    var L = [];
    var title = $('#title').value.trim();
    if (title) L.push(/^#/.test(title) ? title : '## ' + title, '');

    if ($('#optProgress').checked && total) {
      var pct = Math.round((done / total) * 100);
      var filled = Math.round(pct / 5);
      L.push('**Progress:** ' + done + ' / ' + total + ' complete (' + pct + '%)');
      L.push('');
      L.push('`' + new Array(filled + 1).join('█') + new Array(20 - filled + 1).join('░') + '` ' + pct + '%');
      L.push('');
    }

    if ($('#optDetails').checked) {
      L.push('<details>');
      L.push('<summary>' + ($('#summaryText').value || 'Checklist') + ' (' + done + '/' + total + ')</summary>');
      L.push('');
    }

    tree.forEach(function (it) {
      var text = it.text;
      if ($('#optAssignee').checked) text += ' @username';
      if ($('#optIssueRefs').checked) text += ' #000';

      if (headings && it.depth === 0) {
        L.push('');
        L.push('### ' + it.text);
        L.push('');
        return;
      }
      var depth = headings ? Math.max(0, it.depth - 1) : it.depth;
      var pad = new Array(depth * iw + 1).join(' ');
      L.push(pad + marker + ' [' + (it.checked ? 'x' : ' ') + '] ' + text);
    });

    if ($('#optDetails').checked) { L.push(''); L.push('</details>'); }

    var text2 = L.join('\n').replace(/\n{3,}/g, '\n\n').replace(/^\n+/, '').replace(/\s+$/, '') + '\n';
    out.set(text2, 'checklist.md');

    $('#pill').textContent = done + ' / ' + total + ' complete';
    $('#pill').style.background = done === total && total ? 'var(--green-bg)' : 'var(--blue-50)';
    $('#pill').style.color = done === total && total ? 'var(--green)' : 'var(--blue)';

    renderPreview();
    renderWarn(total);
    renderTips();
  }

  function renderPreview() {
    var headings = $('#optParentHeading').checked;
    $('#preview').innerHTML = '<div style="border:1px solid var(--line);border-radius:12px;padding:16px">' +
      tree.map(function (it, i) {
        if (headings && it.depth === 0) {
          return '<h3 style="font-size:15px;margin:' + (i ? '18px' : '0') + ' 0 8px">' + GT.esc(it.text) + '</h3>';
        }
        var depth = headings ? Math.max(0, it.depth - 1) : it.depth;
        return '<label style="display:flex;gap:9px;align-items:flex-start;padding:4px 0;margin-left:' + (depth * 24) + 'px;cursor:pointer">' +
          '<input type="checkbox" data-i="' + i + '"' + (it.checked ? ' checked' : '') +
          ' style="margin-top:3px;accent-color:var(--blue);width:16px;height:16px">' +
          '<span style="font-size:14px;' + (it.checked ? 'color:var(--muted);text-decoration:line-through' : '') + '">' +
          GT.esc(it.text) + '</span></label>';
      }).join('') + '</div>';
  }

  $('#preview').addEventListener('change', function (e) {
    var i = e.target.getAttribute('data-i'); if (i == null) return;
    tree[i].checked = e.target.checked;
    /* Write the state back into the source textarea so it survives a rebuild. */
    var marker = { dash: '-', star: '*', plus: '+' }[$('#marker').value] || '-';
    $('#optAllUnchecked').checked = false;
    $('#optAllUnchecked').closest('.check').classList.remove('on');
    $('#items').value = tree.map(function (it) {
      return new Array(it.depth * 2 + 1).join(' ') + (it.checked ? 'x ' : '') + it.text;
    }).join('\n');
    build();
    $$('#tabs button').forEach(function (x) { x.classList.toggle('on', x.getAttribute('data-tab') === 'preview'); });
    $$('[data-panel]').forEach(function (p) { p.hidden = p.getAttribute('data-panel') !== 'preview'; });
  });

  function renderWarn(total) {
    var w = [];
    if (!total) w.push(['err', 'No tasks yet — add one line per item.']);
    if (total > 30) w.push(['warn', total + ' tasks in one list. GitHub renders it fine, but long checklists in an issue are hard to scan — consider splitting into separate issues and linking them, or wrapping this in a collapsible block.']);
    var deep = tree.some(function (it) { return it.depth > 2; });
    if (deep) w.push(['warn', 'Nesting deeper than three levels does not render reliably across Markdown viewers. Two levels is the practical maximum.']);
    if ($('#optIssueRefs').checked) w.push(['warn', 'Issue references are placeholders (<code>#000</code>). Replace them with real numbers — GitHub then shows each linked issue\'s status inline and tracks completion automatically.']);
    if ($('#optDetails').checked) w.push(['warn', 'Inside a <code>&lt;details&gt;</code> block, GitHub still renders the checkboxes but does not count them in the issue progress bar.']);
    if (!w.length) w.push(['ok', 'Valid GitHub task list — checkboxes will be interactive in issues, PRs and comments.']);
    $('#warnBox').innerHTML = w.map(function (x) {
      return '<div class="note ' + (x[0] === 'ok' ? 'note-ok' : x[0] === 'warn' ? 'note-warn' : 'note-err') + '">' +
        (x[0] === 'ok' ? I.check : I.warn) + '<span>' + x[1] + '</span></div>';
    }).join('');
  }

  function renderTips() {
    $('#tips').innerHTML = [
      ['Checkboxes are clickable in issues and PRs', 'Anyone with write access can tick a box directly in the rendered view — no editing required. Each click is recorded in the issue timeline, so progress is auditable.'],
      ['GitHub counts them automatically', 'An issue or PR body containing task list items shows a progress indicator in list views and project boards. It is the cheapest possible progress tracking.'],
      ['The syntax is exact', 'It must be <code>- [ ]</code> or <code>- [x]</code>: a list marker, a space, a bracket pair with exactly one character inside. <code>-[ ]</code> and <code>- []</code> both render as plain text.'],
      ['Reference issues to link progress', 'Writing <code>- [ ] Fix login bug #42</code> makes GitHub display the linked issue\'s title and state, and closing #42 does not auto-tick the box — but the status is visible at a glance.'],
      ['Nest with two spaces', 'Sub-items are indented by two spaces relative to the parent. More than two levels of nesting renders inconsistently across viewers.'],
      ['Task lists work in more than issues', 'They render in READMEs, wikis, discussions, comments and release notes. Only in issues, PRs and comments are they interactive.'],
      ['Converting a task into an issue', 'Hovering a task item in an issue reveals a button that converts that line into a new issue, linked back to the original. It is the fastest way to break a plan into tracked work.']
    ].map(function (x) {
      return '<div style="margin-bottom:16px"><h4 style="font-size:14.5px;margin-bottom:6px">' + x[0] + '</h4>' +
        '<p style="color:var(--muted);font-size:13.8px">' + x[1] + '</p></div>';
    }).join('');
  }

  $('#template').addEventListener('change', function () {
    if (TEMPLATES[this.value]) { $('#items').value = TEMPLATES[this.value]; build(); }
  });
  $('#optDetails').addEventListener('change', function () { $('#detailsWrap').hidden = !this.checked; });
  $('#tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    $$('#tabs button').forEach(function (x) { x.classList.toggle('on', x === b); });
    $$('[data-panel]').forEach(function (p) { p.hidden = p.getAttribute('data-panel') !== b.getAttribute('data-tab'); });
  });
  $('#cfg').addEventListener('submit', function (e) { e.preventDefault(); build(); });
  $('#cfg').addEventListener('input', build);
  $('#cfg').addEventListener('change', build);

  build();

  GT.page({
    slug: 'github-task-list-generator',
    lede: 'Build nested GitHub task lists from plain text — with progress counts, PR and release templates, and a preview you can tick to update the markdown.',
    steps: [
      { icon: 'gear', title: 'Write or pick a list', text: 'One task per line, two spaces to nest. Templates cover PR, release, feature and triage checklists.' },
      { icon: 'checklist', title: 'Add structure', text: 'Progress line, headings, assignee and issue placeholders, or a collapsible wrapper.' },
      { icon: 'copy', title: 'Paste into GitHub', text: 'Checkboxes become interactive in issues, PRs and comments.' }
    ],
    guideTitle: 'Small syntax, disproportionate usefulness',
    guide:
      '<p style="color:var(--muted)">A task list is just a list item whose text begins with <code>[ ]</code> or <code>[x]</code>, but GitHub treats it as structured data. Boxes become clickable without editing the issue, completion is counted in list views and project boards, and any line can be converted into its own linked issue. For the cost of two characters it is the most effective lightweight tracking GitHub offers.</p>' +
      '<div class="grid g2" style="margin-top:18px">' +
      '<div><h4 style="font-size:14.5px;margin-bottom:8px">The syntax is unforgiving</h4><ul style="color:var(--muted);font-size:13.8px;padding-left:18px;margin:0"><li><code>- [ ] task</code> — correct.</li><li><code>-[ ] task</code> — no space after the marker, renders as text.</li><li><code>- [] task</code> — empty brackets, renders as text.</li><li><code>- [X] task</code> — uppercase X is accepted.</li><li>Nest with exactly two spaces per level.</li></ul></div>' +
      '<div><h4 style="font-size:14.5px;margin-bottom:8px">Getting more out of them</h4><ul style="color:var(--muted);font-size:13.8px;padding-left:18px;margin:0"><li>Reference real issue numbers and GitHub shows each one\'s title and open/closed state inline.</li><li>Keep lists under about twenty items — beyond that, split into linked issues.</li><li>Put a checklist in your pull request template so it appears automatically on every PR.</li><li>Wrap very long lists in <code>&lt;details&gt;</code>, accepting that GitHub then stops counting them in the progress bar.</li></ul></div></div>' +
      '<div class="note note-info" style="margin-top:18px">' + GTI.info + '<span>Paste an existing checklist back into the input — including one copied from a GitHub issue with its <code>- [x]</code> markers — and it will be parsed, renumbered and reformatted. Turn off “ignore existing x markers” to keep the completed state.</span></div>',
    related: ['markdown-table-generator', 'html-table-generator', 'json-array-generator'],
faqs: [
      { q: 'How do I create a checkbox in GitHub Markdown?', a: 'Use <code>- [ ]</code> before an incomplete task and <code>- [x]</code> before a completed task.' },
      { q: 'Can GitHub task lists be nested?', a: 'Yes. Indent child list items beneath a parent task to create nested checklists.' },
      { q: 'Can I use task lists in issues?', a: 'Yes. GitHub supports task-list Markdown in issues, pull requests, comments and other Markdown contexts.' },
      { q: 'Does uppercase X work for completed tasks?', a: 'The GFM task-list definition permits <code>x</code> or <code>X</code> inside the checkbox marker.' },
      { q: 'Can I mention a user inside a task?', a: 'Yes. Normal GitHub mention syntax such as <code>@username</code> can be included in the task text.' },
      { q: 'Can I link a task to another issue?', a: 'Yes. Add a GitHub issue or pull-request reference such as <code>#123</code> where the repository context supports it.' },
      { q: 'Should I use a task list or a table?', a: 'Use a task list for actionable work and a table for comparing structured values.' }
    ],
    seo: {
      title: 'GitHub Task List Generator – Build Nested Markdown Checklists',
      lead: 'Use the GitHub Task List Generator above to turn a plain list of work into properly formatted GitHub Markdown checkboxes.',
      blocks: [
        { html: '<p>Enter one task per line, indent subtasks, mark completed items with <code>x</code>, then choose whether you want progress text, top-level headings, assignee placeholders, issue references or a collapsible <code>&lt;details&gt;</code> block.</p>' +
            '<p>The generator is useful for issue descriptions, pull requests, release checklists, launch plans and recurring team workflows.</p>' +
            '<p>GitHub task-list syntax is small, but long nested lists become surprisingly easy to mis-indent. A generator keeps the source consistent while giving you a rendered preview of the checklist before you paste it into GitHub.</p>' },
        { h: 'What Is a GitHub Task List?',
          html: '<p>A GitHub task list is a Markdown list whose items begin with checkbox markers.</p><p>Unchecked:</p><pre class="code">- [ ] Write documentation</pre>' +
            '<p>Checked:</p><pre class="code">- [x] Write documentation</pre>' +
            '<p>GitHub renders these markers as task checkboxes in supported contexts.</p>' +
            '<p>Task lists are useful because they combine readable plain-text source with visible completion state.</p>' +
            '<p>They can appear in issues, pull requests, comments and Markdown files.</p>' +
            '<p>The GitHub Flavored Markdown specification defines task list items as an extension to normal list syntax.</p>' },
        { h: 'How to Use This GitHub Task List Generator',
          html: '<p>Enter one task per line.</p><p>For example:</p><pre class="code">Design review\nBuild API\nTesting\nShip</pre>' +
            '<p>Indent a line beneath another task to make it a subtask.</p><p>Prefix a task with:</p><pre class="code">x </pre>' +
            '<p>when you want it generated as completed.</p><p>Then choose optional features.</p><p>You can add:</p>',
          list: ['a progress line', 'headings', 'assignee placeholders', 'issue-reference placeholders', 'a collapsible details wrapper'],
          after: '<p>Generate the checklist and inspect the preview.</p>' +
            '<p>The preview helps catch nesting mistakes before you paste the Markdown into an issue or pull request.</p>' },
        { h: 'GitHub Task List Syntax',
          html: '<p>The core syntax is:</p><pre class="code">- [ ] Task</pre><p>for an incomplete task.</p><p>Use:</p><pre class="code">- [x] Task</pre>' +
            '<p>for a completed task.</p><p>GitHub also accepts uppercase <code>X</code> in the marker.</p>' +
            '<p>The important spacing is the space after the list marker and the checkbox syntax.</p><p>A normal list item such as:</p>' +
            '<pre class="code">- Write tests</pre><p>is a bullet, not a task checkbox.</p>' +
            '<p>Task-list syntax builds on normal list parsing, so indentation and surrounding Markdown still matter.</p>' },
        { h: 'Nested GitHub Task Lists',
          html: '<p>Task lists can be nested.</p><p>For example:</p>' +
            '<pre class="code">- [ ] Build checkout\n  - [x] Create form\n  - [ ] Add validation\n  - [ ] Add payment flow</pre>' +
            '<p>GitHub Flavored Markdown supports nested task items.</p>' +
            '<p>Indentation tells the parser that the child task belongs under the parent.</p>' +
            '<p>The exact number of spaces needed can depend on the width of the parent list marker and surrounding structure.</p>' +
            '<p>For ordinary bullet task lists, consistent indentation makes the hierarchy much easier to maintain.</p>' +
            '<p>The generator uses a predictable indentation width so your source remains readable.</p>' },
        { h: 'Why Nested Checklists Are Useful',
          html: '<p>A flat checklist works for short work.</p><p>A nested checklist works better when one deliverable contains several steps.</p><p>For example:</p>' +
            '<p><strong>Release</strong></p>',
          list: ['QA', 'docs', 'deployment', 'monitoring'],
          after: '<p>This helps reviewers see both the high-level milestone and the detailed work required to finish it.</p><p>Nested tasks are useful for:</p>' +

            '<p>Do not create six levels of nesting just because the syntax allows it.</p>' +

        { h: 'Mark Completed Tasks',
          html: '<p>Use <code>[x]</code> for completed items.</p><p>Example:</p><pre class="code">- [x] Database migration tested</pre>' +
            '<p>This creates a visible record of progress while preserving the original task.</p>' +
            '<p>Deleting completed work may make the list shorter, but it also removes context.</p>' +
            '<p>For launch and release checklists, leaving completed items visible can help reviewers understand what has already been verified.</p>' +
            '<p>For a personal scratch list, deleting finished items may be fine.</p>' +
            '<p>Choose based on whether the checklist is also serving as a project record.</p>' },
        { h: 'Add a Progress Count',
          html: '<p>A progress line gives readers an immediate summary.</p><p>Example:</p><pre class="code">7 / 12 complete</pre>' +
            '<p>This is especially useful when the checklist is long enough that readers cannot estimate completion at a glance.</p>' +
            '<p>A progress bar or count is informational text generated from the checkbox state.</p>' +
            '<p>Remember that a manually pasted progress count will not necessarily update itself later unless the surrounding tool or workflow recalculates it.</p>' +
            '<p>If people edit checkboxes directly on GitHub, the text count may become stale.</p>' +
            '<p>Use it as a helpful snapshot, not as a guaranteed live project metric.</p>' },
        { h: 'Use Top-Level Tasks as Headings',
          html: '<p>For structured checklists, top-level lines can act as section headings.</p><p>Example:</p><pre class="code">### Design</pre>' +
            '<p>followed by task items.</p><p>This can improve readability when a checklist covers several phases such as:</p>',
          list: ['Design', 'Development', 'QA', 'Launch'],
          after: '<p>Headings are better than fake “task” items when the line is a category rather than work that can actually be completed.</p>' +
            '<p>Do not add a checkbox to a section title unless completing that section as a whole is meaningful.</p>' +
            '<p>Good structure distinguishes categories from actions.</p>' },
        { h: 'Add Assignee Placeholders',
          html: '<p>GitHub mentions use the:</p><pre class="code">@username</pre><p>syntax.</p>' +
            '<p>A generated placeholder can remind the author to assign responsibility to a task.</p><p>For example:</p>' +
            '<pre class="code">- [ ] Review accessibility @username</pre>' +
            '<p>Mentions can notify people when used in supported GitHub contexts.</p>' +
            '<p>Do not add real usernames automatically when you are preparing a reusable template unless the ownership is always the same.</p>' +
            '<p>A placeholder is safer for generic checklists.</p>' +
            '<p>Responsibility should be explicit enough that readers know who owns the next action.</p>' },
        { h: 'Add Issue or Pull Request References',
          html: '<p>GitHub recognizes references such as:</p><pre class="code">#123</pre><p>within the appropriate repository context.</p>' +
            '<p>These references can connect checklist items to separate issues or pull requests.</p><p>Example:</p>' +
            '<pre class="code">- [ ] Update API docs #123</pre>' +
            '<p>This is useful when the checklist is a high-level tracker and detailed work lives elsewhere.</p>' +
            '<p>Do not create placeholders if the final checklist will never use issue references.</p>' +
            '<p>Extra symbols make source harder to read when they serve no purpose.</p>' +
            '<p>Use references when they help connect planning to tracked work.</p>' },
        { h: 'Task Lists in Issues',
          html: '<p>Task lists are particularly useful in issue descriptions.</p><p>A feature issue can contain:</p>',
          list: ['acceptance criteria', 'implementation steps', 'QA checks', 'rollout tasks'],
          after: '<p>This gives contributors one place to see what remains.</p><p>Keep each task actionable.</p><p>Weak:</p>' +
            '<pre class="code">- [ ] Backend</pre><p>Better:</p><pre class="code">- [ ] Add rate-limit validation to the create-order endpoint</pre>' +
            '<p>A checkbox works best when someone can clearly decide whether the item is done.</p>' +
            '<p>Vague categories make completion subjective.</p>' },
        { h: 'Task Lists in Pull Requests',
          html: '<p>A pull request checklist can remind authors and reviewers about repeatable quality checks.</p><p>Examples include:</p>',
          list: ['tests added', 'lint passed', 'screenshots attached', 'migration reviewed', 'documentation updated', 'accessibility checked'],
          after: '<p>A PR template can contain the same checklist for every contribution.</p>' +
            '<p>The generator is useful for drafting the original Markdown or building a specialized one-off checklist.</p>' +
            '<p>Avoid creating dozens of boxes that authors tick mechanically.</p>' +
            '<p>A checklist should protect against real omissions, not become ceremony.</p>' },
        { h: 'Release Checklists',
          html: '<p>Releases are a strong use case because the sequence repeats and forgotten steps can be expensive.</p><p>A release checklist might cover:</p>',

          after: '<p>Use nested tasks under each release phase.</p><p>For recurring releases, save the generated Markdown as a template.</p>' +

        { h: 'Collapsible details Checklists',
          html: '<p>Long GitHub comments can become difficult to scan.</p>' +

          list: ['large QA matrices', 'secondary checks', 'deployment notes', 'archived completed tasks'],
          after: '<p>Do not collapse the few tasks people must see immediately.</p><p>Critical actions should remain visible.</p>' +

        { h: 'Common GitHub Task List Mistakes',
          html: '<p>Avoid these problems:</p>',

                 'creating excessive nesting', 'leaving a manually written progress count stale', 'adding real assignee mentions to a reusable template unintentionally',
                 'putting every project detail into one giant checklist', 'assuming a checked box proves the action happened', 'hiding critical tasks inside collapsed sections'],
          after: '<p>A useful checklist reduces uncertainty. Every item should make it easier to answer: “What is left, who owns it and how do we know it is complete?” For comparing structured values instead, see the <a href="/tools/markdown-table-generator">Markdown Table Generator</a>.</p>' }
