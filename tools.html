<body data-root="./">

<section class="hero">
  <div class="dots"></div>
  <div class="wrap">
    <div class="crumbs"><a href="/">Home</a><span>/</span><span>All Generators</span></div>
    <h1 style="text-align:center;font-size:clamp(30px,5vw,46px)">All Generators</h1>
    <p class="lede">Every tool is free, runs entirely in your browser, and needs no account.</p>
    <form class="searchbar" id="searchForm" role="search" style="margin-top:26px">
      <span class="wrapper"><span id="searchIcon"></span>
        <label class="sr-only" for="q">Search generators</label>
        <input id="q" type="search" placeholder="Search by name, keyword or category…" autocomplete="off">
      </span>
      <button class="btn btn-primary" type="submit">Search</button>
    </form>
  </div>
</section>

<section>
  <div class="wrap">
    <div class="seg" id="catFilter" style="max-width:100%;margin-bottom:24px"></div>
    <div class="grid g3" id="list"></div>
    <p id="none" style="color:var(--muted);margin-top:20px" hidden>No generator matches that search.</p>
  </div>
</section>

<section>
  <div class="wrap"><div class="card card-pad">
    <h2 class="section-title"><span class="ico" id="icoStar"></span>Coming next</h2>
    <p style="color:var(--muted);font-size:14px;margin-bottom:14px">These generators are in the build queue. Each ships with the same live validation and copy-ready output as the tools above.</p>
    <div id="soon" style="display:flex;flex-wrap:wrap;gap:9px"></div>
  </div></div>
</section>

<script src="assets/js/site.js"></script>
<script>
(function () {
  var I = GTI, T = GT_TOOLS;
  GT.shell('tools');
  document.getElementById('searchIcon').innerHTML = I.search;
  document.getElementById('icoStar').innerHTML = I.star;

  var cats = ['All'].concat(GT.uniq(T.map(function (t) { return t.cat; })));
  var active = new URLSearchParams(location.search).get('cat') || 'All';
  if (cats.indexOf(active) === -1) active = 'All';

  document.getElementById('catFilter').innerHTML = cats.map(function (c) {
    return '<button type="button" data-c="' + c + '"' + (c === active ? ' class="on"' : '') + '>' + c + '</button>';
  }).join('');

  function render() {
    var q = (document.getElementById('q').value || '').trim().toLowerCase();
    var hits = T.filter(function (t) {
      var okCat = active === 'All' || t.cat === active;
      var okQ = !q || (t.name + ' ' + t.desc + ' ' + t.kw + ' ' + t.cat).toLowerCase().indexOf(q) > -1;
      return okCat && okQ;
    });
    document.getElementById('list').innerHTML = hits.map(GT.toolCard).join('');
    document.getElementById('none').hidden = hits.length > 0;
  }

  document.getElementById('catFilter').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    active = b.getAttribute('data-c');
    GT.$$('#catFilter button').forEach(function (x) { x.classList.toggle('on', x === b); });
    render();
  });
  document.getElementById('q').addEventListener('input', render);
  document.getElementById('searchForm').addEventListener('submit', function (e) { e.preventDefault(); render(); });

  document.getElementById('soon').innerHTML = [
    '.htaccess Redirect Generator', 'Content Security Policy Generator', 'Permissions Policy Header Generator',
    'Referrer Policy Generator', 'CORS Header Generator', 'Breadcrumb Schema Generator', 'Video Schema Generator',
    'Job Posting Schema Generator', 'Dataset Schema Generator', 'Software Application Schema Generator'
  ].map(function (n) { return '<span class="chip" style="font-family:var(--sans)">' + n + '</span>'; }).join('');

  document.title = 'All ' + T.length + ' Generators — Free SEO, Developer & Business Tools | Manage My Batch';

  render();
})();
</script>
